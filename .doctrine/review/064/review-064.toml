[[finding]]
id = "F-4"
status = "verified"
severity = "major"
title = "The interim flag does not survive an Emacs restart, which sec-5 itself offers"
detail = "pi review (broker pass). satan-sensor-content-enabled defaults to t and nothing persists a live nil. sec-5 names restarting Emacs as a way to load the broker change. A restart before the attrd deploy restores t, and the probe resumes consuming and losing evidence with no log. Conversely a persisted nil outlives a live re-enable, and the probe stays off silently."
disposition = "fix-now"
route = "probe"
response = "Confirmed: the defcustom defaults to t, and neither the config nor custom-vars sets it. sec-5 now names the mechanism: the setting lives under :custom in apps/dl-satan.el, with a live setq, and re-enabling removes the line. Probe: must hold against an Emacs restart during the interim and against a re-enable that leaves the config line behind; need not hold against an operator deliberately editing the flag. The criterion must assert that after a restart the flag is nil and the watermark has not moved, and that after re-enabling the config no longer sets the flag and the watermark advances. Host phase constraint: the interim phase must precede the daemon deploy, and the re-enable check must follow it."

