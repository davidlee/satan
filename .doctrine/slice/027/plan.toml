  { id = "EX-2", text = "SPEC-004 NF-001: the runner suite passes with only import-path edits and the roomShell(connection, { id, cwd }) call shape (run.ts, collect.ts, room-fixture.ts, shell/prepare/collect tests); moved tests pass in test/room/ with assertions unchanged." },
