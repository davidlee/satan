[[finding]]
id = "F-1"
status = "answered"
severity = "blocker"
title = "the proposed pre-request guard cannot deny a model request"
detail = """
Codex (gpt-6-sol) design review of SL-023, finding 1. Location: §5.4, lines 617–625.
`beforeRequest` may replace messages, but its type has no deny or request-options result ([harness/types.d.ts](/home/david/dev/malebolge/node_modules/@earendil-works/pi-durable/dist/harness/types.d.ts:687)); throwing from a hook is reported and skipped ([README.md](/home/david/dev/malebolge/node_modules/@earendil-works/pi-durable/README.md:713)). **Scenario:** usage is exhausted, the guard throws, and the provider request still starts, violating DEC-057 and SPEC-001 REQ-004. **Repair:** define and test a gate at the actual `Models.streamSimple` call boundary, covering retries and compaction, before claiming pre-request denial. **Verified against source.**"""
disposition = "fix-now"
route = "demonstrate"
response = """
Correct: a throwing hook is reported and skipped (pi-durable README, failure model item 3), and beforeRequest returns only messages, so no hook can deny a request. Repair: denial, the request counter and the output cap move to one model gate at the provider boundary. The runner supplies the harness a Models view whose job models wrap the provider stream; every provider call for the job, retries and compaction summaries included, passes it. The gate increments a durable per-job attempt counter before sending, refuses (an error from the stream, no provider call) when any ceiling is exhausted or usage is unreadable, and sets maxTokens from the remaining allowance. This also carries design section 6 OQ-1. Criterion: with a faux provider, a job whose budget is exhausted makes no provider call on the next generation request, on a retry, or on a compaction summary; the attempt counter survives restart. Host phase constraint: the gate must be demonstrated in the harness against the pinned pi-durable before any phase builds ceilings on it; if it cannot sit in the path, DEC-057 is amended to the weaker guarantee per the user ruling.
"""

