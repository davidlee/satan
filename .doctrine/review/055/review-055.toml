[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "Design sec-2 promises a `refuse` record in the run audit that the build never writes, and sec-6's own audit vocabulary contradicts it"
detail = """
Expected (design sec-2, closing paragraph of "Validation order"): "The refusals are the contract: each is a stable token plus a detail string, and each is recorded — attempts.jsonl when nothing spawned, refuse in the run audit once a run directory exists. A caller never receives a silent downgrade."

Observed: there is no refuse record kind and no path that could write one. AuditKind = 'spawn' | 'abort' | 'exit' (pi/mcp/evidence.ts), and a grep for a refuse audit record across pi/mcp/*.ts finds only the refusal-token vocabulary, never a record. Every refusal — steps 1-8, the pre-spawn audit-failed arm, and the audit-unavailable probe failure — goes to attempts.jsonl through appendAttempt, because the run directory does not exist until after step 8 and is discarded when the pre-spawn audit append fails (server.ts: the refusal path returns before runChild).

So sec-2's clause describes a state the build cannot reach, and design sec-6's own enumeration contradicts it: sec-6 lists the run audit's records as "spawn …, abort …, timeout, switch, exit" — no refuse. RV-053 F-17 records the related collapse (timeout/switch are emitted as abort + cause, tolerated as defensible) but neither F-16's six-item list nor QUE-007's four-item list names this clause.

This is a design-record defect, not a code defect: the code's behaviour is the safer one (one ledger per truth; nothing claimed about a run that never existed). Reconciling it means dropping the refuse clause from sec-2 and stating sec-6's audit-record vocabulary as three kinds plus a cause field."""
disposition = "design-wrong"
response = """
The design record is the defect. Two edits, both per-slice, both in the Reconciliation Brief:

1. design sec-2, "Validation order" closing paragraph: drop the clause "`refuse` in the run audit once a run directory exists". The build allocates no run directory before step 8 and discards it when the pre-spawn audit append fails, so every refusal is an `attempts.jsonl` line — which the same sentence already says. The clause describes a reachable state that is not reachable and a record kind that does not exist.
2. design sec-6, "Evidence": state the run audit's record vocabulary as the three kinds the code emits — `spawn`, `abort`, `exit` — with the cause carried as a field, so `timeout` and `switch` are `abort` records carrying their cause rather than kinds of their own. This also settles by text what RV-053 F-17 tolerated by disposition, and closes the sec-2/sec-6 contradiction F-4 names.

No code change is owed: the code's behaviour is the safer one (one ledger per truth; nothing claimed about a run that never existed). The audit does not mutate either sec-2 or sec-6 — /reconcile is the sole writer of reconciled truth."""

