# Runtime status lives under .doctrine/state/ (phase sheets) — never here.
# Hand-edit freely: the tool reads this file but does not rewrite it.
#
# Paths are in ~/dev/malebolge unless stated. "design sec-N" and "V-N" cite
# .doctrine/slice/030/design.md (V-N = its sec-7 verification rows). Phase
# VT/EX ids are local to their phase. pi-durable / pi-ai are 1.3.0 in
# node_modules; ~/.local/src/pi is the matching source checkout.
#
# Plan review: RV-052. Rounds 1-3 (2026-10-21) amended design sec-4/sec-6/sec-7
# (run rev 46; re-lock pending the user's acceptance); rounds 1-5 amended this
# plan; criteria they changed cite `RV-052 F-n`. Execution order is the array order below:
# PHASE-08 (split out of PHASE-04, F-7) runs after PHASE-04.
#
# Routed design-review findings: RV-051 has none (every finding is route
# `review` or unrouted, all fix-now and verified) — nothing to transcribe.
#
# Gate for every phase: `just check` in ~/dev/malebolge (fmt-check, lint,
# typecheck, vitest with the 85 % line-coverage gate). Each phase ends green;
# no phase edits src/room/, src/runner/ or test/structure.test.ts (DEC-105).
