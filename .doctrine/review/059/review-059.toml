[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "Published identity matches design: expected @davidlee/quotient at v0.1.0; observed @davlee/quotient 0.1.1 (tag v0.1.1)"
detail = """
Expected (design.md l.8, l.491, sec-7 rows 1 and 8; DEC-117; plan PHASE-12 EX-1/EX-2/EX-4): npm name `@davidlee/quotient`, version 0.1.0, satan pinned to `github:davidlee/quotient/v0.1.0`.
Observed: the operator's npm user is `davlee` and the `@davidlee` scope belongs to someone else. Q `3395eab` renamed the package to `@davlee/quotient` and bumped it to 0.1.1, updating the lockfile, the README and `npmDepsHash`. Tag `v0.1.1` was pushed, and `v0.1.0` stays on GitHub at `6c31180`. satan pins `github:davidlee/quotient/v0.1.1` (`70594f4`). npm has `@davlee/quotient@0.1.1`, and `npx -y @davlee/quotient help` exits 0.
DEC-117 already required "npm scope ownership is checked before publish". The check ran only at publish time, after the name was tagged and pushed, so the fix cost a re-tag. Evidence: notes.md § PHASE-12 execution.
"""
disposition = "design-wrong"
response = """
The design, DEC-117 and the plan named a scope the operator does not own, so the design is what's wrong. Reconcile design.md (l.8, l.491, sec-7 rows 1 and 8, § Clients l.528) and amend DEC-117 to `@davlee/quotient`, with first publish 0.1.1 at tag `v0.1.1` and `v0.1.0` left as a GitHub-only tag. The plan's PHASE-12 criteria are immutable: notes.md records the deviation, and the brief does not edit plan.toml. Lesson for DEC-117's "scope ownership is checked before publish": the check belongs at design time, before the name is tagged.
"""

