id    = 44
slug  = "design-review-of-sl-029"
title = "design review of SL-029"
# no status — a review's status is DERIVED from its findings, so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "design"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"
rounds_base = 0
contests_base = 0
concluded = true

[[review.turn]]
act = "conclude"
role = "raiser"
note = "No pass was conducted on this ledger: it was opened for SL-029's design review, and that review ran on RV-043 and RV-046 (both done). Concluded at close (2026-10-21) so an unused ledger does not read active; it certifies nothing."

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
ref   = "SL-029"

# Findings are append-only `[[finding]]` tables, added by `review raise`.
# Empty here at creation — a fresh review is Active, awaiting the raiser.
