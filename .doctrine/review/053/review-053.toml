[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "`failedResult` emits an envelope its own validator rejects, and no test covers it"
detail = """
Expected (design sec-5 "Result contract": one envelope with "session is always present — minted and returned when the caller supplied none", and a failure after spawn carrying `status` and `artifacts`; pi/mcp/result.ts:395-397 states the same rule as an invariant: "a spawned run carries its session" / "carries its status" / "carries its artifacts"): every arm of `resultFor`/`failedResult` returns a document `validateAgentResult` accepts, and the suite tests that for every reachable arm.

Observed: pi/mcp/result.ts:305 `failedResult` is the last-resort arm and emits `session: null`, `status: null`, `artifacts: null` with `state: 'failed'`; running `validateAgentResult` on its own output returns `{ok:false, detail:'a spawned run carries its session'}` (R3 verified this by read-only module evaluation, not by reading alone). It also overloads `transcript` with the failure detail, a field design sec-5 documents as the reduced markdown. The single call site is the catch arm at pi/mcp/server.ts:515, so a conforming client rejects the server's last-resort answer — the one answer a client gets when something already went wrong. No test references `failedResult` at all, although the suite runs the other three arms through `validateAgentResult`.

Raised in R3 (finding 2, MEDIUM); the untested-arm half is R3's coverage note.

Suggestion: give the catch arm the call's session (it is minted before the run) and a `status`/`artifacts` pair, or declare a fourth refusal-shaped arm (`refusal.reason: 'server-error'`); and add the one test that runs every reachable arm — including this one — through `validateAgentResult`.
"""
disposition = "fix-now"
response = """Fixed in a5abffc. Shape chosen: the conforming failure envelope, not a fourth refusal — design sec-5 defines `refused` as "nothing ran" with status/artifacts null, so a server throw after the session and run directory exist cannot honestly claim it, while sec-5 also says "session is always present". pi/mcp/result.ts: `failedResult(termination, causes, session, status, layout)` now builds a fully conforming arm — the call's session, a status record, and the five artifact paths from the RunLayout — and `transcript` is `""`: the diagnostic detail is not reduced markdown and now goes only to the diagnostics sink. pi/mcp/server.ts: the run layout is allocated once (`runLayout(admission.runDir, id)`) and handed to the spawn through `plan.layout` (spawn already honoured `plan.layout ?? runLayout(...)`, so this is the same layout it would have computed), and `callTool`'s try/finally gained a catch answering `failedResult('error', ['error'], session.session, reduce([], {}).status, layout)` — the reducer's verdict on an unread stream. The outer `tools/call` catch now only sees throws from before the run was established (every step before it answers a refusal rather than throwing), so it answers `refusedResult('server-error', …)`, the new token added to `RESULT_REFUSAL_REASONS`; nothing ran there, so a null session/status/artifacts pair is the truth. Tests: the arm sweep in result.test.ts now runs every reachable builder arm through `validateAgentResult` — `resultFor` per termination token, `refusedResult` per declared refusal reason (including `server-error`), and the new subtest "the last resort: a post-run throw is a conforming `failed` envelope, not a refusal" (asserts conformance, the call's session, `artifacts.dir === layout.dir`, `transcript === ''`, null result, `final: false`, null refusal). Verified by evaluation: the HEAD shape returns `{ok:false, detail:'a spawned run carries its session'}`; the new one returns `{ok:true}`."""

