# Implementation plan for SL-030 — the authored, durable phase plan.
#
# Runtime status lives under .doctrine/state/ (phase sheets) — never here.
# Hand-edit freely: the tool reads this file but does not rewrite it.
#
# Paths are in ~/dev/malebolge unless stated. "design sec-N" and "V-N" cite
# .doctrine/slice/030/design.md (V-N = its sec-7 verification rows). Phase
