[[phase]]
id        = "PHASE-04"
name      = "malebolge: satan.wake task — fire and submit"
objective = "The satan.wake v1 definition without its bounded wait or abort handler: fire (not-yet re-sleep, gate, defer keeping n and prepared, compose percept + wake.md fragment + intent + payload), submit (host re-check on every entry, defer back to fire with prepared, submit requestId wake:<id>:<n> followUp, wait), the heartbeat's recurring n+1 branch, and the failure report (design sec-11, sec-2; W1, W3, W6, W7)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-03 exit criteria met." },
]
exit_criteria = [
  { id = "EX-1", text = "src/wake/task.ts: WakeInput, WakeState, WakeResult, EpisodeClass, wakeTask(deps) with phases fire and submit and checkpoints as design sec-11; ownership conversation, background." },
  { id = "EX-2", text = "fire: now < at re-sleeps unchanged; a defer is sleepUntil(until, {...state, at: until}); on fire it runs beforeInput, fetches satan_boot_context{refresh:true} over scheduled within 10 s (else percept unavailable: <reason>), reads the fragment (missing -> fail), composes the <wake> content and checkpoints submit {at, n, firedAt, content}." },
  { id = "EX-3", text = "submit: host checks (switch, quiet) on every entry, defer -> fire with prepared; submits byte-identical content under wake:<id>:<n>; settled done -> one-shot completes {fired:true}, heartbeat sleeps one ceiling with n+1 in one checkpoint." },
  { id = "EX-4", text = "Failure path (DEC-134): wake.md missing, target unreachable, submit throws, or settled unanswered -> journal failed line, best-effort notify_send over scheduled, one-shot fails with the reason, heartbeat stays alive with n+1. Journal lines per design sec-4 for fire, defer, terminal." },
  { id = "EX-5", text = "M green." },
]
verification = [
  { id = "VT-1", expects = "Schedule -> fire (task created directly in the test): nothing before at; one turn after; the model sees <wake> with fragment, intent, payload, percept; entry satan.wake carries n", test_file = "/home/david/dev/malebolge/test/wake-task.test.ts", keywords = ["satan.wake", "<wake", "requestId"], waived = false },
  { id = "VT-2", expects = "W1: interrupt right after submit, reopen with the clock in the quiet window -> exactly one turn; same with a defer between crash and re-run. Crash between submit checkpoint and admission: reopen wakes off -> no input, back to fire with prepared; quiet likewise; on later -> one turn; a second defer keeps prepared", test_file = "/home/david/dev/malebolge/test/wake-task.test.ts", keywords = ["prepared", "reopen", "quiet"], waived = false },
  { id = "VT-3", expects = "Restart with overdue wakes: each fires once. Degraded: satan-mcp unreachable -> percept unavailable and presence unknown, still fires; wake.md missing -> one-shot fails with journal line, heartbeat survives with n+1", test_file = "/home/david/dev/malebolge/test/wake-task.test.ts", keywords = ["percept unavailable", "overdue", "failed"], waived = false },
]
