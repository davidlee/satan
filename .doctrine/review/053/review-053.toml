[[finding]]
id = "F-3"
status = "answered"
severity = "major"
title = "`child_binds` is one fact in three places with the exposure half missing; the bind-set check does not close policy↔form"
detail = """
Expected (design sec-3): `child_binds` is the policy's declaration of the posture's fixed child binds and the child view is their union with {root, active session directory} — "all canonicalised, and it is refused `view-overlaps-protected` when a member is, contains, or lies inside a protected path more strongly than that store tolerates — unreachable stores refuse any exposure, read or write; the never-writable policy file refuses only a writable one (a `write`-capability root, or a rw fixed bind)" (design.md:63), so the declaration carries exposure. And design.md:85: "the flake check asserts the form's actual bind set equals root + session directory + `child_binds`. That is where the loop closes; a server promise alone would not close it."

Observed, three separate faults in one fact:
- (a) No exposure half. `child_binds` is `string[]` (pi/mcp/policy.ts:53) and every member is hard-coded `exposure: 'read-write'` at pi/mcp/childview.ts:124-125, while the form's fixed mounts are mostly read-only (`--ro-bind .../bin/env /usr/bin/env`, `--bind ~/.local/share/jail.nix/home/agent ~`, `--ro-bind-try ~/.local/share/doctrine/bin /run/doctrine-bin`, `--ro-bind-try .../host-git-excludes-file ~/.config/git/ignore` — flake.nix:534-540). A policy therefore cannot declare a read-only bind, and the "policy file is never writable" rule over-refuses a legitimately read-only mount that happens to contain it, where a read-only *root* containing it is tolerated.
- (b) Three places, not two. The same bind set is written in the policy schema (policy.ts:53), in the child-view check (childview.ts:124-125) and as a third literal in the flake probe `jailProbes.pi-mcp.shared` (flake.nix:534-540, consumed by `piMcpFormCheck` at flake.nix:683 and :753).
- (c) The check does not close policy-vs-form. The flake check compares the built launcher against that literal; the recorded smoke policy declares one bind (`"child_binds":["/home/david/.local/share/jail.nix/home/agent"]`, .doctrine/slice/029/notes.md:709) and every test rig uses `child_binds: []`. So the loop closes form-vs-literal, never policy-vs-form: a bind the form adds and the policy omits is still outside the server's knowledge, and design sec-3 currently claims otherwise.

Raised in R3 (finding 3, MEDIUM); the exposure half is also R2's design tension 3.

Suggestion: make `child_binds` `{path, exposure}[]` (or a `{read, write}` split) so the policy can state the truth the child view checks against, and add one test asserting the documented example policy's bind set equals `jailProbes.pi-mcp.shared`; if the three-way duplication is accepted instead, say so where design sec-3 claims the loop is closed.
"""
disposition = "design-wrong"
route = "demonstrate"
response = """
Not repaired here: the fix is a policy-schema change plus a check that needs nix to run, so it belongs to reconcile and to PHASE-09's operator run.

Observed: (a) `child_binds` is `string[]` (`policy.ts:53`), so every member is hard-coded `read-write` in `childview.ts:114-126`, while the wrapped form's fixed mounts are mostly `--ro-bind` — a policy cannot declare a read-only bind, so the "policy file is never writable" rule over-refuses a legitimately read-only mount. (b) Nothing ties the policy's list to the form's actual binds: the flake check compares the built launcher against a third literal (`jailProbes.pi-mcp.shared`), the recorded smoke policy declares one bind, and every test rig declares none. The design's "the flake check asserts the form's actual bind set equals root + session directory + child_binds — that is where the loop closes" is therefore overstated: the loop closes form-vs-literal, not policy-vs-form.

Routes: `demonstrate` for the missing policy-vs-form check (PHASE-09 EX-3 / VA-1, blocked on this host), `refresh` for the design's claim at reconcile.
"""

