schema = "doctrine.spec.tech"
version = 1

id = 4
slug = "patch-runner"
title = "Patch runner"
status = "draft"
kind = "tech"
tags = ["patch-jobs", "runner", "room", "trust-boundary", "ceilings"]
responsibilities = [
  "Be the only consumer of patch jobs and the only owner of their state, schema and audit, in one runner-local store",
  "Define the control socket: who may reach it, its framing, full-schema validation, and the operations Emacs uses (no operation writes a real repo)",
  "Run each job as one durable agent conversation on the host, its tools executed in the room, and hold its ceilings, pause/resume and kill switch with Emacs absent",
  "Return work only as git: collect the job branch into a host quarantine, judge it there (ancestry, path allowlist), and offer it for a human promotion enacted in Emacs",
  "Recover from a restart by a written per-state recovery table, never by guessing",
  "Keep everything door-specific behind one git-channel port with slot and room adapters chosen by config",
]
category = "runtime"
c4_level = "container"
parent = "SPEC-002"

