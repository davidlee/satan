[[finding]]
id = "F-6"
status = "answered"
severity = "major"
title = "Deployed runner and config are not reproducible from pushed/locked state"
detail = """
Expected (H SATAN.md § satan-runner, "Deploy a change: commit, push, `just update-local`, `just home-switch`, restart"): the deployed build is the locked revision.
Observed: the live runner (wxhqgy5v…-satan-runner-0.0.0) was built by `just home-switch`'s dev-checkout override from the local M checkout. M main is 3 commits ahead of origin (226b27c unpushed). H's flake.lock still pins malebolge 4f478c4 (pre-SL-025); H 338beea1 (runner.nix) is unpushed; H flake.lock carries the user's uncommitted `nix flake update fleet`.
Failure scenario: any build from the lock (no ~/dev/malebolge override, or a fresh clone) pairs the old runner parser with the new runner.nix — the old `readLayer(…, ["prompt"])` refuses the `repos`/`allowed_paths` keys, so satan-runner refuses to start (I13). Likewise a lock-based system switch would take the fleet pin the user switched with only if the lock is committed.
"""
disposition = "fix-now"
response = """
Needs the user's outward acts, before /close:
1. push M (`git -C ~/dev/malebolge push`);
2. in H: commit flake.lock (the fleet update), `just update-local` (re-locks malebolge to its pushed main), commit the lock, push H.
Then re-check: H flake.lock malebolge rev == M origin/main containing 226b27c; `just home-build` yields the same satan-runner store path as the running unit (wxhqgy5v…), so no restart is needed.
"""

