[[finding]]
id = "F-1"
status = "answered"
severity = "blocker"
title = "The delegate can truncate or replace the audit that is supposed to constrain it"
detail = "Expected: SL-029 sec-6's fail-closed audit and single-writer claim must hold against the model's bash tool, not just cooperative server writes (ADR-017 §2; SPEC-001 REQ-003). Observed: sec-3 explicitly binds the run directory read-write into each child; sec-5 places audit.jsonl and events.jsonl there. Static mode likewise gives the child the server's writable run-directory view. The child therefore has another writable handle to its own evidence. O_APPEND/fsync on the server's handle does not protect against truncation, unlink or replacement by the child, and none need make the server's later append fail. Verified in an isolated Node fixture: parent appended+fsynced spawn, same-uid subprocess truncated the path, parent appended+fsynced exit successfully; only exit survived. This is stronger than the already-disclosed lack of host-admin immutability: the untrusted delegate itself is deliberately granted the write path. Required correction: distinguish server-owned evidence storage from child-writable runtime/session storage and prevent child alteration of the former in both postures, or explicitly withdraw the audit assurance and reconcile the governing invariant. Verification should attempt truncation/replacement from bash and assert either denial with intact evidence or a fail-closed termination; successful server appends alone are not sufficient."
disposition = "fix-now"
route = "demonstrate"
response = """
Accepted, and the second pass was right on the substance: the first repair removed the evidence *bind* and mistook that for isolation. Containment is the property — a root or fixed mount that contains a protected store exposes it, and DEC-095 does let an operator allowlist `$HOME` or `/`, which contains all of them.

Design revision 56 (48 → 49 → 51 → 53 → 56) answers it with a check over the effective child view rather than the bind list:

- **New policy key `child_binds`** (sec-1, sec-3, DEC-097): the fixed mounts the wrapped form adds beyond the root and the session directory (`~/.pi`, workspaceDeps, anything else). The child view is the canonicalised union {root, active session directory, `child_binds`}.
- **New refusal `view-overlaps-protected`** as validation step 8 (sec-2) and as the sec-3 section "Child-view disjointness": refused when any member is, contains, or lies inside a protected path.
- **Protected set classified by harm**, not listed flatly: the run evidence directory and `attempts.jsonl` unreachable read-or-write (tampering defeats the audit; reading leaks other runs); the session home's other sessions and the binding/lock metadata unreachable (histories, forged bindings); the **policy file never writable** because it governs *other* calls — `enabled`, maxima, allowlists; the tracked profile documents deliberately **not** protected, because a write-capable root already confers authority over the server's own code and flake forms, so guarding them would be theatre. That last exclusion is what keeps a repo-rooted write delegate — the main use case — legal.
- **Refusal, not masking**: a mask means the server authoring bwrap args and a second confinement story (SPEC-001 REQ-009).
- **The loop is closed where the server cannot see**: binds the flake adds and the policy omits are outside the server's knowledge, so the flake check asserts the form's actual bind set equals root + session directory + `child_binds`. A server promise alone would not have closed it, and the design says so.
- **Alias probe added** to the demonstrated verification (sec-7): a policy whose root contains the evidence store must refuse before spawn, for both capabilities, alongside your truncation fixture. Static mode's disjointness is a launcher check plus a start-up comparison — stated, and not built (DEC-100 build status).
- **Your placement point is written in**: sec-7 now says the demonstrate obligations bind the *exit criteria of the phase that implements each mechanism*, the design records obligation and assertion, the plan owns placement, and none is verifiable before that phase exists.

One point I do not concede, because it would overclaim: this does not restore an unconditional isolation promise. Allowlisting `$HOME` now costs something — the refusal names the overlapping path and the operator relocates the stores or narrows the root (DEC-095 amendment). It is a checked invariant with a stated price, not a promise, and static mode's residual is unchanged.
"""

