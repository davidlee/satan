[[finding]]
id = "F-6"
status = "answered"
severity = "major"
title = "The gate and verbatim reducer status give different accounts of the same run's spend"
detail = "Expected: the returned status and audit support the ceiling verdict with one defined accounting model, including compaction and precise request/token units. Observed: sec-4 counts message_end and compaction_end usage, while sec-5 embeds pi-run-status/1 verbatim and sec-7 only adds result/final to the reducer. The current reducer ignores compaction_end entirely, adds only usage.input/output/cacheRead, and turns missing cost into zero after an assistant message (pi/reduce/reduce.ts:109-112, absorb and totalCost). An isolated fixture with compaction cost 0.20 USD plus assistant cost 0.01 USD returns status.cost_usd=0.01; the designed gate would account 0.21 and could abort against 0.10 while returning a below-limit status. DEC-097 also correctly says assistant messages are not provider-request counts, but the request-count calculation for max_requests is not defined; retries and summarization attempts cannot simply be counted as assistant turns. Required correction: choose one authoritative usage accumulator or explicitly expose/reconcile separate accounting with their limitations; define request counting, cached-token treatment, missing/unpriced data and when compaction updates trigger checks. Tests must assert returned/audited spend agrees with enforcement inputs, including compaction and failed/retried requests."
disposition = "fix-now"
route = "demonstrate"
response = """
Accepted on every point that mattered, with two specific pushbacks where the mechanism is sounder than the note allows.

**Accepted and written** (design revision 56, DEC-097 amendment): the counting units are now defined per record, because "retry attempts" and "observed provider requests" named nothing an implementer could code.

| record | effect |
|---|---|
| `message_end`, `role: assistant`, with usage | +1 request, + tokens (`input`, `output`, `cacheRead`, `cacheWrite`), + `usage.cost.total` |
| `compaction_end` carrying `result.usage` | +1 request, + tokens, + cost |
| `auto_retry_start` | +1 request, unmeasured |
| `summarization_retry_scheduled` | +1 request, unmeasured |
| `summarization_retry_attempt_start` | +1 request, unmeasured |
| everything else (`agent_end`, `turn_end`, `*_end`, `summarization_retry_finished`) | nothing |

The failed compaction case you raised is handled: `compaction_end` without `result.usage` (aborted, or failed with `errorMessage`) contributes no tokens and no cost, and it is not counted as a request *there* — the failed attempt is counted by its retry record. Usage validity is specified: absent, non-finite or negative usage, or an absent `cost.total`, aborts `accounting_unknown`; a cached read priced at zero is a price rather than missing data; `cacheWrite` counts and `cacheRead` is reported as `cached`. Every counting record triggers a gate check. `requests` and `requests_unmeasured` join the accumulator and the embedded status, so the returned and audited status *are* the gate's inputs. The scope of accounting is disclosed as an observed lower bound, with the gaps named: a send that emits no record, an abandoned summarization chain's last attempt, and any nested agent the delegate launches for itself.

**Two pushbacks, each verified against installed pi 0.99.1 `docs/json.md`:**

1. "A successful retried assistant turn can be counted both as retry attempt and message_end" — that is not double counting, it is the correct count. The failed attempt emits `auto_retry_start` (attempt, maxAttempts, delayMs, errorMessage) and no `message_end`; only the successful attempt completes a message. Two sends, two requests, one response.
2. "…carry no shared request id for deduplication" — no id is needed. Deduplication is by record category: each counting record belongs to exactly one class, and no class overlaps the completion classes. Request ids would be needed only if two record types described the same send, which is the case the table rules out.

**Your last point stands and is now written, not promised:** the demonstrate obligation is in sec-7 with its assertions — a recorded retry/compaction fixture pinning the arithmetic, failed sends counted but unmeasured, absent/unpriced usage aborting, and gate inputs equal to the returned status — and sec-7 states that these bind the exit criteria of the phase implementing the accumulator and gate, with the plan owning placement. The adapter agreeing that one accumulator owns the truth does not verify it; the phase criterion does.

One residual I am not hiding: `requests` errs low in the abandoned-chain case, deliberately, and the design says so — the ceilings that actually bound spend are the token/cost units and the wall clock, both fed from completed responses.
"""

