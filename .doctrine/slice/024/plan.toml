[[phase]]
id        = "PHASE-01"
name      = "skills module: parse, load, render"
objective = "Add M's src/skills.ts per design §4: pure parseSkill and renderSkills, IO loadSkills with pi 1.3.0's duplicate rules, and skillsExtension; add `yaml` as a runtime dependency (DEC-066). Not yet wired into the daemon."
entrance_criteria = [
  { id = "EN-1", text = "SL-024 design locked (run dr-01a151c7, rev 31)." },
  { id = "EN-2", text = "`just check` in M green before the change." },
]
exit_criteria = [
  { id = "EX-1", text = "`yaml` pinned exactly (no range) in M's package.json dependencies, lockfile updated." },
  { id = "EX-2", text = "parseSkill follows design §4 rules 1-6, including RV-028 F-1: description accepted only when `description.trim() !== \"\"` (advertised untrimmed); name used only when a non-empty string, else basename(dir)." },
  { id = "EX-3", text = "loadSkills follows design §4 Duplicates (RV-028 F-2): realpath-identical SKILL.md skipped silently; name collision keeps the first and logs the second with the winner's file; unreadable or invalid skills logged `skill <dir>: <reason>` and dropped; never throws." },
  { id = "EX-4", text = "renderSkills reproduces pi 1.3.0 formatSkillsForPrompt (read variant) without its leading blank lines; XML-escapes name, description, location; omits hidden skills; returns undefined when no skill is visible. A comment names pi 1.3.0 as the wording's source." },
  { id = "EX-5", text = "skillsExtension is one untagged section keyed `skills`; with no visible skills a turn's system prompt carries no `skills` section." },
  { id = "EX-6", text = "`just check` in M green: format, lint (zero warnings), typecheck, tests with the coverage gate." },
]
verification = [
  { id = "VT-1", expects = "parseSkill table: plain, quoted, folded, block, no frontmatter, unclosed, missing/non-string/empty/whitespace-only description, name missing/non-string/empty fallback, hidden, YAML error, non-mapping", test_file = "/home/david/dev/malebolge/test/skills.test.ts", keywords = ["parseSkill", "disable-model-invocation", "whitespace", "folded"], waived = false },
  { id = "VT-2", expects = "renderSkills: exact pi text for a sample, escaping, hidden filtered, undefined when none visible", test_file = "/home/david/dev/malebolge/test/skills.test.ts", keywords = ["renderSkills", "<available_skills>", "&amp;"], waived = false },
  { id = "VT-3", expects = "loadSkills over temp dirs: missing dir and bad skill logged and dropped, order kept, repeated and symlinked dirs listed once silently, name collision keeps first and logs", test_file = "/home/david/dev/malebolge/test/skills.test.ts", keywords = ["loadSkills", "symlink", "collides"], waived = false },
  { id = "VT-4", expects = "through openTestHarness: the skills section reaches a turn's system prompt; none visible gives no skills key", test_file = "/home/david/dev/malebolge/test/skills.test.ts", keywords = ["skillsExtension", "openTestHarness"], waived = false },
]
specs        = []
requirements = []

