response = "Contest accepted on both points. (1) quit: sec-3 now closes the session's transport (delete-process) after settling and before re-signalling, so a live uncancelled caller sees a disconnect rather than a timeout, decoded siblings meet a closing session and are dropped by Admission, and both fall under I2's existing transport-closed exception; I2 is not broadened. (2) The synthetic tool-result now names :id explicitly ({:id <call id> :ok false :error ...}; satan-audit.el:647-648). V15 extended: live uncancelled request sees close; second request in the same chunk never starts; call-interrupted carries the :id."

[[finding]]
id = "F-3"
status = "answered"
severity = "major"
title = "Idle eviction erases the reconnect history needed to refresh the shared tool registry"
detail = """
Expected: DEC-125's refresh integration must preserve SL-028 recovery when a server restarts and tools change, including a conversation returning after idle. Observed: .doctrine/slice/032/design.md:224-239 deletes and closes an expired entry, constructs a fresh reconnectingClient for its replacement, and relies exclusively on each handle's onReconnect to refresh discovery. In malebolge/src/reconnecting-client.ts:120-124,142-148, onReconnect requires that this same handle previously observed a lost client; a new handle starts with lost=false. The discovery connection is lazy too (169-190), so its close does not itself re-list tools.

Failure schedule: discovery installs tool set S1; all pooled entries expire, or the next tool call belongs to a previously unseen conversation; satan-mcp restarts serving S2 while an existing model turn is still running; that turn makes its next SATAN call through a fresh pool entry. Its connection succeeds but onReconnect does not run, discovery stays disconnected, and the registry keeps S1. A continuing turn can keep offering removed tools and cannot see newly added ones. malebolge/src/daemon-start.ts:102 does refresh before external input, which mitigates the next input but does not cover calls later in a turn that is already running. This is the missing edge of the earlier refresh-coupling integration, not a repeat of the already-addressed same-handle reconnect.

Verified standalone probe /tmp/rv060-pool-refresh.ts uses the real malebolge reconnectingClient and a local fake MCP server: connect discovery and an entry; close the entry to represent idle eviction; restart the server; create a fresh entry and call a common tool. Output: {"refreshCallbacks":0,"replacementServerMethods":["initialize","tools/call"]}. No tools/list reaches the replacement server. The pool module is not implemented, so its use of these handles follows the draft.

Repair: retain discovery invalidation/recovery knowledge at the satanTools/pool owner, across entry lifetimes, and ensure a successful new entry after that invalidation triggers coalesced refresh without replaying the tool call. V12 must include restart with no surviving pool entry and an already-running turn, in addition to same-entry replacement. Suggested severe-finding route for the responder: demonstrate; the criterion must use the real reconnecting client plus discovery and assert registry replacement, not merely invocation of a mocked callback."""
disposition = "fix-now"
route = "demonstrate"
response = "Verified: lost is per-handle closure state (malebolge reconnecting-client.ts:120-148); a fresh handle starts lost=false, so a pool entry created after eviction never fires onReconnect. Repair in sec-7: the pool owns discovery invalidation — the first successful connection of every new entry triggers the shared coalesced refresh (one tools/list per conversation window; windows are >=15 min apart), in addition to same-handle onReconnect. Call not replayed. V12 extended to use the real reconnectingClient with a fake server: restart with no surviving entry, fresh entry, assert the registry is replaced. Sibling fixed: design described reconnectingClient(socket, {capabilities}); the real signature is (socketPath, log, onReconnect) — sec-7 now states the added parameter exactly."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
route = "demonstrate"
response = "Verified: lost is per-handle closure state (malebolge reconnecting-client.ts:120-148); a fresh handle starts lost=false, so a pool entry created after eviction never fires onReconnect. Repair in sec-7: the pool owns discovery invalidation — the first successful connection of every new entry triggers the shared coalesced refresh (one tools/list per conversation window; windows are >=15 min apart), in addition to same-handle onReconnect. Call not replayed. V12 extended to use the real reconnectingClient with a fake server: restart with no surviving entry, fresh entry, assert the registry is replaced. Sibling fixed: design described reconnectingClient(socket, {capabilities}); the real signature is (socketPath, log, onReconnect) — sec-7 now states the added parameter exactly."

[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "Failed lazy minting leaves a published partial run directory that the retry abandons"
detail = """
Expected: lazy mint failure and retry (.doctrine/slice/032/design.md:92-98,287-289) should leave one owned activity-window run, or an explicitly accounted failed attempt. Observed: the design publishes session slots only after satan-audit-open succeeds but specifies no rollback or retention of its partially written run directory. satan/satan-audit.el:61-68 creates the final directory and writes manifest, bundle and transcript sequentially. An error after manifest write leaves a visible run directory but no audit handle on the session; the next ensure-run repeats satan-run-new-ctx and opens another directory. A subsequent no-run disconnect finalises nothing (design.md:118), so the first attempt is permanently ownerless.

Verified temporary fault injection: fail satan-audit--write-json on its second call during satan-audit-open. Output: audit-open escaped: injected bundle write failure; visible run dirs after failure: ("2026-10-26/20261026T120000-interactive-aabbcc"); orphan contents: ("manifest.json"). satan-run-list-dirs enumerates it (satan/satan-run.el:184-205). Recent-run readers also select directories by name, not complete-audit state (satan/satan-context.el:277-289), so repeated attempts can occupy their capped window. No tool action had to succeed for this failure, hence minor rather than a claim of lost enacted-action evidence.

Repair: define failure-atomic publication/cleanup, or retain and explicitly account for the failed attempt before retrying. Extend V4 to fail after actual file creation and assert the final directory census, including disconnect after the failed attempt. A stub that throws at the entrance to audit-open cannot catch this."""
disposition = "fix-now"
response = "Verified: satan-audit-open writes manifest, bundle and transcript sequentially into the final dir (satan-audit.el:61-67). Repair in sec-3: ensure-run is failure-atomic — on error after the run dir exists it deletes that dir before answering -32603, so a retry leaves exactly one run. V4 extended: fail the second write inside audit-open; assert the dir census after failure, after retry, and after a no-run disconnect."

