[facet]                         # every field typed; seeded empty (captured later)
context = "SL-034 wakes are pi-durable background tasks (research S3-S6). inq-1 asked which task definition carries a wake and what its input is."
choice = 'Task `satan.wake` v1 in the `tasks` extension. Ownership: the target conversation (`ownership:{kind:"conversation"}`, `conversationId`: target, `background:true`), created by the tool via `api.commit(tx => tx.createTask(...))`. The tool runs WakePolicy.schedule and stores the decided `at` in the task input (`initial(input)` is synchronous, so the input is the durable carrier). Two phases. `fire`, checkpoint `{phase:"fire", at, n}`, initialised from `{at: input.at, n: 0}`: the decider runs on entry; not-yet or defer -> `sleepUntil(next, {...state, at: next})` (only `at` changes; `n` and `prepared` survive every defer); go -> beforeInput gate, percept, fragment, then commit `{phase:"submit", at, n, …composed input}`. `submit`: re-check the host gate (switch, quiet window) on every entry; a defer returns to `fire` with `sleepUntil(until, {phase:"fire", at: until, n, prepared: true})`; else submit input with entry `satan.wake` and requestId `wake:<taskId>:<n>` (a stable occurrence id, so a re-run dedupes even after a defer moved `at`), wait for settlement, then one-shot commits terminal `{fired:true}`; the recurring heartbeat sleeps into `fire` with `n+1`. Abort handler reads `task.state.checkpoint`: phase `fire` without `prepared` -> terminal `{fired:false}`; phase `submit`, or `prepared` -> the handler owns the occurrence input: it looks up the submission by requestId in the target and calls Harness.abortSubmission; never admitted or withdrawn while queued -> terminal `{fired:false}`; placed, settled, or an error -> terminal `{fired:true}` (a turn that ran or may run is never reported as cancelled, and no aborted wake leaves a queued input unwatched). A thrown error is the task failed outcome (inq-8). Input `{conversationId, intent, payload?, episodeClass, at, requestedAt?, scheduledBy, recurring?}`; `requestedAt` is kept for audit; `scheduledBy` is the scheduling tool `api.conversationId`. No priority field in v0. Topic and parent are not stored: at fire the wake turn derives them from the index via `contextOf`.'
alternatives = ["Task owned by the scheduling tool call: abandonOnRestart by default, so a wake dies on daemon restart", "One dedicated scheduler conversation owning all wakes: an extra conversation with no gain over Harness.inspect()", "Two phases sleeping -> fire (spike shape): an extra step; one phase covers first sleep and every defer", "Snapshot topic and SATAN_PARENT_CONVERSATION into the input at schedule time"]
rationale = "Simplest shape the spike proved. The decided time in the checkpoint makes defer a re-sleep, not abort+recreate. Snapshotting topic/parent is not cheaper (contextOf is one index-doc read, already done per tool attempt) and is less resilient: a second source of truth (conversation-context.ts forbids one) that goes stale when the conversation is forked or re-topicked. scheduledBy is a historical fact and is free at schedule time, so it is snapshotted."
consequences = ["inq-2 must settle fork handling: forks inherit their parent's topic (topics.ts:87-92), so a pending wake targets the conversation chosen at schedule time, not the topic's latest", "inq-3's decider takes episodeClass and the checkpoint's at", "Priority can return as an optional input field later"]
decided_by = "user (2026-10-27), on the agent's proposal"
decided_on = "2026-10-27"

