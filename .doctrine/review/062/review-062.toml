[[finding]]
id = "F-14"
status = "verified"
severity = "major"
title = "Definition-blocked heartbeat replacement orphans the task without running its new input-withdrawal handler"
detail = """
Expected: the new Wake task ownership prose (design.md:158-164) says 'Every abort path goes through the handler — wake_cancel and the heartbeat replacement ... so no aborted wake leaves a queued input unwatched'; W9 (:79-84) repeats that property. Heartbeat ensure (:469-474) explicitly supports candidates blocked for missing_task, task_too_old and migration_failed as well as restart_limit: it calls abortTask and replaces them. The new handler is currently the only cleanup owner for such a task's occurrence.

Observed/VERIFIED source: pi-durable distinguishes a restart-limit park from an unavailable/incompatible definition. harness/scheduler.ts:558-574 resolves an inactive task before marking it and calls #terminate with orphaned immediately when no definition can take it and no owned work remains. Its abort-reservation path (:1545-1551) likewise orphans rather than calling missing/incompatible code. docs/spec.md:2234-2243 explicitly states that aborting a blocked task cannot run its abort handler and external effects may remain uncleaned; it names missing_task, task_too_old and migration_failed. The design's assertion that every replacement abort passes through withdraw is therefore false for three of the four blocked reasons it explicitly lists. Only the restart_limit case with a usable definition still runs the handler, aided by withAbortMark resetting the restart count (:2403-2409).

VERIFIED installed pi-durable 1.4.0 MemoryStorage/faux probe: an old recurring satan.wake v2 submitted wake:10:0 behind a foreground run; the run failed, leaving that input queued under keep. Closed/reopened with the same task kind registered at v1, modelling an incompatible-definition rollback; inspection returned blocked/task_too_old. The ensure recipe's abortTask plus waitForTask returned terminal orphaned/task_too_old with zero abort-handler calls, and wake:10:0 remained queued. Two successful replacement-heartbeat-like inputs to a newer conversation still left the original input queued (3 model calls total). Targeting a newer conversation is allowed by ensure's latest-topic selection and W8: replacement need not return to the old task's fixed target. A control using a v1 record parked by restarts:5 instead returned blocked/restart_limit, ran the same handler once, and settled the old input unanswered/aborted before replacement traffic. The control's restart count was explicitly seeded in the in-memory record to exercise the documented parked branch. No production upgrade/rollback or real process crash was performed.

INFERENCE: in the design's supported incompatible/missing-definition replacement cases, an old heartbeat input can remain queued with no handler or bounded monitor, even though the daemon has a healthy replacement. If replacement targets the original conversation, the old orphaned input may instead run later when fresh input releases it; it still did not receive the promised withdrawal/ownership handoff. This is separate from F-12's ordinary cancel race, whose now-executable abort handler is repaired.

Repair: give ensure/recovery an explicit fallback cleanup/monitoring responsibility when abortTask cannot execute the definition, or narrow and reconcile which blocked reasons it promises to handle. Do not infer handler execution from abortTask success or terminality. Safely identify the old occurrence from the stored record and preserve user submissions and W1/W4/W9; define the fallback for unsupported checkpoint versions rather than guessing. Test at least a definition-blocked replacement with an already-queued occurrence, including a newer latest-topic conversation, in addition to the current restart_limit test. No change to afterFailedRun:keep or a new schema owner is required."""
