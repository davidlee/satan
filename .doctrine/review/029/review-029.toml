[[finding]]
id = "F-23"
status = "verified"
severity = "minor"
title = "A held job whose repo left config wedges the one seat on rejoin; stop does not cut backoff sleeps"
detail = """
Expected: a held job always makes progress or ends; the one-seat scheduler is never wedged by one job.
Observed (PHASE-10 B Open, confirmed in `rejoin.ts`/`scheduler.ts`): rejoining a non-`preparing` row (e.g. `running`, `waiting_room`) whose recorded policy or repo no longer resolves (repo removed from config while the job was in flight) throws; the scheduler logs it and rests; the job stays held and keeps the one seat (I1 seat rule, design §5.4 Scheduling) until the next restart, which throws again. Every later job, on every repo, waits. No test covers it. (A `preparing` row fails as `runJob` would.)
Related, smaller: `awaitRoom`/`readyRoom` backoff sleeps and the post-collect clean do not take `RunDeps.stopping`, so a runner stop can wait up to one backoff delay (≤ 60 s); systemd's stop timeout bounds it and restart recovery resumes the row.
"""
disposition = "follow-up"
response = """
Follow-up: ISS-047 (minted, linked to SL-023) — choose the fail-closed end for an unrejoinable held job so the seat is released and audited, with tests per guard; the ≤ 60 s shutdown delay rides along. Code work, not a design gap (§5.4's seat rule and I12 already say what must hold).
"""

