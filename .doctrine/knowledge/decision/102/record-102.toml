[facet]                         # every field typed; seeded empty (captured later)
context      = "notes jailed-pi bound /run/user/1000/satan read-write so interactive pi could goad-emit to the router's ingress socket (notes e2965c4). That let the jail replace satan-mcp's socket; DEC-101's read-only overlay held only when mcp/ existed at launch (RV-047 F-1)."
choice       = "Remove the bind. jailed-pi gets satan-mcp only through satanMcpOptions; goadBackends stays writable."
alternatives = ["Keep the writable bind with the mcp overlay after it (DEC-101)", "Bind /run/user/1000/satan read-only: goad-emit keeps working, but the jail can connect to every socket under it, including malebolge's attach socket (durable/room)"]
rationale    = "The socket served only interactive pi (user, 2026-10-20). Losing goad-emit there costs little; the broker emits from outside the jail. Removing the bind closes F-1 outright and needs no ordering invariant."
consequences = ["Interactive pi (jpi) cannot goad-emit", "IMP-047's remaining half: update goad backends through satan-runner instead of the writable goadBackends bind"]
decided_by   = "user (2026-10-20)"
decided_on   = "2026-10-20"

