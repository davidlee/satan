title = "a crash can strand a job in `running` before its first submission"
detail = """
Codex (gpt-6-sol) design review of SL-023, finding 3. Location: §5.4, lines 542 and 598–600; recovery line 745.
The design moves to `running` after branch creation, then configures and submits the prompt. Recovery leaves `running` to `resume()`, which only continues admitted work (DEC-052; [README.md](/home/david/dev/malebolge/node_modules/@earendil-works/pi-durable/README.md:108)). **Scenario:** the runner dies after recording `running` but before `submit`; restart finds no pending task, and the job holds the sole slot forever. **Repair:** persist an admission marker or check for the job’s submission and retry it with the stable job `requestId` before resuming. Fault-inject that exact gap. **Inferred from verified ordering.**"""
disposition = "fix-now"
route = "review"
response = """
Correct. The job moved to running before the initial submission was admitted, and resume continues only admitted work. Repair: the initial submission belongs to preparing. A job leaves preparing for running only after submit with requestId equal to the job id has returned (admitted). Recovery for preparing with base_oid and conversation recorded resubmits the initial prompt with the same requestId (pi-durable returns the existing submission if it was admitted) and then records running. Recovery table and fault-injection list gain this boundary.
"""

