memory_key = "mem.fact.jail.bind-the-socket-directory-not-the-file"
schema_version = 1
memory_type = "fact"
status = "active"
title = "Jails must bind a unix socket's directory, not the socket file"
summary = "A bwrap bind of a socket file pins its inode; when the server deletes and re-listens (satan-mcp-start does), the jail gets ECONNREFUSED. Bind the parent directory."
created = "2026-10-17"
updated = "2026-10-17"

