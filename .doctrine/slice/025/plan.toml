entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 and PHASE-02 committed; PHASE-03 room rebuilt (PHASE-03/VH-1)." },
  { id = "EN-2", text = "No SATAN session will be started during the sitting." },
]
exit_criteria = [
  { id = "EX-1", text = "H runner.nix: roomRepo helper, 15 repo entries per design §4.3 (doctrine edge, nix-config at home), modes self-edit-mech, self-edit-mind, tick-agent (computed: all repos but satan and satan-corpus), interactive (\"*\"); mode.fix removed; header comment current. SATAN.md § satan-runner: interactive smoke, the modes and their scope. `just home-build` in H succeeds and the rendered config.toml has the 4 modes and 15 repos." },
  { id = "EX-2", text = "Drain: the runner store has no job queued or preparing, checked immediately before the switch." },
  { id = "EX-3", text = "User: home switch (builds runner from the committed M checkout with runner.nix), satan-runner restarted, journal shows no `refusing to start`." },
  { id = "EX-4", text = "C: prompts/self-edit-mech.txt, prompts/self-edit-mind.txt, prompts/tick/agent.txt and tools/patch_job_create.md per design §4.5, written after the restart and committed by path." },
  { id = "EX-5", text = "User: Emacs reloaded; patch_job_create's schema has no mode." },
]
verification = [
