name      = "Bootstrap the quotient repo"
objective = "Create ~/dev/quotient with filtered history and the design sec-1 layout. Moved code behaves as in satan; the package type-checks and its suites run green from the new paths."
entrance_criteria = [
  { id = "EN-1", text = "Design locked (SL-031 design run, rev 39); satan just pi-suites green at the starting commit." },
  { id = "EN-2", text = "~/dev/quotient does not exist, or is empty." },
]
exit_criteria = [
  { id = "EX-1", text = "git filter-repo keeps only pi/mcp, pi/reduce, bin/pi-mcp, bin/pi-run-reduce and bin/pi-mcp-hostile-audit, renamed to src/server, src/reduce and scripts/hostile-audit, with --prune-empty (design sec-1 History). bin/pi-mcp and bin/pi-run-reduce survive only in history; cli.ts replaces them in PHASE-02." },
  { id = "EX-2", text = "The rewritten history has been reviewed with git log --stat and secret-scanned, and the scan's result is recorded in notes. No remote is pushed." },
  { id = "EX-3", text = "package.json is as in design sec-5: name @davidlee/quotient, version 0.1.0, bin quotient -> dist/cli.js, files, scripts, engines node >=22, devDependencies typescript ^5.7 and @types/node ^22, no runtime dependencies. package-lock.json is committed." },
  { id = "EX-4", text = "tsconfig.json is as in design sec-5: nodenext, strict, rewriteRelativeImportExtensions, erasableSyntaxOnly, verbatimModuleSyntax, rootDir src, outDir dist; tests and test-rig.ts excluded from the emit." },
  { id = "EX-5", text = "npx tsc --noEmit is clean over src, tests included. The moved suites pass with npm test, the 262 tests that just pi-suites ran in satan; any change in the count is explained in notes." },
  { id = "EX-6", text = "Moved forms.test.ts is not in quotient: it stays in satan (design sec-1, What does not move)." },
  { id = "EX-7", text = "scripts/hostile-audit is moved but not yet runnable: it still execs bin/pi-mcp. Notes record this; PHASE-09 generalises it." },
  { id = "EX-8", text = "Until PHASE-09 adds quotient's devShell, the suites run on satan's devshell node (>= 22.6, type stripping). Notes record the node version used." },
]
verification = [
  { id = "VT-1", expects = "package.json carries the design sec-5 fields, including version and @types/node", test_file = "/home/david/dev/quotient/package.json", keywords = ["@davidlee/quotient", "\"version\": \"0.1.0\"", "@types/node", "dist/cli.js"], waived = false },
  { id = "VT-2", expects = "tsconfig carries the design sec-5 compiler options", test_file = "/home/david/dev/quotient/tsconfig.json", keywords = ["rewriteRelativeImportExtensions", "erasableSyntaxOnly", "verbatimModuleSyntax", "nodenext"], waived = false },
