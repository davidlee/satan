entrance_criteria = [
  { id = "EN-1", text = "SL-023 design locked (run dr-01a14d77)." },
  { id = "EN-2", text = "An oubliette capsule slot (slot f, EVD-005) can be started by the user (`! capsule f start`, needs sudo) and reached through its relay." },
]
exit_criteria = [
  { id = "EX-1", text = "`@earendil-works/pi-env` pinned at the exact pi-durable version in M's package.json." },
  { id = "EX-2", text = "RV-025 F-1 / design §6 OQ-1: with a faux provider and memory storage, a Models view wrapping both `streamSimple` and `completeSimple` refuses once the budget is exhausted, and the next generation request, a retry, and a compaction summary each reach no provider; a durable attempt counter counts failed attempts and survives a harness reopen. If the view cannot sit in every call's path, STOP and /consult: DEC-057 is amended to the weaker guarantee per the user's ruling before PHASE-08." },
