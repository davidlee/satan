[[finding]]
id = "F-3"
status = "verified"
severity = "blocker"
title = "§4.6, §6: CON-005’s egress boundary is deferred to an audit that may accept leaks."
detail = """
Reviewer: GPT (gpt-6-sol), adversarial pass 2026-10-20.

3. **F-3 — blocker — §4.6, §6: CON-005’s egress boundary is deferred to an audit that may accept leaks.**  
   **Claim:** the room profile has no egress beyond the bounded gateway. **Verified:** the daemon exposes every tool listed by the interactive MCP server ([satan-tools.ts](/home/david/dev/malebolge/src/satan-tools.ts:101)); that server forms a union of registered tools ([satan-mcp.el](/home/david/dev/satan/satan/satan-mcp.el:66)). The proposed closure gate permits an off-host-capable tool to be recorded as an “accepted residual” ([design.md](/home/david/dev/satan/.doctrine/slice/027/design.md:689)), while CON-005 requires no egress with the room attached (`doctrine show CON-005`). **Inference:** the network namespace cannot constrain what a host MCP handler subsequently sends, and an audit note cannot enforce the profile as the tool set changes. **Repair:** establish a room-profile MCP allowlist or another enforced channel boundary before closure; enumerate and test the allowed calls. If the intended rule permits a specific return channel, obtain an explicit amendment to CON-005 rather than treating it as a residual."""
disposition = "fix-now"
response = "Fixed as before (the section 6 closure gate; the dynamic-union residual is accepted by the user). Control: the incorrect candidate is an interactive-mode SATAN tool that can carry data off the host, for example one that posts a notification to an external service or fetches a URL. The egress audit must classify that tool as blocking closure, not record it as a residual."
