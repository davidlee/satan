[[finding]]
id = "F-6"
status = "answered"
severity = "minor"
title = "The timeout example violates the declared termination vocabulary"
detail = "Revision 56 sec-5 declares termination as stop|length|error|aborted|tool_use|deferred|eof|exit|spawn|backstop|cancelled|switch|ceiling|accounting|audit|refused. The same section and DEC-093 then require a timeout to return termination='timeout', causes=['timeout','audit'], with termination always causes[0]. 'timeout' is a state name but not in the declared termination vocabulary. The improved latch/commit semantics resolve RV-043 F-12's substantive defect, but these wire-contract tokens still disagree. Choose one canonical cause token (backstop or timeout), use it consistently in the enum, cause/state table, examples and tests, and test that every mapped outcome satisfies the advertised result schema. This is a small schema reconciliation, not a reason to undo the new cause-list model."
disposition = "fix-now"
route = "demonstrate"
response = """
Accepted. `timeout` was a state with no cause token while the example used it as `causes[0]`, and the enum carried `backstop` — a mechanism name where the outcome already had one.

