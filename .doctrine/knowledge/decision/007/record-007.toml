schema = "doctrine.knowledge"
version = 1

id = 7
slug = "goad-ask-correlates-by-construction"
title = "An ask correlates at emit, about something already perceived — and the loop can still break before maturity"
record_kind = "decision"
status = "proposed"
created = "2026-09-21"
updated = "2026-09-23"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "Correlation is the outer gate on every classification. satan-observer-classify-for-motives intersects each motive's :cue against the intervention's percept handles and returns :unknown :no_correlation when nothing overlaps — and satan-observer-classify is then never called at all. Neither the positive leg (a fourth predicate) nor the negative leg (the RFC-016 D3 keystone) runs. Both legs of SL-016's verification intent sit behind this one gate and nothing in the slice as scoped acknowledged it."
choice = "Establish correlation at emit rather than hoping for it — and require the question to be about something already perceived. Three parts. (1) The canon rule emits app:goad from the presence of SATAN's own queue file (not the day record — see DEC-013 and RV-007 F-6) plus per-item topic: handles. (2) The ask tool requires the question to name a handle present in the run ctx :percept-handles AND requires that specific handle to appear in the winning motive's cue; a generic app:goad overlap is not sufficient. With no winner it does not emit and records the suppression. (3) It passes :related-motive-id and :cue-handles for the winner. Correlation holds AT EMIT; motive mutation can still break it before maturity and the design says so plainly rather than claiming a closed loop."
alternatives = ["Pass :cue-handles on the ask and rely on it — does not work: satan-observer--intervention-percept-handles reads bundle.json only and never reads the cue_handles column", "Emit unconditionally and accept that some asks classify :unknown :no_correlation — silently forfeits the keystone the slice exists to demonstrate", "Change satan-observer-classify-for-motives to consider cue_handles — arguably correct since the column exists and is unused for this purpose, but it changes classification for every intervention kind and belongs in its own slice"]
rationale = "The emit-time check is exact rather than approximate because it reads the identical input the correlator will read. The run ctx built at satan/satan-run.el:242-250 carries :percept-handles directly; satan-intervention-create takes the intervention's percept_handles from that same ctx at satan/satan-intervention.el:386; and the percept written to bundle.json is the same percept. So intersecting motive cues against ctx :percept-handles at emit predicts the correlator's answer at maturity exactly — given an unchanged motive file. Failing closed follows SPEC-001 REQ-005/010: an ask that cannot be classified is an ask whose refusal cannot be perceived, which is the precise failure RFC-016 names."
consequences = ["The canon rule must emit into an admitted namespace or the whole scheme fails silently — see DEC-004 as corrected. app:goad is the anchor handle; topic: carries subject matter.", "A decorrelation race exists and cannot be closed inside this slice. The correlator recomputes at maturity against the motive file as it then stands. tick-pulse holds motive-write with motive_read and motive_replace in its tool list (satan/satan-tick.el:60-88) so SATAN can rewrite the motive between emit and maturity and silently decorrelate its own ask. Recording related_motive_id and cue_handles at emit makes this detectable after the fact; it does not prevent it. IMP-002 (A13 audit verifier — cross-check observer.json against intervention transcripts) is the natural home for the cross-check.", "Suppression must be observable. A fail-closed ask that silently declines to ask reintroduces exactly the blindness RFC-016 diagnoses — SATAN would have no sense organ for its own muteness. The no-correlation suppression needs a recorded signal so that never asked is distinguishable from working fine.", "The ask tool needs motive read access in every mode that can emit an ask. tick-pulse already carries motive_read and motive-write.", "Correlation quality now depends on motive authorship — a keeper with no live motive whose cue names app:goad will never be asked anything. That is defensible and must be documented as the operating contract rather than discovered.", "This makes the fourth observer predicate of inq-7 reachable: past the gate, predicates run first and a firing one short-circuits to :worked."]
decided_by = "design run dr-01a0c179 (SL-016), agent-proposed"
decided_on = "2026-09-21"

