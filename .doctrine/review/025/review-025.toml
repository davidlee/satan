[[finding]]
id = "F-7"
status = "verified"
severity = "major"
title = "elapsed-time recovery lacks durable start points"
detail = """
Codex (gpt-6-sol) design review of SL-023, finding 7. Location: §5.3, lines 425–435 and §5.4, lines 626–629, 668–677.
`active_ms` is checkpointed per turn/transition, but there is no persisted `running_since`, `waiting_since`, or `pending_collection_since`. **Scenario:** a runner crashes 40 minutes into a long tool call; restart re-arms a one-hour active ceiling from the earlier checkpoint. Repeated restarts can similarly reset room-wait or collection-abandonment timing if `updated_at` is used. **Repair:** persist entry times for each timed state, define how crash intervals are charged, and test restart during long calls and waits. **Inferred from the schema and recovery rules.**"""
disposition = "fix-now"
route = "review"
response = """
Correct. Repair: jobs gain state_entered_at (set on every transition) and running_since (start of the current running segment). Active wall-clock is active_ms from closed segments plus now minus running_since; a crash interval is charged to the job (fail closed). Room-wait and pending-collection bounds measure from state_entered_at, which restarts do not reset. Tests: restart during a long call and during each bounded wait.
"""

