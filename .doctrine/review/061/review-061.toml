[[finding]]
id = "F-3"
status = "verified"
severity = "major"
title = "Design sec-3 lifecycle no longer describes the landed close/settle mechanics (DEC-126, id list, nested quit deferral)"
detail = """
Expected: design.md sec-3 (canonical) matches satan-mcp.el at aad0d4c.
Observed divergences (notes.md Execution log PHASE-05/06):
1. DEC-126 (accepted): any non-error non-local exit (e.g. `throw`) settles with reason "exit" and closes the transport like quit. Sec-3 Settle names only error|quit.
2. `in-flight` is the list of in-flight request ids (count = length), not a count; `cancelled` membership is checked against it. Sec-3's slot table says "count".
3. Nested-filter quit: a quit inside a nested filter is deferred to `quit-flag` (`satan-mcp--filter-depth`, `--resignal-quit`) because a quit cannot cross the C process reader (mem.fact.satan.quit-in-process-filter). Absent from sec-3.
4. Settle helpers named `--begin-close` / `--finalise` / `--release` / `--deliver`; `--deliver` records cancelled / disconnected instead of sending; -32603 only on an open, live session.
5. Verifier: "gains call-interrupted as a known record" landed as a `calls-match-results` docstring line + VT-2 (PHASE-05 D1); the verifier has no event registry."""
disposition = "design-wrong"
response = 'Code is right (VTs green, VA probes in notes); sec-3 is stale. Reconcile direct edit of design.md sec-3: slot table `in-flight` = list of request ids; Settle covers non-error non-local exits per DEC-126 (reason "exit", transport closes like quit); nested-filter quit deferral to quit-flag with the reason; -32603 only on an open live session; deliver records cancelled/disconnected; verifier change as a docstring + VT (no registry). Brief: Per-slice F-3.'

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "design-wrong"
response = 'Code is right (VTs green, VA probes in notes); sec-3 is stale. Reconcile direct edit of design.md sec-3: slot table `in-flight` = list of request ids; Settle covers non-error non-local exits per DEC-126 (reason "exit", transport closes like quit); nested-filter quit deferral to quit-flag with the reason; -32603 only on an open live session; deliver records cancelled/disconnected; verifier change as a docstring + VT (no registry). Brief: Per-slice F-3.'

[[finding.turn]]
act = "verify"
role = "raiser"
note = "Brief entry exists (Per-slice F-3)."

[[finding]]
id = "F-4"
status = "verified"
severity = "major"
title = "Design sec-7 refresh and idle config diverge from malebolge a737928"
detail = """
Expected: sec-7 describes the pool as landed.
Observed (notes.md PHASE-07; malebolge src/satan-pool.ts, src/config.ts):
1. The first call of a new entry AWAITS the coalesced refresh before answering (bounded by the refresh deadline, ≤ 2 s; not replayed). Sec-7 lists the new-entry trigger as calling `refresh` with no ordering. VA-1 showed the fire-and-forget form leaves the restarted tool "not available" for one step (pi-durable resolves tools at step start). User chose await.
2. The idle default `DEFAULT_SATAN_IDLE_MS = 900_000` lives in satan-pool.ts (de-duplicated from config/satan-tools); configured by env `MALEBOLGE_SATAN_IDLE_MS` (strict integer parse). Sec-7 says only "config, default 15 min".
3. Shutdown closes pooled connections (`closeAll`, isolated per entry) — present in sec-7; aligned.
Live (PHASE-08): both runs finalised exactly 15 min after their last call (00:31:57, 00:34:49), consistent with 900_000."""
disposition = "design-wrong"
response = "The await was a user-chosen fix of a defect VA-1 demonstrated (RV-060 F-3). Reconcile direct edit of design.md sec-7: the first call of a new entry awaits the coalesced refresh (bounded by the refresh deadline, not replayed), with the VA-1 reason; idle default lives in satan-pool.ts, set by MALEBOLGE_SATAN_IDLE_MS (strict integer). Note the known risk deferred as malebolge IMP-013 (a failed refresh empties the extension). Brief: Per-slice F-4."

