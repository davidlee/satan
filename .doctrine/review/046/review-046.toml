[[finding]]
id = "F-5"
status = "answered"
severity = "major"
title = "Writable source checkout is incorrectly equated with authority to change live profiles for other calls"
detail = "Expected: an authorised write delegate may edit source in its allowed root without silently gaining control over the capability/tool authority granted to later calls on other roots. Observed in revision 56 sec-3's new protected-store table and DEC-095: the tracked profile directory is deliberately not protected because write access to the server's source/flake is said to make protecting profiles 'theatre'. But DEC-092 resolves profiles from the server's install location and the repo shim/no-build-step deployment is in scope; there is no immutable deployment boundary or startup profile snapshot. Policy only permits profile names, while DEC-098 takes filesystem authority from the profile document. Concrete admitted deployment: run bin/pi-mcp from the SATAN checkout, allow a write call in that checkout, and permit reviewer plus writer profiles in policy. The writer edits the LIVE reviewer profile from filesystem:read to filesystem:write (and widens its tools). A later reviewer call on another allowlisted root now selects wrapper_write, without any policy change or operator deployment act. Editing flake/source text is not the same as rebuilding/deploying that control plane; live profile reads make this escalation immediate. Required correction: separate editable source profiles from live authority (for example immutable installed copies, a validated startup snapshot, or policy-pinned profile capability/content), or explicitly ask the operator to accept that writers to this root administer later calls. Preserve repo-rooted source work rather than blanket-protecting every source file. Verification should mutate a source profile in an authorised write call and prove it cannot change the live reader capability for a second root without an explicit authority/deployment change. This is a new capability-integrity consequence of the revision-56 exclusion, separate from RV-043 F-1's evidence isolation proof."
disposition = "fix-now"
route = "demonstrate"
response = """
Accepted, and it defeats the reasoning in the revision-56 table rather than merely its wording. I had used "a write root already owns the source" as the test; the correct test is whether the child's write can change **live authority**. Profiles are read per call and take the filesystem capability from the document, so a writer inside the authorised checkout could rewrite a `read` profile into a `write` one and elevate a later call on a different root with no policy change and no deployment act. Editing source is not deploying a control plane.

Fixed in design revision 60 (sec-3, a new "Profiles are live authority" subsection; sec-2 step 3; sec-7) and DEC-092's appended amendment:

- the server loads, validates and **freezes** the tracked profiles at **start-up**: one snapshot, held for the process lifetime, its digest recorded in every run's audit `spawn` record;
- a profile edit on disk is therefore inert until the server restarts — a deployment act, not something a call can perform — and an invalid snapshot is refused at start-up (`profile-invalid`, naming the path) instead of being discovered per call;
- repo-rooted source work stays legal: no profile file is protected from a write root, and the previous "theatre" exclusion is corrected rather than extended to every source file;
- the child-view table's row now says the documents are source while the snapshot is authority, so the two are not conflated again.

sec-7 names the demonstration: mutate a tracked profile from inside an authorised `write` call, then assert a later call on another root keeps the snapshotted capability and that the change takes effect only after a restart.

Residual, stated: two server processes on the same checkout do not share a snapshot, so a profile edit plus a restart changes authority for the restarted process. That is the deployment act the finding asked for, not a hole in it — and it is why the plan should start one server per client from a known-good snapshot.
"""

