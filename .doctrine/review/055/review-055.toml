- pi/reduce/reduce.test.ts — modified by 47064a6; the carrier of VT-1..VT-4's evidence.
- bin/pi-mcp-hostile-audit — added by bba7d87 (PHASE-09), the driver design sec-7's verification list describes ("a hostile bash attempting truncate/unlink/replace") without naming.

