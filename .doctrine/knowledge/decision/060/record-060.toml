id = 60
slug = "sl023-collect-and-classify"
title = "SL-023 runner collects every job's commits through a git-channel port and classifies them from the quarantine"
record_kind = "decision"
status = "accepted"
created = "2026-10-18"
updated = "2026-10-18"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "Oubliette has slot provision/collect; oubliette SL-006 sec-6 defines the room's push/collect (quarantine /var/lib/capsule/collect/<room>/<repo>.git, refs/capsule/<room>/heads/<branch>), provisional until SL-006 locks. Classification is SATAN's (Plan F §5)."
choice = "A git-channel port: refresh(repo, base_ref) → base_oid; collect(job) → quarantine ref + oid; two adapters behind it, chosen by [door] kind: slot (capsule <slot> provision/collect; the live rung until oubliette SL-006 ships) and room (DEC-065). Each job works on job/<id> from base_oid. Execution ending is separate from collection: every ended job (complete, ceiling, cancel, room_unavailable) enters collecting; if the channel is unavailable it waits in pending_collection and retries when the channel returns; abandonment is explicit, bounded and audited. Before needs_review the runner records reviewed_oid and checks ancestry (reviewed_oid descends from base_oid) and allowed_paths over the full collected commit set. Classes: complete → needs_review; partial (ended on ceiling or room loss) → needs_review flagged; no_changes → failed; path_violation → failed and not promotable; error → failed. The commit check is the authoritative path-allowlist site; a beforeTool block on write/edit is early feedback only. Paths are repo-relative. Uncommitted work never travels."
alternatives = ["Classify from the transcript", "Enforce allowlist only per tool call"]
rationale = "bash can write any path, so only the commit check is authoritative; collecting partial work honours the pre-abort warning."
consequences = ["Room adapter tracks SL-006 sec-6 until it locks; its live rung follows SL-006 shipping"]
decided_by = "user"
decided_on = "2026-10-18"

