entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 complete." },
]
exit_criteria = [
  { id = "EX-1", text = "Config.skillDirs: MALEBOLGE_SKILLS split on ':' with empty segments dropped; unset or empty gives []." },
  { id = "EX-2", text = "daemon-main.ts calls loadSkills(config.skillDirs, log) once, adds skillsExtension(skills) immediately after the persona extension, and reports the skill count in the existing startup log line." },
  { id = "EX-3", text = "README.md and docs/internals.md name MALEBOLGE_SKILLS and the skills extension; the user's pre-existing uncommitted edits to docs/internals.md, biome.json and justfile are not altered or committed by this phase." },
  { id = "EX-4", text = "`just check` in M green." },
  { id = "EX-5", text = "Manual smoke: the daemon started with MALEBOLGE_SKILLS pointing at ~/dev/goad/kit/skills/goad-backend logs `1 skills`; with a bogus path appended it logs the skip and still starts. If the daemon cannot start in this environment (satan-mcp, gateway), record that and rely on VT-1/PHASE-01 VT-4." },
]
verification = [
  { id = "VT-1", expects = "MALEBOLGE_SKILLS: unset, empty, 'a::b:' gives ['a','b']", test_file = "/home/david/dev/malebolge/test/config.test.ts", keywords = ["MALEBOLGE_SKILLS", "skillDirs"], waived = false },
  { id = "VA-1", expects = "daemon-main.ts wiring and log line match EX-2 (read the diff); EX-5 smoke result recorded in notes" },
]
