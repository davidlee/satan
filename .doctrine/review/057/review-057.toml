[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "Design sec-3 says 'no closing flag is added'; the code's Connection.ended flag is required by the failed-attach rule"
detail = """
Expected (design.md:106): "destroyed is the only state the check reads; no closing flag is added."
Observed: Connection.ended (src/daemon.ts:40-41), set by fail() (:67-74) and the drop branch (:226-229), read with socket.destroyed (:227). It is required by design.md:105 (failed attach drops queued lines, never acting on root): fail() only end()s the socket, so destroyed stays false until the peer closes; without ended a queued line would reach firstLine as an unbound first line. A reader trusting :106 could delete ended and reopen that hole. Design wrong; code right.
"""
disposition = "design-wrong"
response = """
Code is right; the flag is load-bearing for the failed-attach rule. Reconciliation brief: design.md sec-3 (:106) — replace "destroyed is the only state the check reads; no closing flag is added" with: the turn check reads destroyed or the connection's ended marker, which a failed attach sets (it only ends the socket, so destroyed lags until the peer closes).
"""

