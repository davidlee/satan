title = "Design §5 code impact: expected every delivered file listed; observed seven delivered files absent from §5 and the selector registry"
detail = "Manual per-repo conformance (slice conformance is satan-only). Delivered but undeclared: malebolge src/coalesce.ts, src/reconnecting-client.ts (PHASE-02; notes:169-171), src/attach-main.ts (PHASE-04; notes:249), justfile (PHASE-04 4098b6b: daemon recipe comment); ~/flakes features/profiles/personal-linux.nix + features-test.nix (PHASE-06 a49c3f0b: the feature is inert until selected); ~/.config/emacs apps/dl-satan.el (PHASE-06 08367c7: :commands lacked malebolge-start/-stop, VH-1 failed from a fresh Emacs). Each was necessary and is recorded in notes; the design and the selector registry lag the work. Every design-target selector was delivered (none undelivered)."
disposition = "design-wrong"
response = "Reconcile, per-slice direct edit: design.md §5 table gains the seven files; selector registry gains them as design-target (doctrine slice selector add), the load-bearing change. See ## Reconciliation Brief."

