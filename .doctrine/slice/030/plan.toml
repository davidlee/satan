[[phase]]
id        = "PHASE-04"
name      = "Daemon transport: one binding per connection, ordered lines"
objective = "Design sec-3 in src/daemon.ts: install the close handler and one line splitter at connect; feed one per-connection serial chain; each turn first awaits `conversations`, then drops itself and every later line if the socket is destroyed; the first line binds (attach → open → bind with ack; anything else → bind root, then act); later lines act on the bound conversation (an attach line → `already attached to conversation N`). `serve({socketPath, conversations, beforeInput})`. Composition in daemon-start.ts, the daemon-env.ts header (DEC-106), and the minimal client bridge that keeps attach.test.ts green: `attach.ts` sends `{type:\"attach\"}` on connect."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 and PHASE-02 complete." },
  { id = "EN-2", text = "Read design sec-3 in full before writing daemon.ts; the lifecycle took three review rounds to state (notes § Design review RV-051)." },
]
exit_criteria = [
  { id = "EX-1", text = "One splitter, one queue: the `data` handler and splitter are installed at connect, before `conversations` resolves; every line, `abort` included, waits for the previous line's handling; a failed handler writes its `ErrorMessage` and the chain continues (sec-3 § Rules)." },
  { id = "EX-2", text = "Departure: a turn's first step, after `conversations` resolves and the previous line is done, is the `socket.destroyed` check; a destroyed socket drops that line and every later one. An attach whose turn has started completes its open, acquires its stream and stops it at once (sec-3 § No line after departure)." },
  { id = "EX-3", text = "Bind: `conversations.watch(conv)`; if the socket is destroyed, stop the stream and drop the queue; else write `attached` (attach only), the snapshot, then start the stream. The close handler stops any stream already acquired." },
  { id = "EX-4", text = "Failed attach (refused shape, unknown id, task-owned): one `ErrorMessage`, socket ended, queued lines dropped, never acted on root (V-1 daemon half, observed with `LineClient.closed()`)." },
  { id = "EX-5", text = "A first line that is a command binds root and is acted on, with no `attached` (V-2); a first line that is not JSON or not a valid command binds root then errors, connection open." },
  { id = "EX-6", text = "`attached` precedes the snapshot and carries the opened/created id (V-3)." },
  { id = "EX-7", text = "`attach`+`input` in one write, and one frame split across two writes, are handled in order (V-5); while `conversations` is pending a connection is silent and its one-write `attach`+`input` are handled in order once it resolves (V-13, replacing `test/daemon.test.ts:174-183`)." },
  { id = "EX-8", text = "A second `attach`, well-formed and malformed, errors `already attached to conversation N`; a garbage non-attach line gets its own error; the binding is unchanged (V-6). The bound check precedes shape validation: a parsed `AttachMessage` or an `AttachRefused` on a bound connection both answer `already attached` (RV-051 F-18)." },
  { id = "EX-9", text = "Departed before ready: an `attach` (root, and `new`) then disconnect before `conversations` resolves acquires no stream and creates nothing (V-11); an `input` then immediate disconnect before ready is never submitted on root (V-14)." },
  { id = "EX-10", text = "Departed mid-bind: an `attach` (root, and `new`) whose turn has started, socket destroyed while `open`/`watch` is pending (a barrier inside the `watchEvents` mock): `watched.streams` holds exactly one stream, its `closed` resolves `stopped`; for `new`, a `scanConversations` read finds the created ownerless conversation (V-15; with V-11 replaces `test/daemon.test.ts:185-196`)." },
  { id = "EX-11", text = "The `submit` draft is built from validated fields (`content`, `requestId`), not the parsed wire object (research X-5)." },
  { id = "EX-12", text = "`daemon-start.ts` builds one `AgentChange {model, cwd: environment.cwd}` for `openSession` and `conversations`, and passes `serve` a `Promise<Conversations>` resolved after the session opens; shutdown order is unchanged (daemon, harness, environment, satan, lock)." },
  { id = "EX-13", text = "Headers: daemon.ts states invariant 1 of sec-1 and that `beforeInput` is one daemon-wide gate shared by every conversation; daemon-env.ts states that faults and trust belong to the one room connection every conversation shares (DEC-106)." },
  { id = "EX-14", text = "`test/fixtures.ts` `LineClient` gains `closed(): Promise<void>` and `write(raw: string)`; `test/daemon.test.ts`'s `attach()` helper sends an attach frame and waits for `attached` then the snapshot; `test/attach.test.ts`'s `serve()` calls take the options object and its exact-output banner assertions include the `[attached to conversation N]` line; `attach.ts` sends `{type:\"attach\"}` first on connect. Every other existing test passes unmodified in meaning." },
  { id = "EX-15", text = "`just check` green; test/structure.test.ts unchanged and passing." },
]
verification = [
  { id = "VT-1", expects = "refused attach closes with one error and creates nothing; command first line binds root without attached; attached precedes snapshot (V-1, V-2, V-3)", test_file = "/home/david/dev/malebolge/test/daemon.test.ts", keywords = ["closed()", "\"attached\"", "snapshot", "conversation"], waived = false },
