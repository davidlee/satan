(b) §5 says the VT-7 pin test uses real lines copied from a live raw file. satan/test/satan-desktop-test.el:466-505: umbriel lines are shape-faithful but sanitised; niri lines are DERIVED (live niri logs had rotated out).
(e) §5 code impact lists two fixture functions; satan-desktop-fixture.el also provides -focus, -append, -with-root, -zone (additive)."""
