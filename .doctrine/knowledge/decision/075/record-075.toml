[facet]                         # every field typed; seeded empty (captured later)
context = "CON-005 room profile; research X1 (only the gateway is TCP), X3 (launch-dir bind is library policy); flakes DEC-047 rejected an in-jail forwarder only because jails shared the host netns; GPT second opinion (2026-10-20) on job interference through a shared room user."
choice = "jailed-malebolge's room profile: jail profile offline (--unshare-net), launch-dir bind off, gateway through a bound user-owned unix socket and an in-jail forwarder on 127.0.0.1:4000 (flakes prerequisite slice). Read-only binds: room door dir, the daemon's own room identity key, room known_hosts, door file and ssh_config, gateway client socket dir, satan-mcp dir (/run/user/1000/satan/mcp), malebolge tree, ~/satan-corpus, gateway key, catalog. Read-write: the profile's own attach-socket dir /run/user/1000/satan/durable/room/ and its own store dir. Packages: node, openssh, socat. vm mode runs as its own room user (e.g. satan) with its own key and home; /work clones stay owned by agent, readable, not writable, so vm-mode work reaches the host only as a patch job. Residual egress: the gateway, bounded by the key's model list and budget. Residual host reach: the interactive SATAN MCP tool set (RSK-019, out of scope)."
alternatives = ["Keep host netns and rely on the room for isolation (convention, refused by CON-005)", "Add the user to the llm-gateway group", "Share room user agent with the runner (job contamination, no client distinction)"]
rationale = "Every remaining host reach is a named, bound socket; client sockets connect through read-only binds (verified 2026-10-20: door ssh banner through --ro-bind; listen on ro fails EROFS). A separate room user turns RFC-019 D3 from convention into file permissions."
consequences = ["Cross-repo: flakes:SL-015 provides flakes:DEC-075 (gateway client socket)", " flakes:DEC-076 (jailLib.gatewaySocketOptions; jailed-malebolge adds it to extraOptions itself", " since it passes no gateway)", " flakes:DEC-078 (mountLaunchDir = false); fleet rooms.assistant.users gains the vm-mode user; flakes issues its key", "The jail definition renders the daemon's ssh_config itself (ProxyCommand with the socat from its own closure; door socket /run/capsule-room/<room>/ssh.sock); oubliette IMP-022 (room-client bundle) is the long-term home", "Persisted jail home moves agent → agent-offline; the daemon keeps nothing there (store and socket are explicit binds; pi-env's server binary comes from the ro malebolge tree)", "The daemon reports 'gateway unreachable' itself when the socket is absent", "VT: literal launcher probes; VA: live negative probe inside the jail"]
decided_by = "user (accepted agent proposals, 2026-10-19/20)"
decided_on = "2026-10-20"

