[[finding]]
id = "F-2"
status = "answered"
severity = "major"
title = "Active kill-switch polling has no failure rule when policy becomes unreadable or invalid"
detail = "Expected: the new operator-controlled active halt remains fail-closed when its source disappears or becomes unreadable/malformed, not only when enabled=false is parsed successfully (ADR-017 §4; SPEC-001 REQ-005/REQ-010; DEC-097's missing-policy rule). Observed: revision 48 sec-1 snapshots policy per call and says absent/malformed policy refuses calls; sec-4 adds event/idle re-reading of enabled for active runs, but specifies only the successful false case. There is no active-run outcome for deletion, permission/read failure or TOML parse failure during a policy replacement. Retaining the last enabled=true snapshot would let an already-running delegate continue precisely when the control channel is unavailable, while throwing from the poll could lose cleanup/audit. Required correction: define active-run read/parse/validation failure, the operator publication/atomic replacement expectations, the mapped termination reason and the bounded shutdown behaviour. Keep other per-run maxima snapshot semantics separate if desired. Verification: begin a slow/idle delegate, then remove or corrupt the policy without sending a driver cancellation; assert a documented fail-closed result, cleanup and refusal of later calls. This does not undo RV-043 F-3's verified improvement from admission-only to active enabled polling."
disposition = "fix-now"
route = "demonstrate"
response = """
Accepted. The switch had a success case and no failure case, which is the wrong half to leave undefined: retaining `enabled = true` because the source vanished makes the control channel's unavailability the attacker's friend.

Fixed in design revision 60 (sec-4's tick, sec-1's policy sentence) and DEC-097's appended accounting section:

- the tick re-reads **and re-parses** the policy file, not just one key;
- absent, unreadable (permission, ENOENT) or malformed (TOML parse, schema) **aborts the in-flight run through the same ladder**, with cause `switch` and a detail naming the failure — so the run ends and the audit says why. Cleanup, audit append and the session-lock release proceed as for any ladder trigger, and the exit is fail-closed rather than a thrown exception out of the poll;
- a brief window during a non-atomic rewrite therefore halts the run. That is deliberate: the operator is expected to publish atomically (write, then rename), and a control channel fails closed. Stated in sec-4 rather than discovered;
- per-run maxima remain snapshotted (a mid-run ceiling change still does not apply), which is separate from the switch;
- later calls refuse `policy-unavailable` / `policy-invalid` as already specified.

sec-7 names the probe: delete, then separately corrupt, the policy during an idle run with no driver cancellation, asserting a documented fail-closed abort, cleanup and refusal of later calls. It is a phase criterion; RV-043 F-3's admission-to-active-halt improvement is untouched.
"""

