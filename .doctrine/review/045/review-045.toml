[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "An exhausted attach wait is silent for 10 s, then a raw Node crash dump"
detail = "src/attach.ts:40-43, src/attach-main.ts:7: nothing is written before connectUnixWaiting; on exhaustion the rejection escapes attach-main uncaught (stack trace, exit 1). With Type=simple, a daemon that exits 1 at startup (InstanceLocked, missing gateway key) leaves systemctl start at status 0, so M-x malebolge-start shows 10 s of nothing then the dump, with no journalctl hint. Verified: MALEBOLGE_SOCKET=<absent> node src/attach-main.ts → 10.1 s silence, triggerUncaughtException ENOENT. Suggestion: turn the exhausted wait into one line naming the socket and the journalctl hint."
disposition = "fix-now"
response = "Fixed in malebolge cc6f478: attach writes '[no daemon at <path> (<code>); see journalctl --user -u malebolge-room]' then rejects; attach-main exits 1 without a stack on connect errors (others still throw). Test 'says why when it gives up…' (red seen: empty output). Probe: absent socket → 10.1 s, that line, exit 1. No 'waiting' line: unit startup races the listen routinely, so it would print on most starts."

