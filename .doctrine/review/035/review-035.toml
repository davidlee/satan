title = "§4.6, §6: the jail can still gain a writable host workspace."
detail = """
Reviewer: GPT (gpt-6-sol), adversarial pass 2026-10-20.

1. **F-1 — blocker — §4.6, §6: the jail can still gain a writable host workspace.**  
   **Claim:** `workspaceDeps = []` and `mountLaunchDir = false` remove host coding writes. **Verified:** `makeJailedAgent` also reads `JAIL_WORKSPACE_DEPS` during impure evaluation and adds each path with `--bind`, which is read-write ([jailed-agents.nix](/home/david/flakes/agents/jailed-agents.nix:496), [jailed-agents.nix](/home/david/flakes/agents/jailed-agents.nix:538)); the proposed call leaves that mechanism enabled ([design.md](/home/david/dev/satan/.doctrine/slice/027/design.md:496)). **Inference:** an impure build with that variable set can ship a room-profile launcher with a writable host repo, violating the declared profile. **Repair:** make dynamic workspace binds impossible for this consumer in the flakes prerequisite, and test the rendered launcher under an impure evaluation with `JAIL_WORKSPACE_DEPS` set."""
disposition = "fix-now"
response = "Fixed as before (design 4.6, flakes:SL-015 PHASE-05 workspaceDepsFromEnv set false). Control: the incorrect candidate is the jailed-malebolge launcher built from the impure devshell with JAIL_WORKSPACE_DEPS set to include the notes dir, which binds /workspace/notes read-write. The section 6 check (the just recipe over the built launcher: no /workspace/ bind at all) must reject that candidate, observed before the fix is applied."
