title = "SL-034 tool surface: wake_schedule/wake_cancel/wake_list; target is the caller or a known topic's latest, resolved at schedule"
record_kind = "decision"
status = "accepted"
created = "2026-10-27"
updated = "2026-10-27"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "SL-034 inq-2. Malebolge topics are index names; an unwritten topic other than `default` is refused; a topic resolves to its latest conversation and `new` starts another in it (src/conversations.ts:122-156), so a topic's latest moves after scheduling, not only on fork."
choice = 'Native tools in the `tasks` extension: wake_schedule{intent, after_minutes?, topic?, payload?, episode_class} -> {id, at, conversation, enabled}, where `at` is WakePolicy.schedule decided time; wake_cancel{id}: refused for an id that is not a live satan.wake or is the heartbeat; a wake not sleeping answers "already fired" untouched; a sleeping wake -> Harness.abortTask, wait for the task to settle, answer cancelled only when its result is `{fired:false}`, else "already fired" (DEC-127 abort handler), so a cancelled answer never leaves an admitted turn; wake_list{} -> pending (sleeping) wakes {id, at, topic, conversation, intent, episode_class}, topic derived via contextOf. Target: the calling conversation (api.conversationId) by default; with `topic`, that topic latest conversation resolved at schedule time; an unknown topic is refused; the tool creates no topics. after_minutes omitted -> ceiling. episode_class is required: `attend` or `seclude`.'
alternatives = ["Topic resolved at fire time: always the topic's latest, but the task cannot be target-owned (reopens DEC-127) and 'wake me here' breaks when a new conversation starts in the topic", "Tool creates absent topics: unattended topic sprawl; duplicates the client's topic creation", "Absolute timestamp argument: models are less reliable with absolute time", "task_* names: 'task' already means pi-durable tasks and runner patch jobs; rename when other kinds arrive"]
rationale = "The common case (wake me here) cannot go stale; DEC-127's ownership holds unchanged; least code."
consequences = ["A topic-targeted wake can miss a newer conversation started in that topic after scheduling; accepted for v0", "inq-5's heartbeat target must be a topic that exists (e.g. `default`)", "Slice scope objective 2's task_* names become wake_*"]
decided_by = "user (2026-10-27), on the agent's proposal"
decided_on = "2026-10-27"

