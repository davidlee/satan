  { id = "EX-4", text = "`render.ts`'s `Printable` includes `AttachedMessage` and its handler map has an `attached` entry (a missing one is a compile error); `toPrintable` is unchanged." },
  { id = "EX-5", text = "The protocol header states: the attach frame is valid only as a connection's first line; a connection whose first line is not `attach` is bound to root and gets no `attached`; a connection that sends nothing is never bound and receives nothing; a conversation id names a conversation only within this profile's store (sec-2 § Ids)." },
  { id = "EX-6", text = "`just check` green." },
]
