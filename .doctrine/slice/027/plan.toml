# Implementation plan for SL-027 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
#
# Code paths are in ~/dev/malebolge unless prefixed (satan/, satan-corpus/,
# notes/). VT test_file paths outside this repo are absolute (SL-023's
# convention); verify-vt fails them until the phase creates the file.
# RV-035's routed findings (F-1, F-3, F-4, F-9 control; F-2 demonstrate) are
# transcribed from the ledger into the criteria that cite them.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-027"

[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

[[phase]]
id        = "PHASE-01"
name      = "Root moves and the import allowlist"
objective = "The runner stops importing daemon modules (design §4.1 root moves): parseModel, ModelRef, DEFAULT_MODEL move from src/config.ts to src/models.ts; registryOf moves from src/session.ts to a new src/registry.ts. test/structure.test.ts asserts the three-sided import allowlist over src/, file by file. Behaviour unchanged."
entrance_criteria = [
  { id = "EN-1", text = "Design locked (run dr-01a15431, rev 49); malebolge `just check` green at the phase's base commit." },
]
exit_criteria = [
  { id = "EX-1", text = "src/runner/* imports neither src/config.ts nor src/session.ts; model-gate.ts, run.ts, start.ts and test/harness-fixture.ts import from models.ts / registry.ts. No re-export shim left behind." },
  { id = "EX-2", text = "test/structure.test.ts asserts §4.1's three rules file by file over src/: (a) nothing outside src/runner/ imports src/runner/* except src/runner-main.ts; (b) src/runner/* imports only src/runner/*, src/room/* and the eleven named root modules (context, fields, grep, json, message-of, models, ndjson, project-context, registry, truncate, unix-socket); (c) src/room/* imports only src/room/* and context, fields, json, project-context, truncate (plus packages). Rule (c) holds vacuously until PHASE-02 creates src/room/." },
  { id = "EX-3", text = "RV-035 F-9 (control): the allowlist checker, fed a fixture source string in which a src/runner/ module imports a root module outside its allowlist (`../daemon-env.ts`, and a root module not yet listed), reports a violation; the test asserts that rejection, so a denylist or wildcard implementation fails it." },
  { id = "EX-4", text = "`just check` green; runner suite passes with import-path edits only." },
]
verification = [
  { id = "VT-1", expects = "three allowlist rules hold over src/; runner-main.ts entry-point exception; fixture probe imports (../daemon-env.ts, an unlisted root module) rejected (RV-035 F-9)", test_file = "/home/david/dev/malebolge/test/structure.test.ts", keywords = ["src/runner", "src/room", "runner-main.ts", "daemon-env"], waived = false },
  { id = "VT-2", expects = "registryOf lives in its own root module and the runner imports it from there", test_file = "/home/david/dev/malebolge/src/registry.ts", keywords = ["export function registryOf"], waived = false },
  { id = "VT-3", expects = "parseModel / ModelRef / DEFAULT_MODEL live beside GATEWAY_PROVIDER", test_file = "/home/david/dev/malebolge/src/models.ts", keywords = ["parseModel", "ModelRef", "DEFAULT_MODEL", "GATEWAY_PROVIDER"], waived = false },
]
