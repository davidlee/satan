[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "A connection closed before the session resolves leaks its event watch"
detail = """
malebolge src/daemon.ts:43-57 (at d23d619). `attach` awaits the session (:43) and `watchEvents` (:49) before registering `socket.on("close", () => void stream.stop())` (:57); a close emitted earlier is not replayed. Reviewer probe: a client connected while the session promise was unresolved, then destroyed, then the session resolved — the close handler never ran and the watch (view mount pinning a transcript snapshot and the per-commit delivery loop) stays for the daemon's life. Against a ready session the handler registered in time 30/30. PHASE-03 widened the window to the whole store open + resume. Fix: register the close handler first; stop a stream that arrives on a destroyed socket; test by destroying a client before the session resolves and asserting the stream stops.
"""
disposition = "fix-now"
response = "Fixed in malebolge f44240e: close handler registered before the awaits; a stream arriving on a destroyed socket is stopped. Test 'stops watching when a client leaves before the session resolves' observes the stream's closed promise; bite-checked 3/3 red against the old ordering."

