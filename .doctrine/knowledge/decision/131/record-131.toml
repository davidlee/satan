context = "SL-034 inq-5. The scoped heartbeat (after a wake turn, add one if none pending) races: two wakes settling together each see the other live and neither adds one; it also needs a separate daemon-start check."
choice = "Exactly one heartbeat: the satan.wake definition (DEC-127) with input `recurring: true`, episode class `seclude`. At daemon start (room profile only), under the daemon lock, the daemon writes the heartbeat topic record (config; e.g. `room`) and ensures the heartbeat, owned by that topic latest conversation: live satan.wake tasks with `recurring` count unless `abortRequested` or blocked (restart_limit, missing_task, task_too_old, migration_failed); before that, a start sweep journals and aborts every blocked satan.wake (heartbeat or one-shot) and withdraws its still-queued inputs by its `wake:<id>:` request ids, because pi-durable cannot run the abort handler of a definition-blocked task (it settles orphaned); a blocked one-shot also takes the failure report; with none counting, a new one is created. The abort and the create are separate; a restart between them is safe because an abort-marked task no longer counts. When due: if any other satan.wake is sleeping, sleepUntil one ceiling on; otherwise run the gate and fire composition. In `submit` the heartbeat shares every wake's bounded wait (DEC-134): an input still queued after one ceiling is withdrawn; the heartbeat then journals and notifies `heartbeat unanswered` and sleeps with `n+1`; its next input starts a run that carries any other inputs queued behind the failed one (afterFailedRun `keep` leaves queued inputs for the next input), so a heartbeat stuck behind a failed run recovers itself. Pending means a sleeping satan.wake task only. It never goes terminal. wake_cancel refuses it (host-owned); the off switch is inq-7. Defaults: ceiling 2h, floor 5m, both daemon config. afterFailedRun stays `keep`."
alternatives = ["Post-turn check in the fire phase: must await the turn, needs check-and-create in one commit to avoid the race, and still needs a start-time check", "In the tool: nothing triggers it if SATAN never schedules", "Heartbeat into `default`: unprompted turns interleave with the user's default conversation"]
rationale = "One task by construction removes the race; reuses the wake definition and fire path; a dedicated topic gives SATAN its own seclusion thread, bounded by pi-durable auto-compaction."
consequences = ["Worst-case gap is about 2x ceiling when SATAN own chain stops just after a heartbeat check; about 3x when the heartbeat input is stuck behind a failed run", "A new conversation started in the heartbeat topic is not followed: the heartbeat stays with the conversation it was created in", "inq-11 owns the start ordering (topic write; heartbeat ensure after resume/refresh/backfill) and the config keys"]
decided_by = "user (2026-10-27), on the agent's proposal"
decided_on = "2026-10-27"

