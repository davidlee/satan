[[finding]]
id = "F-3"
status = "answered"
severity = "blocker"
title = "The designated kill switch only disables future admission, not ongoing enactment"
detail = "Expected: the component receiving ledger row 6c supplies a kill switch that halts enactment and fails closed (SPEC-001 REQ-005; ADR-017 §2/§4). Observed: sec-1 reads enabled only once per call; DEC-097 explicitly says enabled=false is not a mid-flight interrupt and an in-flight run keeps its enabled snapshot. Sec-7 nevertheless assigns this to the delegate kill-switch row. A delegate already executing bash or spending on a provider can continue until its ordinary backstop after the operator trips the designated switch. DEC-096's per-request MCP cancellation is a useful shutdown path, but requires the connected driver and is not the persistent switch described in row 6c. Required correction: identify and expose an operator-controlled active-run kill mechanism independent of driver cooperation (which may reuse the shutdown ladder), or change the switch semantics and reconcile the authority/spec claim explicitly. Do not silently equate an admission flag with an active kill. Verification: start a long-running delegate, trip the declared operator switch with no driver cancellation, and assert enactment ends within the documented bound and later admissions fail closed."
disposition = "fix-now"
route = "review"
response = "Accepted. enabled is re-read at each gate tick (event boundary, bounded to about a second) and a flip aborts in-flight runs through the shutdown ladder with audit abort(switch), with no driver cooperation required. The truth table separates admission refusal from active halt, and both are named."

