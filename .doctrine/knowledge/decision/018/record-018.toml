schema = "doctrine.knowledge"
version = 1

id = 18
slug = "record-before-emit-audit-append-gates"
title = "Record before emit: the audit append gates the alert; the psql projection follows it"
record_kind = "decision"
status = "accepted"
created = "2026-09-23"
updated = "2026-09-23"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "SPEC-001 REQ-003 requires every enacted action to be in the durable audit log. satan_notify_send emits before satan-intervention-create (satan-tools-notify.el:56-65). For pre-spawn sensor alerts the create always fails, so the alert is shown and never recorded (ISS-016). The create appends the canonical audit line (satan-intervention.el:392) and then runs a psql projection that signals on failure."
choice = "satan-intervention-create is split into record (validate + audit append) and project (psql), and survives as their composition; satan-intervention-classify is split the same way into classify-record (validate + audit append, no database) and classify-project (outcome upsert), and survives as lookup + both + the attribute enqueue. notify_send runs record, then announce, then project. If the append fails, nothing is emitted. If the pop fails after the record, satan-tools-notify--mark-undelivered appends an unknown/high/mature/auto verdict with the note 'undelivered: ERR' via classify-record, then best-effort projects the intervention and the verdict in foreign-key order, with no attribute enqueue; it never signals, and the tool returns (ok ... :delivered :false). If the projection fails, the tool returns ok with a projection_failed note. The per-cause sensor cooldown arms on ok, meaning the record succeeded. Failure announcements and listener-death alarms are operational alarms: a failure announcement's record is its run bundle, and a listener death's only trace is its journal line. The ledger row 4 standing note names both. Amended 2026-09-23 per RV-009 F-2/F-11. Amended 2026-09-23 per RV-010 F-1: the classify split, because the composed classify reads Postgres before it appends and its upsert needs the unprojected parent row."
alternatives = ["Atomic create, then emit: a Postgres outage silences every alert (R1), and when the projection fails the audit line is already written, so every run adds a duplicate record and shows nothing.", "Emit with a degraded marker: shows an unrecorded action, so REQ-003 is not met; it is only labelled."]
rationale = "REQ-003 holds by construction, because nothing is shown before the audit line exists. The projection can be rebuilt from the transcript, so its failure must not gate the alert. The only possible edge is over-recording (recorded but not shown), which is the safe direction. No third audit writer is added (ledger row 4)."
consequences = ["satan-intervention-create is replaced by a record step and a project step. Callers are updated.", "The per-cause cooldown arms on a successful record, not on the projection.", "A REV to the ledger row 4 standing note names the listener-death alarms and the logger line as channels that are not audit writers.", 'The SPEC-001 REQ-003 acceptance criterion "a side effect whose record fails is not enacted" becomes testable.']
decided_by = "user (keeper)"
decided_on = "2026-09-23"

