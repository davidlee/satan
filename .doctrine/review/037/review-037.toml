detail = """
Source: jailed-pi-research pass, verified by the raiser against 1c42811.

`src/daemon-env.ts:52-54` (private):

```ts
52| /** The daemon's reword: the fault named, the error's type and fields kept. */
53| const reword: Reword = (fault, error) =>
54|   new RemoteError({ ...error.fields, message: faultText(fault, error.message) });
```

`test/room/connection.test.ts:217-219` defines its own identical-shape `reword` and asserts `isConnectionLost(error) === true` (`:229`). The daemon-env tests (`:199-228`) assert only message text through the tools, where the `RemoteError` has already been converted to `ExecutionError`/`FileError`. So an edit to the production `reword` that dropped `lost`/`code` from `fields` would fail no test, although §4.4/point 2 names that preservation. Suggested fix: export `reword` (or a `reworder(words)` factory) and assert fields/`isConnectionLost` directly.
"""
