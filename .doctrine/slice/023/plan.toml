[[phase]]
id        = "PHASE-10"
name      = "Restart recovery"
objective = "Implement DEC-054's two-phase startup — phase A host-only with read-only harness views, phase B the one in-flight job's harness act then `resume()` — and exercise every recovery-table row by fault injection at its write boundary."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-09 complete." },
]
exit_criteria = [
  { id = "EX-1", text = "Phase A settles every job row from the §5.4 table using job tables, git reads, the probe and read-only views only (I15)." },
  { id = "EX-2", text = "Phase B (enabled only) performs the in-flight job's act per the table — create/record conversation, resubmit initial prompt, abort a recorded pause, resubmit warning, submit resume message — then `resume()`." },
  { id = "EX-3", text = "Disabled restart runs phase A only and makes no progress-asking call; a recorded pause stays recorded; status reads the job as it was." },
  { id = "EX-4", text = "Each recovery-table row has a fault-injection test at its write boundary; no task is scheduled before phase A completes; no resume message is sent twice." },
  { id = "EX-5", text = "Reconcile behaviour ported from the Go runner's crash-reconcile tests as acceptance fixtures." },
  { id = "EX-6", text = "Supersedes the narrower wording of EX-1 and EX-3 under DEC-065 (design rev 56, §5.4 Restart recovery): phase A work that reaches the room — a channel verb (refresh/push, collect, the probe) or an env command (checks, branch create, clean) — runs only when `enabled` (I14). Disabled, every such row does nothing: the job stays in its state and no wait bound is applied, so nothing times out while parked. Rows: `preparing` (both), `waiting_room`, `collecting`, `pending_collection`." },
  { id = "EX-7", text = "Under DEC-065 (design rev 56): `jobs` gains `parked_at` (store migration). A disabled startup sets `parked_at = now` on each non-terminal job whose `parked_at` is null, in one transaction with a `parked` event; a later disabled restart leaves it as is. The first enabled startup, in phase A before any bound is judged, shifts `state_entered_at` (and, for `running`, `running_since`) forward by `now − parked_at` and clears `parked_at`, in one transaction with an `unparked` event; a crash either side re-bases exactly once." },
  { id = "EX-8", text = "Under DEC-065 (design rev 56): the `preparing`, `base_oid` set row splits on the initial submission record (read-only view). No record → (enabled) ensure `job/<id>` at `base_oid` as before, then submit with `requestId` = job id. Record exists → no checks and no branch judgement (the agent may already have worked in the clone); record `running`, then `resume()` continues it." },
]
