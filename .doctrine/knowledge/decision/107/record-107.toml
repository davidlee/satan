slug = "malebolge-daemon-cwd-opaque-string"
title = "malebolge daemon: client cwd remains opaque metadata; room tools start at room home"
record_kind = "decision"
status = "accepted"
created = "2026-10-20"
updated = "2026-11-01"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "SL-030 D-D: a created conversation's cwd is pi's AgentChange.cwd, stored as a string. User direction 2026-10-20: do not couple it to conversation identity beyond pi-durable. SL-013 later confirmed a room-only distinction between stored cwd and daemon tool execution cwd."
choice = "The daemon stores a client-supplied cwd string as given: no path resolution, containment check or realpath. Omitted, the daemon's default cwd is stored (DEC-104). For room-profile daemon tool environments, configured room home is the effective starting directory regardless of stored cwd, including existing conversations and wake, thread and bridge turns. Host-profile tool environments retain the stored cwd override and default fallback. Stored values remain inspectable and are not rewritten. Confinement remains the jail's (CON-005, DEC-078); the separate task runner retains its policy."
alternatives = ["Lexical containment under DaemonEnv.cwd", "realpath containment via an injected resolveCwd (raw/architecture.md F-5)"]
rationale = "cwd is a starting directory, not a boundary: the agent's bash tool already reaches anything its jail binds, so daemon-side containment would imply a guarantee it cannot give. The room-only execution override separates room work from host context while preserving opaque stored values and host behavior."
consequences = ["In host profile a cwd outside the jail binds fails at tool time rather than at create", "Host profile retains stored cwd override and default fallback", "Room daemon tools start at configured room home regardless of stored cwd", "Isolation and RFC-019 D1 narrowing remain the jail's responsibility under CON-005"]
decided_by = "user (accepted 2026-10-20; room-only amendment confirmed in malebolge SL-013 design, 2026-10-31)"
decided_on = "2026-10-20"

