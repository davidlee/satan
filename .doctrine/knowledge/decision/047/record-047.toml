context = "flakes:SL-013 moved the emacs flake jails (E commit 069e9b6). User settled OQ-1 (satan and pi keys) and OQ-5 (delete opencode, dirge)."
choice = 'piGateway = jailLib.gatewayClient "pi" on jailed-pi; jailed-pi-research; jailed-shell and jailed-claude. jailed-claude also gets subagents = ["pi" "claude"] and maxSubagentDepth = 2 so it can run pi (research) agents nested on the pi gateway, matching the emacs flake. satanGateway = jailLib.gatewayClient "satan" on satan-jailed-gptel-harness. Drop useOpEnv/passApiKeysFromEnv everywhere. Delete apiKeyJailOptions; jailed-opencode; jailed-dirge and dirge in subagents. satanGptelJailOptions forwards SATAN_MODEL; SATAN_BUDGET_TOKENS and SATAN_MAX_BUDGET_TOKENS only. SATAN-jailed-fake-harness stays offline. Amended 2026-10-18: the user overruled RV-023 F-8.'
