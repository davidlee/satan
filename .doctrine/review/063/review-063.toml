status = "verified"
severity = "minor"
title = "Wake turns can still hang on room tools without a per-call deadline (bash, grep)"
detail = """
Expected (design Risks): a wake's model turn is bounded; the model stream deadline (PHASE-03) covers the model, and in-turn tool calls should be bounded too.
Observed (PHASE-06 recon): satan-mcp calls are bounded by pi-mcp's 30 s request timeout; `bash` (no default timeout) and `grep` (no wall-clock bound) are not. A hung tool call holds the wake's placed input until the daemon restarts. Minted RSK-022.
"""
