detail = "Contract says sections {id(sec-): text}; error only says 'marker map ... N mismatched'. Took ~8 guesses (titles, markers, bodies, 12-hex fingerprints) to find the value is the full sha256 hex of each section body (md chunk after the marker, trailing newlines collapsed to one). Also: inq- declarations reject resolution/body/dispose with 'inert at inq-' — resolution goes via a cp- checkpoint declaration, which the contract doesn't say. SL-016 revision, 2026-09-24."

