[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "A changed host key mid-job is handled as downtime, not a trust failure"
detail = "design.md:397,456-469,1084 say a changed key is a trust failure, never retried as a pause, and :465 says pi-env gives only ssh's text. Code facts: the room command function calls detectPlatform/deployDaemon, which throw typed HostKeyChangedError/HostKeyUnknownError (pi-env dist/ssh.js runSsh). pi-env Connection.#start then wraps any command-function rejection as RemoteError{code:spawn_error, lost:true} (dist/connection.js:193-200). JobConnection pauses on isConnectionLost (malebolge src/runner/env.ts #observe), and prepare.ts roomShell counts the same loss as ChannelUnavailable. Scenario: a room is rebuilt mid-job with a new host key. The daemon reconnect fails strict, so the job pauses (waiting_room). reachable() is 'capsule ssh true', non-zero for any ssh failure, so it stays false. After max_room_wait the job goes to pending_collection, whose retry is gated on reachable(), and after max_pending_collection it ends collection_abandoned. It is never reported as a host-key failure. Same path for a restart in preparing with base_oid set (no re-push): the lookup passes on the old key, the env spawn_error counts as ChannelUnavailable, and the job ends room_unavailable. Fix: the runner-owned command function catches HostKey*Error and rethrows a non-lost typed error (or JobConnection excludes it). Then add recovery rows for running/waiting_room/preparing-with-base_oid, and a §9 test for a changed key on reconnect."
disposition = "fix-now"
response = "Fixed in §5.2 Host keys: typed HostKey*Error → per-job trust failure, never waiting_room. Demonstrated by the §9 changed-key tests (PHASE-15) and the live room rung."
route = "demonstrate"

