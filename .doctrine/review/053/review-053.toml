[[finding]]
id = "F-17"
status = "answered"
severity = "minor"
title = "Hardening observations: over-broad child env strip, unbounded line buffer, no server signal handler, stale-lock advice, undocumented audit-kind collapse"
detail = """
Five hardening observations raised as "design tensions, residual" rather than defects. Each fails in a safe direction today; each is a place where the stated boundary is narrower than the code's exposure. Grouped for the ledger, not collapsed — one bullet per observation, each with its site.

- Over-broad child env strip (R1, design tension 5). Expected (PHASE-06 EX-5): the child inherits no environment variable naming the run directory. Observed: `childEnv` skips any variable whose value *contains* a run path (pi/mcp/spawn.ts:180-183), so a short `PI_MCP_RUN_DIR` (e.g. `/run/user/1000/satan`) can strip `XDG_RUNTIME_DIR` or a `PATH` entry and break the launch with a confusing `spawn` failure. Fails safe, over-broad.

- Unbounded line buffer (R1, design tension 6). Expected: the wire reader and the stream capture are bounded by something other than RAM. Observed: `serve`'s `pending` accumulator grows without limit (pi/mcp/server.ts:589-600), and the child's whole stream is held in memory as `lines` (declared at pi/mcp/spawn.ts:204, pushed at pi/mcp/spawn.ts:302) while also being written to disk. Fine for the intended prompt sizes; a multi-hundred-MB prompt or a very long tool-output stream is bounded by nothing.

- No server signal handler (R1, design tension 4). Expected: the counterpart of PHASE-06 EX-11 ("it never leaves a child behind"). Observed: neither `pi/mcp/main.ts` (7 lines, `await serve(process.stdin, process.stdout, process.env)`) nor `pi/mcp/server.ts` installs a SIGTERM/SIGINT handler, so a driver that kills the server rather than closing stdin leaves the child's session alive — the child is its own session, so nothing propagates. DEC-103 names stdin EOF as *the* shutdown, so this is a declared boundary, not a defect; it belongs in the slice's residual list.

- Stale-lock advice (R1, design tension 2). Expected: an operator-facing `detail` describes a state an operator can safely act on. Observed: pi/mcp/session.ts:370 says the lock "carries no readable ownership record … it must be cleared by an operator", but between the `O_EXCL` create (pi/mcp/session.ts:301) and the record write the lock is legitimately empty, so a concurrent caller can read that advice about a lock that is about to become live. Fail-closed, but an operator acting on it would clear a live lock.

- Undocumented audit-kind collapse (R3, finding 8). Expected: design sec-6 enumerates the audit vocabulary — "`spawn` (with the profile snapshot digest), `abort` (with usage at the gate and the cause), `timeout`, `exit`, `switch`, each with the policy digest" (design.md:221). Observed: `AuditKind` is `'spawn' | 'abort' | 'exit'` (pi/mcp/evidence.ts:179) and the code emits `abort` + `cause`, while the comment above it says later phases "add fields, not new files" — true of the file, not of the record vocabulary. Defensible (the cause names the outcome), but it reads as an oversight rather than a choice.

Suggestion: state the audit-kind collapse in the comment (`timeout`/`switch` are `abort` records carrying a cause), narrow `childEnv`'s test to the variables the design actually names, bound the line buffer and the retained stream (or state the size limit), add the SIGTERM/SIGINT handler or record it in the slice's residual list, and replace the stale-lock advice with "owned, record not yet readable — retry".
"""
disposition = "tolerated"
route = "probe"
response = """
Accepted as residual risk for the audit's risk register, judged not worth a repair now (each fails safe or is bounded by the deployment):

- Over-broad child env strip. `childEnv` drops any variable whose value contains the run directory path; with a short `PI_MCP_RUN_DIR` (e.g. `/run/user/1000/satan`) that can drop `XDG_RUNTIME_DIR` or a `PATH` entry, producing a confusing `spawn` failure.
- Unbounded buffers. `serve`'s per-line buffer and `spawn`'s in-memory `lines` (alongside the on-disk `events.jsonl`) are bounded only by RAM; fine for the intended prompt sizes.
- No SIGTERM/SIGINT handler on the server. A driver that kills the server rather than closing stdin leaves the child's session alive — a declared boundary (DEC-103 names stdin EOF as the shutdown), but the natural counterpart to EX-11 and worth stating in the residual list.
- Stale-lock advice. `reclaim`'s message tells the operator to clear a lock that, between `openSync('wx')` and the record write, may be about to become live.
- `AuditKind` collapses design sec-6's `timeout`/`switch` record kinds into `abort` + `cause` without saying so; defensible, currently reads as an oversight.
"""

