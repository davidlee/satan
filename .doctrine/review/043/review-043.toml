[[finding]]
id = "F-8"
status = "answered"
severity = "major"
title = "Refusals must be audited but have no specified audit location"
detail = "Expected: policy-unavailable/invalid, disabled, profile/root failures and other pre-spawn refusals produce durable, discoverable evidence without launching a child or requiring a valid policy digest. Observed: sec-2 says every refusal is audited; sec-5 says refused has artifacts=null and 'nothing ran'; sec-6's only sink is per-run audit.jsonl and every record carries a policy digest. No sink/allocation rule is given for a rejected attempt, particularly when policy could not be read, or when the run directory itself is unwritable (the operator's explicit fail-closed audit case). Implementers must either invent an undisclosed attempt directory, omit audit on these paths, or recursively try to audit an audit failure. Required correction: separate 'no child spawned' from 'no attempt storage allocated'; define where refusal records live and how they are discovered, how absent policy digest is represented, and the bounded fallback when durable recording itself is impossible. The essential fail-closed choice should stand: no child may start because logging is unavailable. Verification should cover missing/malformed policy, disabled admission and an unwritable/full evidence store, without recursion or an unhandled JSON-RPC/server crash."
disposition = "fix-now"
route = "review"
response = "Accepted. Refusals write to a server-level attempts.jsonl in the state directory: no child, no policy digest required, digest recorded when it was readable. If that sink is unwritable the refusal is still returned, in-band and on stderr, and the no-child-without-logging rule holds. Recursion is excluded by design because the attempt log never requires a run directory."

