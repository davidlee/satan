[[phase]]
id        = "PHASE-01"
name      = "Spike: model gate and room-down signal"
objective = "Prove, against pinned pi-durable 1.3.0 and pi-env 1.3.0, the mechanisms the design builds ceilings and pause on, before any phase builds on them: the model gate in every provider call's path (design §6 OQ-1), pi-env's typed failure on a real room stop caught at an env wrapper, and the spike confirmations of §6."
entrance_criteria = [
  { id = "EN-1", text = "SL-023 design locked (run dr-01a14d77)." },
  { id = "EN-2", text = "An oubliette capsule slot (slot f, EVD-005) can be started by the user (`! capsule f start`, needs sudo) and reached through its relay." },
]
exit_criteria = [
  { id = "EX-1", text = "`@earendil-works/pi-env` pinned at the exact pi-durable version in M's package.json." },
  { id = "EX-2", text = "RV-025 F-1 / design §6 OQ-1: with a faux provider and memory storage, a Models view wrapping both `streamSimple` and `completeSimple` refuses once the budget is exhausted, and the next generation request, a retry, and a compaction summary each reach no provider; a durable attempt counter counts failed attempts and survives a harness reopen. If the view cannot sit in every call's path, STOP and /consult: DEC-057 is amended to the weaker guarantee per the user's ruling before PHASE-08." },
  { id = "EX-3", text = "RV-025 F-2: against the slot, a `capsule f stop` mid-tool-call surfaces at an `ExecutionEnv` wrapper as a typed pi-env failure (matched by type/code, never message text); an ordinary tool error with the same message text is not recognised. The typed failure's exact class/code is recorded." },
  { id = "EX-4", text = "The wrapper's host write on the shared SQLite adapter, made while catching that failure, settles (runs outside any pi transaction) and is durable before `afterTool` runs (RV-025 F-17)." },
  { id = "EX-5", text = "A `whenBusy: \"steer\"` submission made mid-run is placed after the current tool round, before the next model request; `Harness.submission(id).status()` on a paused harness reads the record without enabling scheduling." },
  { id = "EX-6", text = "Findings captured as evidence records (doctrine knowledge, kind evidence) and EVD/notes cite them; F-1 and F-2 verified on RV-025 against that evidence, or the slice stops for a DEC-057/DEC-055 amendment." },
]
verification = [
  { id = "VT-1", expects = "faux-provider spike test: exhausted budget → no provider call on generation, retry and compaction; counter survives reopen", test_file = "/home/david/dev/malebolge/test/runner/model-gate.test.ts", keywords = ["streamSimple", "completeSimple", "compaction", "retry"], waived = false },
  { id = "VH-1", expects = "user starts and stops slot f on request during the live room-stop spike (sudo)" },
  { id = "VA-1", expects = "evidence records for EX-3..EX-5 cite the run (commands, observed types, versions); F-1/F-2 verdicts recorded on RV-025" },
]
