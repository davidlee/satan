[[finding]]
id = "F-6"
status = "verified"
severity = "nit"
title = "Expected (design §2) that appending events after T never changes the answer; observed malformed can flip to missing"
detail = 'A garbage-only day file reads ("malformed"). Appending one valid line with ts > T makes it ("missing") (probe in scratch). An ok or disconnected answer never changes; only the malformed/missing distinction does.'
disposition = "design-wrong"
response = "The §2 append-invariant is overstated: the decision (ok/disconnected and their window) never changes on append after T, but malformed vs missing can. Behaviour is acceptable (both are non-ok, window nil); qualify the invariant in design §2 at reconcile."

