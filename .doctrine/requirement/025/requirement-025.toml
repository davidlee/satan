id = 25
slug = "harness-jail-profile-declared-by-root-and-test-asserted"
title = "The harness jail profile is declared by root and asserted by test"
status = "pending"
kind = "quality"

# description — the requirement statement (structured, queryable; `show` renders
# it as the statement line — the storage rule forbids deriving it from prose).
# Rationale and extended discussion stay in the sister `.md`. Add as:
#   description = "…"
description = "The harness jail binds from the host only its run directory (read-write), the corpus hippocampus (read-write), the notes root (read-only) and its persisted jail home, and forwards only the declared SATAN_* variables; the launcher sets LLM_GATEWAY_URL and passes LLM_GATEWAY_KEY over a file descriptor. The profile is declared once, in root terms, and asserted by test against the built wrapper."
tags = ["jail", "security"]
acceptance_criteria = ["The built wrapper's bind list equals the declared set; in particular no source tree and no other part of the user's home is bound.", "No editor or MCP socket is bound.", "No mount can be added from the build or launch environment.", "The gateway key never appears on any process argv.", "Every ceiling the broker sets, including SATAN_MAX_BUDGET_TOKENS, is visible inside the jail.", "No variable outside the declared forwards (e.g. an op:// reference) is visible inside the jail."]
