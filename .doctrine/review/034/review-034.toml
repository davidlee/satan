[[finding]]
id = "F-13"
status = "answered"
severity = "nit"
title = "Expected every untrusted read to be time-bounded; observed grep and the daemon reader without exec timeouts"
detail = """
grep sets no exec timeout: a hostile room rg that never prints, or daemon grep on a FIFO path, waits for caller abort or the job deadline. nodeSourceReader stats then opens (TOCTOU: a swap to a FIFO blocks daemon start-up); it logs via console.error, not the malebolge logger. Memory stays bounded throughout.
"""
disposition = "tolerated"
response = """
Memory is bounded on every path. Runner grep is bounded in time by the job deadline (REQ-030, the wall-clock authority); daemon grep runs for an attended interactive user who can abort. The daemon reader's TOCTOU needs the user to swap a file in their own directory during start-up. console.error at start-up precedes the daemon logger's scope. Revisit if grep gains unattended daemon use.
"""

