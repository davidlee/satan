[[finding]]
id = "F-4"
status = "verified"
severity = "nit"
title = "Expected refusal typing only for children that never produced a result; observed final-without-ready then exit yields a done run with failure_reason spawn_failed"
detail = """
Refusal predicate in satan-broker--wrap-sentinel tests process ended, (not ready), status running — not final. A child that emits `final` without `ready` and exits gets a spawn-failed audit event and failure_reason spawn_failed, while --finalize still sets status done (final present). Shipped harnesses always emit ready first (runloop.py ~:228; flake fake harness), so unreachable today; incoherent record if it ever happens.
"""
disposition = "fix-now"
response = """
2243b41: refusal predicate also requires (not (satan-run-final run-ctx)). Red→green test satan-broker/final-without-ready-is-not-a-refusal.
"""

