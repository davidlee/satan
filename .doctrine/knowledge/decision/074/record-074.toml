[facet]                         # every field typed; seeded empty (captured later)
context = "SL-027 needs the runner's pi-env connection for the daemon. malebolge RFC-001 (advice) proposes a src/room/ tier, a consumer cut and travelling invariants; EVD-011 shows two concurrent clients on one room are independent."
choice = "New src/room/ holds what a room session needs whichever program holds it: RoomConnection, Launch and a direct launch, sshTarget, daemonCommand, DaemonConnection/daemonConnection, HostKeyFailure, LostFailure/ConnectionObserver shapes, ObservedConnection (the observed-connection class the shell factory is built on; amended 2026-10-20, design R1), RoomShell/ShellLimits/ShellOutput, ChannelUnavailable/ChannelFailed, the shell factory over a connection (not a job), roomSourceReader split from job admission, and a parser for a room door TOML table. src/runner/ keeps JobConnection (the job's use of ObservedConnection), the pause observer, jobEnv, GitChannel and capsule verbs, the slot door, clone hygiene, daemonLaunch (session <repo>) and door-kind dispatch; the remainder of runner/room.ts is renamed runner/door.ts. Module header states its invariants: built from facts and never knows which client it serves; a host-key failure is a trust failure, never downtime; no pause, profile or tool-error policy inside. The runner's two single-helper root imports move so config.ts and session.ts become daemon-only (amended 2026-10-20, RV-035 F-8/F-10, RFC-001 §3): parseModel, ModelRef, DEFAULT_MODEL → src/models.ts; registryOf → src/registry.ts. A structural import test asserts allowlists file by file (RV-035 F-9): nothing outside src/runner/ imports src/runner/*; src/runner/ imports only runner/*, room/* and named shared root modules; src/room/ imports only room/* and named root leaves."
alternatives = ["Daemon imports src/runner/* directly", "Door parsing per program (RFC-001 §3), duplicating the closed room-door key table", "A src/lib/ tier in the same change (deferred to malebolge IMP-002)"]
rationale = "One implementation (POL-001) with a named boundary; the consumer test keeps both programs' policies out of the shared code."
consequences = ["VT: runner suite green unchanged; structural import test", "malebolge IMP-002 keeps src/lib/ and the run.ts cut"]
decided_by = "user (accepted agent proposals, 2026-10-19/20)"
decided_on = "2026-10-20"

