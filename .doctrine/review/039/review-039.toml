id    = 39
slug  = "reconciliation-review-of-sl-027"
title = "reconciliation review of SL-027"
# no status — a review's status is DERIVED from its findings, so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "reconciliation"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"
rounds_base = 0
contests_base = 0
concluded = true

[[review.turn]]
act = "conclude"
role = "raiser"
note = """
Audited SL-027 against design §4/§6, CON-005 and plan PHASE-01..06: live PHASE-06 evidence (jail netns probes, room clone/write as satan during/after patch jobs, egress sweep of 37 tools, VH-1), gates in satan/malebolge/check-jails, slice conformance and verify-vt, and carry-over of RV-035..038. 7 findings, all verified; design/governance drift mapped in the Reconciliation Brief.
"""

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
ref   = "SL-027"

[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "Expected design §4.8/§6 to name the clone form satan can use; observed they prescribe safe.directory and plain git clone, which git refuses"
detail = """
Design §4.8: oubliette IMP-023 gives readers "git `safe.directory` for the readers"; §6 VA: "as `satan`, `git clone /work/<repo>` succeeds".
Observed (PHASE-06, notes § VA-2): no safe.directory is configured (user decision 2026-10-20, notes: "safe.directory: never"); `git clone /work/goad-walk` as satan → `fatal: detected dubious ownership in repository at '/work/goad-walk/.git'`; `git clone --no-local` succeeds; prompts/env/room.txt already tells the agent `--no-local`.
Plan PHASE-06 EX-2 carries the same plain-clone text (immutable; note only).
"""
disposition = "design-wrong"
response = """
Design is wrong, the user's decision stands (no safe.directory; --no-local). Reconcile: design §4.8 (drop "git safe.directory for the readers"; clone form `git clone --no-local /work/<repo>`; in-place git refused by design) and §6 VA bullet. Brief entry RB-1.
"""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "design-wrong"
response = """
Design is wrong, the user's decision stands (no safe.directory; --no-local). Reconcile: design §4.8 (drop "git safe.directory for the readers"; clone form `git clone --no-local /work/<repo>`; in-place git refused by design) and §6 VA bullet. Brief entry RB-1.
"""

[[finding.turn]]
act = "verify"
role = "raiser"

[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "Expected §4.7's 'devToolPkgs (incl. rg) removed' to describe the jail's PATH; observed flakes commonPkgs still put rg, curl, wget, python3, libnotify, pulseaudio on it"
detail = """
Design §4.7 row "devToolPkgs (incl. rg) — removed — no host coding tools".
Observed (live, /proc/<daemon>/environ PATH, PHASE-06): ripgrep, curl, wget, python3, libnotify, pulseaudio, fd, jq, git-guarded among the jail's PATH — flakes' base commonPkgs, not satan's grant. No egress consequence: the netns is offline (ENETUNREACH v4/v6) and no D-Bus / Pulse socket is bound (/run/user/1000 holds only satan/{mcp,durable}). The design's claim is satan-grant-only and should say so.
"""
disposition = "design-wrong"
response = """
Design overclaims. Reconcile: §4.7 row says devToolPkgs is satan's grant, removed; flakes base commonPkgs (rg, curl, wget, python3, …) remain, harmless under the offline netns with no host session sockets bound. Brief entry RB-2.
"""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "design-wrong"
response = """
Design overclaims. Reconcile: §4.7 row says devToolPkgs is satan's grant, removed; flakes base commonPkgs (rg, curl, wget, python3, …) remain, harmless under the offline netns with no host session sockets bound. Brief entry RB-2.
"""

[[finding.turn]]
act = "verify"
