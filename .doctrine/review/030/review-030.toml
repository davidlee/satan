[[finding]]
id = "F-5"
status = "verified"
severity = "minor"
title = "jailProbes strings written literally (flake.nix convention); observed MALEBOLGE_SKILLS probe interpolates goadSkill"
detail = """
Expected: jailProbes entries are literal strings, so a probe cannot drift with the binding it checks (convention at flake.nix:344, :451; memory trap 3 cited by the PHASE-03 sheet R1).
Observed: `"--setenv MALEBOLGE_SKILLS ${goadSkill}"` (f677f55) derives the probe from the binding under test. Design §4 Deployment prescribed exactly this. Mitigations verified by PHASE-03 negative controls: dropping the set-env fails the probe (the entry stands alone), and a wrong goadSkill value fails the separate `test -r ${goadSkill}/SKILL.md`. A literal store path would break on every `nix flake update goad`; a literal `/nix/store/` prefix is hash-free but weaker.
"""
disposition = "tolerated"
response = """
The literal rule exists to stop a probe passing while checking nothing. Here a literal would pin a store hash that moves on every goad update, and the two failure modes the rule guards against are each covered by a check that does not share the interpolation's blind spot (negative controls C1/C2 in notes). The departure is commented at the probe site. Accepted.
"""

