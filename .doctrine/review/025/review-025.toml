[[finding]]
id = "F-2"
status = "answered"
severity = "blocker"
title = "a typed pi-env exception may not remain typed at `afterTool`"
detail = """
Codex (gpt-6-sol) design review of SL-023, finding 2. Location: §5.4, lines 645–660.
pi-durable converts an exception from tool execution or environment construction into a generic `tool_error` diagnostic containing its message before invoking `afterTool` ([tool.js](/home/david/dev/malebolge/node_modules/@earendil-works/pi-durable/dist/harness/tool.js:287)). EVD-005 observed an error message, not a typed signal at this hook. **Scenario:** a room stop throws from the remote environment; the hook cannot distinguish it from an ordinary tool error, so the model spends turns retrying. **Repair:** make the first spike prove the hook-visible representation; if exceptions are erased, catch and encode the typed failure in a tool wrapper before pi-durable converts it. **Inferred for pi-env; conversion verified against source.**"""
disposition = "fix-now"
route = "demonstrate"
response = """
Correct: the tool runner catches exceptions from env construction and execute before afterTool sees a result (pi-durable dist harness tool.js, the catch around runtime.env and tool.execute), so a typed pi-env error can reach the hook only as text. Repair: recognition moves to the environment boundary. The runner wraps pi-env's ExecutionEnv for each job; the wrapper catches pi-env's typed connection-lost or spawn failure before pi-durable converts it, records the room-down condition for that job, and rethrows. afterTool consults that recorded condition, never the result text, then replaces the result and triggers the pause. Criterion: in the pause spike against a stopped slot, the wrapper observes a typed failure (not a message match) and the job pauses before another model request; an ordinary tool error with the same message text does not pause. Host phase constraint: the first spike phase must establish the typed signal before the pause machinery is built on it.
"""

