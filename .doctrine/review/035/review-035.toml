   **Claim:** the new user can clone from `/work` while permissions prevent writes. **Verified:** the room seeder creates each clone directory `0700`, owned by `room.repos.user`, currently `agent` ([room.nix](/home/david/dev/oubliette/vm/room.nix:164), [fleet flake](/srv/fleet/flake.nix:154)); the design requires `satan` to read those clones ([design.md](/home/david/dev/satan/.doctrine/slice/027/design.md:541)). **Inference:** a distinct `satan` user receives `EACCES` before `git clone` can read a repo. **Repair:** specify and deploy a read-only access mechanism for the clone trees, including files created by later runner jobs, while denying write and traversal into unrelated `agent` state. Gate on a live clone and a denied write as `satan`."""
