[[phase]]
id        = "PHASE-08"
name      = "End to end, then enable"
objective = """
One integration test drives the real loop with no goad host: `goad_ask`
writes the queue; the real `backend.py` (run as a subprocess against a temp
data dir, `skip-unless` the corpus is present) evaluates and renders the ask
first; a scripted `respond` answers it; the observer classifies it `:worked`
from the record backend.py wrote. A second ask carries a form and is
answered with field values, which reach the trace intact. The goldens from PHASE-02 are checked
against the live backend's output so they cannot drift.

Then the rollout, with the user: redeploy attrd; apply migration 0008 to
the live database (DEC-024 landing step); set `satan-goad-enabled`;
one live ask end to end; one live ask left untouched to maturity. While the
tick timer is dormant (ISS-022) the live asks come from a driven tick-pulse
run, not the timer.
"""
