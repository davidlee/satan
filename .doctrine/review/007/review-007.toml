[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "goad-emit exit 0 does not mean the prompt was delivered"
detail = "goad replies `accepted` BEFORE calling the backend. crates/goad/src/controller.rs:735 says so verbatim: 'accepted. The reply leaves **before** the backend is called: the listener awaits it before accepting the next connection, so a reply that waited for the exchange would put `engaged` out of reach (I-2)'. host.evaluate() runs later, at controller.rs:998. CONFIRMED by read. Design sec-5 claims 'a dead backend.py or an unreachable socket must suppress asking, never bypass. Exit 2 is that case' — false: a dead or crashing backend.py yields exit 0. SATAN then persists an intervention and starts an outcome window for a question that was never rendered, which later matures :ignored. That conflates delivery failure with human disengagement, which is exactly the signal the slice exists to produce. EVD-002's refusal-transport conclusion is unaffected and stands; what is wrong is the delivery inference layered on it."
disposition = "design-wrong"
response = "THE REFRAME. Disengagement, deferral and delivery are read from goad's own record and queue — the files SATAN already reads for the answer — instead of from panopticon focus telemetry. Accepted in full and the design was wrong. The doorbell is demoted to a pure hint with NO inference attached to its exit code: exit 0 means the host took the envelope and nothing more. Delivery is proven by a presented_at stamp the backend writes into the day record when it actually renders an item — the backend can only write it if it ran, which is exactly the fact exit 0 does not carry. EVD-002 is unaffected and stands: its subject is refusal transport through the ledgered tier, which remains correct. What was wrong was the delivery inference layered on top of it in design sec-5, and that inference is removed rather than repaired."

[[finding]]
id = "F-2"
status = "verified"
severity = "blocker"
title = "The observer ack gate is always false, so DEC-012 narrows a count that is never taken"
detail = """satan-memory-evidence--segments-status returns the STRING "ok" (satan/satan-memory-evidence.el:163-190, docstring states it) and it reaches :sensor_status :focus verbatim (:555). satan-observer--ack-checked-p compares it to the SYMBOL 'ok with eq (satan/satan-observer-classify.el:271-277), which is nil for every production run. CONFIRMED by read and by `emacs --batch --eval '(eq (quote ok) "ok")'` => nil. Consequence in classify-negative (:326-345): the :unknown branch is unreachable, --count-ack-events never runs, confidence is never :medium, and every user-facing intervention firing no positive predicate classifies :ignored :low unconditionally. Raised separately as ISS-014 because it is a live bug independent of this slice; SL-016 needs ISS-014. Design sec-6's 'today' truth table is therefore wrong, and DEC-012's surface narrowing is inert until ISS-014 is fixed."""
disposition = "design-wrong"
response = "THE REFRAME. Disengagement, deferral and delivery are read from goad's own record and queue — the files SATAN already reads for the answer — instead of from panopticon focus telemetry. Accepted, and the reframe removes the dependency rather than fixing around it. The negative leg no longer reads sensor_status or focus segments at all, so satan-observer--ack-checked-p is no longer on SL-016's path and DEC-012's surface narrowing is withdrawn. ISS-014 remains a genuine live bug — every user-facing intervention firing no predicate currently classifies :ignored :low unconditionally — but it stops being this slice's prerequisite. The `SL-016 needs ISS-014` edge should be withdrawn at revision time. Design sec-6's 'today' truth table is deleted, not corrected, because it described a path the slice no longer takes."

[[finding]]
id = "F-3"
status = "verified"
severity = "blocker"
title = "Focus telemetry cannot support the absent/ignored/engaged truth table even once ISS-014 is fixed"
detail = 'Three independent defects, all CONFIRMED by GPT against source and telemetry. (a) --count-ack-events counts only segments whose start_ts is STRICTLY AFTER the emit (satan-observer-classify.el:279), so a keeper continuously focused from before the emit counts as absent. (b) Only the newest ten segments survive assembly (satan-memory-evidence.el:63, :185), so an early goad focus can be evicted before maturity. (c) Real telemetry carries transiently wrong surface labels — app_id "goad" appearing with Emacs and Claude window titles in ~/.local/state/behaviour/segments/focus-2026-09-20.jsonl:5. Together: stable presence can read as absent, a genuine deferral can read as ignored, and focus elsewhere can read as goad acknowledgement. DEC-012 assumes a clean surface signal that the data does not provide.'
disposition = "design-wrong"
response = "THE REFRAME. Disengagement, deferral and delivery are read from goad's own record and queue — the files SATAN already reads for the answer — instead of from panopticon focus telemetry. Accepted in full, and it is the finding that drove the reframe. All three defects — strictly-after-emit excluding continuous presence, ten-segment eviction, and transiently mislabelled app_ids — are properties of focus telemetry, and the slice no longer depends on it. goad's record answers the question directly and without inference: an ask that was presented (F-1's presented_at) and is neither answered nor deferred past its slot is non-engagement, evidenced by the same file the answer would have arrived in. No compositor behaviour, no segment retention policy and no surface mapping can corrupt it."

[[finding]]
id = "F-4"
status = "verified"
severity = "blocker"
title = "The motive-mutation race invalidates 'correlate by construction'; it is not a safely carried risk"
detail = "The observer rereads LIVE motives on every pass (satan/satan-observer.el:383) and ranks them against the bundle (satan-observer-classify.el:584). It never consults the persisted related_motive_id or cue_handles. CONFIRMED. So an ask that passed the emit-time gate can still mature :no_correlation if motive_replace touched the motive in between — and tick-pulse holds motive-write with motive_replace in its tool list. Design sec-2 and DEC-007 record this as detectable-but-carried, with IMP-002 as the home for an after-the-fact verifier. Detecting a broken loop is not the same as having a closed one, and both legs of the verification intent sit behind it. Either the correlator must honour the persisted motive id, or the design must stop claiming the loop is closed by construction."
disposition = "accepted-not-closed"
response = "THE REFRAME. Disengagement, deferral and delivery are read from goad's own record and queue — the files SATAN already reads for the answer — instead of from panopticon focus telemetry. Accepted as stated: this is a broken loop, not a detectable one, and the design must stop claiming otherwise. The reframe does NOT dissolve it — a goad-derived predicate still runs inside satan-observer-classify, which still sits behind classify-for-motives, so motive correlation remains the outer gate on everything. Two changes. First, DEC-007's claim is narrowed: the emit-time check makes correlation true AT EMIT, and the design will say plainly that motive mutation can break it before maturity. Second, a goad ask that matures :no_correlation becomes a PERCEPTIBLE event through the same channel as suppression (see F-8), so a broken loop is visible rather than silent — which is the slice's own thesis applied to itself. Making the correlator honour the persisted related_motive_id is the real fix and it is a change to shared classification semantics; it goes to the backlog as its own item, not into this slice."

[[finding]]
id = "F-5"
status = "verified"
severity = "blocker"
title = "The correlation gate correlates ambient percept to motive, never the question to the motive"
detail = "Design sec-2's gate compares live motive cues against ambient percept handles only; neither the question text nor its subject participates. The maturity correlator does the same (satan-observer-classify.el:544). CONFIRMED by reading both. So a generic app:goad cue admits ANY question, on any subject, and where several motives carry the handle, file order picks which one is credited (rank ties break by :order). The gate proves 'some motive overlaps the ambient percept', not 'this question concerns that motive'. DEC-007's title and sec-2's claim both overclaim. The per-item topic: handles sec-3 proposes are the obvious lever but the design does not require the ask to carry one."
disposition = "fixed"
response = "THE REFRAME. Disengagement, deferral and delivery are read from goad's own record and queue — the files SATAN already reads for the answer — instead of from panopticon focus telemetry. Accepted, and the fix is a design principle rather than a patch: SATAN may only ask about something already in its perceptual field. The ask tool will require the question to name a handle present in ctx :percept-handles, and require THAT handle — not merely a generic app:goad — to be in the winning motive's cue. This is forced by the machinery rather than chosen: the percept is frozen at spawn, before the question exists, so a question-specific handle can only correlate if the question is derived from what is already perceived. The gate then proves what DEC-007 claimed for it — that this question concerns that motive — instead of merely that some motive overlaps the ambient percept. It also removes the file-order tie-break concern, since the overlap is now on a specific subject handle."

[[finding]]
id = "F-6"
status = "verified"
severity = "blocker"
title = "Daily bootstrap deadlock: no day record exists until the keeper answers, so SATAN can never ask first"
detail = "Design sec-3 conditions the new app:goad handle on the presence of today's day record, precisely so it does not depend on window focus. But backend.py load() returns {} when the file is absent (~/satan/goad/backend.py:69-74) and save() runs only on a 'respond' request (:153). CONFIRMED by read. So before the keeper answers an existing checklist item on any given day, there is no day record, no goad handle, no correlation, and the ask suppresses itself. The elicitation surface cannot be the first goad interaction of the day — which is most of what an autonomous producer is for. The handle's trigger needs rethinking (backend presence? the queue file itself? a daily bootstrap write?)."
disposition = "fixed"
response = "User-accepted 2026-09-23; design revision 39. Correlation no longer depends on any goad-minted handle, so neither the day-record nor the queue-file keying can deadlock the first ask. sec-2 'What the rule is for' reframes the goad canon rule as perception for later runs; sec-10 requires a perceived non-goad subject (F-20). VT-13."

[[finding]]
id = "F-7"
status = "verified"
severity = "blocker"
title = "backend.py save() serializes only static ITEMS, so a queued SATAN answer is dropped on write"
detail = "save() iterates `for item_id, _section, label in ITEMS` (~/satan/goad/backend.py:77-90) — the hardcoded list. CONFIRMED by read. Design sec-4 and sec-7 specify merging the queue into pending() and echoing intervention_id, but never say save()'s static enumeration must be replaced. As written, a dynamic SATAN item would render, be answered, mutate the in-memory items map, and then vanish at persist time. ASM-001's round trip would fail silently, and backend.py has no tests to catch it. The fixture must prove a queued id survives respond -> save -> load."
disposition = "fixed"
response = "THE REFRAME. Disengagement, deferral and delivery are read from goad's own record and queue — the files SATAN already reads for the answer — instead of from panopticon focus telemetry. Accepted — a real gap that would have failed silently and which backend.py has no tests to catch. save() must serialize the union of ITEMS and the queued SATAN items rather than iterating ITEMS alone, and a fixture must prove a queued id survives respond -> save -> load. This is part of the same backend.py change set as F-18's priority fix, F-19's record enrichment and F-1's presented_at stamp; taken together backend.py is a materially larger change than the design's 'merge the queue into pending()' implied, and the revised design will say so."

[[finding]]
id = "F-8"
status = "verified"
severity = "major"
title = "The suppression sensor alert has no implementation path and needs durable state the design denies it"
detail = "Existing alerts are derived PRE-SPAWN from a closed sensor-status table covering only current-window, focus and browser faults (satan/satan-sensor-alerts.el:102, :322). Goad suppression happens LATER, inside a model-invoked tool handler, with no enqueue API and no sensor-status source. satan-sensor-alerts.el is absent from the design's affected surface (sec-10). And sec-7 states the suppression is not audited, removing the one durable source that could have fed the next tick. CONFIRMED. Verification item 6 ('an ask with no correlating motive is suppressed, and the suppression is perceptible') is not achievable as designed. DEC-011's suppression channel needs a real mechanism or a different one."
disposition = "fixed"
response = "THE REFRAME. Disengagement, deferral and delivery are read from goad's own record and queue — the files SATAN already reads for the answer — instead of from panopticon focus telemetry. Accepted: the sensor-alert mechanism was asserted without checking and does not exist for this case. Verified replacement: suppression is enqueued as an ATTRIBUTE from the tool handler via satan-attribute-enqueue, following the satan-tools-hippocampus.el:109 precedent of a tool handler enqueueing directly — confirmed by read, not assumed this time. That is the right shape as well as an available one: suppression is a persistent condition of the organism rather than an event in the world, which is what the attribute layer is for, and the throttling F-8 demanded becomes a property of attribute semantics rather than bespoke cooldown code. Two constraints the revised design must carry: attributes reach the capsule as pressure rather than readable text, so any detail needs a second sink; and ISS-011 records that satan-attrd REJECTS unknown sensor outcome reasons, so a new reason value needs attrd support and that is a cross-repo dependency to name at plan time. satan-sensor-alerts.el leaves the affected surface; satan-attribute.el joins it."

[[finding]]
id = "F-9"
status = "verified"
severity = "major"
title = "The memory trace does not hold the answer, and is not written under the tick's memory-write capability"
detail = "The positive observer trace records intervention id, motive id, predicates, classification and confidence (satan/satan-observer.el:131, :141) — not the question, not the submitted value. It calls satan-memory-store-mark directly (:149) rather than being dispatched through a tool under the mode's capability. CONFIRMED. Design sec-7 claims the answer 'becomes a memory trace ... written under tick-pulse's existing memory-write capability, so the answer path needs no new capability'. Both halves are wrong: the existing trace records that an intervention worked, not what the keeper said, and the capability claim describes a path that is not taken. DEC-011's third landing place needs designing rather than asserting."
disposition = "fixed"
response = "User-accepted 2026-09-23; design revision 39. The answer trace is written by the observer: satan-observer--persist-positive, which already writes the observation trace for :worked, gains the question (message) and submitted value for kind ask. sec-5 positive leg, sec-6. VT-17."

[[finding]]
id = "F-10"
status = "verified"
severity = "major"
title = "The ask outcome window (60min) and the observer evidence window (30min) disagree, and the predicate has no upper bound"
detail = "docs/attributes/outcome-semantics.md:103 recommends a 60-minute outcome window for kind 'ask'. Observer evidence always ends at a fixed 30 minutes (satan-observer-classify.el:28, :80). The predicate design sec-6 proposes requires only `at > emitted_at` with no upper bound. CONFIRMED. So a deferral or focus at minute 45 is invisible to focus evidence, while a late day-record answer can still fire the predicate as :worked if classification runs late. The design never states what outcome-window-minutes the ask handler actually passes."
disposition = "fixed"
response = "User-accepted 2026-09-23; design revision 39. outcome-window-minutes is 60 (outcome-semantics.md:103), passed by the handler (sec-3). The predicate bounds at emit+60; the goad record is contributed unbounded by after's 30-min horizon and windowed by its consumers (sec-2, sec-8). VT-15."

[[finding]]
id = "F-11"
status = "verified"
severity = "major"
title = "The queue projection is only rewritten by the ask handler, so it is not self-maintaining"
detail = "Design sec-4 specifies the rewrite in the ask handler and sec-4's table claims the whole-rewrite is 'total by construction' with 'no reaping'. But an ask stops being open when the observer classifies it, independently (satan/satan-observer.el:424), and nothing rewrites the queue at that moment. CONFIRMED. So a matured, retired intervention keeps its queue entry until some later ask happens to rewrite the file, and backend.py keeps re-presenting it. Equally, after state loss nothing regenerates until the next ask. The regenerability property DEC-005 rests on needs a trigger, not just a writer."
disposition = "fixed"
response = "THE REFRAME. Disengagement, deferral and delivery are read from goad's own record and queue — the files SATAN already reads for the answer — instead of from panopticon focus telemetry. Accepted. 'Total by construction' was true of each rewrite and false of the file over time, because only the ask handler was specified to rewrite it while the observer retires rows independently. The revised design gives the projection a maintenance trigger at classification time as well as at emit, so a retired ask leaves the queue when it is retired rather than when the next ask happens to occur. This is also what makes the regenerability property DEC-005 leans on actually hold, so it earns the test the design already promised it."

[[finding]]
id = "F-12"
status = "verified"
severity = "major"
title = "goad_ask in interactive MCP mode has no percept, so it suppresses or never correlates"
detail = "Interactive mode exposes every registered tool and capability automatically (satan/satan-mcp.el:66). Its session is minted with a synthetic bundle carrying no percept and its tool context is frozen immediately (:154, :177, :197); later boot-context perception runs on a copy and updates neither (satan/satan-context.el:642, satan-mcp.el:358). CONFIRMED by GPT. So an interactive goad_ask reads nil :percept-handles and suppresses at emit, and the maturity bundle has no percept either. The design must either prohibit the tool in interactive mode explicitly or repair MCP run-state coherence — it currently does neither, and sec-2's 'same handle list' claim is silently false on that path."
disposition = "fixed"
response = "THE REFRAME. Disengagement, deferral and delivery are read from goad's own record and queue — the files SATAN already reads for the answer — instead of from panopticon focus telemetry. Accepted. goad_ask is explicitly prohibited in interactive mode. Interactive sessions mint a synthetic bundle with no percept and freeze tool context immediately, so the tool would read nil :percept-handles, suppress at emit, and in the event it did emit would mature :no_correlation against a bundle that also has no percept. Repairing MCP run-state coherence is a real and separate concern and goes to the backlog; it is not this slice's to fix. The revised design states the prohibition as a property of the tool rather than leaving sec-2's 'same handle list' claim silently false on that path."

[[finding]]
id = "F-13"
status = "verified"
severity = "major"
title = "ASM-001's mechanism is wrong: intervention_id must ride an option or field id, not event.data"
detail = "GPT verified the zero-host-change identity premise is ACHIEVABLE but by a different route than ASM-001 implies. goad echoes backend-owned option and field ids (docs/specs/001-host-backend-protocol.md:87) while only view_id is host-minted (:139); ingress event.data does NOT survive into a 'respond' request. ASM-001's body leans on SPEC-003/R-11's opaque data field and on the `yes:meds` option-id precedent as parallel evidence. The option-id route is the one that works and the record should say so specifically, because it constrains the id encoding (option ids must remain parseable back to an intervention_id)."
disposition = "fixed"
response = "THE REFRAME. Disengagement, deferral and delivery are read from goad's own record and queue — the files SATAN already reads for the answer — instead of from panopticon focus telemetry. Accepted with thanks — this corrects the mechanism, not just the wording. ASM-001 leaned on SPEC-003/R-11's opaque data field, and ingress event.data does not survive into a respond request; only backend-owned option and field ids are echoed, with view_id host-minted. So intervention_id must be encoded in the option id, extending the existing yes:meds convention that backend.py's own docstring already describes as smuggling backend-owned identity through a host that will not carry it. ASM-001's claim, validation plan and body are updated to name the option-id route specifically, and the constraint it implies — option ids must remain parseable back to an intervention_id — becomes part of the record."

[[finding]]
id = "F-14"
status = "verified"
severity = "minor"
title = "Design sec-9 and sec-6 disagree about what 'saw it and did nothing' classifies as"
detail = "sec-9 states verification item 3 as 'present, saw it, did nothing' => :ignored. sec-6's truth table says goad focus with no answer => :unknown :low, correctly, because that is a deferral. If the keeper genuinely 'saw it' they focused goad, which sec-6 routes to :unknown. The two sentences are incompatible as written. sec-9 means 'present at the machine but never looked at goad'; it should say that."
disposition = "fixed"
response = "THE REFRAME. Disengagement, deferral and delivery are read from goad's own record and queue — the files SATAN already reads for the answer — instead of from panopticon focus telemetry. Accepted: the two sentences were incompatible. Under the reframe both are rewritten anyway, since the truth table no longer refers to focus segments at all. The distinction the revised text must keep is between presented-and-untouched (non-engagement) and presented-and-deferred (engagement), which F-19 shows the record cannot currently express — so the wording fix and the record enrichment land together."

[[finding]]
id = "F-15"
status = "verified"
severity = "minor"
title = "Restoring global quiet hours to protect the doorbell is scope creep with unrelated effects"
detail = "satan-tick-quiet-hours suppresses the ENTIRE tick before any mode is selected (satan/satan-tick.el:124, satan-tick-quiet-p consulted first in satan-tick). CONFIRMED. Design sec-8 proposes restoring it specifically to stop the goad doorbell ringing overnight. That would also disable overnight observer processing, memory work, inbox work and every other tick behaviour — none of which this slice has any business changing. A goad-specific emission window is the contained solution. The underlying hazard (a doorbell on a round-the-clock ~30min tick) is real and still needs an answer."
disposition = "fixed"
response = "THE REFRAME. Disengagement, deferral and delivery are read from goad's own record and queue — the files SATAN already reads for the answer — instead of from panopticon focus telemetry. Accepted — genuine scope creep, and the finding is right that the contained solution is better. satan-tick-quiet-hours suppresses the entire tick before mode selection, so restoring it would silence overnight observer processing, memory work and inbox work, none of which this slice has any business touching. The revised design specifies a goad-specific emission window instead. The underlying hazard is unchanged and still real: a doorbell on a round-the-clock thirty-minute tick can ring at 3am, and shipping the doorbell without a window would spend exactly the attention this slice exists to conserve."

[[finding]]
id = "F-16"
status = "verified"
severity = "nit"
title = "'Handles exist only for what reaches the evidence window' is overstated"
detail = "Design sec-3 states handles exist only for what reaches the evidence window and has a rule to name it. Canon rules also emit context- and hint-derived handles (satan/satan-memory-canon.el:429 and the normalized-hints path). GPT confirms this does not create a missed probe or tool route, so DEC-004's route decision is unaffected — but the absolute phrasing is false and a future reader may rely on it."
disposition = "fixed"
response = "THE REFRAME. Disengagement, deferral and delivery are read from goad's own record and queue — the files SATAN already reads for the answer — instead of from panopticon focus telemetry. Accepted. The sentence is rewritten to say that no probe and no post-percept tool can contribute a handle for that run, which is the claim that actually carries the route decision, rather than the absolute and false 'handles exist only for evidence'. Canon also emits context- and hint-derived handles, and a future reader should not be misled by the stronger phrasing."

[[finding]]
id = "F-17"
status = "verified"
severity = "major"
title = "SUSPECTED: presenting the goad window may itself generate a goad focus segment"
detail = "Rendering a prompt calls window.show() (crates/goad/src/glass.rs:328) and the application id is 'goad' (crates/goad/src/main.rs:124). If the compositor focuses newly shown windows, an untouched prompt produces a goad focus event immediately, and under DEC-012's narrowing that reads as acknowledgement — turning every ignored prompt into :unknown and destroying the keystone from the other direction. GPT rates this SUSPECTED (medium confidence): it did not verify compositor behaviour. Needs a measured fixture — present a prompt, touch nothing, inspect the focus segments — not an assumption either way."
disposition = "moot-under-reframe"
response = "THE REFRAME. Disengagement, deferral and delivery are read from goad's own record and queue — the files SATAN already reads for the answer — instead of from panopticon focus telemetry. Accepted as a real risk and made moot rather than resolved. The concern — that window.show() may itself produce a goad focus segment, turning every ignored prompt into acknowledgement — only bites a design that reads focus segments, and the reframe stops reading them. No compositor fixture is needed because no classification depends on the answer. Recorded here so that anyone who later reintroduces a focus-based signal knows to measure it first; the right test is to present a prompt, touch nothing, and inspect the segments."

[[finding]]
id = "F-18"
status = "verified"
severity = "blocker"
title = "A SATAN ask merged into pending() renders only if it reaches position 0"
detail = "Found while verifying the reframe's own premise; neither the adversarial pass nor the original design caught it. backend.py main() renders ONE item per exchange — it takes waiting[0] from pending() and nothing else (~/satan/goad/backend.py:157-159). pending() returns every unanswered, undeferred item in ITEMS order, and the ITEMS comment says so outright: 'id, section, label. Order is ask order.' (:22). There are 14 hardcoded checklist items. CONFIRMED by read. So a SATAN question appended to pending() is not shown until every checklist item ahead of it is answered or deferred — on a normal day, effectively never. The design says merge the queue into pending() and says nothing about position. It must specify priority (SATAN asks at the front, or their own slot) or the PROMPT leg does not work at all. This also bears directly on delivery proof: being in the queue is not being rendered."
disposition = "fixed"
response = "THE REFRAME. Disengagement, deferral and delivery are read from goad's own record and queue — the files SATAN already reads for the answer — instead of from panopticon focus telemetry. Accepted, self-raised while verifying the reframe's own premise, and it is a blocker for the PROMPT leg independent of everything else. backend.py renders only the first pending item, and pending() returns ITEMS order, so a SATAN question appended behind fourteen checklist items would effectively never be shown. The revised design requires SATAN asks to take priority in pending() rather than merely being merged into it. It also sharpens F-1: being in the queue is not being rendered, which is precisely why presented_at has to be written at render time by the backend rather than inferred anywhere else."

[[finding]]
id = "F-19"
status = "verified"
severity = "blocker"
title = "The day record cannot distinguish an explicit Later from a bulk Enough dismissal"
detail = "answer() writes the SAME deferred_at key for both verbs (~/satan/goad/backend.py:132-146): the later verb sets deferred_at on one item; the enough verb loops over every pending item and sets deferred_at on all of them. CONFIRMED by read. For SL-016 these are opposite signals — Later is engagement (the keeper saw this question and postponed it), Enough is dismissal (the keeper cleared the slot, quite possibly without ever seeing the SATAN question, since only the first pending item is ever rendered). The record makes them identical, so no predicate and no reframe can tell them apart. Compounding it, the enough verb defers a SATAN ask the keeper never saw, and is_deferred holds until the next slot boundary (slots every two hours). The reframe onto goad's record therefore requires enriching what the record stores: a presented_at stamp, and distinct deferral provenance. Both are backend.py changes, already in scope."
disposition = "fixed"
response = "THE REFRAME. Disengagement, deferral and delivery are read from goad's own record and queue — the files SATAN already reads for the answer — instead of from panopticon focus telemetry. Accepted, self-raised. answer() writes the same deferred_at for the later verb and the enough verb, so the record cannot distinguish 'the keeper saw this question and postponed it' from 'the keeper cleared the slot, probably without ever seeing it' — opposite signals for this slice, and the bulk case can defer a SATAN ask the keeper never saw. The revised design enriches the record with distinct deferral provenance alongside F-1's presented_at stamp. Without both, the reframe cannot actually read engagement out of goad's record, so these two are the reframe's load-bearing backend changes and they are stated as such rather than left implicit."

[[finding]]
id = "F-20"
status = "verified"
severity = "blocker"
title = "Queue-derived goad handles can never correlate the ask that creates them; the subject gate is circular"
detail = "Design sec-10 (§2) requires the ask to name a handle in ctx :percept-handles AND have that handle in the winning motive's cue; sec-2 (§3) says the canon rule emits app:goad plus topic:<Subject> 'per outstanding question' from the queue file, and that 'the topic: emissions are load-bearing'. But the percept is frozen pre-spawn (satan-percept.el:65-67; tool ctx :percept-handles = prepare :percept :handles, satan-run.el:325-334), and the maturity correlator reads the SAME emitting run's bundle.json (satan-observer-classify.el:500-509). The queue entry for question Q is written by the tool inside that run, so neither app:goad (first ask, empty queue) nor topic:<Q-subject> can be in the percept that gates or correlates Q. No other source emits topic: in a percept: satan-percept-build passes hints=nil to canonicalize (satan-percept.el:67), and hint.topic (satan-memory-canon.el:452-459) is the only topic: rule. Failure scenario: SATAN wants to ask about subject S for the first time; percept has no topic:S; gate fails closed; suppression recorded; repeat forever — F-6's 'SATAN can never ask first' deadlock recurs per subject. F-6's answer ('an ask writes the queue, the queue makes the handle, the handle permits correlation') only holds for a LATER run, never for the ask itself. If instead the subject may be any perceived handle (app:, bough_node:, artifact:...), then the goad canon rule is decorative for correlation, DEC-004's 'only this route produces handles' rationale no longer carries the route choice, and sec-2's load-bearing claim is false. The design must say which handles may serve as subject and where they come from for a first ask."
disposition = "fixed"
response = "User-accepted 2026-09-23; design revision 39. sec-10: the subject must be a perceived handle that is NOT goad-minted (app:goad / goad topic:); goad handles are circular because the percept is frozen before the question exists and the observer reads that frozen percept. The goad canon rule is for perception by later runs (sec-2). DEC-004 amended. VT-13."

[[finding]]
id = "F-21"
status = "verified"
severity = "major"
title = "Ambient predicates P1-P3 run before the ask branch, so an undelivered ask can mature :worked"
detail = "Design sec-5 says the ask's verdict is read from goad's record ('Nothing is inferred from where the keeper's eyes were'; never-presented -> :unknown :high undelivered; verification item 12). But satan-observer-classify (satan-observer-classify.el:470-485) runs ALL of satan-observer--predicates first and only calls classify-negative when none fire. The three existing predicates are kind-agnostic: P1 editor_edit_in_window reads :focus_segments (focus telemetry — exactly what DEC-013 removed), P2 git_commit_observed and P3 fs_recent_delta read git/recentf (satan-observer-classify.el:147-250), each firing whenever the winning motive has :project_cwd. Scenario: SATAN asks about subject S under a motive with :project_cwd ~/dev/satan; goad never renders it (slot not reached, backend dead); the keeper commits in ~/dev/satan within 30 min; P2 fires -> :worked :medium, motive worked_count bumped and a positive trace written (satan-observer.el:110-163) for a question never seen. The precedence table's first row is unreachable whenever any ambient predicate fires, and the goad answer predicate can co-fire with ambient ones to reach :high (sec-5 endorses this). Needs: for kind 'ask', dispatch on the goad record before (or instead of) the ambient predicates, or gate P1-P3 by kind; and a VT for 'undelivered ask + in-window commit'."
disposition = "fixed"
response = "User-accepted 2026-09-23; design revision 39. sec-5: predicates scoped by kind — for kind ask the answer predicate is the only positive predicate; ambient P1-P3 do not apply. Other kinds unchanged. VT-14."

[[finding]]
id = "F-22"
status = "verified"
severity = "major"
title = "Doorbell is not optional: backend.py's next_check pins goad to 2-hour slots, so queued asks mature before presentation"
detail = "Design sec-4 (§5): 'The queue file is the durable carrier and goad polls on its own schedule (default_poll 30m)' and 'the doorbell can ship last, or not at all in v1'; sec-9 repeats it; verification item 5 claims a refused goad-emit 'loses nothing: the question is still asked at the next poll'. False for this backend: backend.py main() always returns next_check = next_slot(now) (~/satan/goad/backend.py:40,54-60,160) — slots at 9,11,...,23, and 23:00 -> 09:00 next day. goad's schedule takes the backend's instruction over default_poll; default_poll applies only when next_check is absent (~/dev/goad/crates/goad-semantics/src/schedule.rs:233-248). None of the four backend changes (sec-3 table) alters next_check. Scenario: ask recorded 13:10 with a 60-min window, doorbell absent or refused (exit 1/2); goad next evaluates at 15:00; the observer's first run after 14:10 classifies :unknown :high undelivered and the classification-time queue rewrite (sec-3) retires it — it is never shown. Roughly any ask whose window does not straddle a slot boundary, and every ask after 23:00, is lost. Either the doorbell is mandatory for v1 (and a refused ring is not harmless), or backend.py must shorten next_check while SATAN asks are queued (a fifth backend change), or the outcome window must exceed the slot interval."
disposition = "fixed"
response = "User-accepted 2026-09-23; design revision 39. sec-4: the doorbell is the primary delivery path, rung by the ask tool at emit (sec-3 step 7) and shipped with PROMPT (sec-9). The slot poll is fallback; late delivery matures undelivered, never :ignored. Re-evaluation after an engaged exchange named as unverified, plan verifies. VT-5."

[[finding]]
id = "F-23"
status = "verified"
severity = "major"
title = "The ask branch reads goad state out of a fixed 30-minute 'after' window and measures elapsed time from emit, not presentation"
detail = "Design sec-5 reads presented_at/deferral/answer 'out of after exactly as the positive predicate does', and sec-8 says the predicate requires the answer inside the declared outcome window. But 'after' is assembled for [emit, emit+satan-observer-window-mature-seconds=1800s] regardless of outcome_window_minutes (satan-observer-classify.el:28,78-85,112-126), with the day file keyed by (substring end 0 10) (satan-memory-evidence.el:506). The design never says whether the goad evidence source honours [start,end]. If it does: with outcome-semantics.md:109's 60-min window for 'ask', a presentation, Later or answer at minute 31-60 is invisible, so a delivered ask classifies :unknown :high undelivered and a timely answer never fires :worked. If it does not (reads the file as of classification): the verdict depends on when the observer happens to run (anywhere in the 24h mature band), and post-window Laters/answers change it. Separately, 'presented, nothing else -> :ignored :medium untouched' has no exposure bound: an ask first rendered at minute 59 of a 60-min window (likely, given slot-bound presentation — see the next_check finding) and classified at minute 60 is recorded as the keeper ignoring it after seconds of exposure — the F-1 lesson (a delivery artefact recorded as the keeper's silence) reintroduced. Needs: the goad source's bound semantics, the window value, and an exposure criterion (e.g. presented_at + minimum dwell <= window end, else :unknown)."
disposition = "fixed"
response = "User-accepted 2026-09-23; design revision 39. sec-2: the goad source ignores the assembler's time bounds; consumers apply the ask's 60-min window. sec-5: short_exposure row — presented in the window's last 10 min matures :unknown :low. VT-15."

[[finding]]
id = "F-24"
status = "verified"
severity = "major"
title = "'Open rows' is undefined; stale asks are never classified and never leave the queue"
detail = "Design sec-3 rewrites queue.json 'from the open rows' at emit and at classification (F-11 fix), and verification item 8 tests total regeneration. No existing query returns them: satan-intervention-pending returns only MATURED rows without outcome and EXCLUDES rows past window+24h (satan-intervention.el:839-875); satan-intervention-recent ignores outcomes (:877-910). outcome-semantics.md:221: after :stale 'the auto-classifier ignores the intervention'. So an ask not classified within window+24h never gets an outcome row. If 'open' = 'no outcome row', it stays in the queue forever and backend.py (which gives SATAN asks priority, sec-3 change 1) re-presents it ahead of the checklist indefinitely. This is not an edge case once SL-018 lands: the observer runs only inside satan-broker--spawn (satan-broker.el:749-753), and SL-018's credential_deferred branch spawns nothing (.doctrine/slice/018/design.md sec-1 diagram, sec-3 step 4), so a keeper away with the vault locked for >24h strands every outstanding ask as stale. The design's SL-018 paragraph (sec-7, sec-9) considers only the producer, not the observer. Needs: a defined open-set predicate with a staleness cutoff (and the new query named in satan-intervention.el's surface row), plus a VT for a stale ask leaving the queue."
disposition = "fixed"
response = "User-accepted 2026-09-23; design revision 39. sec-3: open rows defined (kind ask, no outcome, window not passed); every queue entry carries expires_at and backend.py change 5 skips expired entries, so the queue is self-limiting when no run spawns (SL-018 defer). VT-16."

[[finding]]
id = "F-25"
status = "verified"
severity = "minor"
title = "Affected surface omits satan-observer.el, whose verdict mapping drops the ask branch's evidence labels"
detail = "The design needs two changes in satan-observer.el yet lists it nowhere in sec-9: (1) the queue rewrite at classification, which sec-3 itself locates at satan-observer-persist-verdict (satan-observer.el:264); (2) satan-observer--verdict-classify-args (satan-observer.el:180-262) persists :unknown evidence as only (:source_events :reason) and :ignored evidence as target_surface/ack fields. The ask branch's labels undelivered / deferred / dismissed / untouched (sec-5 table) are therefore not persisted unless mapped, so 'dismissed' and 'untouched' become indistinguishable in the outcome row and audit. Sec-5's claim that the undelivered row 'uses the vocabulary notify_send already writes' is also unmet: notify writes it as :notes 'undelivered: ERR' (satan-tools-notify.el:65), a field the observer path never sets. The matured-:no_correlation attribute (item 7) and the answer memory trace likewise need an observer-side writer that the surface does not name."
disposition = "fixed"
response = "User-accepted 2026-09-23; design revision 39. sec-9 surface gains satan-observer.el (classification-time queue rewrite, answer trace, evidence labels in satan-observer--verdict-classify-args). sec-5 says the mapping gains the labels. VT-18."

[[finding]]
id = "F-26"
status = "verified"
severity = "nit"
title = "Ask handler checks correlation before the MCP refusal, so interactive use records spurious suppression"
detail = "Design sec-3 handler order: step 1 resolves the motive and 'fails closed ... recording the suppression' (an attribute, sec-6); step 2 refuses in interactive MCP mode. In MCP, :percept-handles is nil (sec-10, satan-mcp.el:155-197), so step 1 always fails and enqueues a suppression attribute before step 2 refuses — polluting the very signal meant to report SATAN's muteness. Swap steps 1 and 2 (and state where the goad quiet-window check sits in the list; it is absent from the steps though sec-7 requires it)."
disposition = "fixed"
response = "User-accepted 2026-09-23; design revision 39. sec-3 handler order: MCP refusal first, then quiet-window refusal, then correlation/suppression. Neither refusal records a suppression."

[[finding]]
id = "F-27"
status = "verified"
severity = "nit"
title = "Governance cites REV-002 / ledger row-4 note as accepting the undelivered auto-verdict writer; it does not"
detail = "Design sec-7 (§8) trigger 2: the undelivered verdict 'goes through the auto-verdict writer notify_send already uses, accepted with SL-017 under REV-002 (ADR-017 row 4 note)'. REV-002 and the row-4 standing note (.doctrine/adr/017/authority-ledger.md:71-81) cover operational alarms (failure announcements, listener death reports) as non-audit emits; neither mentions satan-tools-notify--mark-undelivered or any outcome writer. The substantive conclusion survives — the writer appends via satan-audit-record through satan-intervention-classify-record (satan-intervention.el:448-483), the single row-4 writer — but the cited acceptance does not exist. Cite the actual basis instead. Also stale: sec-5 point 1 and the sec-9 risk row still describe the ack gate as eq vs string; ISS-014 is fixed in code (satan-observer-classify.el:271-277 now uses equal)."
disposition = "fixed"
response = "User-accepted 2026-09-23; design revision 39. sec-7 trigger 2 no longer cites REV-002 as accepting the writer; it states the reuse of the existing auto-verdict writer and leaves a possible ledger note to /reconcile. Stale ISS-014 text removed (fixed at 6ff52f7) in sec-5, sec-8, sec-9."

[[finding]]
id = "F-28"
status = "answered"
severity = "major"
title = "Goad-minted handles still count in motive ranking, so the follow-up motives the design invites outrank and suppress (or take credit from) every other ask"
detail = "041ba2f bars goad-minted handles only as a SUBJECT (design.md:117-120). They stay in the frozen percept, and design.md:246-251 invites motives to cue on them ('to follow up, or to back off'). The correlator ranks motives by |cue ∩ ALL percept handles| and credits the top one (satan-observer-classify.el:521-541, :587-599). The design says the emit check uses 'same list, same arithmetic' (design.md:154) with the subject in 'the winning motive's cue' (:120). But sec-3 step 3 (:305) 'resolves the correlating motive on the question's subject handle', which is a different rule. Scenario: run N queued question X. In run N+1 the percept holds {app:goad, topic:X, artifact:Y}. Motive M_goad cues 'app:goad topic:X' (overlap 2); M_Y cues 'artifact:Y' (overlap 1). SATAN asks about artifact:Y. (a) If the tool ranks as the observer does, M_goad wins, artifact:Y is not in its cue, and the ask is suppressed. So while any question is outstanding, no ask on any other subject can pass. (b) If the tool resolves on the subject, it records related_motive_id=M_Y, but at maturity the observer credits M_goad: persist-positive bumps M_goad's worked_count (satan-observer.el:110-129). That brings back F-5's misattribution. The same happens when the keeper has goad focused at spawn, because current_window emits app:goad (satan-memory-canon.el:256-268). Needs: say which motive the ask credits, and make the emit check and the correlator agree. For example, exclude goad-minted handles from ranking for kind ask, or restrict ranking to motives whose cue holds the subject. Add a VT for 'question outstanding + goad-cued motive + ask on another subject'."
disposition = "fixed"
response = 'User-accepted 2026-09-23; design revision 41. Kind "ask" no longer re-ranks at maturity. At emit the tool ranks only motives whose cue holds the subject (overlap with the percept, ties by file order) and records the winner as related_motive_id, with the subject as :cue-handles. At maturity the correlator credits that live motive when it is not dormant and its cue still holds the subject; otherwise the ask matures :no_correlation, which is perceptible. Goad-cued motives therefore neither suppress nor absorb asks on other subjects. sec-10 ("Emit decides; maturity reads the decision"), sec-2, sec-3 step 3/4, sec-9 surface and risks. VT items 19 and 20. DEC-007 amended.'

[[finding]]
id = "F-29"
status = "answered"
severity = "major"
title = "Unbounded goad read leaves 'which day file' undefined; asks near or across midnight lose their record and mature :ignored or undelivered"
detail = "design.md:223-227 says the goad source ignores the assembler's bounds and contributes 'the day record as it stands'. It never says which day. backend.py keys every write by the local date at write time (record_path(now), ~/satan/goad/backend.py:65-66, :150-156), and presented_at (change 2) is also written at render time. The observer's midnight guard checks only its own 30-min window (satan-observer-classify.el:87-96). The after-state ctx :time_now is emit+30 (:98-115), and the assembler keys day files by (substring END 0 10) (satan-memory-evidence.el:506). Scenarios. (1) Ask emitted 23:15 with a 60-min window: the guard passes (end 23:45). The keeper answers at 00:05, which lands in D+1's file. If the source reads the emit/end date, the record shows presented with no value, so the ask classifies :ignored :medium 'untouched', a false keystone signal. The answer trace is also lost. (2) If the source reads 'as it stands' at classification time, any ask that matures after midnight reads the wrong file. That covers every ask emitted after 23:00, and every evening ask when no run spawns overnight (SL-018 defer; the observer runs only in satan-broker--spawn). The whole record is then invisible, so a presented and answered ask matures :unknown :high 'undelivered'. The 23:00 slot (SLOT_HOURS, :40) makes late-evening asks routine unless satan-goad-quiet-hours covers them, and the design gives it no default. Needs: the goad source reads every day file that [emit, emit+window] touches, joined by intervention_id. Or the midnight guard uses the ask's 60-min window and quiet hours cover 23:00 onward. Add a VT for an answer after midnight."
disposition = "fixed"
response = """User-accepted 2026-09-23; design revision 41. backend.py change 6: a SATAN ask's events are filed in the day file of its emitted_at date (carried on the queue entry), and pending() reads its state there. This also stops an ask answered before midnight from being asked again after it. The goad source reads the day file of the window start's date (the emit date, for the observer), never the classification date. Kind "ask" is exempt from the 30-min crosses_midnight guard, which protects panopticon segment files that the ask branch does not read. satan-goad-quiet-hours defaults to (22 . 9). sec-2, sec-3, sec-5, sec-6, sec-7; VT item 21. DEC-009 amended."""

[[finding]]
id = "F-30"
status = "answered"
severity = "minor"
title = "short_exposure keys on a presented_at whose first-vs-latest render semantics are unstated; re-rendering at a slot boundary downgrades the keystone"
detail = "The negative-leg table (design.md:636-637) turns 'presented_at in the window's last 10 minutes' into :unknown :low short_exposure. presented_at is 'written when an item is actually rendered' (design.md:722-723, backend change 2 at :397). But backend.py re-renders waiting[0] on EVERY evaluation until it is answered (~/satan/goad/backend.py:158-160), and next_check pins an evaluation at each 2-hour slot boundary (:40, :160). Scenario: ask emitted and rung at 12:10, rendered, left untouched. At 13:00 the slot evaluation renders it again. If presented_at is overwritten, it reads 13:00, which is inside the last 10 minutes of the 12:10-13:10 window, so the ask matures short_exposure instead of :ignored 'untouched'. With 2-hour slots and 60-min windows, roughly 1 in 12 asks is hit this way (a slot boundary in the window's last 10 minutes). Every re-shown ask after a Later is hit too. Needs: presented_at is stamped on FIRST render only (setdefault), stated in change 2 and pinned by a fixture."
disposition = "fixed"
response = "Design revision 41. sec-3 change 2 and sec-6: presented_at is stamped on first render only and never moved. VT item 22 (backend.py fixture)."

[[finding]]
id = "F-31"
status = "answered"
severity = "minor"
title = "Precedence table has no row for an answer arriving after the window; a late answer classifies :ignored 'untouched' and the answer is discarded"
detail = "The positive predicate fires only for 'at' within emit+60 (design.md:568-571). The negative table (:634-640) has no 'answered late' row, so a presented ask carrying a value with at > emit+60 falls to 'presented, nothing else' and becomes :ignored :medium 'untouched', the keystone. Backend change 5 (:400) stops RENDERING expired entries, but a view already on screen stays answerable: goad sends respond with the option id and answer() writes value/at (~/satan/goad/backend.py:141-142, :153-156). Scenario: ask presented at minute 20, keeper answers at minute 65, observer classifies at minute 70. The record holds a value, yet it is filed as the keeper ignoring SATAN, and persist-positive never writes the answer trace (DEC-011's durable human-sourced evidence). Needs: a row, for example value present after window gives :unknown :low 'late_answer', or the backend refuses responses to expired entries. Plus a VT."
disposition = "fixed"
response = "Design revision 41. sec-5 precedence table gains a second row: a value whose at is past the window gives :unknown :low late_answer. It earns no :worked and no answer trace; the answer stays in the day record for later percepts. VT item 23."

[[finding]]
id = "F-32"
status = "answered"
severity = "nit"
title = "Stale text contradicts the 041ba2f reframe: percept still does 'correlation', doorbell still 'demoted'"
detail = "design.md:736 (sec-6, Where the answer lands, item 2): 'the percept — visibility and correlation, via §3'. After F-20 the goad percept contribution does not do correlation (design.md:50-54, :220-221; DEC-004 amendment). design.md:469-470 (sec-4): 'the correction is the reason the doorbell is demoted'. After F-22 the doorbell is the primary delivery path (:312, :507-515). Also :562-563 says first-fire-wins, but satan-observer-classify.el:476-485 collects all firers. Reword all three."
disposition = "fixed"
response = 'Design revision 41. All three rewritten. sec-6 item 2: percept is "visibility for later runs; never correlation". sec-4: F-1 is "why the doorbell proves nothing about delivery". sec-5: every firing predicate is collected, and two or more raise confidence to :high. The same sweep also updated sec-7/sec-9 SL-018 text to match the landed broker gate (723c205): tick modes defer, escalate after 4h, and a deferred run runs no observer. It also updated sec-10 "What does not work" to note the ask route reads cue_handles.'

