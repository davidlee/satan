[[finding]]
id = "F-16"
status = "verified"
severity = "minor"
title = "Stream deadline expiry is non-retryable under pi-ai 1.4.0, contradicting the stated retries-then-fail outcome and the F-13 criterion"
detail = """
Opus standing in for codex (quota exhausted). Expected: Daemon wiring and configuration, Model stream deadline (design.md approx 598-611) says that on expiry the wrapper ends the stream as an error (model stream exceeded 2h) and pi-durable handles that as any model error: it retries per its retry policy, then fails the run; worst case about (retries + 1) x 2 h. Verification (approx 789-795) and the F-13 ledger criterion assert the run fails after its retries.

Observed/VERIFIED source (pi 1.4.0 source at ~/.local/src/pi, same version as malebolge's installed pi-ai and pi-durable): durable/src/harness/generation.ts:559-567 retries only when stopReason is error AND isRetryableAssistantError(message). ai/src/utils/retry.ts:266-271 returns true only when errorMessage matches RETRYABLE_PROVIDER_ERROR_PATTERN (lines 33-118: overloaded, 5xx codes, timed out, timeout, terminated, network/connection wording, etc). The text model stream exceeded 2h matches none of them. Separately, ai/src/api/openai-completions.ts:726 sets stopReason to aborted (errorMessage Request was aborted, :696-701) whenever the request signal is aborted - which is how the wrapper cancels the inner request - and generation.ts:537-588 treats a non-error stopReason as non-retryable and fails the run with model_error.

INFERENCE: as specified, the first deadline expiry fails the run immediately with zero retries, whichever way the wrapper ends the stream. The liveness bound still holds and is tighter (one deadline, not retries+1), so this is not a liveness defect; it is a mis-stated outcome class. Consequences: the worst-case arithmetic and the criterion clause after its retries describe behaviour that will not occur, and the design has not actually decided whether a stalled stream should be retried (a transient upstream stall arguably should be). A test written to the criterion either fails for the wrong reason or is quietly adjusted at implementation.

Repair: decide the outcome class. Either (a) no retry - state that the deadline fails the run at once, worst case about 2 h, and make the criterion assert exactly one model request; or (b) retry - the wrapper must end the stream with stopReason error (not aborted, even though it aborted the inner request) and an errorMessage the pi-ai classifier deems retryable (e.g. containing timed out), and the criterion asserts retries+1 requests. Either way the test asserts the request count, so it discriminates.
"""
disposition = "fix-now"
response = """
Accepted. Verified: generation.ts:561-566 retries only stopReason error whose message isRetryableAssistantError accepts (retry.ts:266-271); model stream exceeded 2h matches none of its patterns, and openai-completions.ts:726 sets aborted when the request signal is aborted, which is never retried. User decision 2026-10-27: no retry. Design rev 56 and 58, Daemon wiring: the expiry is not retried by design, and the wording is deliberately non-transient; the run fails with model_error on the first expiry, its inputs settle unanswered and the wake reports through the Fire composition failure path. The bound is per model request (about 2 h from that request's start), not per turn, since a turn may make several requests. The worst-case arithmetic is removed. Verification, Model stream deadline: the run fails with model_error after exactly one model request (no retry), so a wording change that made the expiry retryable fails the test. This supersedes the F-13 criterion clause the run fail after its retries; the criterion /plan carries for F-13 must read: the run fails with model_error after exactly one model request.
"""

