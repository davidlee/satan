context = "SL-034 inq-10. ADR-017 §3 / INV-1: every new authority duty has one legend owner; rows and token land in the same change. The legend has no interactive-daemon token. Row 7 (arrival policy) is emacs-client's satan-tick."
choice = "Landing with the implementing phase: legend token `room-daemon` (malebolge interactive daemon, room profile, unit malebolge-room). Row 7b arrival policy -> malebolge wakes (WakePolicy and its config from the room jail env; DEC-128). Row 6d kill switch -> wakes (MALEBOLGE_WAKES, read at start, fail closed, defers; stops new admissions only, an admitted turn completes; DEC-132). Row 4d append-only audit -> wake lifecycle (wake_schedule/wake_cancel tool calls and satan.wake input entries in pi-durable transcripts; one journal line per gate decision: fire, defer with reason, heartbeat suppression; one per terminal outcome; heartbeat creation and recreation; DEC-134) -- task rows are mutable and are not cited; no new table, no transcript writes. Row 3b (malebolge execution profile, satan-flake) evidence gains the wake env keys in the room jail options and launcher probes. No row 5d: the no-limits decision covers it. Rows cite ADR-017 directly (QUE-001 open; no SPEC-001 arrival REQ). SPEC-002: interactive daemon Owns gains wake scheduling; the satan-mcp transport names `scheduled` (REV at reconcile). docs/architecture.md:50-54 and docs/governance.md:54 gain one sentence: malebolge wakes are a user-installed mechanism (host clamp, heartbeat, fail-closed switch)."
alternatives = ["A SPEC-001 arrival requirement first (QUE-001 still open)", "A new append-only wake event table (second schema owner of session.sqlite; transcripts already serve)"]
rationale = "Minimal writes that satisfy INV-1 and REQ-003 using records that already exist."
consequences = ["The plan carries a ledger/docs task in the implementing phase and a SPEC-002 REV at reconcile"]
decided_by = "user (2026-10-27), on the agent's proposal"
decided_on = "2026-10-27"

