[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "The drain after the reap is outside the ladder: no trigger can bound a run whose leader has exited"
detail = """
Expected (design sec-4, "Termination": "One ladder for every trigger: SIGTERM to the group, 2 s grace, SIGKILL to the group, then reap and drain the stream, then audit, then return"; and "a blocking result never blocks cancellation"; PHASE-06 EX-11 "it never leaves a child behind"; PHASE-07 EX-6 "the wall clock — the hard backstop"): a trigger arriving while the stream is still draining kills the group and the drain ends, so no run outlives every trigger.

Observed: pi/mcp/spawn.ts:396 removes the abort listener the instant `await exited` returns, so the whole drain phase has no listener at all; and the non-signal path stops earlier — `terminate`'s `if (exit !== null) return;` at pi/mcp/spawn.ts:368, whose comment ("already reaped: there is no group left to signal") is false, because a process group outlives its leader while members remain. The result is that `await finished(stdout)` at pi/mcp/spawn.ts:401 is bounded by nothing, including the comment at :399 that claims "the ladder's SIGKILL to the group is what bounds this on the abort path". Reproduced with a stub launcher that starts `sleep 60 &` (R3: `sleep 30 &`), prints the stream and exits 0: `abort('cancelled')` 100 ms after the leader's exit left `runChild` pending at 3000 ms with `outcome.abort === null` and `audit.jsonl` holding `spawn` only (R1: still pending at 6 s after an abort at 703 ms). Consequences: `serve`'s EOF sweep awaits `call.done` (pi/mcp/server.ts:609-611) and never settles, so the server never exits, the child's session is orphaned and the session lock is held for the process's life; and the gate's idle poll keeps ticking, aborting a controller nobody is listening to, so the backstop is dead exactly when the run is stuck. The existing test encodes the hole rather than closing it: the drain test at pi/mcp/spawn.test.ts:906 measures the grandchild's `sleep 2`, not the ladder.

Raised in both reviews: R1 finding 1 (HIGH) and R3 finding 1 (HIGH), independently reproduced.

Suggestion: keep the abort listener attached until after the drain (remove it where `gate.close()` happens, i.e. after `finished(events)`), let a post-reap `terminate` still `signalGroup(pid, 'SIGKILL')` (signalling `-pid` after the leader is reaped is safe while the group has members), bound the drain with the remaining grace, and end the run with an `audit`/`timeout` cause if it still has not closed. Correct the stale comment at :368.
"""
disposition = "fix-now"
response = "Fixed in 80bb3ce. pi/mcp/spawn.ts: the abort listener now stays attached through the drain and is removed only after the exit record; terminate no longer early-returns on exit !== null but SIGKILLs the group (a pgid outlives its reaped leader), and every signalling rung leaves a drainBound one grace out so the drain is waited a slice at a time and gives up on an unreachable tail rather than never. Pinned by 'a cancellation arriving after the leader was reaped still bounds the drain: the group that holds stdout is killed, so the call answers instead of waiting on a grandchild' (spawn.test.ts; fails on HEAD at 5 s, passes in ~0.2 s now) and by the reworked 'the session lock is released only after the drain and the final audit append … and the ladder is what ends the drain', whose grandchild is now sleep 30 and whose assertion is the bound, not the sleep."

