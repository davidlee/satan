schema_version = 1
memory_type = "fact"
status = "active"
title = "bwrap: a later writable parent bind hides an earlier read-only child bind; -try binds vanish when the source is absent"
summary = "In a jail.nix option list, bind order is mount order: a read-only child (e.g. satan/mcp) must come AFTER any writable bind of its parent, and a --*-bind-try overlay is silently skipped if the path doesn't exist at launch"
created = "2026-10-20"
updated = "2026-10-20"

