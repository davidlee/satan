`pi.usage` contains aggregate model/tool token and cost totals, not a request count ([usage.d.ts](/home/david/dev/malebolge/node_modules/@earendil-works/pi-durable/dist/harness/usage.d.ts:4)); `maxTokens` limits output, while usage also charges input ([pi-ai types.d.ts](/home/david/dev/malebolge/node_modules/@earendil-works/pi-ai/dist/types.d.ts:279)). **Scenario:** failed requests consume a request allowance without a recoverable count; a large prompt exceeds remaining cost even with a small output cap. **Repair:** persist request attempts at the provider boundary and specify how input and compaction spend are bounded or accounted for. Resolve the unproven cap mechanism against DEC-057 before locking the claimed guarantee. **Verified against types; failure scenario inferred.**"""
disposition = "fix-now"
route = "review"
response = """
Correct: pi.usage holds aggregate token and cost totals per model and per tool, no request count; maxTokens bounds output only. Repair, in prose: the request ceiling counts attempts recorded by the model gate (see F-1), durably, before each send. Token and cost checks compare pi.usage totals (which include input, failed, aborted and compaction spend) against the ceiling before each send. The guarantee is stated precisely: spend may exceed a ceiling by at most one request, whose output is capped by the gate and whose input cost is that of its prompt. This is DEC-057's strict-up-to-one-capped-request, defined; the gate mechanism itself is routed on F-1.
"""

