role = "responder"
disposition = "fix-now"
response = "Verified: execFile timeout signals only the direct child. Fix (§5.2 'Killing a verb'): each verb spawned as its own process-group leader; on channel_timeout TERM then KILL to -pgid, await leader exit before ChannelUnavailable; execFile timeout not used. §9 stub spawns a surviving grandchild; code impact updated."

