[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "A duplicate in-flight request id evicts the first call from cancellation and the EOF sweep"
detail = """
Expected (DEC-103, PHASE-06 EX-11 "it never attempts to deliver a result down a closed channel, and it never leaves a child behind"): `inFlight` is the cancellation index and the EOF sweep's work list, so every running call is in it — `notifications/cancelled` resolves an entry via `callKey(requestId)` (pi/mcp/server.ts:551) and the EOF sweep collects `[...context.inFlight.values()]` (pi/mcp/server.ts:609-611).

Observed: entries are keyed by `callKey(id)` at pi/mcp/server.ts:506. A second `tools/call` carrying the same id overwrites the entry, and the first call's `finally { context.inFlight.delete(key) }` (pi/mcp/server.ts:518) then removes the *second* call's entry. Both calls become invisible to cancellation and to the EOF sweep, which can therefore resolve while two children still run — so the "no child outlives the server" promise holds only for well-behaved ids. JSON-RPC requires unique ids, so this is a misbehaving-client case rather than a live bug, and it fails in the direction of an orphaned child rather than a protocol error.

Raised in R1 (finding 2, LOW); R3's coverage note names duplicate ids as one of the two risks the suite leaves untested.

Suggestion: refuse a second in-flight id (`-32600` / `request-invalid`) at registration, or keep `Map<string, InFlightCall[]>` and delete by entry identity instead of by key; either way add the one test with two calls sharing an id.
"""
disposition = "fix-now"
response = "Fixed in 80bb3ce. pi/mcp/server.ts: inFlight is Map<string, InFlightCall[]> — a repeated wire id appends to the list under its key, the finally removes by entry identity and deletes the key only when the list empties, abortNamed aborts every entry under the id, and the EOF sweep flattens all lists. The invariant 'every running call is in the index' therefore holds for a misbehaving client's repeated id. Pinned by 'two tools/calls carrying one id are both in the index: a cancellation naming it aborts both, and each run records its abort' (spawn.test.ts; fails on HEAD — one call answered, the other run hung to the 10 s ceiling — and passes now)."

