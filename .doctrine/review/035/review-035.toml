[[finding]]
id = "F-4"
status = "verified"
severity = "major"
title = "§4.1, §4.3–4.5: startup context loses host-key fault classification."
detail = """
Reviewer: GPT (gpt-6-sol), adversarial pass 2026-10-20.

4. **F-4 — major — §4.1, §4.3–4.5: startup context loses host-key fault classification.**  
   **Claim:** one observed connection supplies both tool wording and a room shell that distinguishes untrusted keys from downtime. **Verified:** §4.3 wraps `DaemonConnection` once, then §4.5 passes that wrapper to `roomShell` ([design.md](/home/david/dev/satan/.doctrine/slice/027/design.md:397), [design.md](/home/david/dev/satan/.doctrine/slice/027/design.md:458)). Today `roomShell` constructs a second observing connection ([shell.ts](/home/david/dev/malebolge/src/runner/shell.ts:122)); its trust distinction relies on its *immediate inner* connection being `DaemonConnection` ([env.ts](/home/david/dev/malebolge/src/runner/env.ts:116)). **Inference:** under the proposed mechanical move, the outer observer sees an `ObservedConnection`, records a loss, and startup logs “room unavailable” for a host-key refusal. **Repair:** define a single observation owner for the shell path, or pass the underlying trust record explicitly. Test a real failed start through `readContext`, not only a fake `RoomShell`. R1’s shared class is reasonable, but this wiring must be resolved with its departure from DEC-074."""
disposition = "fix-now"
response = "Fixed as before (section 4.3: the startup read passes the bare DaemonConnection to roomShell; ObservedConnection never wraps another ObservedConnection). Control: the incorrect candidate is the startup read through a nested ObservedConnection, which reports a host-key refusal as a loss. The section 6 VT, a real DaemonConnection whose start fails host-key checking, must log room host key untrusted and never room unavailable, and must reject that candidate."
route = "control"

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Verified: trust check reads trustFailure() from the immediate inner (env.ts JobConnection #lost). Integrated §4.3/§4.5: the startup read passes the bare DaemonConnection to roomShell; rule stated that ObservedConnection always wraps a DaemonConnection directly. §6 VT: real failed host-key start through readContext logs untrusted."

[[finding.turn]]
act = "verify"
role = "raiser"
note = "GPT verify pass 2026-10-20: verified — bare DaemonConnection passed to roomShell preserves the immediate-inner trust check (malebolge src/runner/env.ts:116); failed-start test added."

