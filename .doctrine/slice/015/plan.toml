# Implementation plan for SL-015 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-015"

[specs]                          # empty in v1 — no spec/requirement registry yet
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# One [[phase]] per ordered phase. Ids are PHASE-NN (zero-padded), immutable and
# never reused once authored — edits append, they never renumber. Criterion ids
# are local to their phase, bare, and equally immutable (.doctrine/glossary.md §
# reference forms): EN-1 entry, EX-1 exit, and verification by mode —
# VT-1 test (automated), VA-1 agent check, VH-1 human acceptance.

# ── Sequencing note ─────────────────────────────────────────────────────────
# The design's cutover (design §5.4 S0-S4) is split so that no phase leaves the
# live system inconsistent. PHASE-01 is a pure refactor: the roots are named and
# every site rewired, but the two new defaults still resolve to today's
# locations, so nothing on disk moves and nothing can break. PHASE-02 and
# PHASE-03 are the two independent live moves (state, then corpus), each ending
# with its tree, its defaults and its external writers agreeing. PHASE-04 sweeps
# the record.
#
# PHASE-01's transitional defaults are NOT the fallback chain design D2 rejects.
# A fallback resolves two paths and prefers whichever exists; these resolve
# exactly one. At every moment there is a single answer to "where does the
# corpus live", and PHASE-03 changes that answer once.

[[phase]]
id        = "PHASE-01"
name      = "Name the three roots"
objective = "Introduce satan-corpus-root / satan-state-root defcustoms and satan-corpus-path / satan-state-path joins in satan-custom.el (design §5.2), and rewire all 24 sites: the 16 corpus paths spelled `(expand-file-name \"satan/<x>\" satan-notes-root)` (design §2.1) and the 8 inlined XDG-state clones (design §2.2). The two `behaviour/`-leaf defcustoms of design §2.2b are OUT — panopticon's state, read-only to SATAN, a fourth ownership class SATAN does not name (design D1). Pure refactor — both new defaults resolve to today's on-disk locations, so every one of the 24 paths comes out byte-identical (modulo trailing-slash normalisation, design A3) and nothing moves. This phase is the design (P1): once the concepts have names, the relocation is a default value. It is also the whole DRY payload, and it carries no cutover risk."
entrance_criteria = [
  { id = "EN-1", text = "Design authored at .doctrine/slice/015/design.md; the suite green at the baseline commit (design §2.5) via a DOCUMENTED invocation — bare `just check` aborts with `refusing to run batch tests against production socket`, so SATAN_DB_HOST or SATAN_FAILOVER_TO_SYSTEM_DB must be set, and design §9.1 records that `just lint` is paren-balance only and that ~130 tests skip-and-pass without the test databases" },
]
exit_criteria = [
  { id = "EX-1", text = "satan-custom.el defines satan-corpus-root (transitional default: `satan/` below satan-notes-root) and satan-state-root (default: XDG_STATE_HOME or ~/.local/state, + `satan`), both :group 'satan" },
  { id = "EX-2", text = "satan-custom.el defines satan-corpus-path and satan-state-path with the same join-and-expand shape as the existing satan-notes-path — the root is expand-file-name'd, so a literal tilde root never reaches a caller (design F5/E2)" },
  { id = "EX-3", text = "All 16 corpus sites (design §2.1 table) resolve via satan-corpus-path; the `\"satan/\"` literal is gone from each" },
  { id = "EX-4", text = "All 8 XDG-state clones (design §2.2 table) resolve via satan-state-path; both divergent fallback spellings are gone. The 6 of 8 modules lacking `(require 'satan-custom)` gain it — satan-trace, satan-ingest-cursor, satan-sensor-alerts, satan-sensor-curiosity, satan-sensor-content, satan-patch-worktree (design §9.1)" },
  { id = "EX-5", text = "satan-tools-notes-root and satan-tools-atsatan-root still default to satan-notes-root — unchanged, and now a deliberate statement rather than an accident" },
  { id = "EX-6", text = "satan-custom.el remains a zero-satan-dependency leaf (design I2/F6)" },
  { id = "EX-7", text = "Nothing on disk moves; no external consumer (flake, justfile, ~/.config, corpus text) is touched in this phase" },
  { id = "EX-8", text = "satan-prompts-dir is promoted from defvar to defcustom (satan-mode.el:80) so VT-2's standard-value idiom can reach it (design A4)" },
  { id = "EX-9", text = "satan-sensor-curiosity-segments-dir and satan-tools-content-dir are UNTOUCHED — the `behaviour/` class stays where it is (design §2.2b/D1). Rewiring them to satan-state-path would resolve to a nonexistent ~/.local/state/satan/behaviour/ and silence the curiosity sensor without an error" },
]
verification = [
  { id = "VT-1", expects = "The two new joins are covered as the existing satan-notes-path cases are: segments join below the root, a tilde root is expanded, and satan-state-root honours XDG_STATE_HOME — including a value with a trailing slash. Kept as a cheap regression guard, NOT as evidence for D1: the two spellings differ only in the fallback branch, which is unreachable when XDG_STATE_HOME is set (design D1, corrected rationale).", test_file = "satan/test/satan-custom-test.el", keywords = ["satan-corpus-path", "satan-state-path", "satan-corpus-root", "satan-state-root", "XDG_STATE_HOME"], patterns = ["^\\(ert-deftest "], waived = false },
  { id = "VT-2", expects = "Derivation, not literals: rebinding satan-corpus-root or satan-state-root moves every dependent default. Extends the invariant satan-run-test.el:186 already asserts for satan-notes-root to the two new roots, with the wpm, sensor, trace and patch-worktree paths as the new cases. The 24 sites map to 22 VARIABLES (14 corpus + 8 state) — satan-self-edit-mind-roots is one variable spanning satan-context.el:535-537 — and satan-prompts-dir must be a defcustom first (EX-8) or the standard-value idiom cannot reach it.", test_file = "satan/test/satan-custom-test.el", keywords = ["satan-runs-dir", "satan-hippocampus-dir", "satan-sensor-state-file", "satan-trace-dir", "satan-sensor-wpm-log-dir"], waived = false },
  { id = "VT-3", expects = "Recurrence guard (design I1/D10, VT form): a test asserts that no `expand-file-name` whose DIR argument is a satan-*-root carries a `satan/` segment literal. Scoped exactly that narrowly, with an EXPLICIT allowlist for the two live path expressions that legitimately keep it — satan-mcp.el:43 (XDG_RUNTIME_DIR, a fourth location outside all three roots) and satan-patch-worktree.el:52 (the job-id/branch prefix, joined under the worktree root at :56). Weaker than I1's letter; design D10 says so on the record. The atsatan exclude glob (satan-tools-atsatan.el:51-52) is still present when this guard is written and retires only in PHASE-03 — it must not be flagged.", test_file = "satan/test/satan-custom-test.el", keywords = ["satan/", "directory-files-recursively"], waived = false },
  { id = "VT-4", expects = "satan-custom.el declares both new defcustoms and both new joins and requires nothing from satan (leaf invariant I2).", test_file = "satan/satan-custom.el", keywords = ["defcustom satan-corpus-root", "defcustom satan-state-root", "defun satan-corpus-path", "defun satan-state-path"], waived = false },
  { id = "VA-1", expects = "Byte-identical resolution: enumerate all 24 paths before and after the rewire (batch-eval each variable) and diff, comparing AFTER file-name-as-directory normalisation. Five sites carry a trailing slash that expand-file-name preserves and the joins drop — satan-mode.el:81, satan-tools.el:27, satan-trace.el:37, satan-patch-worktree.el:18, satan-patch-prompt.el:27 — and every consumer of those five normalises anyway, including the confinement guard at satan-patch-worktree.el:66-70 (design A3). Without the normalisation clause this reads as a 5-line defect. The baseline must cover all 24 plus the 2 user-notes roots and the 2 behaviour-class defcustoms, so that a wrong rewire of any of them shows up as a diff. Empty diff — the refactor is provably behaviour-free, which is what licenses landing it ahead of any move." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-02"
name      = "Split runtime state out of the corpus"
objective = "Move the two runtime trees — runs/ (9.4k files, 145M, already gitignored) and log/wpm/ — out from under the corpus and onto satan-state-root, retargeting the one external writer (waybar). Independent of the corpus relocation and separable from it: after this phase ~/notes/satan holds only authored content (~250K), which is what makes PHASE-03's repo split clean and lets ~/satan ship with no .gitignore (design P5, D3)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 complete: satan-state-root and satan-state-path exist and are proven behaviour-free (VA-1)" },
  { id = "EN-2", text = "Writers quiesced (design §5.4 S0): satan-{tick,motd,morning}.timer and satan-attrd.service stopped, waybar wpm module stopped" },
]
exit_criteria = [
  { id = "EX-1", text = "satan-runs-dir defaults to (satan-state-path \"runs\"); the wpm log dir defaults to (satan-state-path \"log\" \"wpm\")" },
  { id = "EX-2", text = "satan-hippocampus-dir stays on satan-corpus-path — hippocampus is SATAN-authored, versioned content, not scratch (design D3)" },
  { id = "EX-3", text = "Both trees moved by rename into ~/.local/state/satan/ (same filesystem, design F7)" },
  { id = "EX-4", text = "~/.config/waybar/wpm-status.py:43 writes to the new location" },
  { id = "EX-7", text = "~/flakes/modules/home/linux/sway.nix:12 retargeted: wpm-archive-yesterday hardcodes ~/notes/satan/log/wpm/<date>.tsv and its timer is ACTIVE (Persistent=true, 04:00). Left alone it takes its `if [ ! -f` branch, prints \"nothing to archive\", exits 0 — hourly WPM bucketing stops silently and permanently (design R8). It is a nix derivation: flake edit + home-manager rebuild, not a sed" },
  { id = "EX-5", text = "The `/satan/runs` line is removed from ~/notes/.gitignore, and the few tracked log/wpm rows are git rm'd — telemetry from a non-SATAN writer was never meant to be versioned (design D3)" },
  { id = "EX-6", text = "Restarted IN ORDER — Emacs first, THEN the timers (design §5.4 S4): satan-motd/satan-morning/wpm-archive are all Persistent=true, so a timer started after its window has passed fires a catch-up run immediately, and a catch-up run against a not-yet-restarted Emacs writes to the dead path. Then a live tick writes its bundle under ~/.local/state/satan/runs/" },
]
verification = [
  { id = "VT-1", expects = "Both run-layout defcustoms derive from satan-state-root, and satan-hippocampus-dir derives from satan-corpus-root — the split of design D3 asserted in the test that already owns this invariant. satan-run-test.el:197's `/tmp/nr/satan/hippocampus` expectation follows the rename.", test_file = "satan/test/satan-run-test.el", keywords = ["satan-state-root", "satan-corpus-root", "satan-runs-dir", "satan-hippocampus-dir"], waived = false },
  { id = "VT-2", expects = "The wpm sensor resolves its TSV directory through the state join, not the notes root — a source-shape assertion, since there is no satan-sensor-wpm test file and one path check does not earn a new one (its derivation is already covered by PHASE-01 VT-2).", test_file = "satan/satan-sensor-wpm.el", keywords = ["satan-state-path"], waived = false },
  { id = "VA-1", expects = "~/notes/satan contains no runs/ or log/ directory, and ~/notes/satan is now under 1M — the authored corpus, alone. True of the WORKING TREE only: the 63 tracked wpm rows stay in the 28 commits PHASE-03's split carries, so ~/satan inherits the blobs regardless (design §2.3)." },
  { id = "VH-1", expects = "After restart, one live tick writes a complete run bundle under ~/.local/state/satan/runs/<date>/, and waybar's next minute lands a TSV row in ~/.local/state/satan/log/wpm/." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-03"
name      = "Corpus cutover to ~/satan"
objective = "Split ~/notes:satan/ into a standalone ~/satan repo with history, move the tree, flip satan-corpus-root to ~/satan, and follow every remaining consumer — including the 8 authored corpus files that name their own old path to the model (design D6/F2). Retire the two workarounds the nesting forced (design D8). This is the only phase where the live system is briefly inconsistent; design §5.4 keeps that window to seconds and design D4 rules out a symlink that would hide a missed consumer."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 complete: only authored content remains under ~/notes/satan" },
  { id = "EN-2", text = "Hard gate (design R3): ~/notes working tree clean under satan/ before any history operation. NOT by committing everything: all 33 untracked files and one of the 4 modified are satan/log/wpm/*.tsv telemetry that PHASE-02 EX-5 just git-rm'd — committing them here re-imports what PHASE-02 removed, into the history the split then carries into ~/satan. Commit the 3 genuine corpus edits (motd.txt, motives.org, motives.archive.org); the wpm rows are excluded, not committed" },
  { id = "EN-3", text = "OQ-1 already RESOLVED (design §6, 2026-08-24): ~/notes has 36 commits total, 28 touching satan/; `git subtree split -P satan` runs in seconds and yields <=28 inspectable commits at dated-snapshot granularity. git filter-repo is absent and not needed. This criterion reduces to: run the split and eyeball the log before any git rm" },
]
exit_criteria = [
  { id = "EX-1", text = "~/satan is a git repo whose history carries the corpus commits; ~/notes has the subtree removed and no .gitignore entry for it" },
  { id = "EX-2", text = "satan-corpus-root defaults to the literal \"~/satan\" — no fallback, no derivation from satan-notes-root (design D2/P4)" },
  { id = "EX-3", text = "OQ-4 decided and recorded: ~/satan will run permanently dirty otherwise, because hippocampus/ and proposals/ are model-written and corpus-tracked, and today that dirt is absorbed by ~/notes' daily `git add .` habit (~/notes/justfile:1-4) which ~/satan does not inherit. Either .gitignore those two trees, add a commit recipe, or accept the dirt on the record. Design P5's bare `no .gitignore` is provisional pending this call" },
  { id = "EX-4", text = "The 8 authored corpus files naming ~/notes/satan are retargeted: system/scaffold.txt, tools/{inbox_append,hippocampus_write,proposal_stage}.md, prompts/{motd,morning,self-edit-mech,self-edit-mind}.txt. Content semantics unchanged — only the path strings (design D6)" },
  { id = "EX-5", text = "flake.nix:134 binds $HOME/satan/hippocampus; the --ro-bind of $HOME/notes stays (design A1 — the jail needs no corpus bind, assembly is elisp-side)" },
  { id = "EX-6", text = "~/notes/justfile build-system-prompt reads its two sources from ~/satan; the recipe stays in ~/notes with its .pi/SYSTEM.md artefact (design D7)" },
  { id = "EX-7", text = "~/.config/zsh/init.zsh:161 motd read retargeted" },
  { id = "EX-10", text = "satan-patcher's prompt path fixed at its real editable surface: ADD `systemPromptFile = \"%h/satan/patch-agent/prompt.md\";` to ~/flakes/modules/home/linux/satan-patcher.nix, then home-manager rebuild + `systemctl --user daemon-reload`. The systemd unit is a /nix/store home-manager symlink and is NOT editable, and it carries no pin — the daemon runs on the punted module's own default (~/dev/satan-patcher/nix/module.nix:74). One line in the flake; does not touch the CHR-003 repo (design D5, corrected)" },
  { id = "EX-11", text = "flake.nix:98 workspaceDeps decided (design R7): after the cutover a jailed DEV agent (jailed-pi/claude/opencode/dirge) can no longer read a prompt or system/framing.txt through /workspace/notes. Not a runtime break (design A1). If ~/satan is added, the mount name must not be `satan` — flake.nix:131 already binds ~/dev/satan to /workspace/satan. Add under another name, or accept the loss on the record" },
  { id = "EX-12", text = "Restarted IN ORDER — Emacs first, THEN the timers (design §5.4 S4, Persistent=true catch-up hazard)" },
  { id = "EX-8", text = "Workarounds retired (design D8): denote-excluded-directories-regexp dropped from ~/.emacs.d/org/dl-denote.el, and the '!**/satan/**' exclude glob dropped from satan-tools-atsatan.el" },
  { id = "EX-9", text = "~/notes/satan no longer exists — no symlink stands in for it (design D4)" },
]
verification = [
  { id = "VT-1", expects = "The atsatan scan no longer excludes a satan/ subtree: the exclude-glob constant and its test expectation are both gone.", test_file = "satan/test/satan-tools-atsatan-test.el", keywords = ["satan-tools-atsatan-root"], waived = false },
  { id = "VT-2", expects = "Fixture trees follow the rename — the context and integration tests build ${temp}/satan/... layouts that would otherwise pass against a layout that no longer exists (design §9 regression watch).", test_file = "satan/test/satan-integration-test.el", keywords = ["satan-corpus-root"], waived = false },
  { id = "VT-3", expects = "satan-corpus-root's default is the standalone path, not a derivation from the notes root.", test_file = "satan/satan-custom.el", keywords = ["\"~/satan\""], waived = false },
  { id = "VA-1", expects = "No file under ~/satan names ~/notes/satan — the corpus no longer lies to the model about where it lives (design F2). Scoped to the corpus: prose inside the CODE repo (docs/, docstrings) is design D9's separate question, not this criterion's." },
  { id = "VA-2", expects = "git log in ~/satan shows corpus history predating the split, not a single initial commit (design F3)." },
  { id = "VH-1", expects = "After an Emacs restart (design E1/R4 — restart, never setq), a live interactive run receives its framing from ~/satan/system/framing.txt and its tool descriptions from ~/satan/tools/, and a denote: link-follow in ~/notes is no slower than before the exclusion regexp was dropped." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-04"
name      = "Sweep the record"
objective = "Close the paper trail: retarget the remaining documentation and memory references, and run the whole-$HOME sweep that catches any consumer missing from the design's inventory (design R5). Closed-slice prose stays as written — SL-002 and SL-012 cite ~/notes/satan as historical record and are not rewritten (slice non-goals)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-03 complete; `just check` green" },
]
exit_criteria = [
  { id = "EX-1", text = "docs/perceptual-design.md names the new motives path (7 lines in that file, not the 1 an earlier draft cited)" },
  { id = "EX-5", text = "Design D9 applied: the ~111 doc lines across 17 files under docs/ (docs/governance.md 31, docs/data-collection.md 20, docs/at-satan/design.md 12) and the 17 docstring/comment lines in satan/*.el are NOT retargeted wholesale in this phase — they are prose in the code repo, not model-facing corpus, so VA-1's allowlist covers them and the residue goes to backlog. If a smaller batch is wanted, the 17 production docstrings are the defensible subset" },
  { id = "EX-2", text = "Memory corpus updated: the SATAN orientation signpost's code/content split and the corpus-integration skip-unless pattern both name ~/satan" },
  { id = "EX-3", text = "The three-root model is recorded as durable knowledge — which root owns what, and why satan-notes-root is read-only to SATAN — so the distinction survives the next context" },
  { id = "EX-4", text = "Closed-slice prose (SL-002, SL-012 notes/plans/designs) left untouched" },
]
verification = [
  { id = "VA-1", expects = "Whole-$HOME sweep (design R5) run as `grep -rIl --dereference-recursive \"notes/satan\"` — plain `grep -r` does NOT follow symlinks and every home-manager dotfile under ~/.config is a /nix/store symlink, so a non-dereferencing sweep reports clean over precisely the hardest consumers (proven: 0 hits vs 2). It must also cover ~/flakes SOURCES, where surfaces 8 and 12 actually live. Returns only (a) historical run bundles under the state root, frozen evidence deliberately not rewritten (design A2), (b) closed-slice doctrine prose, (c) the punted satan-patcher repo (CHR-003), and (d) prose inside the code repo — docs/ and production docstrings (design D9). Any other hit is a missed consumer." },
  { id = "VA-2", expects = "`doctrine memory validate` clean; the updated memories retrieve on a satan-orientation query." },
]
specs        = []
requirements = []
