[facet]                         # every field typed; seeded empty (captured later)
question = "Should the gateway's client wire convention (clients send flat OpenAI reasoning_effort; the gateway translates per provider) be documented once in ~/flakes README § LLM gateway, or left to emacs:SL-015's design?"
why_matters = "SL-022 (satan harness) and emacs:SL-015 (gptel inq-5 flattens reasoning to reasoning_effort) must not diverge; the convention's owner is the gateway, not either client."
answer = "In ~/flakes, owned by the gateway: flakes:DEC-074 (clients send flat reasoning_effort; thinking and reasoning still admitted for existing clients), specified in flakes:SPEC-001 § Client contract. Correction to the premise: the gateway translates nothing; LiteLLM's provider adapters map reasoning_effort, and the gateway only admits it (allowed_openai_params on OpenRouter routes). SL-022 and emacs:SL-015 cite flakes:DEC-074 and flakes:SPEC-001. Flat effort on DeepSeek alone and on Fireworks is not yet verified (flakes:IMP-038)."
