[[phase]]
id        = "PHASE-05"
name      = "grep tool"
objective = "src/grep.ts grepTool + grepExtension over rg --json (design §4.5): parameters incl. noIgnore and clamps; bounded line splitter (MAX_MESSAGE_BYTES), parse-time truncation, stderr capped while streaming, stops at limit or 50 KB, caller abort throws; exit codes incl. 2-with-matches; bytes decoding; JobTools gains grepTool."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 complete (truncate.ts)." },
]
exit_criteria = [
  { id = "EX-1", text = "Output, notices, caps and exit-code handling as design §4.5; file path shown as basename." },
  { id = "EX-2", text = "RV-033 F-2 probe criterion holds: for multi-GB single lines, binary data, many matches or submatches, and a hostile rg emitting unbounded or malformed stdout or unbounded stderr, the tool's peak host memory is bounded by MAX_MESSAGE_BYTES + 50 KB + 4 KiB + a constant and the result is at most 50 KB." },
  { id = "EX-3", text = "JobTools has five tools; read and grep replay-safe. `just check` green." },
]
verification = [
  { id = "VT-1", expects = "faux env: argv per parameter, clamps, chunk-split JSON, context, bytes, basename, limit and 50 KB stops as success, caller abort throws, exit 1/2", test_file = "/home/david/dev/malebolge/test/grep.test.ts", keywords = ["grepTool", "noIgnore", "limit reached", "No matches found"], waived = false },
  { id = "VT-2", expects = "F-2 probe: multi-MB single line, limit 1000 × long lines, multi-MB stderr; splitter carry never above MAX_MESSAGE_BYTES (negative control: an uncapped splitter fails this test)", test_file = "/home/david/dev/malebolge/test/grep.test.ts", keywords = ["MAX_MESSAGE_BYTES", "stderr"], waived = false },
  { id = "VT-3", expects = "one run over localConnection with the host's rg", test_file = "/home/david/dev/malebolge/test/grep.test.ts", keywords = ["localConnection"], waived = false },
  { id = "VT-4", expects = "five tools; read and grep replay-safe", test_file = "/home/david/dev/malebolge/test/runner/tools.test.ts", keywords = ["grepTool"], waived = false },
]
