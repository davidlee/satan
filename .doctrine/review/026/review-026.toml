detail = "design.md:449-454,1086,1185,1226 credit the drop on a frozen guest to ssh ServerAliveInterval=15 x ServerAliveCountMax. pi-env's Connection pings every 5 s and tears the session down after 30 s of silence (dist/connection.js:11-13 PING_INTERVAL_MS/SILENCE_LIMIT_MS, ~224-227), so it fires first (ssh's default count of 3 gives 45 s). The outcome is the same (typed lost, so a pause), but the live-rung test 'keepalive drop' would be checking the wrong mechanism, and ServerAliveCountMax is not load-bearing. Fix: correct the attribution."
disposition = "fix-now"
response = "Verified: connection.js PING_INTERVAL_MS 5000, SILENCE_LIMIT_MS 30000. Fix: frozen-guest drop attributed to pi-env's 30 s silence limit; ssh keepalive (only ServerAliveCountMax ours) a 45 s backstop; edge case, risk and live-rung test wording corrected."

