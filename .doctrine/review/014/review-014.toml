[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = """Escalation streak is per mode, so a dismissed escalation can be followed by another tick mode's escalation, not "a full threshold later""""
detail = """
Expected (design sec-4, DEC-022 (3)): "A dismissed escalation prompt ends the streak, so the next escalation is a full threshold later."
Observed: `satan-broker--credential-streak-age` walks `satan-run-outcome-streak` for one mode slug. `satan-tick-pool` holds two defer modes (tick-pulse weight 5, tick-agent weight 3), each with its own credential_deferred streak. With the vault locked for longer than the threshold, a dismissed tick-pulse escalation ends only tick-pulse's streak; the next tick that picks tick-agent finds its streak also past the threshold and prompts again. The claim holds per mode, not per keeper. PHASE-08 notes already record "the escalation streak is per mode" but the design prose does not.
Impact is bounded: it only arises after ≥4 h locked and only after a dismissal; an accepted prompt warms the shared session, so the other mode then reads silently."""
disposition = "verified"
response = 'Behaviour tolerated by keeper decision (2026-09-23). It is rare: it needs ≥ threshold locked plus a dismissal, and an accepted prompt warms the shared session for every mode. No code change. The prose is wrong, though, so it goes to /reconcile: design sec-4 must say the streak and the "full threshold later" guarantee are per mode, and that each defer mode (tick-pulse, tick-agent) can escalate independently.'

