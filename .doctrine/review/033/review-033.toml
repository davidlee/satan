title = "Preparing-time repo reads are unbounded in time, and size-bounded only by a repo-supplied head"
detail = "§4.2 ReadCapped runs bare `head -c 65537 -- path`; `test -d` and `git check-ignore` get no ShellLimits either. preparing has no deadline: readyRoom gets only control.signal (run.ts:336); the deadline is armed after submit (run.ts:358); roomWaitDeadline bounds retries, not one hung exec (prepare.ts:121). Every exec takes the repo toolsPackage PATH first (room.ts ~474), so head/test/git may be repo binaries. §7 calls head-on-a-device harmless, departing from DEC-072 'first readable regular file' unrecorded; §3 claims reads are 'bounded in size and time in the room' — false. Scenario A: AGENTS.md -> a FIFO under an ignored path kept by cleanRoomClone (no -x): head blocks forever, the single-tenant room seat wedges, every restart repeats it. Scenario B: a repo head that ignores -c streams without end into shell.ts's buffer on the host. Repair: ShellLimits on every fetch exec (timeout ~10 s, stdout cap+1, stderr 4 KiB); honour DEC-072's regular-file rule (e.g. find -L dir -maxdepth 1 -type f per directory) or record the departure; fix §3/§7."
