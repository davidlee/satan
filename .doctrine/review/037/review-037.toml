[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "Expected startup to leave no room session behind when it never starts serving; observed a room connection started before catalog/model validation, with no `close` on any failure path"
detail = """
Source: jailed-pi-research pass, verified by the raiser against 1c42811.

`src/daemon-main.ts:25-27` creates the environment and reads context (the first `env.exec`/`connection.info` is what starts ssh + the pi-env daemon) **before** `loadGatewayModels` (`:28`) and the unknown-model throw (`:30-32`), and before satan-mcp/`openSession`/`serve` (`:34-54`). `environment.close()` exists only inside `stop()` (`:70`), and `stop()` runs only from SIGINT/SIGTERM.

```ts
25| const environment = daemonEnv(config.execution, log);
27| const projectContext = renderProjectContext(await environment.readContext());
28| const models = await loadGatewayModels(config.gatewayCatalog, config.gatewayKeyFile);
30| if (models.getModelOfType("chat", provider, modelId) === undefined) {
31|   throw new Error(`unknown model ${provider}/${modelId}`);
```

Why it matters: with `MALEBOLGE_PROFILE=room` and an unknown model (or unreadable catalog, unreachable satan-mcp, `openSession`/`serve` failure), the daemon ssh'es in, verifies/deploys and starts pi-env, performs the whole startup context read, then throws. The connection is never closed; cleanup relies on the parent exiting and pi-env's "exits … when stdin ends" (`node_modules/@earendil-works/pi-env/docs/protocol.md:64-65`), so no lasting daemon — but it is wasted room work on an obvious local configuration error. Suggested fix: move `readContext()` after catalog/model validation (and ideally after `serve` is about to succeed), and/or wrap startup in `try { … } catch (error) { environment.close(); throw error; }`.
"""
disposition = "fix-now"
response = "Fixed in malebolge 368f625: daemon-main checks the gateway socket, loads the catalog, validates the model and connects satan-mcp before daemonEnv is built and readContext reaches the room. A failure in openSession/serve after that still exits the process; pi-env exits when its stdin ends."

