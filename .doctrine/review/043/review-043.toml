[[finding]]
id = "F-4"
status = "verified"
severity = "major"
title = "The honest retrospective ceiling concession still needs an explicit conformance disposition"
detail = "Expected: the design identifies which governing safety properties it satisfies and which require an accepted exception or governance revision. SPEC-001 REQ-004 states that a run cannot exceed its token/budget ceilings, and ADR-017 §4 requires absent-client ceiling enforcement. Observed: sec-4 and DEC-097 correctly withdraw the prior admission-gate/one-response guarantee and select retrospective accounting with best-effort termination, no bounded request allowance, and no provider output cap. Sec-7 still assigns 'delegate ceilings' to pi-mcp without naming this as a conformance gap or specifying the accepted replacement property. This finding does not ask to restore the disproved stream gate or automatically move to the SDK: the factual correction is right. But reporting an overrun after it occurs does not by itself discharge the stronger requirement, and DEC-057's accepted provider-entry-point gate is not evidence for this weaker mechanism. Required correction: obtain and record the precise accepted concession/revision (including what finite bounds remain and what is not guaranteed), or supply a mechanism meeting the requirement. Verification/acceptance must test the actual weaker promise rather than label a normal slow-provider smoke run proof of hard ceilings."
disposition = "fix-now"
route = "review"
response = "Accepted. The design records the concession explicitly as a REQ-004 revision candidate with the replacement property stated: no provider output cap, overshoot bounded by observation latency plus one in-flight request, unknown usage aborts. Ledger row 5c describes exactly that weaker property. The concession needs operator acceptance at reconcile and is recorded as pending rather than implied."

