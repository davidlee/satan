detail = """
Source: jailed-pi-research pass, verified by the raiser against 1c42811.

`src/daemon-env.ts:89-91`:

```ts
89| const reader = roomSourceReader(shell, new AbortController().signal, (source, failure) => {
90|   log(`project context: ${source}: ${failure.reason}`);
91| });
```

`ReadFailure` carries the detail (`src/room/source-reader.ts:20-22`: `{ reason: "error"; code?: number | string; stderr?: string }`), and the runner keeps it (`src/runner/project-context.ts:145-147` spreads `...failure` into `Degradation`). So an unreadable `AGENTS.md` (exit 2, stderr "denied") logs `project context: /home/satan: error` — indistinguishable from any other "error", and this log is the only startup record. The new test (`test/daemon-env.test.ts:290-296`) only asserts `startsWith("project context: /home/satan")`, so it cannot catch this. Suggested fix: log `failure.reason` plus `code`/`stderr` when present (or share one renderer with the runner).
"""
