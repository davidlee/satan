severity = "nit"
title = "Conformance undeclared: slice-014.toml touched but not a design-target"
detail = "conformance reports undeclared(1): M .doctrine/slice/014/slice-014.toml. Expected: only the two design-target artifacts (adr-017.md, authority-ledger.md) edited. Observed: slice-014.toml also modified. Evidence: git diff shows the sole change is status ready->started, written by 'doctrine slice status' as the lifecycle advanced. It is the slice's own runtime-adjacent metadata, not a design surface, and is correctly excluded from design-target selectors. Lead to disposition, not scope creep."
disposition = "aligned"
response = "Benign. slice-014.toml is the slice's own lifecycle-status TOML; the sole diff is status ready->started, written by 'doctrine slice status' as the lifecycle advanced (started, then audit). It is not a design-target surface and is correctly outside the design-target selectors — no scope creep, no missed design update. No action."

[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "Ledger rows 2/3 anchor to symbols; design.md §5.3 still cites stale satan-mode.el:80-208"
detail = "Expected (design §5.3): row-2 'Enforced at' = 'mode/tool table satan-mode.el:80-208'; row-3 = 'mode specs satan-mode.el'. Observed (authority-ledger.md): row 2 anchors to mode-spec :tools via satan-mode-register + consistency satan-mode-check-tool-references; row 3 to satan-profiles / satan-mode--apply-profile. Reason: satan-mode.el is 208 lines total (line 80 = a defvar, 208 = EOF), so the cited range is stale; design §5.2/F4 explicitly mandates symbol-first anchors with line numbers advisory, so the ledger is MORE correct than the design's advisory range. Divergence is sanctioned, not a defect in the ledger — but design.md §5.3 now carries stale anchors and no longer mirrors the delivered artifact. Canon should be reconciled so the design record tells the truth. verified -> reconciliation brief (Per-slice direct edit, design.md §5.3)."
disposition = "verified"
response = "Observation confirmed. The ledger's symbol-first anchors are correct and sanctioned by design §5.2/F4 (line numbers advisory). But design.md §5.3 rows 2/3 cite 'satan-mode.el:80-208' / 'mode specs satan-mode.el', a range that is stale (satan-mode.el is 208 lines; line 80 is a defvar) and was already inaccurate at authoring — so canon does not mirror the delivered artifact. Remediation delegated to /reconcile: Per-slice direct edit of design.md §5.3 to the symbol anchors (satan-mode-register/satan-mode-check-tool-references; satan-profiles/satan-mode--apply-profile). See ## Reconciliation Brief. Finding stays verified; the edit is reconcile's job."

