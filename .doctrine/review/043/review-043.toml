[[finding]]
id = "F-10"
status = "answered"
severity = "minor"
title = "The accepted session grammar permits IDs that pi refuses"
detail = "Expected: requests passing the server's session validation can be passed to pi --session-id without an additional CLI grammar failure. Observed: sec-6 accepts ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$, including IDs such as 'a.' and 'a-'. Installed pi 0.99.1 docs/cli.md §Sessions explicitly requires IDs to start AND end with a letter or number. The server only checks the first character. Required correction: use a grammar compatible with pi (including the one-character case), and test trailing period/underscore/hyphen refusals as well as valid single-character IDs. This should remain a session-invalid pre-spawn refusal, not become an unexplained child invocation failure."
disposition = "fix-now"
route = "review"
response = "Accepted. Grammar becomes alnum at both ends, up to 64 characters, single-character ids valid, with tests for trailing period, underscore and hyphen plus a valid one-character id."

