[[phase]]
id        = "PHASE-05"
name      = "malebolge: bounded wait and the abort handler"
objective = "Every occurrence waits at most one ceiling for its input to be placed, and an aborted wake owns its input: the bounded-wait race in submit (aborted / already_placed / settled), the heartbeat's unanswered recovery, and the abort handler's withdraw (design sec-2 Bounded wait, sec-11 abort handler, sec-3 Bounded wait; W4, W9). Relies on PHASE-03: a placed input always settles."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-04 exit criteria met; PHASE-03/EX-2 (RV-062 F-13) met." },
]
exit_criteria = [
  { id = "EX-1", text = "submit races submission.wait() against one ceiling; on expiry submission.abort(): aborted -> failure path with not answered within <ceiling>; withdrawn (heartbeat: unanswered journal + notify, sleep, n+1); already_placed -> wait on unbounded; settled -> read wait()." },
  { id = "EX-2", text = "abort handler: when the checkpoint is submit or prepared, withdraw looks up submissionByRequest(conversationId, wake:<id>:<n>) and abortSubmission per the design's table; returns {fired} accordingly; lookup or abort throwing -> fired with a journal line." },
  { id = "EX-3", text = "M green." },
]
verification = [
  { id = "VT-1", expects = "Heartbeat behind a failed run (faux stopReason error, second input queued): after one ceiling its input is withdrawn (journal + notify unanswered), it sleeps, its next input runs with the other queued input; withdrawn input never reaches the model; also across close/reopen while stuck", test_file = "/home/david/dev/malebolge/test/wake-wait.test.ts", keywords = ["heartbeat unanswered", "afterFailedRun", "withdrawn"], waived = false },
  { id = "VT-2", expects = "One-shot behind a failed run in a non-heartbeat conversation: withdrawn after one ceiling, task fails with not answered within <ceiling>; withdrawn, journal + notify_send, no turn; across close/reopen. Negative control: submit without the bound leaves the task running and the input queued, and the test fails. Placed at the bound: neither withdrawn nor reported, completes when the turn ends", test_file = "/home/david/dev/malebolge/test/wake-wait.test.ts", keywords = ["not answered within", "already_placed", "notify_send"], waived = false },
  { id = "VT-3", expects = "Abort owns the input (harness.abortTask directly): queued behind a foreground run -> withdrawn, {fired:false}; then fail the foreground run and pass one ceiling -> submission unanswered (aborted), no turn, no failure report; prepared occurrence admitted before a crash, and one never admitted -> {fired:false}; placed -> {fired:true}. Negative control: a handler that only reports leaves the input queued and the test fails", test_file = "/home/david/dev/malebolge/test/wake-wait.test.ts", keywords = ["abortTask", "submissionByRequest", "fired"], waived = false },
]
