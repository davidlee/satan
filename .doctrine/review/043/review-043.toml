act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
route = "demonstrate"
response = "Accepted. The run directory is no longer bound into any child: the child gets only its active session directory. Per-call mode writes evidence (events, transcript, status, audit) into a server-owned directory outside the jail's bind set. Static mode cannot deny its child the server's writable view in a single-uid jail, so evidence is buffered in memory and flushed after the child exits, and that residual is stated rather than papered over. Verification reproduces your truncation fixture in both postures: a hostile bash attempting truncate/unlink/replace must either fail to reach the path or the run must report failed with evidence intact."

[[finding]]
id = "F-2"
status = "answered"
severity = "major"
title = "Binding the shared session home exposes every session to every delegate"
detail = "Expected: SL-029 sec-6 and DEC-099 bind sessions to a canonical root and filesystem capability so that session history is not a cross-call privilege channel. Observed: sec-3 and sec-6 bind the shared persistent PI_MCP_SESSION_HOME read-write, rather than only the active session's directory; static-mode children inherit that shared writable view. A bash-capable reader for root A can enumerate, read, overwrite or delete another session's JSONL for root B or a write-capability session, without passing the server's session-root/session-capability checks. The checks only mediate opening a session through pi_agent, not direct filesystem access from the model. DEC-099 originally specified a server-owned directory per session; its shared-home addendum widens the actual authority. Required correction: specify the child-visible session scope and keep binding/lock metadata server-owned; normally only the active session should be child-writable. If static mode cannot isolate those histories, restrict its promised isolation or change that posture explicitly. Verification: sessions on different roots/capabilities, with a hostile bash operation in one attempting to read/change the other's history and binding metadata."
disposition = "fix-now"
route = "review"
response = "Accepted. The child-visible bind narrows from the shared home to <home>/<session-id>/ - the active session only - with binding and lock metadata held server-side outside every bind. Static mode inherits a broader view by construction, so that posture's isolation claim is restricted explicitly and its policy may declare a single session."

