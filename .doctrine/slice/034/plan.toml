# Implementation plan for SL-034 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-034"

# Canonical spec/requirement links — cite ids, never restate what they say. The
# plan reader does not model these yet, so nothing downstream consumes them.
[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# One [[phase]] per ordered phase, in execution order — the authored array order
# IS the order; never sort by id. Ids are PHASE-NN (zero-padded), immutable and
# never reused once authored — edits append, they never renumber, so the id
# sequence goes non-monotonic after a split and that is expected. Criterion ids
# are local to their phase, bare, and equally immutable
# (`lib:reference/glossary.md` § reference forms). The prefix is
# the only mode marker; there is no mode field. Reference a criterion from
# another phase phase-qualified (PHASE-03/EX-8) — bare EX-8 is ambiguous.
#
# Paths: malebolge code and tests are absolute (~/dev/malebolge = M); satan paths are repo-relative.
# "M green" = `just check` in M (fmt-check, lint, typecheck, test) at zero warnings.

[[phase]]
id        = "PHASE-01"
name      = "malebolge: wake settings, WakePolicy v0, presence adapter"
objective = "The pure core of the slice: WakeSettings parsed from the five MALEBOLGE_WAKE* keys (host refuses them), the v0 WakePolicy (schedule clamp + jitter; gate: switch, quiet window, weighted presence) over an injected WakeEnv, and presenceOf, the printed-Lisp adapter (design sec-12, sec-4 Config, W2/W3/W10)."
entrance_criteria = [
  { id = "EN-1", text = "Design SL-034 locked; M green at the starting commit." },
]
exit_criteria = [
  { id = "EX-1", text = "src/config.ts: Config.wakes: WakeSettings from MALEBOLGE_WAKES (only exact on enables), _WAKE_FLOOR_MS, _WAKE_CEILING_MS (digit-only, idleMsOf's rule), _WAKE_QUIET (HH:MM-HH:MM, may wrap midnight), _WAKE_TOPIC; design defaults; malformed value fails start; any MALEBOLGE_WAKE* key under the host profile fails start." },
  { id = "EX-2", text = "src/wake/policy.ts: WakePolicy, WakeEnv, Gate, DeferReason, WakeSettings, QuietWindow, v0Policy, constants JITTER = 0.1 and PRESENCE_WEIGHT = 0.4; schedule and gate exactly as design sec-12 (gate order: disabled, quiet, presence; presence only called at step 3)." },
  { id = "EX-3", text = "src/wake/presence.ts: presenceOf(result) maps the first :presence \"<word>\" by the design's regex; no match or isError -> unknown. A thrown call maps to unknown at the env.presence call site." },
  { id = "EX-4", text = "M green." },
]
verification = [
  { id = "VT-1", expects = "Config: each key parsed with its default; malformed floor/ceiling/quiet fail; WAKES other than exact on is disabled; a wake key under host fails start", test_file = "/home/david/dev/malebolge/test/config.test.ts", keywords = ["MALEBOLGE_WAKES", "MALEBOLGE_WAKE_QUIET", "MALEBOLGE_WAKE_CEILING_MS"], waived = false },
  { id = "VT-2", expects = "Policy with a fake env (fixed clock, seeded random, scripted presence): clamp below floor and above ceiling; jitter within +-10% and within bounds over many seeds; quiet window defers to its end incl. a window wrapping midnight and now exactly at either edge; disabled defers with no presence call; favoured fires, unfavoured fires at weight 0.4 under a seeded sequence, unknown fires", test_file = "/home/david/dev/malebolge/test/wake-policy.test.ts", keywords = ["v0Policy", "PRESENCE_WEIGHT", "midnight", "presence"], waived = false },
  { id = "VT-3", expects = "Adapter over real satan-mcp result text: typing, reading, mixed -> present; idle -> away; :status \"missing\", isError -> unknown", test_file = "/home/david/dev/malebolge/test/wake-presence.test.ts", keywords = ["presenceOf", "typing", "idle", "isError"], waived = false },
]
