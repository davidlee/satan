[[phase]]
id        = "PHASE-04"
name      = "Daemon transport: one binding per connection, ordered lines"
objective = "Design sec-3 in src/daemon.ts — the whole lifecycle, departure rules included: install the close handler and one line splitter at connect; feed one per-connection serial chain; each turn first awaits `conversations`, then drops itself and every later line if the socket is destroyed; the first line binds (attach → open → bind with ack; anything else → bind root, then act); later lines act on the bound conversation (an attach line → `already attached to conversation N`). `serve({socketPath, conversations, beforeInput})`. Composition in daemon-start.ts, the daemon-env.ts header (DEC-106), and the minimal client bridge that keeps attach.test.ts green: `attach.ts` sends `{type:\"attach\"}` on connect. The mid-bind departure test (V-15) is PHASE-08 (RV-052 F-7)."
