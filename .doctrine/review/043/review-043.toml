[[finding]]
id = "F-12"
status = "answered"
severity = "major"
title = "Outcome precedence collapses distinct server aborts into ceiling_exceeded"
detail = "Expected: one total result rule preserves the reason and required outcome for every server-controlled stop, including races with an otherwise completed reducer result. Observed: sec-5 gives highest precedence to 'server abort (ceiling_exceeded)', but DEC-096 requires MCP cancellation to return incomplete, sec-6 requires mid-run audit failure to return failed, and sec-4 also aborts on unreadable/unpriced usage without defining its result state. These are all server aborts and need not mean a ceiling was crossed. The response has a refusal reason only when nothing was spawned; it has no specified machine-readable termination reason for these started-run failures. A late cancellation or failed exit-audit after agent_settled is especially ambiguous because the reducer can already report completed/final. Required correction: define a cause-to-state/final mapping and race/precedence rules for cancellation, timeout, measured ceiling crossing, unknown usage/pricing, audit failure and normal/nonzero exit. Preserve a named reason without requiring a new state for every cause. Tests should exercise concurrent abort causes and failures after the settled event, asserting the response cannot claim success or a measured overspend when the actual cause was audit/accounting failure."
disposition = "fix-now"
route = "review"
response = """
Accepted. "Earliest cause wins" and "a late cause still decides" were two rules pointing opposite ways, and the table had no row for spawn failure, nonzero exit, or a terminal `tool_use`/`deferred`.

Design revision 56 and DEC-093 now have one total rule:

- **Success is a predicate, not a table row** (with F-5): terminal answer-bearing message, `agent_settled`, exit 0, accounting known, empty abort latch.
- **Success is provisional until the commit point** — after the termination ladder, reap, stream drain, final accounting, and the `exit` and abort evidence appends. Any cause recorded before it joins the latch and decides the state, so a cause after settling still decides, and it does so without a race. Nothing runs after the commit point, so no post-commit failure can be invented either. The commit point is written down, which is what the previous response lacked.
- **`causes` is returned, ordered by discovery; `termination = causes[0]`; `state` is that cause's row.** A later audit failure is therefore secondary and exposed, not hidden behind a single winning cause: an audit append that fails after a timeout reports `termination: "timeout"`, `causes: ["timeout","audit"]`, and the audit carries both.
- **Table rows added** for exactly the reachable outcomes you named: terminal `tool_use` / `deferred` → `incomplete`; no terminal message and exit 0 → `incomplete` (`eof`); nonzero exit → `failed` (`exit`); spawn failure after the run directory was allocated → `failed` (`spawn`). The `termination` enum in sec-5 grew to carry them.
