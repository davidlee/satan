[[finding]]
id = "F-12"
status = "answered"
severity = "major"
title = "Outcome precedence collapses distinct server aborts into ceiling_exceeded"
detail = "Expected: one total result rule preserves the reason and required outcome for every server-controlled stop, including races with an otherwise completed reducer result. Observed: sec-5 gives highest precedence to 'server abort (ceiling_exceeded)', but DEC-096 requires MCP cancellation to return incomplete, sec-6 requires mid-run audit failure to return failed, and sec-4 also aborts on unreadable/unpriced usage without defining its result state. These are all server aborts and need not mean a ceiling was crossed. The response has a refusal reason only when nothing was spawned; it has no specified machine-readable termination reason for these started-run failures. A late cancellation or failed exit-audit after agent_settled is especially ambiguous because the reducer can already report completed/final. Required correction: define a cause-to-state/final mapping and race/precedence rules for cancellation, timeout, measured ceiling crossing, unknown usage/pricing, audit failure and normal/nonzero exit. Preserve a named reason without requiring a new state for every cause. Tests should exercise concurrent abort causes and failures after the settled event, asserting the response cannot claim success or a measured overspend when the actual cause was audit/accounting failure."
disposition = "fix-now"
route = "review"
response = "Accepted. One cause-to-state mapping with a named termination reason for every non-completed outcome: completed, failed, incomplete, timeout, cancelled, audit_failed, accounting_unknown, ceiling_exceeded, refused; result null and final false wherever the cause is not a model answer; earliest-cause-wins for concurrent aborts. Tests cover concurrent causes and a failure after agent_settled."

