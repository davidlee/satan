[[finding]]
id = "F-7"
status = "answered"
severity = "major"
title = "The proposed argv treats an agent launcher as a generic command-prefix wrapper"
detail = "Expected: sec-3's flake-built forms and sec-4's argv contract connect without an extra command word or option terminator becoming part of pi's prompt. Observed: sec-4 specifies '<wrapper form> [--] pi --mode json ...'. The cited makeJailedAgent/makeJailedPi API takes agent=<derivation> and builds a launcher for that fixed executable, forwarding its arguments; it is not a generic wrapper that consumes an arbitrary executable argument (verified /workspace/flakes/agents/jailed-agents.nix:343-346, inner construction around 621, gatewayOuter exec and makeJailedPi). With that API, the server should pass pi's options to the already-bound pi executable: a literal 'pi' is an additional message, and '--' before '--mode' terminates pi option parsing. A separate generic exec launcher could make the sample valid, but none is specified. Static mode also needs the bare pi executable and its provider configuration in the server jail's closure/PATH: makeJailedAgent's piInJail test is false for agent=pi-mcp unless pi is supplied through the declared mechanism. Required correction: state the exact executable/argv/environment/path contract for both postures, including runtime bind variables and child-visible session paths. Verify a stub captures exactly pi's intended options and prompt, and a thin launcher integration confirms the selected executable/provider configuration is actually available."
disposition = "fix-now"
route = "demonstrate"
response = "Accepted. The argv is the launcher followed by pi's options: the executable is baked into the launcher, so there is no pi token and no double-dash. Static mode names its pi executable and provider configuration in the launch closure and PATH, handling piInJail explicitly. A stub asserts the exact argv; a launcher probe asserts the executable and provider config are reachable."

