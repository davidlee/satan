[[finding]]
id = "F-4"
status = "answered"
severity = "major"
title = "A bash-capable delegate can incur model spend outside the sole event-stream accumulator"
detail = "Expected: the declared scope of accounting is explicit, and the accepted retrospective-ceiling concession is not mistaken for complete attribution of all model spend caused by a delegate. Observed: revision 48 sec-4 treats the main pi event reader as the sole usage source, but sec-3 grants bash and pi's runtime/authentication environment. The reused jail generator includes curl (jailed-agents.nix:108), the bare agent executable on PATH (:635), and gateway URL/key forwarding (:472-475). A bash command can invoke another pi or call the reachable gateway directly; those requests share credentials/reach but do not produce top-level message_end/compaction_end events in the parent pi stream. Their usage may only be text inside a bash result, or nowhere at all. A read-only synthetic reducer fixture confirmed that nested message_end usage embedded in tool output is not attributed to the outer run; no billable request was made. Outer assistant messages can all have valid priced usage, so the new accounting_unknown check need never fire. This is an observability bypass, not merely overshoot caused by slow event observation, and is separate from RV-043 F-6's request-event mapping/deduplication problem. Required correction: state whether arbitrary subprocess provider use is outside the supported threat/accounting model and obtain an explicit concession if so, or identify an enforcement/attribution mechanism at the provider capability boundary. Do not automatically broaden scope or assume shared gateway insurance is a per-run ceiling. Verification should use a stub gateway/nested process to show whether extra calls are attributed, refused, or explicitly reported as outside the guarantee."
disposition = "fix-now"
route = "demonstrate"
response = """
Accepted. The observation is right and my disclosure did not go far enough: sec-4 called the event reader the sole usage source while sec-3 grants bash, the bare agent executable and gateway credentials, so a nested `pi` or a direct gateway call is reachable by design and invisible to the parent stream.

Disposed as a **stated limit plus a named conformance gap**, not as coverage:

- design revision 60 (sec-4, "Scope of accounting") says the accumulator describes this run's own provider sends; a send that emits no record the parent stream sees, and spend whose only evidence is text in a tool result, are outside it. The ceiling is a bound on the delegate's run, not on all spend its tools can cause.
- DEC-097's appended section records that limit as a second conformance gap beside the retrospective-accounting concession, and names the mechanism that would close it: a per-run gateway token with a spend limit (IDE-015). It is not claimed as insurance here, and this slice has not been widened to build it.
- Because it is a second accepted-shape concession, it needs the operator's decision at reconcile like F-4's — recorded as a candidate, not asserted as assent. A REV to SPEC-001 REQ-004 should carry both limits in one place rather than two scattered sentences.
- sec-7's demonstration is the stub gateway / nested-process probe: show extra calls are **not attributed and not claimed** as attributed, so the run cannot publish a ceiling verdict that implies more than it observed.

What I explicitly do not claim: that shared gateway credentials make the per-run ceiling hold. They do not, and the design now says so.
"""

