[facet]                         # every field typed; seeded empty (captured later)
context = "Today's forms (flake.nix piMcpJail) build on the operator's private agents flake (inputs.agents mkJailedAgents), so they cannot ship to strangers."
choice = "quotient ships form-1, a mechanism-neutral form contract: an executable invoked with argv = session dir then pi argv, cwd = the call's root; it must guarantee root not writable under read and writable under write, session dir writable, private temp, and nothing reachable beyond the policy's declared exposure. Mechanism (bwrap, seatbelt, Landlock, ...) is the implementation's choice; hostile-audit is the form-agnostic conformance probe that defines conformance. quotient's flake exports the package only. satan keeps building this host's bwrap forms, renamed quotient-<capability>; ADR-017 ledger row 3c stays with satan-flake. The policy's bwrap-flavoured child_binds is renamed exposure in quotient-policy/1. Generic and native forms (seatbelt, bwrap+Landlock) are follow-ups implementing form-1 without contract change."
alternatives = ["generic bwrap forms + lib.mkForms in quotient"]
rationale = "Today's forms depend on the operator's private agents flake; and confinement beyond NixOS (macOS seatbelt etc.) is an open thread, so the contract states guarantees, not bwrap binds (operator, 2026-10-22)."
consequences = ["slice scope: nix forms are not a quotient flake output in v1"]
decided_by = "operator"
decided_on = "2026-10-22"

