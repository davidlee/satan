[[finding]]
id = "F-1"
status = "open"
severity = "blocker"
title = "PHASE-09's three empirical criteria are unexecuted and the phase has no recorded boundary, so the slice's loop-closing property is undemonstrated"
detail = """
Expected (plan.toml PHASE-09 EX-3/EX-5/EX-7 and VA-1..VA-3, which are the phase's authority; design sec-3 and sec-7): three criteria that only executing the built forms can prove — the flake check asserting each form's actual bind set equals root + active session directory + the policy's child_binds (EX-3/VA-1), one live per-call smoke run against deepseek-flash through the wrapped form with the gateway forwarded (EX-5/VA-2), and the hostile truncate/unlink/replace fixture under the real wrapped form (EX-7/VA-3). Design sec-3 rests its loop-closing claim on the first: "the flake check asserts the form's actual bind set equals root + session directory + child_binds. That is where the loop closes; a server promise alone would not close it."

Observed: none of the six has been executed, and the tree says so (notes.md § "What did not run, and is not claimed"). This host has no nix binary (/nix/store is a transplanted snapshot, /nix/var/nix empty) and no gateway socket (/run/llm-gateway-client absent), so the derivations cannot be built, pi-mcp-forms / just check-jails cannot run, and the smoke has no provider. What is green is the nix-free half: 252 tests including pi/mcp/forms.test.ts (six textual assertions over flake.nix), PHASE-09 EX-6's bwrap-token scan, and a bash rehearsal of the check's body against hand-built launcher text. The hostile driver was exercised only against a stub form, which the phase evidence itself labels "Plumbing, not EX-7: a stub form has no jail".

Three consequences, all mechanical and all verified in this pass:

(a) PHASE-09 has no boundary row in .doctrine/state/slice/029/boundaries.toml (PHASE-01..08 only, PHASE-08's row last), because a blocked phase is never concluded. Its actual delta (bba7d87: flake.nix, bin/pi-mcp-hostile-audit, pi/mcp/forms.test.ts, justfile) is therefore outside every recorded delta.

(b) `doctrine slice verify-vt 29` reports 54 PASS with the single exception of PHASE-09 VT-1 UNATTRIBUTABLE ("keyword present but flake.nix not modified by this slice"), and `doctrine slice conformance 29` reports flake.nix undelivered. Both are the same missing row, not a missing artefact: flake.nix was modified by bba7d87 (git log -- flake.nix). The attribution heuristic is starved of the delta it reads, not wrong about the file.

(c) Two open blockers on prior ledgers wait on exactly this evidence and are still answered-not-terminal: RV-043 F-1 (BLOCKER, fix-now, route demonstrate — "the delegate can truncate or replace the audit that is supposed to constrain it") and RV-053 F-18 (BLOCKER, follow-up, route demonstrate — "PHASE-09's empirical criteria are unexecuted on this host"). Under lib:reference/review-ledger.md §3 an unresolved blocker refuses the audit->reconcile crossing, so the slice cannot reach reconcile on this evidence.

The status is honest — PHASE-09 reads blocked and must not be flipped to completed — so this is not a finding about a false claim. It is about the one thing that decides whether the slice may close: either the operator run happens (the three recorded commands in notes.md § PHASE-09 evidence), or a human consciously accepts an undemonstrated blocker and design sec-3's loop-closing sentence is reconciled to say what is actually proven (form-vs-literal proven by the check as written; policy-vs-form awaiting the operator run — RV-053 F-3's refresh route). That choice is not the audit's to make."""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "PHASE-08's recorded delta range spans a foreign SL-030 commit, so the conformance undeclared cell reports eleven paths this slice never touched"
detail = """
Expected (the recorded source-delta is what `slice conformance` reads): a phase's recorded code range contains that phase's work, so an `undeclared` path is a lead about this slice's scope.

Observed: PHASE-08's boundary row is df71ab4 (PHASE-07's tip) .. 1a7a769, and `git log df71ab4..1a7a769` is two commits — 1a7a769 (SL-029 PHASE-08) and 2c1b98e ("doctrine(SL-030): plan — seven phases from the locked design"), a concurrent session that commits into this same tree. `doctrine slice conformance 29` consequently lists eleven .doctrine/** paths (backlog/issue/053, one memory item, slice/030/*) in its `undeclared` cell plus one more in `M` state, none of it SL-029's work. The signal is real but polluted: read alone, the cell attributes another slice's planning artefacts to this one.

PHASE-06's range was narrowed for the same reason (notes.md § "Implementation and review": it now starts at 31afa50 rather than PHASE-05's tip 9879067), which leaves the boundary chain non-contiguous in two places. That is the precedent's cost, and it is why re-recording PHASE-08 is not the obvious repair: narrowing its start to 2c1b98e would drop the foreign commit but make the row claim the phase began after its predecessor ended, understating the phase's own span. The honest disposition is to keep the row truthful and read the undeclared cell with this caveat — which is what this finding records."""
disposition = "tolerated"
response = """
Accepted as the honest reading rather than repaired. PHASE-08's boundary row df71ab4..1a7a769 is a true statement of the range in which the phase's work landed; that a concurrent SL-030 session committed 2c1b98e inside it is a fact about this tree, not about the row. Narrowing the start to 2c1b98e would remove the noise and make the row claim the phase began after PHASE-07 ended, understating the span and repeating a falsification PHASE-06's narrowing already introduced.

What is accepted: `slice conformance 29`'s undeclared cell must be read with the caveat that eleven of its entries are SL-030's `.doctrine/**` planning artefacts, and the boundary chain is knowingly non-contiguous in two places (PHASE-06 and PHASE-08). Carried into the audit's synthesis as a standing reading instruction, so a later auditor does not re-derive it. If a future pass wants the cell clean, the correct repair is a per-phase delta that can express an interleaved foreign commit — a doctrine change, not an SL-029 one."""

