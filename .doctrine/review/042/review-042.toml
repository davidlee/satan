status = "verified"
severity = "nit"
title = "lockOf hides the environment close on a lock refusal"
detail = """
malebolge src/daemon-start.ts:43-49, call site :82 (at d23d619). `lockOf(path, environment)` reads as an accessor but closes the environment on InstanceLocked, hiding one of the D2 compensations outside the single teardown list in the catch (:100-109). Fix: inline the try/catch at the call site.
"""
disposition = "fix-now"
response = "Fixed in malebolge f44240e: lockOf inlined into startDaemon (unknown-model check extracted to requireKnownModel to stay under eslint complexity)."

