[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "Two spawn-failure tests read the live corpus and take the other branch without it"
detail = """Expected: the PHASE-05 spawn-failure tests are hermetic (design sec-4 R10 coverage; mem.pattern.satan.corpus-integration-skip-unless: corpus-dependent tests skip-unless the corpus). Observed: satan-broker/spawn-error-before-child-finalizes-spawn-failed (satan/test/satan-broker-test.el:1450) and satan-broker/spawn-exec-failure-keeps-context-bundle (:1495) use --with-spawn-collaborators, which leaves the real satan-broker--build-manifest in place. With no :tools the builder still calls satan-tool-final-schema (satan/satan-tools.el:318) -> satan-tool--description "satan_final" (:202), which reads satan-tools-descriptions-dir = ~/satan/tools/satan_final.md from the live corpus. Verified: binding satan-tools-descriptions-dir to an empty tmp dir makes both tests FAIL (manifest build now throws before audit-open, so the no-audit branch runs; T4's crash-context assertion and T8's bundle :ctx assertion fail). So the tests' verdict on the audit-open branch depends on the corpus repo being present and carrying satan_final.md; on a machine or CI without it they red for an unrelated reason. Suggest: wrap both in the existing satan-broker-test--with-tool-descriptions (satan-broker-test.el:428) with a tmp satan_final.md, or have --with-spawn-collaborators bind satan-tools-descriptions-dir to a tmp dir under ROOT seeded with satan_final.md. Distinct from ISS-018 (writes) — this is a read of a live root."""
disposition = "fix-now"
response = "Fixed in 2d6c0da: --with-spawn-collaborators runs inside satan-broker-test--with-tool-descriptions (satan_final only). Red: empty descriptions dir failed both tests; green after."

[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "Undelivered path: a failed verdict projection after a successful intervention projection leaves the unseen alert pending"
detail = "Expected (design sec-5, and the function's own docstring at satan/satan-tools-notify.el:44-56): an intervention projected without its verdict must never exist, because satan-intervention-pending (satan-intervention.el:828, LEFT JOIN ... WHERE o.intervention_id IS NULL) would surface it and the observer would score an alert the keeper never saw. Observed: satan-tools-notify--mark-undelivered (satan-tools-notify.el:57-72) runs the two projections as separate psql round-trips: (or (--project #'satan-intervention-project payload) (--project #'satan-intervention-classify-project verdict)). When step 2 succeeds and step 3 fails (Postgres drops between calls, lock timeout, any upsert error), satan_interventions holds the row with no outcome row -> exactly the pending, unseen state the docstring says the chaining prevents. The ruled deviation (skip the verdict projection when the intervention projection fails) covers the opposite ordering only. Untested: satan-tools-notify-test.el covers FAILING = (project) and (project classify-project) (:268), but never FAILING = (classify-project) alone; nor is the :verdict branch (classify-record signals -> both projections skipped, :73) exercised anywhere. Suggest: project both statements in one transaction (one satan-intervention--exec-sql over insert-created-sql + upsert-outcome-sql inside one BEGIN/COMMIT) so the window cannot exist; add tests for the classify-project-only failure and the :verdict branch. Transcript (the record) is correct in all cases; rebuild would repair it — the defect is in the projection the observer reads between rebuilds."
disposition = "fix-now"
response = "Fixed in 2d6c0da: new satan-intervention-project-with-verdict (one --exec-sql, one BEGIN/COMMIT via new --transaction-sql, also used by project/classify-project/rebuild); --mark-undelivered makes one projection call. DB test project-with-verdict-is-one-transaction (CHECK-violating verdict → 0 intervention rows); new notify test undelivered-verdict-record-fails covers the :verdict branch."

[[finding]]
id = "F-3"
status = "withdrawn"
severity = "minor"
title = "spawn_failed runs record crash-context :pre_spawn_completed true even when pre-spawn failed"
detail = "Expected: the crash-context snapshot (docs/resilience-design.md sec 1.2) aids diagnosis; for a spawn that failed before its child it should not claim pre-spawn completed. Observed: PHASE-05 routes every audit-open pre-child failure through satan-broker--finalize (satan-broker.el:917 via --record-spawn-failure), which records crash-context built by satan-broker--crash-context (:221). That computes :pre_spawn_completed as (not (null prepare)) (:235), and the struct's prepare slot is set at make-satan-run (:720-736) — so it is t for every spawn_failed run, including those where enrich (not wrapped in a condition-case, :747) or the context-fn (:801) threw before pre-spawn finished. Before PHASE-05 finalize was only reached after a child existed, so t was always true; the new path makes the field lie. The spawn-failed event's :error and failure_reason spawn_failed mitigate but do not correct it. Suggest: compute the flag from real progress (e.g. (plist-member prepare :pre_spawn), set only after the last pre-spawn stage), or set it false in --record-spawn-failure; add an assertion to spawn-error-before-child-finalizes-spawn-failed."

[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "spawn_failed runs record crash-context :pre_spawn_completed true even when a pre-spawn stage threw"
detail = "(Supersedes withdrawn F-3, whose detail wrongly counted a context-fn failure as pre-spawn.) Expected: the crash-context snapshot (docs/resilience-design.md sec 1.2) aids diagnosis; for a spawn that failed inside the pre-spawn window it should not claim pre-spawn completed. Observed: PHASE-05 routes every audit-open pre-child failure through satan-broker--finalize (satan-broker.el:917 via --record-spawn-failure), which records crash-context from satan-broker--crash-context (:221). :pre_spawn_completed is (not (null prepare)) (:235), and the struct's prepare slot is non-nil from make-satan-run onward (:720-736), so it is t for every spawn_failed run — including one where satan-run-enrich (not wrapped in a condition-case, :747-748) threw, i.e. the pre-spawn window never finished and no :pre_spawn was set. Before PHASE-05 finalize was only reached after a child existed, where t was always true; the new path makes the field false-positive. The spawn-failed event's :error and failure_reason mitigate, but the snapshot itself misleads. Suggest: derive the flag from real progress, e.g. (plist-member prepare :pre_spawn) — set at :798 after the last pre-spawn stage — and assert it in a spawn-failure test with a throwing enrich."
disposition = "fix-now"
response = "Fixed in 2d6c0da: new satan-run slot pre-spawn-completed, set as the last pre-spawn let* binding in --spawn (stage order unchanged); --crash-context emits t / :false. The suggested plist-member test would not work: satan-run-new-ctx writes :pre_spawn nil up front. New test spawn-error-in-pre-spawn-reports-incomplete."

[[finding]]
id = "F-5"
status = "verified"
severity = "nit"
title = "The 'no wall-clock fallback' guard checks key presence, which the canonical builder always satisfies"
detail = "Expected (design sec-4, PHASE-04 EX-3): 'a ctx without :time-now fails the check, so it cannot run with the wrong time.' Observed: satan-intervention--ctx-required (satan-intervention.el ~:346) tests (plist-member ctx :time-now), not a usable value. satan-run-tool-ctx (satan-run.el:323-331) always emits the :time-now key, copied from prepare's :time_now, so a run whose prepare lacks :time_now yields :time-now nil and passes the check. Downstream: satan-observer-process (satan-observer.el:374-376) then queries satan-observer-pending with now = nil, which satan-intervention--quote-text renders as NULL::timestamptz, so pending comes back empty and the observer silently processes nothing; satan-sensor-alerts-check (satan-sensor-alerts.el:326-327) calls (date-to-time nil) and signals, which the broker swallows. The only test of the guard (satan-observer/process-rejects-ctx-without-time-now, satan-observer-test.el:1340) builds a ctx with the key absent, a shape the canonical builder can never produce. Low likelihood (satan-run-new-ctx always sets :time_now), hence nit. Design keeps ctx-required unchanged, so this is a suggestion, not a deviation: have the check require (stringp (plist-get ctx :time-now)) and non-nil :id / :audit, and test through satan-run-tool-ctx over a prepare without :time_now."
disposition = "fix-now"
response = "Fixed in 2d6c0da: --ctx-required requires non-nil values for :id :mode-name :time-now :audit; observer rejection test now builds its ctx through satan-run-tool-ctx with nil time."

[[finding]]
id = "F-6"
status = "verified"
severity = "nit"
title = "perceive_failed and spawn_failed no-child records are hand-built twice"
detail = """Expected: one definition of 'a no-child run that failed with ERR at stage X' (global CLAUDE.md: DRY, no parallel implementation). Observed: satan-broker-run's perceive branch (satan-broker.el:614-621) and satan-broker--record-spawn-failure's no-audit branch (:918-925) each call satan-broker--write-no-child-run with 'failed, a reason string, a :final of (:summary (format "<stage> failed: %s" msg) :actions [] :reason <reason>) and :rename-announce t, then stamp satan-trace-outcome with the same reason. They differ only in the reason string and the spawn branch's :event / :event-payload (which the perceive branch arguably should also carry, so its transcript names the error the way spawn-failed does). Suggest a small helper, e.g. satan-broker--write-failed-no-child-run (mode prepare dir reason err), used by both; it would also make the perceive path record its error in the transcript, not only in final.json's summary."""
disposition = "fix-now"
response = "Fixed in 2d6c0da: satan-broker--write-failed-no-child-run shared by the perceive and spawn no-child branches; perceive_failed transcript gains a perceive-failed event with :error (no reader of the old shape in satan/ or docs/)."

