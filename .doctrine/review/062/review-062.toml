[[finding]]
id = "F-3"
status = "verified"
severity = "major"
title = "wake_cancel explicitly permits the outcome that the accepted scope and tests forbid"
detail = """
Expected: SL-034 scope Summary requires a cancel racing fire to cancel or answer already fired, never report a cancelled wake with a queued turn; DEC-130/F5 limits cancellation to sleeping wakes and leaves admitted work alone. Observed: design.md:242-256 reads sleeping then aborts in a separate operation, explicitly accepts a queued wake surviving that cancellation, and says the outcome line will be cancelled. Verification at design.md:562-564 still requires the opposite. The design calls the race accepted for v0, but the accepted DEC-130 amendment and scope do not contain that relaxation.

VERIFIED source: pi-durable src/harness/harness.ts:310-317 and 332-334 make inspection and abort separate operations; scheduler.ts:558-584 marks and signals the task; harness.ts:491-518 and docs/spec.md:1014-1028 state that cancelling the invocation/wait leaves admitted submissions durable. This applies even if the turn is still queued behind a busy conversation.

VERIFIED reproduction with installed 1.4.0 and faux model: hold a foreground turn; create/sleep a wake until 2000; inspect sleeping; advance the injected clock and resume; wait until the wake input is queued; abortTask; wait for its terminal receipt. Observed task result {fired:false} with requestId wake:10:0 still queued. Releasing the foreground response ran the queued wake (modelCalls:2). This proves the design's advertised interleaving without implementing new production code.

Repair: specify one consistent admission/cancellation protocol so a winning admission yields already fired and a successful cancellation guarantees no admitted input; reconcile the task outcome and journal line too. If the narrower promise is deliberately abandoned, obtain an explicit scope/decision amendment rather than asserting acceptance in the draft. Test both timer-before-abort orderings, including admission-before-abort; testing only abort-before-submit as design.md:255-256 proposes hides the defect."""
disposition = "fix-now"
response = """
Contest upheld: the handler now reads task.state.checkpoint (pi-durable RunningTask.state = {status, checkpoint}); fired = phase submit or checkpoint.prepared. Design Wake task code; DEC-127 amended.

Route added 2026-10-28: review. Repaired in prose in this design review; the finding predates route tagging.
"""
