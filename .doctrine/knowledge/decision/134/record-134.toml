context = "SL-034 inq-8. User wants a notify-send and, ideally, recent failures visible in satan-tank, at low cost. Submission.wait() settles done|unanswered (pi harness/types.ts:88-94). satan-mcp mints a run in satan-runs-dir per scheduled connection and audits each tool call (satan-mcp.el:258-300); satan-tank's RECENT EVENTS tails those transcripts."
choice = """The submit phase awaits submission.wait() for at most one ceiling; then submission.abort() withdraws the input if it is still queued (pi-durable checks and withdraws in one commit; a placed input is waited on, unbounded). A fire failure (wake.md missing, target unreachable, submit throws), an unanswered settlement, or a withdrawal after one ceiling is reported by: (1) a journal line on stderr `malebolge: wake <id> (<topic>) failed: <reason>`; (2) best-effort notify_send{title:"SATAN wake failed", body: reason, topic, intent} over the wake's scheduled satan-mcp connection, which is both the desktop notification and a satan-tank RECENT EVENTS entry with no tank code; (3) one-shot -> task failed with the reason; heartbeat -> reported, stays alive, sleeps a ceiling."""
alternatives = ["A dedicated satan-tank recent-wakes section (needs a daemon read op or filtering runs by kind=scheduled) -- backlog", "Journal only (invisible unless looked for)"]
rationale = "Reuses the scheduled connection DEC-129/DEC-133 already open and satan's existing audit-to-tank path; zero satan-side code."
consequences = ["Emacs or satan-mcp down: journal only", "Model failures (e.g. gateway spend cap) settle the input unanswered with reason model_error (pi-durable generation.ts:376) so wait() already reports them", "Backlog: tank recent-wakes section"]
