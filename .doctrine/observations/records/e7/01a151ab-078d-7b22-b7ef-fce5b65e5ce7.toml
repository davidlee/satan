summary = "patch_job_create outside a run has no tool-ctx, so closure jobs carry no intervention"
detail = "SL-023 PHASE-14 B2: satan-tool/patch-job-create called via emacsclient with nil ctx returns :intervention_error (ctx-required wants :id/:mode-name/:time-now/:audit). The only ctx builder outside a run (satan-run-manual-tool-ctx) reopens an existing run's audit, which would be false provenance. EX-2's intervention evidence row cannot be produced by the ruled create path."

