[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "Heartbeat ensure cannot recognize a wake stranded behind a failed run"
detail = """
Expected: DEC-131 explicitly treats a heartbeat blocked behind a failed run as dead and recreates it at daemon start; afterFailedRun remains keep. Observed: design.md:351-362 tests only TaskInspection.state.kind === blocked and its four scheduler-definition/restart reasons. A heartbeat awaiting Submission.wait() is an active invocation, so inspect reports running even when its input is permanently queued in an idle conversation. The task's own n remains unchanged; replay submits the same requestId and returns the old queued submission, so restart does not release it.

VERIFIED source: ~/.local/src/pi/packages/durable/src/harness/scheduler.ts:1667-1679 returns running before any other test; harness/generation.ts:404-427 leaves queued inputs untouched under keep; harness/submissions.ts:210-216 returns the existing submission without a placement boundary. design.md:287-289 awaits that submission. The narrower gap qualification at design.md:370-373 does not implement DEC-131's restart recovery.

VERIFIED reproduction against malebolge's installed pi-durable 1.4.0, MemoryStorage and faux model: hold a foreground response; run a conversation-owned background task that submits wake:<id>:0 and waits; fail the foreground response with stopReason error; inspect; close/reopen the same storage, resume and inspect again. Both views showed task {kind:running} and the same submission {status:queued,requestId:wake:10:0}; model call count remained 1. This is an API-behavior probe, not execution of the unimplemented wake code.

Repair: specify detection of this application-level blockage using the queued submission plus target conversation/run state, and a safe recovery/admission path while preserving the accepted keep setting and occurrence identity. Add this exact failed-run/restart case to verification; the current parked-heartbeat test at design.md:558-561 cannot detect it."""
disposition = "fix-now"
response = """
Accepted (verified: types.ts:568 keep semantics, generation.ts:414). Start-time detection dropped for this case; the heartbeat's submit phase races wait() against one ceiling, journals+notifies 'heartbeat unanswered', sleeps with n+1; its next input starts a run carrying the stuck one under keep. DEC-131 amended; design Heartbeat + Verification (failed-run and close/reopen cases).

Route added 2026-10-28: review. Repaired in prose in this design review; the finding predates route tagging.
"""
