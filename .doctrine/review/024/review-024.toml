[[finding]]
id = "F-6"
status = "verified"
severity = "nit"
title = "Expected ingest advance to require the perceived snapshot; observed the no-arg live-heads fallback remains with no production caller"
detail = """
satan-ingest-cursor-advance (satan/satan-ingest-cursor.el ~:174-196) keeps its no-argument live-heads branch; the only production caller is --commit-frontiers, which passes (plist-get snaps :ingest). If :ingest were ever absent, nil silently falls back to live heads, defeating "commit what was perceived" (I5). plan.toml PHASE-03 EX-3 explicitly requires the no-arg behaviour be kept.
"""
disposition = "tolerated"
response = """
plan.toml PHASE-03 EX-3 explicitly requires `satan-ingest-cursor-advance` to keep read-head behaviour without an argument (immutable criterion), and the design kept it for other callers. perceive always stores :ingest under :probe_snapshots (satan-context.el), so the nil fallback is unreachable from the broker today. Making `heads` required would change a plan criterion — not worth a plan escalation for an unreachable path.
"""

