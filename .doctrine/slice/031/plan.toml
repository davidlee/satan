[[phase]]
id        = "PHASE-05"
name      = "Layered profiles, capability pin, protected stores"
objective = "Profiles load from the launch-dir and XDG layers into one start-up snapshot. The policy's profiles map pins each profile's capability at validation step 3. Step 8 protects both profile layers and both help layers (DEC-112, DEC-113, design sec-3)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-04 exit criteria met." },
]
exit_criteria = [
  { id = "EX-1", text = "loadProfiles(layers) treats a missing layer dir as empty. An unreadable layer, or an invalid document in either layer (shadowed or not), refuses start-up, and every call is then profile-invalid. Per name, the launch-dir document wins. Each Profile carries source." },
  { id = "EX-2", text = "The header marker is quotient-profile, with no pi-mcp-profile alias. DEFAULT_PROFILES_DIR is removed, and there is no built-in profile layer. The moved src/server/profiles/*.md become examples/profiles/{read,research,write}.md, and tests take their layers from fixtures." },
  { id = "EX-3", text = "Step 3 runs grammar, then snapshot (profile-unknown), then map key (profile-not-allowed), then capability: a document filesystem that differs from the pinned capability is profile-capability-mismatch." },
  { id = "EX-4", text = "profile_digest (sha256 over name, source and bytes, in name order) and profile_source are on the spawn record. Audit-only." },
  { id = "EX-5", text = "ChildViewInput gains profileLayers and helpLayers, and the child_bind role becomes exposure. The four layers are never-writable protected stores whether or not they exist: a write call whose root or exposure path contains one refuses view-overlaps-protected, and read calls are admitted." },
]
verification = [
  { id = "VT-1", expects = "profiles: launch-dir beats XDG per name; a missing layer is empty; an invalid shadowed document refuses start-up; the digest changes with the source path; the capability pin refuses mismatch; an unmapped name is profile-not-allowed", test_file = "/home/david/dev/quotient/src/server/profiles.test.ts", keywords = ["loadProfiles", "quotient-profile", "profile-capability-mismatch", "profile-not-allowed", "profile_digest"], waived = false },
  { id = "VT-2", expects = "step 8: a write root containing the launch-dir .quotient/, existing or not, refuses view-overlaps-protected; a read root containing it is admitted; a sibling-repo write root is admitted", test_file = "/home/david/dev/quotient/src/server/childview.test.ts", keywords = ["profileLayers", "helpLayers", "view-overlaps-protected", "exposure"], waived = false },
]
