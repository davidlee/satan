objective = "Design sec-2 in src/protocol.ts and the Printable half of sec-6 in src/render.ts, as pure parsing and typing with no caller yet: `AttachTarget`, `AttachMessage`, `AttachedMessage`, `AttachRefused`, and `parseConnectionMessage(line): AttachMessage | ClientMessage`, which validates the attach frame strictly and delegates every other type to the unchanged `parseClientMessage`. `render.ts` renders `attached` as `[attached to conversation N]`."
entrance_criteria = [
  { id = "EN-1", text = "Design locked (run dr-01a15954, rev 42). `just check` green in ~/dev/malebolge at the phase's base commit." },
]
exit_criteria = [
  { id = "EX-1", text = "Each row of the sec-2 attach table parses to its `AttachTarget`: `{type:\"attach\"}` → root; `conversation: N` → existing N; `new: true` → new; `new: true, cwd: S` → new with S, untrimmed, the empty string kept." },
  { id = "EX-2", text = "Every refused shape throws `AttachRefused` (an exported class, so `instanceof` distinguishes it from other parse errors): `conversation` with `new`; `cwd` without `new`; `new` other than `true`; `conversation` not a safe positive integer (0, -1, 1.5, 2^53, \"3\", null); `cwd` not a string; any key outside `type`, `conversation`, `new`, `cwd`." },
