[[phase]]
id        = "PHASE-06"
name      = "PROMPT + DOORBELL: the goad_ask tool"
objective = """
New `satan/satan-tools-goad.el`: one `satan-tool-register` spec `goad_ask`
under capability `goad-ask`, args `question` + `subject`. Handler order is
design sec-3's, verbatim:

1. refuse in interactive MCP mode (before anything else);
2. refuse when `satan-goad-enabled` is nil or inside
   `satan-goad-quiet-hours` — refusals, not suppressions;
3. subject gate (design sec-10): subject in ctx `:percept-handles`, not
   goad-minted (`app:goad`, or a `topic:` of an outstanding queue entry), and
   held by a live non-dormant motive's cue; rank those motives by
   |cue ∩ percept|, ties by file order; no winner → no emit, enqueue
   `ask_suppressed`;
4. `satan-intervention-record` kind "ask" with `:related-motive-id`,
   `:cue-handles (subject)`, `:outcome-window-minutes 60`;
5. `satan-intervention-project`;
6. rewrite queue.json whole and atomically from the open rows —
   `satan-goad-queue-rewrite`, in `satan-goad.el`: `satan-intervention-pending`
   filtered to kind "ask" with `created_at + window` still ahead. No new
   query;
7. ring via `satan-trace-call` on `goad-emit --source satan`, bounded by
   `satan-goad-emit-timeout`; the exit code is logged, never interpreted
   beyond the doorbell (design sec-4).

A failed step 5 or 6 takes the shared undelivered writer (PHASE-04). Model
description `~/satan/tools/goad_ask.md` lands in the corpus in the same
window — a missing description breaks every run of an allowlisting mode.
`tick-pulse` gains the tool and capability.
"""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-05 complete" },
]
exit_criteria = [
  { id = "EX-1", text = "every handler branch covered; goad-emit stubbed with cl-letf, never a live host in tests" },
  { id = "EX-2", text = "~/satan/tools/goad_ask.md committed in the corpus before the tick-pulse allowlist change is committed here" },
  { id = "EX-3", text = "`satan-goad-enabled` still nil by default; lint clean; `just check` green with counts recorded" },
]
verification = [
  { id = "VT-5", expects = "a refused (exit 1) or failed (exit 2, timeout) goad-emit leaves the question in queue.json and records the ask normally", test_file = "satan/test/satan-tools-goad-test.el", keywords = ["satan-tools-goad/refused-ring-keeps-queue"] },
  { id = "VT-6", expects = "an ask with no correlating motive is not recorded and enqueues ask_suppressed", test_file = "satan/test/satan-tools-goad-test.el", keywords = ["satan-tools-goad/suppressed-enqueues-attribute", "ask_suppressed"] },
  { id = "VT-9", expects = "goad_ask refuses in interactive MCP mode and records no suppression", test_file = "satan/test/satan-tools-goad-test.el", keywords = ["satan-tools-goad/refuses-in-mcp"] },
  { id = "VT-11", expects = "a failed projection or queue rewrite leaves the undelivered verdict, the ask absent from satan-intervention-pending, and survives satan-rebuild-interventions with its verdict", test_file = "satan/test/satan-tools-goad-test.el", keywords = ["satan-tools-goad/projection-failure-undelivered", "satan-rebuild-interventions"] },
  { id = "VT-13", expects = "first-ever ask correlates on a perceived non-goad subject; app:goad or an outstanding topic: subject is refused", test_file = "satan/test/satan-tools-goad-test.el", keywords = ["satan-tools-goad/first-ask-correlates", "satan-tools-goad/goad-subject-refused"] },
  { id = "VT-28", expects = "queue.json regenerates wholly from the open ask rows, atomically, excluding classified and expired rows", test_file = "satan/test/satan-goad-test.el", keywords = ["satan-goad-queue-rewrite", "satan-goad/queue-regenerates"] },
  { id = "VT-29", expects = "with an ask outstanding and a motive cued on app:goad, an ask on another perceived subject emits and records the subject's motive (emit half of design item 19)", test_file = "satan/test/satan-tools-goad-test.el", keywords = ["satan-tools-goad/goad-motive-cannot-absorb"] },
  { id = "VT-38", expects = "goad_ask refuses when disabled and inside satan-goad-quiet-hours, recording neither an intervention nor a suppression", test_file = "satan/test/satan-tools-goad-test.el", keywords = ["satan-tools-goad/quiet-window-refuses", "satan-goad-enabled"] },
