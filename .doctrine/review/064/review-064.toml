act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
route = "control"
response = "Observation confirmed in satan-attribute-listener--handle. The prescription is wrong: the daemon's process_reply_row deletes each satan_audit_replies row after logging it, so an absent row proves nothing. Control: the concrete incorrect candidate is a broker running without content_backlog in satan-audit-attribute-sensor-reasons; the check must reject it. The criterion must assert that removing the literal turns the accepted-reasons test red, and that the host check needs the transcript line for the event and no broker rejected attribute.delta_applied journal line, not merely the event row. Host phase constraint: it must follow the re-enable step, and needs a positive control on the journal search. Separable second arm, repaired in prose: sec-3 now states what a rejection costs, and sec-7 says the event row proves only the daemon half."

