# Implementation plan for SL-016 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
#
# VT numbering is slice-wide, not per phase: VT-1..VT-25 are design.md sec-8's
# own item numbers, kept verbatim so a phase row and its design row share one
# id (VT-10 is moot in the design and is never used). Where a design item spans
# two phases, the design id sits in the phase that completes the claim and the
# other half gets a new id. New rows continue from VT-26. VA/VH ids are per
# phase.
#
# Out-of-repo tests (~/satan corpus, ~/dev/satan-attrd) carry waived = true:
# verify-vt cannot attribute a file outside this repo. They are verified by
# that repo's own test run, recorded in notes.md (SL-018 precedent).
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-016"

[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

[[phase]]
id        = "PHASE-01"
name      = "backend.py: fixtures, then the JSON record (corpus)"
objective = """
Give ~/satan/goad/backend.py a test harness before any behaviour change
(slice R2, design sec-3). Stdlib `unittest` only (no new dependency), run by a
`check` recipe in ~/satan/goad/justfile. Guard `main()` under
`if __name__ == "__main__"` so the module imports. Characterise today's
checklist behaviour first (slots, pending order, later/enough/yes/no, next
check), green against the unchanged code. Then switch the record to JSON
(DEC-009): `load`/`save` read and write `data/YYYY-MM-DD.json` via `json.dump`
through tmp+rename; the characterisation tests stay green. One-off conversion
of the existing `data/*.toml` files to JSON, committed as its own reviewable
commit. `README.md:16` updated to the new format.

The live goad unit runs this file on every exchange: every edit is live on
save. Land the format switch and the conversion together, in one short window.
"""
entrance_criteria = [
  { id = "EN-1", text = "SL-016 plan approved" },
  { id = "EN-2", text = "~/satan working tree state recorded in notes.md; the user's uncommitted corpus changes (goad/data/*, goad/goad.service, motd.txt) are theirs — not staged, reverted or committed by this phase without asking" },
]
exit_criteria = [
  { id = "EX-1", text = "`just check` in ~/satan/goad runs the backend tests and fails on a failure (non-zero exit proven once by a deliberately broken assertion)" },
  { id = "EX-2", text = "characterisation tests pass against the pre-change backend, then against the JSON backend, unchanged" },
  { id = "EX-3", text = "`save` is atomic (tmp + rename in the same directory); no TOML code remains" },
  { id = "EX-4", text = "every existing day file converted; a converted file loads to the same items map the TOML file did" },
  { id = "EX-5", text = "README.md describes the JSON record; committed in ~/satan" },
]
verification = [
  { id = "VT-39", expects = "characterisation: pending order, slot boundaries, later/enough/yes/no effects, next_check — identical before and after the format switch", test_file = "/home/david/satan/goad/test_backend.py", keywords = ["class Characterisation", "next_slot", "pending"], waived = true, waived_reason = "out-of-repo test (~/satan corpus); verified by ~/satan/goad `just check`, recorded in notes.md" },
  { id = "VT-40", expects = "JSON record: save→load round-trips the items map; save leaves no partial file on failure; a converted legacy TOML day loads equal", test_file = "/home/david/satan/goad/test_backend.py", keywords = ["class Record", "os.replace", "tomllib"], waived = true, waived_reason = "out-of-repo test (~/satan corpus); verified by ~/satan/goad `just check`, recorded in notes.md" },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-02"
name      = "backend.py: SATAN asks (corpus)"
objective = """
The six backend changes of design sec-3, each test-first against PHASE-01's
harness:

1. read the queue projection (default
   `$XDG_STATE_HOME/satan/goad/queue.json`, else
   `~/.local/state/satan/goad/queue.json`; `GOAD_SATAN_QUEUE` overrides, for
   tests); an absent or unreadable queue means no asks, never a crash;
2. SATAN asks come first in `pending()`;
3. `presented_at` stamped on an ask's first render (an `evaluate`, not only a
   `respond`, may now save) and never overwritten;
4. deferral provenance: `deferred_by` = `later` | `enough` beside
   `deferred_at`;
5. asks are serialised by `save` (a separate `asks` map keyed by
   `intervention_id`, so the checklist `items` map is untouched);
6. an ask's events are filed in the day file of its `emitted_at` local date,
   and `pending()` reads its state from there;

plus: entries past `expires_at` are never rendered. Option ids carry the
intervention: `yes:ask:<intervention_id>` — the existing single
`partition(":")` yields verb `yes`, item `ask:<id>`. v1 asks are yes/no with
Later and Enough, the checklist's own four buttons.

With an empty or absent queue, behaviour is byte-identical to PHASE-01 —
proven by the characterisation tests.

Also a `just goldens <dir>` recipe that drives the real backend through a
fixed script (queue an ask; evaluate; answer; Later; Enough; expire) and
writes the resulting day files and queue into `<dir>`. Run by hand into
`satan/test/goad-fixtures/` and committed in this repo, so SATAN's tests read
the producer's output, never a hand-built value (design sec-8, the ISS-014
lesson). No test writes across repos.
"""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 complete; ~/satan/goad `just check` green" },
]
exit_criteria = [
  { id = "EX-1", text = "all six changes plus expiry implemented and covered; characterisation tests still green" },
  { id = "EX-2", text = "the queue file schema (entry fields: intervention_id, question, subject, emitted_at, expires_at) is written down once, in README.md, and matches the golden queue" },
  { id = "EX-3", text = "golden fixtures committed under satan/test/goad-fixtures/ with a README naming the recipe and corpus commit that produced them" },
  { id = "EX-4", text = "committed in ~/satan; the live unit keeps serving the checklist (checked by one live evaluate)" },
]
verification = [
  { id = "VT-2", expects = "an answer to `yes:ask:<id>` is stored under asks[<id>] with value and at, and survives save→load (ASM-001's round trip, backend half)", test_file = "/home/david/satan/goad/test_backend.py", keywords = ["class Asks", "yes:ask:", "\"asks\""], waived = true, waived_reason = "out-of-repo test (~/satan corpus); verified by ~/satan/goad `just check`, recorded in notes.md" },
  { id = "VT-16", expects = "an entry past expires_at is never rendered", test_file = "/home/david/satan/goad/test_backend.py", keywords = ["expires_at"], waived = true, waived_reason = "out-of-repo test; verified by ~/satan/goad `just check`" },
  { id = "VT-22", expects = "presented_at keeps its first render's stamp across later evaluations", test_file = "/home/david/satan/goad/test_backend.py", keywords = ["presented_at"], waived = true, waived_reason = "out-of-repo test; verified by ~/satan/goad `just check`" },
  { id = "VT-26", expects = "a queued ask renders ahead of every pending checklist item", test_file = "/home/david/satan/goad/test_backend.py", keywords = ["test_ask_renders_first"], waived = true, waived_reason = "out-of-repo test; verified by ~/satan/goad `just check`" },
  { id = "VT-27", expects = "Later writes deferred_by=later on the rendered item only; Enough writes deferred_by=enough on every pending item", test_file = "/home/david/satan/goad/test_backend.py", keywords = ["deferred_by"], waived = true, waived_reason = "out-of-repo test; verified by ~/satan/goad `just check`" },
  { id = "VT-30", expects = "an ask emitted 23:15 and answered 00:05 is filed in the emit date's file and not rendered again after midnight", test_file = "/home/david/satan/goad/test_backend.py", keywords = ["test_ask_filed_under_emit_date"], waived = true, waived_reason = "out-of-repo test; verified by ~/satan/goad `just check`" },
  { id = "VT-31", expects = "emitted_at 09:30+10:00 files under that local date, whatever the process zone renders", test_file = "/home/david/satan/goad/test_backend.py", keywords = ["test_emit_date_is_local"], waived = true, waived_reason = "out-of-repo test; verified by ~/satan/goad `just check`" },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-03"
name      = "PERCEIVE: goad reader, evidence slice, canon rule"
objective = """
New `satan/satan-goad.el`: pure readers only — the local date of a parsed
instant (never a timestamp substring, design sec-2 / F-33); read the queue;
read one ask's record from its emit date's day file. Path defcustoms in
`satan-custom.el` as root joins: `satan-goad-data-dir`
(`satan-corpus-path "goad/data"`) and `satan-goad-queue-file`
(`satan-state-path "goad/queue.json"`).

`satan-memory-evidence-assemble-with-bounds` gains a compact `:goad` slice:
each outstanding queue entry with its record, read by the entry's emit date,
ignoring the assembler's time bounds (design sec-2, F-23). New canon rule
`goad.outstanding` emits `app:goad` plus `topic:<slug>` per outstanding
ask, where `<slug>` is `satan-goad-subject-topic` of the ask's subject: one
function, reusing `satan-memory-canon--slugify`, so the handle always passes
the cue regex (raw values carry `/` and `~`) and PHASE-06's goad-minted check
computes the same token. Bounded by construction: only open asks, each
within a 60-minute window (ISS-001). The perceive leg stays pure (ADR-001).
"""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 complete; golden fixtures in satan/test/goad-fixtures/" },
  { id = "EN-2", text = "`just check` green with SATAN_DB_HOST set, and the ran/skipped counts recorded (green-is-not-green)" },
]
exit_criteria = [
  { id = "EX-1", text = "satan-goad.el readers covered against the golden fixtures, not hand-built plists" },
  { id = "EX-2", text = "the :goad slice appears in the evidence window only when the queue has entries; absent or malformed files yield an empty slice, never a signal" },
  { id = "EX-3", text = "the canon rule's handles pass `satan-motive--cue-handles-well-formed-p` and fall in the admitted namespaces" },
  { id = "EX-4", text = "lint clean; `just check` green with counts recorded" },
]
verification = [
  { id = "VT-24", expects = "under a GMT-rendered ts and a +10:00 local zone, an ask emitted 09:30 local resolves to its local date and reads that day's file", test_file = "satan/test/satan-goad-test.el", keywords = ["satan-goad-local-date", "satan-goad/local-date"] },
  { id = "VT-25", expects = "a run after midnight perceives an ask answered before midnight as answered, reading the emit date's file", test_file = "satan/test/satan-goad-test.el", keywords = ["satan-goad/after-midnight-reads-emit-date"] },
  { id = "VT-32", expects = "assembling evidence with a goad queue writes nothing: every file-writing and DB function is an ert-fail spy", test_file = "satan/test/satan-memory-evidence-test.el", keywords = ["goad", "ert-fail"] },
  { id = "VT-33", expects = "the goad.outstanding rule emits app:goad and one topic: per outstanding ask, well-formed and admitted even for a subject value with / and ~; nothing when the queue is empty", test_file = "satan/test/satan-memory-canon-test.el", keywords = ["goad.outstanding", "app:goad", "satan-goad-subject-topic"] },
]
specs        = []
requirements = []

