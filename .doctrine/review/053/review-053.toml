[[finding]]
id = "F-16"
status = "answered"
severity = "major"
title = "Design-record divergences owed at reconcile: validation order, unbounded `maxima`, budget-0 inversion, pending→settled status divergence, `switch` mapping, `final` with no answer"
detail = """
Six divergences between the locked design record (design sec-1/2/4/5) and the implementation, raised by the reviews as "design tensions, not defects". Each is a decision owed at reconcile (a REV/QUE entry that settles the prose), not a code defect; they are grouped here as one ledger row so the list is not lost, and each bullet names its own site. Grouped for the ledger, not collapsed.

- Validation order (R1, design tension 1). Expected: design sec-2's "Validation order (fail closed, first failure wins)" puts policy at step 1. Observed: the start-up snapshot refusal (pi/mcp/server.ts:263-269) and `readToolCall`'s `request-invalid` (pi/mcp/server.ts:276-277) both precede `admitCall`'s policy read at pi/mcp/server.ts:280, so two refusal tokens can be emitted ahead of the design's first failure. The deviation is justified in a comment at pi/mcp/server.ts:147-152 but absent from DEC-103 and from the plan.

- Unbounded `maxima` (R2, design tension 1). Expected: design sec-1 "Absent or malformed refuses everything: a delegate with no ceiling is unbounded spend". Observed: `REQUIRED_FIELDS` requires only that the key is present (pi/mcp/policy.ts:100, :196-198), and the maxima loop accepts any subset of `MAXIMA_FIELDS` (pi/mcp/policy.ts:210-223), so `maxima: {}` — or any maxima without `wall_clock_s` — satisfies the schema and grants an unbounded delegate with no hard backstop. A negative maximum is likewise accepted, and turns every call into an instant `ceiling` abort.

- Budget-0 inversion (R2, design tension 2). Expected: a `transcript_budget_bytes` maximum bounds the transcript. Observed: `0` or a negative value is accepted by the policy (pi/mcp/policy.ts:248-262) and then read as "no ceiling" by `transcriptBudget` (`policyMax > 0 ? policyMax : undefined`, pi/mcp/result.ts:338), inverting the clause: a maximum of 0 means unbounded rather than none.

- `pending`→settled status divergence (R2, design tension 5). Expected: design sec-5 — a `message_end` carrying `pending` is "malformed rather than merely unfinished: it is counted as a request and the run reports `incomplete` with `termination: "eof"`", and `status.state` and `state` diverge only for out-of-stream causes. Observed: the reducer's stream verdict is `settled ? 'completed' : 'incomplete'` regardless of the terminal reason (`pi/reduce/reduce.ts:246-250`), so a settled stream whose last assistant message ended `pending` yields `status.state: "completed"` with `result: null`. The call-level verdict is right — `result.ts` derives `eof` — only the stream verdict diverges, and it needs a settled-after-pending stream to be seen.

- `switch` mapping (R1, design tension 3). Expected: design sec-5 "Precedence among concurrent causes is order of discovery, and a later cause is never hidden behind an earlier one". Observed: `gate.fire` hands only the cause to `config.abort` (pi/mcp/gate.ts:126-130), `AbortController.abort()` on an already-aborted signal emits no second event, and spawn keeps the first trigger and returns (`pi/mcp/spawn.ts:365-366`), so a `switch`/`timeout` crossing during a cancellation's grace is recorded nowhere — the audit says `cancelled` while the operator's kill switch also fired. State impact is nil (`switch` → `cancelled` at pi/mcp/result.ts:80, `cancelled` → `cancelled`); the loss is audit fidelity against sec-5's rule.

- `final: true` with no answer (R3, design tension 1). Expected: design sec-5 defines `final` by terminal reason + settled + exit 0, and withdraws `result` on a non-completed run. Observed: a textless terminal `stop` message completes with `final: true` and `result: null`, because `final` is derived from the state alone (`const final = state === 'completed'`, pi/mcp/result.ts:259, with `result: final ? reduced.result : null` at :268) and the case is codified by test at pi/mcp/result.test.ts:467. This is the letter of the contract; whether "final" should mean "an answer exists" is a design question the implementation inherits rather than answers.

Suggestion: settle each in the design record at reconcile (the six are the right size for one REV or a QUE entry per item, as DEC-093's existing list of reconcile corrections does), and let the implementation follow the settled prose — except the `switch`-cause loss, which is cheap to fix in code either way (append an abort record per trigger, or record the extra cause).
"""
disposition = "design-wrong"
route = "refresh"
response = """
Six design-record divergences, none a code defect, all owed at reconcile (the QUE-007 class). Each is recorded here so the reconciled truth can settle it once:

1. Validation order. `request-invalid` and the start-up profile-snapshot check run before design sec-2's step 1 (policy), so two refusal tokens can disagree with "first failure wins".
