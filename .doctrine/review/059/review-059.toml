[[finding]]
id = "F-5"
status = "verified"
severity = "minor"
title = "Conformance registry: expected a source-delta row for every completed phase; observed none for PHASE-04"
detail = """
Expected: each completed phase has a boundary row, so that `slice conformance 31` is complete.
Observed: "conformance incomplete — completed phase PHASE-04 has no recorded source-delta row". PHASE-04 went to completed without entering in_progress (`started = ""`; harvest § Learned records it). Its work was entirely in quotient, so satan has no code delta for it. Recording `--start == --end` would be a no-op row that conformance reads as covered (memory footgun mem_01a0d7f2…).
"""
disposition = "tolerated"
response = """
PHASE-04 touched no satan source: its whole delta is in quotient, which satan's registry cannot attribute. A `--start == --end` row would falsely read as covered, which is a known footgun. The full satan range, `conformance 31 --against d203626^..HEAD`, is the substitute evidence: 0 undelivered, and no undeclared code path after F-4. The process slip (completed without entering in_progress) is already recorded in harvest § Learned.
"""

