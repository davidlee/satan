slug = "goad-ask-autonomous-in-v1-via-tick-pulse"
title = "v1 includes the autonomous producer: tick-pulse gains a goad-ask capability, with a goad-specific emission window"
record_kind = "decision"
status = "proposed"
created = "2026-09-21"
updated = "2026-09-23"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "The RFC-016 D3 keystone is that disengagement becomes perceptible and consequential, which requires SATAN to ask unprompted and notice when it is ignored. The slice scoped D1 as a blocker: motd and morning fail at turn 0 on an expired API key (ISS-012), leaving tick-pulse as the only unattended mode that completes. Research delta 9 then reported that tick-pulse holds neither notify nor inbox-write, making the autonomous path dead on arrival."
choice = "v1 includes the autonomous producer driven by tick-pulse. Add a distinct goad-ask capability to the satan-tick-register defaults rather than reusing notify, and gate it additionally on a satan-goad-enabled defcustom. Constrain when the doorbell may ring with a GOAD-SPECIFIC emission window — not by restoring the global satan-tick-quiet-hours, which suppresses the entire tick before mode selection and would silence overnight observer processing, memory work and inbox work that this slice has no business touching (RV-007 F-15)."
alternatives = ["v1 interactive-only, autonomous producer deferred behind ISS-012 — but a keystone demonstrated while the keeper is already present is not the keystone", "Fix ISS-012 and use motd or morning as the producer — blocks design on an ops task and adds nothing tick-pulse lacks", "Reuse the existing notify capability for the doorbell — cheaper, but it collapses the kill switch: disabling goad would disable all notification, and enabling notification would enable goad"]
rationale = """Research delta 9 is false. tick-pulse is registered by (satan-tick-register "pulse") at satan/satan-tick.el:95 and takes the defaults at :60-88, whose :capabilities are (notify inbox-write memory-write motive-write). Delta 9 cited satan/satan-mode.el:146-154, which is self-edit-mech's spec, not tick-pulse's. So tick-pulse is already a human-facing mode with notify and inbox-write, and the autonomous path was never blocked. It also carries motive-write with motive_read and motive_replace in its tool list, which is what makes the inq-1 correlation check performable in the same mode that emits the ask. A distinct capability rather than reuse follows SPEC-001 REQ-005/010: the kill switch has to be able to stop asking without stopping notifying."""
consequences = ["satan-tick-quiet-hours is currently nil — 'was (22 . 7); disabled while iterating' (satan/satan-tick.el:24) — so the tick fires every ~30 minutes around the clock. Shipping a doorbell into that means SATAN can ring at 3am. For a slice whose thesis is the attention economy this inverts the point, so restoring a quiet window is in scope, not a follow-up.", "tick-pulse's budget is tight by design: 100000 tokens, 10 tool calls, 60s timeout, :auto-apply 'owned. The ask and the doorbell must fit inside a tool-call budget shared with everything else the tick does.", "The tick pool is weighted ((tick-pulse . 5) (tick-agent . 3)), so tick-pulse runs roughly five times in eight. Ask frequency is governed by the pool and the ceiling, not by the tool.", "ISS-012 stays open and stops blocking this slice. It still means motd and morning cannot be the producer.", "Adding a capability to the satan-tick-register defaults grants it to tick-agent as well, since tick-agent overrides :capabilities explicitly — confirm at plan time which tick modes should hold it."]
decided_by = "user (design review, SL-016 design run dr-01a0c179)"
decided_on = "2026-09-21"

