rationale = "One proven pattern across repos; the gateway carries no provider keys (apiKeys = [] is enforced at eval). claude gets the gateway only to suppress the default op run; it signs in by OAuth."
consequences = ["ISS-029 criteria 3-4 close for S.", "The launcher hint prints the jail name as the alias (cosmetic; flakes backlog)."]
