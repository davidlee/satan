  { id = "EX-3", text = "convert_toml_days.py removed; committed in ~/satan by explicit path; one live evaluate still serves the checklist" },
]
verification = [
  { id = "VT-45", expects = "an ask with a form renders its options (opt:<option>:ask:<id>) and fields; answering one stores {option, values} with the host's values verbatim under asks[<id>], presented_at intact", test_file = "/home/david/satan/goad/test_backend.py", keywords = ["opt:", "\"values\"", "presented_at"], waived = true, waived_reason = "out-of-repo test (~/satan corpus); verified by ~/satan/goad `just check`, recorded in notes.md" },
  { id = "VT-46", expects = "an ask with no form renders Yes / No as opt:yes / opt:no and stores the same {option, values} shape", test_file = "/home/david/satan/goad/test_backend.py", keywords = ["test_default_form"], waived = true, waived_reason = "out-of-repo test; verified by ~/satan/goad `just check`" },
