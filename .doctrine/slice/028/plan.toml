[[phase]]
id        = "PHASE-04"
name      = "Emacs start/stop, attach wait, malebolge docs"
objective = "Design §4.2 and the malebolge part of §4.6: attach() connects through a bounded retry (200 ms, up to 10 s, on ENOENT/ECONNREFUSED; other errors fail at once); malebolge.el gains malebolge-unit, malebolge--systemctl, malebolge-start (soft satan-mcp-start under condition-case on error) and malebolge-stop; README.md and docs/internals.md describe the unit start path, per-input tool refresh and the instance lock."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-03 complete." },
]
exit_criteria = [
  { id = "EX-1", text = "attach retries ENOENT and ECONNREFUSED up to its bound, then fails with the last error; any other connect error fails at once (design VT-12)." },
  { id = "EX-2", text = "malebolge.el: malebolge-start calls satan-mcp-start only when fboundp, catches any `error` from it with a message naming the cause and continues; runs systemctl --user start malebolge-room and signals user-error with exit status and journalctl hint on failure; then malebolge-attach. malebolge-stop runs systemctl --user stop. No (require 'satan-mcp)." },
  { id = "EX-3", text = "malebolge.el byte-compiles with no warnings (declare-function present)." },
  { id = "EX-4", text = "README.md launch section and docs/internals.md (start path, tool list refreshed per input and reconnect, instance lock) match design §4.6; no mention of hello-durable as the launch path." },
  { id = "EX-5", text = "`just check` green." },
]
verification = [
  { id = "VT-1", expects = "attach retry bound and error classes", test_file = "/home/david/dev/malebolge/test/attach.test.ts", keywords = ["ECONNREFUSED", "ENOENT", "retry"], waived = false },
  { id = "VT-2", expects = "malebolge.el defines start/stop with the soft dependency", test_file = "/home/david/dev/malebolge/emacs/malebolge.el", keywords = ["defun malebolge-start", "defun malebolge-stop", "declare-function satan-mcp-start", "condition-case"], waived = false },
  { id = "VA-1", expects = "emacs --batch byte-compile of emacs/malebolge.el reports no warnings; with satan-mcp-start stubbed to signal `error` and systemctl stubbed, malebolge-start messages and still reaches attach (design VA-4)." },
]
