[[finding]]
id = "F-8"
status = "verified"
severity = "major"
title = "After a failed replacement, the recovery connect is not announced: no refresh on reconnect"
detail = "Raised by the orchestrator reviewing C7 (recorded under the raiser role). src/reconnecting-client.ts record()/get(): satan-mcp restarts; a call while it is down hits the replacement branch, the replacement fails and record() clears current. When satan-mcp is back, the next get() begins a FRESH attempt (current undefined), which is never announced — onReconnect does not fire and the tool list stays the pre-restart set for the rest of the turn. a810ddc announced this path. Violates EX-6 (lost and recovered during a turn: the reconnect refreshes). Fix: announce any successful connect once the handle has had a connected client before (first-ever connect excluded), not only a direct replacement."
disposition = "fix-now"
response = "Fixed in malebolge 902c20d: loss-driven announcement — a drop the handle did not cause sets 'lost'; the next successful connect (direct replacement or a fresh attempt after a failed one) announces and fires onReconnect; own reset/close never arm it (worker's refinement of the orchestrator's 'any connect after the first' rule, which caused an unbounded announce->read chain on a wedged server). Test 'announces the connection that recovers satan-mcp after a lost client' (red on ae41194)."

