[[finding]]
id = "F-7"
status = "verified"
severity = "minor"
title = "§4.4, §7 R6: a socket’s existence does not prove gateway reachability."
detail = """
Reviewer: GPT (gpt-6-sol), adversarial pass 2026-10-20.

7. **F-7 — minor — §4.4, §7 R6: a socket’s existence does not prove gateway reachability.**  
   **Claim:** checking `MALEBOLGE_GATEWAY_SOCKET` on disk refuses startup when the gateway is unreachable ([design.md](/home/david/dev/satan/.doctrine/slice/027/design.md:448)). **Verified:** the specified check is path presence, while the in-jail forwarder may accept local connections and then fail its Unix-socket connection (flakes handback, §“What `jailed-malebolge` must do”). **Inference:** a stale socket, permission failure, or listener failure after the check still produces the opaque failure R6 aims to avoid. **Repair:** call this a *missing-socket* check, or perform a bounded connect/readiness probe and handle later gateway loss separately.

**Sound on source inspection:** R2’s configured room home avoids requiring `info().home` while the room is down ([connection.ts](/home/david/.local/src/pi/packages/env/src/connection.ts:36)); R3’s error rewording is viable because `RemoteError` takes a fields object and pi-env copies its message into file and execution errors ([connection.ts](/home/david/.local/src/pi/packages/env/src/connection.ts:21), [errors.ts](/home/david/.local/src/pi/packages/env/src/errors.ts:9), [remote-env.ts](/home/david/.local/src/pi/packages/env/src/remote-env.ts:928)). The per-call environment hook and lazy retry claims match the inspected code ([harness.ts](/home/david/.local/src/pi/packages/durable/src/harness/harness.ts:255), [connection.ts](/home/david/.local/src/pi/packages/env/src/connection.ts:268)). R4’s persona split, R5’s attach default, R7’s named settings, and T4’s separation of room files from host roots are coherent as proposals; the blockers above prevent treating the design as closed. No build, deployment, or live jail probe was run in this read-only review."""
disposition = "fix-now"
response = "Agreed: presence is not reachability. Renamed to a missing-socket check with message 'gateway socket missing'; later failures surface as the provider's connection error (§4.4, §6, §7 R6)."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Agreed: presence is not reachability. Renamed to a missing-socket check with message 'gateway socket missing'; later failures surface as the provider's connection error (§4.4, §6, §7 R6)."

[[finding.turn]]
act = "verify"
role = "raiser"
note = "GPT verify pass 2026-10-20: verified — §4.4, §6, §7 consistently describe a missing-socket check; later connection failures are left to the provider."

