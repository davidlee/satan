[facet]                         # every field typed; seeded empty (captured later)
context = "ISS-041: the producer sends base_ref HEAD and the Go clone rejects it. Contract validation in both elisp and a daemon would be dual enforcement (REQ-009). The 0005 states assume a worktree model and cross-process claim; accepted_external and stale have no writer."
choice = "base_ref must name a branch of the real repo; the runner validates at submit (check-ref-format --branch and ref exists) and rejects otherwise; when omitted, the repo pin's default branch applies; the runner records base_oid at refresh and reviewed_oid at collection. States: queued → preparing → running ⇄ waiting_room → collecting ⇄ pending_collection → needs_review → promoted | rejected; any non-terminal → cancelled or failed(reason); a job is terminal only on a known collection outcome. claimed, preparing_worktree, accepted_external and stale are dropped. The runner is the authoritative validator of every RPC (full schema); the Emacs tool argument schema is only the model-facing gate (ledger row 1). The per-job policy is runner config; the ADR-018 D2 policy artifact does not exist yet and the runner restates nothing from it."
alternatives = ["Producer resolves base_ref", "Keep the 0005 state set"]
rationale = "One validator, one owner; the room model needs refresh and pause states, not worktree or claim states."
consequences = ["Producer default HEAD removed", "Store is runner-local SQLite (DEC-052)"]
