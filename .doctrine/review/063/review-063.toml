Expected: design sec-5 sketch `tasksExtension(deps)` registering `wakeSchedule(deps)` etc.; sec-13 tools read the harness and conversations from the late-bound deps; sec-3 is silent on what a sweep/ensure failure does to start.
Observed (phase-sheet decisions):
- Signatures: `wakeSchedule(deps, task)` (PHASE-06 D1), `tasksExtension(deps, task?)` (PHASE-07 D2), `sweepBlockedWakes(deps, read, ctx)` (PHASE-07 D1), `DaemonParts.tasks` + `profile` (D3), `SessionOptions.setTimer` (PHASE-05 D2), `StartDeps.environment?/now?` test seams (PHASE-07 D4), shared helpers `liveWakes`/`createWakeTask`/`reportFailure` (D5), `durationOf` → src/duration.ts (PHASE-05 D6).
- Behaviour: `wake_schedule` resolves a topic through the index (`readIndex(api)`, shared `isKnownTopic`), not `deps.conversations` (whose `open` would create a topic); a known topic with no conversation is refused (PHASE-06 D2). `wake_cancel` refuses terminal wakes too and answers `cancelled` only on exactly `{fired:false}` (PHASE-06 D4). A sweep or ensure failure fails daemon start, closing the session first (PHASE-07 D7 + review M1).
All within the design's intent; the text should match before close.
"""
