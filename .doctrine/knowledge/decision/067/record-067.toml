[facet]                         # every field typed; seeded empty (captured later)
context = "SL-024: personaExtension re-reads corpus files per request so edits land next turn. Skill paths are nix store paths."
choice = "Read and parse every skill in daemon-main.ts at startup; the extension receives the parsed skills and renders a constant."
alternatives = ["Re-read per request, as persona does"]
rationale = "Store paths are immutable and change only on a rebuild, which restarts the daemon; per-request reads would re-read identical bytes and repeat skip warnings every turn."
consequences = ["Editing a non-store skill directory needs a daemon restart"]
