[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "Expected the door bind to survive a room stop/restart; observed a ro-bind of the per-room dir, which is the relay's RuntimeDirectory"
detail = """flake.nix `(readonly "/run/capsule-room/assistant")`, inherited from design §4.6. oubliette host/services.nix:357 sets RuntimeDirectory = dirOf socket (removed on stop); host/room-client.nix:19-23,46 binds the door ROOT for exactly this reason (DEC-056), making the root at boot (services.nix:812 tmpfiles). Failures: (a) jail start with the room stopped fails in bwrap (ro-bind source missing), before the daemon's graceful degrade; (b) after a relay restart the jail holds the old unlinked dir, so every call stays `room unavailable` until the daemon restarts — contradicting §4.4/README "next call tries again". Design-level: the locked sketch names this path."""
disposition = "design-wrong"
response = 'User chose "Root + state dir" (2026-10-20). satan 91a7fc0 binds ro /run/capsule-room and /var/lib/capsule/room/assistant (oubliette DEC-056 pattern), replacing the per-room door dir and the known_hosts file binds; probes updated first (red), then binds (green). Design §4.6/§6 erratum in notes.md for reconcile.'

