summary = "Sl-L-016 PHASE-09 worker: batch-byte-compile to disk shadows edited .el with stale .elc"
detail = "The worker byte-compiled during its red/green cycle; Emacs then loaded the .elc instead of the freshly edited .el, so a fixed test still looked broken until the .elc files were removed. just check never byte-compiles. Do not compile to disk mid-cycle; the paren checker plus a test run suffice."

