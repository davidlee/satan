[[phase]]
id        = "PHASE-04"
name      = "The daemon's environment in the room"
objective = "Design §4.3–§4.5 (DEC-079, DEC-080, DEC-081): openSession takes the env hook (SessionOptions.env); src/daemon-env.ts builds host (NodeExecutionEnv, node reader) or room (one lazy DaemonConnection via directLaunch, tool path through ObservedConnection with the daemon's reword, RemoteExecutionEnv id pi-env:daemon-room, cwd state.cwd ?? home); readContext reads project context from the home through roomSourceReader over roomShell on the bare DaemonConnection; ObservedConnection gains reword; grep's spawn_error text becomes neutral; daemon-main checks the gateway socket, wires daemonEnv, closes it on stop, logs the profile. docs/internals.md and README.md updated."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-03 complete." },
]
exit_criteria = [
  { id = "EX-1", text = "session.ts no longer imports NodeExecutionEnv; daemonEnv is the one place a profile becomes an environment. Room: one connection reused across calls, launched with directLaunch (argv has no `session`); cwd = home; close() closes it." },
  { id = "EX-2", text = "Fault wording at the seam (§4.4): lost with no trust failure → `room unavailable: <msg>`; lost with trustFailure() set → `room host key untrusted: <msg>`, never unavailable, logged every time; any other failure → pi-env's message unchanged; without reword the error is rethrown unchanged (the runner's case). One bash and one grep call through a lost connection each return a tool error and the session takes the next call." },
  { id = "EX-3", text = "RV-035 F-4 (control): readContext through a real DaemonConnection whose start fails host-key checking (fake DaemonHelpers) logs `room host key untrusted` and never `room unavailable`. The test is run first against the incorrect candidate — the startup read through a nested ObservedConnection — and observed to fail before the correct wiring (bare DaemonConnection to roomShell) makes it pass. The rule `ObservedConnection always wraps a DaemonConnection directly` is stated in the code where both are built." },
  { id = "EX-4", text = "Startup context (DEC-080): read from the home only, every exec carrying FETCH_LIMITS / HEAD_LIMITS; ChannelUnavailable and ChannelFailed host_key → [] and a log line, daemon continues; cwd section reads the room home." },
  { id = "EX-5", text = "Missing MALEBOLGE_GATEWAY_SOCKET path → startup refused with `gateway socket missing: <path> (llm-gateway client listener)`. grep's spawn_error reads `rg could not run: <message>`." },
  { id = "EX-6", text = "docs/internals.md and README.md describe the room tier, profiles, door file, socket paths. `just check` green; structure.test.ts green (daemon-env.ts outside the runner's allowlist)." },
]
verification = [
  { id = "VT-1", expects = "host → NodeExecutionEnv at launch dir; room → RemoteExecutionEnv cwd=home over one reused connection, directLaunch argv asserted", test_file = "/home/david/dev/malebolge/test/daemon-env.test.ts", keywords = ["daemonEnv", "directLaunch", "RemoteExecutionEnv", "pi-env:daemon-room"], waived = false },
  { id = "VT-2", expects = "reword: unavailable vs host key untrusted vs passthrough; bash and grep through a lost connection return tool errors and the session continues", test_file = "/home/david/dev/malebolge/test/daemon-env.test.ts", keywords = ["room unavailable", "room host key untrusted", "reword"], waived = false },
  { id = "VT-3", expects = "RV-035 F-4: readContext over a real DaemonConnection failing host-key start logs untrusted, never unavailable; fake RoomShell: home-only reads with limits, ChannelUnavailable → []", test_file = "/home/david/dev/malebolge/test/daemon-env.test.ts", keywords = ["readContext", "HostKeyFailure", "FETCH_LIMITS", "HEAD_LIMITS"], waived = false },
