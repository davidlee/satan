question    = "When the room is stopped mid-job (routine before probes, oubliette DEC-031), does the runner pause the job until the room is back, or let the model keep issuing tool calls that fail with connection errors?"
why_matters = "EVD-005: an interrupted pi-env call reaches the model as an ordinary tool error and the model recovered; but while the room stays down every call fails (spawn_error), burning turns and budget. Bears on ceilings (REQ-004), job state (a paused state in patch_jobs?) and whether the runner needs room-liveness awareness."
