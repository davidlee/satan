schema = "doctrine.knowledge"
version = 1

id = 16
slug = "pre-spawn-uses-run-tool-ctx"
title = "Pre-spawn sensor alerts use the run's own tool-ctx; the synthetic builder is deleted"
record_kind = "decision"
status = "accepted"
created = "2026-09-23"
updated = "2026-09-23"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "ISS-016. satan-sensor-alerts--make-tool-ctx (satan-sensor-alerts.el:297) builds a synthetic ctx that has no :audit, no :percept-handles, and a non-run id (pre-spawn-<mode>). satan-intervention--ctx-required therefore rejects every pre-spawn alert (221 dispatch_failed on disk), and the cooldown never arms. The live audit handle is already in scope at the call site (satan-broker.el:612-636)."
choice = "Every tool-ctx plist is built in satan-run.el (DEC-001). satan-broker--spawn creates the satan-run struct immediately after satan-audit-open. Each later rebind of prepare (observer; enrich; pre_spawn) setfs the struct's prepare slot. The observer and the pre-spawn sensor alerts both receive (satan-run-tool-ctx run-ctx); satan-sensor-alerts--make-tool-ctx and satan-observer--ctx-from-run-ctx are deleted. The identical manual-mark and atsatan builders merge into satan-run-manual-tool-ctx (run-id audit now). satan-intervention--ctx-required is unchanged. Amended 2026-09-23 per RV-009 F-4/F-9: the struct placement lets a pre-child spawn error finalize the run; five builders were found where two were assumed."
alternatives = ["Split satan-run-tool-ctx into a pure by-inputs constructor. That gives one list with two entry points, and pre-spawn stays a special hand-assembling caller.", "Relax :audit for pre-spawn. That makes two contracts (REQ-009), leaves alerts unrecorded (REQ-003), and keeps ids that do not join to a run."]
rationale = "Pre-spawn is part of the run it precedes, so it should see that run's context. One constructor (DEC-001: satan-run.el owns tool-ctx) and one contract (REQ-009). Record-before-emit becomes possible on this surface (REQ-003, REQ-011)."
consequences = ["Pre-spawn interventions mint as <run-id>.ivNNN and carry percept_handles, so the observer can correlate them.", "mode-name loses its /pre-spawn suffix. No consumer reads it (rg, 2026-09-23).", "The --spawn let* is reordered. prepare rebinds after struct creation must keep the struct's slot in sync.", "Tests that stub satan-intervention-create in the sensor-alert suites can no longer mask ISS-016 and must exercise the real create."]
decided_by = "user (keeper)"
decided_on = "2026-09-23"

