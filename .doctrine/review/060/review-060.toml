[[finding]]
id = "F-6"
status = "verified"
severity = "minor"
title = "The verification matrix has false positives for reentry, generic responses and observer attribution"
detail = """
Expected: V1-V13 must discriminate the invariant violations they claim to exercise. Observed: .doctrine/slice/032/design.md:325-327 says V5-V7 exercise nested dispatch on the same connection, but V5 has one tools/call plus a sentinel, V6 one tools/call plus a cancellation notification, and V7 an MCP call plus a broker-context memory tool (290-299). None nests two tools/call handlers on one MCP session.

Concrete incorrect candidate: use a boolean busy flag rather than the specified in-flight count. It passes V5, V6 and V9's single-call/double-close scenarios, V7's broker nesting, and V1's distinct sessions. With outer call A and nested call B on the SAME session, close during B and B's unwind can clear busy and finalise while A is still running. Thus the nested-depth part of I3, and simultaneous-response correlation under I2, have no discriminating row. Add a controlled two-call same-session schedule, observe depth two then one then zero, and assert no finalisation at depth one plus separate exactly-once responses when the transport stays live.

Other uncovered clauses: I2's generic uncaught-error response has no row; V4 tests only a mint-specific failure, so handling that error locally while omitting the proposed handle-message guard still passes it. I5 has tool-dispatch and nil-manual assertions in V7, but no observer write: satan/satan-observer.el:112-129,291-329,428-435 threads that production path via opts. An implementation that migrates the two tool writers and drops observer trace_marked entirely still passes every listed attribution assertion. Add an observer positive verdict during a differently attributed MCP wait and assert that its trace_marked is emitted with the observer's broker run id.

Coverage assessment: every named invariant has at least one nominal row (I1 V3; I2 V3/V4/V6; I3 V5/V9; I4 V1/V5; I5 V1/V7). None is wholly unmentioned. The defects are missing discriminating branches, not a claim that the matrix literally contains no tests for an entire invariant. I4's abnormal-unwind hole and V12's fresh-entry refresh false positive are separately evidenced in F-2 and F-3. This finding requests concrete negative controls rather than another restatement of the invariants."""
disposition = "fix-now"
response = "Accepted: V5-V7 do not nest two tools/call on one session, no row covers the generic -32603 guard, and no row covers observer attribution. Added rows: same-session nesting (depth 2->1->0, no finalise at depth 1, both responses exactly once when live; rejects a boolean busy flag); a generic uncaught handler error answers -32603 (not mint-specific); an observer positive verdict during a differently attributed MCP wait emits trace_marked with the broker run id. sec-91's claim about V5-V7 corrected."

