[facet]                         # every field typed; seeded empty (captured later)
context = "Room assistant is not enabled at boot; the daemon builds an env per tool call; EVD-009: exec erases the lost type, only the connection seam keeps it."
choice = "At startup, a room that cannot be reached means no project context section, logged; the daemon starts. The daemon never starts the room (capsule assistant start is the operator's). Per call, a lost connection reads 'room unavailable' and a host-key failure reads 'room host key untrusted' (logged), never conflated; both observed at the connection seam and injected into tools: the injection is the daemon's reword at the connection seam, covering all five coding tools, and grep's own text stops naming a cause it cannot know (amended 2026-10-20, design R3; grep is not taught about rooms)."
alternatives = ["Block startup until the room is up", "Start the room from the daemon"]
rationale = "Interactive use stays available; trust failures stay visible (malebolge RFC-001 §4 EX-5)."
consequences = ["VT: grep and tool error mapping under lost and untrusted starts"]
