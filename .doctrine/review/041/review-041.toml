id = "F-1"
status = "verified"
severity = "minor"
title = "get() dereferences an undefined current after a concurrent reset/close"
detail = "src/satan-tools.ts:111-127 (a810ddc): a caller suspended at 'await attempt.opening' resumes after reset()/discard() set current=undefined; the 'current === attempt' guard is false, and 'return current.opening' throws TypeError (tsc misses it: narrowing survives the closure mutation). Reproduced by the reviewer 3/3: concurrent SATAN tool call on a stalled connect + a timed-out refresh -> call rejects 'Cannot read properties of undefined (reading opening)'. Fix: return (current ??= begin()).opening after the replacement branch."
disposition = "fix-now"
response = "Fixed in malebolge 9b3b570: current ??= begin() before get()'s final return; test 'starts a fresh attempt for a caller whose attempt was discarded' (red on a810ddc with the TypeError). C6 additionally makes close() terminal so the fall-forward applies to reset() only."

