[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = """Expected the "an `ObservedConnection` always wraps a `DaemonConnection` directly" rule to be stated/enforced at both seam-construction sites; observed it only on `observedEnv`'s doc, while `roomShell` takes any `Connection`"""
detail = """
Source: jailed-pi-research pass, verified by the raiser against 1c42811.

`src/room/shell.ts:210-213`:

```ts
210| export function roomShell(
211|   connection: Connection,
212|   { id, cwd }: { id: string; cwd: string },
213| ): RoomShell {
```

and `src/room/connection.ts:152-158` silently classifies a non-`DaemonConnection` inner as downtime:

```ts
152| const trust = this.#inner instanceof DaemonConnection ? this.#inner.trustFailure() : undefined;
153| if (trust === undefined) {
154|   await this.#observer.lost(failure, error);
155|   return "unavailable";
```

The rule lives in `observedEnv`'s doc (`connection.ts:170-176`) and as a call-site comment (`daemon-env.ts:131-132`). `roomShell` is the *other* place that builds the seam (via `observedEnv`), and has two production callers in the runner (`src/runner/run.ts:352`, `src/runner/collect.ts:178`); a future caller passing an already-observed connection reproduces exactly RV-035 F-4 (a host-key refusal worded "room unavailable"). Today's control test only covers the current wiring. Suggested fix: document the requirement on `roomShell`, and add a cheap guard in `observedEnv` (`if (connection instanceof ObservedConnection) throw …`) — both production sites funnel through it, and the existing fixtures (`FailingConnection`, `localConnection`, `RebuiltRoom`) are not `ObservedConnection`s, so no test breaks.
"""
disposition = "fix-now"
response = "Fixed in 368f625: observedEnv throws when given an ObservedConnection (both production seams go through it); roomShell's doc states the rule. Test: test/room/connection.test.ts 'an observed env refuses a nested wrapper'."

