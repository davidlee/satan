[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "Heartbeat replacement loses restart safety after committing the old task's abort mark"
detail = """
Expected: W5 (design.md:69-70) and DEC-131 ensure exactly one viable heartbeat after every start. Observed: design.md:356-362 aborts a blocked heartbeat, excludes it only in that invocation's local collection, and creates its replacement later. A stop/crash after the durable abort mark and before replacement leaves an abortRequested task. On the next start that task is ready or running its abort handler, rather than blocked, so ensure counts it as the heartbeat and creates nothing. Its abort handler then commits terminal {fired:false} (design.md:111), leaving zero heartbeats for the whole daemon lifetime.

VERIFIED source: pi-durable src/harness/scheduler.ts:558-584 commits the abort mark and joins only an active run, not the abort handler; docs/spec.md:1021-1028 explicitly says abortTask does not await terminal settlement. scheduler.ts:1667-1679 reports an active abort invocation as running. There is no abortRequested exclusion in the design's survivor predicate.

VERIFIED reproduction with installed 1.4.0: create a recurring background task on a paused in-memory harness; abortTask; close/reopen the same storage (representing the persisted mark before replacement); resume and hold its abort handler at a barrier. Inspection returned [{state:{kind:running},abortRequested:true,input:{recurring:true}}]. Apply the design's survivor test: one survives, so no replacement. Release the handler: live heartbeat count becomes 0. The barrier makes a valid scheduling window deterministic; no wake implementation exists yet.

Repair: define viable survivors to exclude durable cancellation intent and make replacement restart-idempotent across the abort/create boundary; account for abortTask returning before terminal settlement. Add a restart test at this boundary and verify the surviving heartbeat can fire, rather than merely counting live recurring records."""
disposition = "fix-now"
response = """
Accepted. Candidates exclude record.abortRequested, so a restart between abort and create yields a replacement. DEC-131 amended; design Heartbeat (abort/create boundary) + Verification (restart at the boundary, survivor fires).

Route added 2026-10-28: review. Repaired in prose in this design review; the finding predates route tagging.
"""
