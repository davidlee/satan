[[finding]]
id = "F-1"
status = "answered"
severity = "major"
title = "Expected §4.2 per-directory stat with dir as cwd; observed one stat -L per dir from the clone root over absolute paths (D-1)"
detail = """
malebolge src/runner/project-context.ts:174-187. Two execs as designed, never opens a file, but the cwd/path shape differs. Rationale (PHASE-03 notes D-1): a per-directory cwd fails to start when `.pi/` is absent, which the design classifies `missing` and so degrades every ordinary job. User decision pending; design §4.2 must be amended to match.
"""
disposition = "design-wrong"
response = """
Verified at project-context.ts:174-187. The code is the better mechanism: same exec count, never opens a file, and no false `missing` for repos without `.pi/`. Reconcile amends design §4.2 (Reconciliation Brief, per-slice). Subject to the user's ruling at /reconcile; if they reject it, this reopens as code work.
"""

