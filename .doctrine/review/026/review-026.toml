[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "channel_timeout kill leaves the capsule process tree running; retries race in the quarantine"
detail = "design.md:397,642-643,1087 say that on expiry 'the verb is killed', treated as exit 75 and retried. :1353 plans this as an 'exec.ts timeout option'. malebolge src/runner/exec.ts uses execFile, and Node's timeout signals only the direct child. The tree is capsule (room branch execs capsule-room-git, bash) -> git push/fetch -> ssh -> socat (oubliette SL-006 sec-4/sec-5). Killing the top process orphans the git fetch, which can still update refs/capsule/<room>/heads/job/<id> in the bare quarantine. Scenario: the guest is slow, collect times out, and the job goes to pending_collection. reachable() then succeeds and a second collect fetches into the same repo while the orphan holds the ref lock. git fails 'cannot lock ref', exit 1, ChannelFailed, so a good job ends class error. A push orphan likewise races the retried push. Fix: spawn the verb in its own process group, kill the group (-pid), await exit before retrying, and say so in §5.2. §9:1218 'a stub that never exits' should also spawn a grandchild that keeps running."
disposition = "fix-now"
response = "Fixed: each channel verb in its own process group, TERM→KILL the group and await exit before retry. Demonstrated by the §9 grandchild-stub timeout test (PHASE-15)."
route = "demonstrate"

