[[phase]]
id        = "PHASE-07"
name      = "The gate: enforcement, ceilings, switch and policy re-read"
objective = "Design sec-4's gate, in pi/mcp/gate.ts: one reader over the child's stream maintaining the single accumulator from PHASE-01; every record that increments a unit is a tick, and an idle poll bounded to about a second is a tick, so a blocking result never delays cancellation. A tick evaluates the clamped ceilings (requests, tokens, cost), the wall-clock backstop, the switch (the policy file re-read and re-parsed — absent, unreadable or malformed aborts through the ladder with cause `switch`, because a switch whose source cannot be read is not evidence that it is off), and usage sanity. Retrospective, not admission: a crossing aborts the run."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-06 complete and green." },
]
exit_criteria = [
  { id = "EX-1", text = "A ceiling crossing on requests, tokens or cost aborts through the ladder, reports `state: ceiling_exceeded`, and the abort record carries the accumulator's usage at the crossing (design sec-4)." },
  { id = "EX-2", text = "Enforcement and reporting cannot disagree: the returned status is produced by the same accumulator the gate consults, pinned by a recorded retry/compaction fixture whose arithmetic the test asserts (RV-043 F-6)." },
  { id = "EX-3", text = "Switch: flipping `enabled` to false during an in-flight run aborts it through the ladder with cause `switch`, with no driver cooperation and no child left behind." },
  { id = "EX-4", text = "Policy loss fails closed: deleting the policy, and separately corrupting it, during an idle run aborts through the ladder with cause `switch`, performs cleanup and audit, and leaves later calls refused `policy-unavailable` / `policy-invalid` (RV-046 F-2). The run's clamped ceilings are the ones snapshotted at admission: a maximum lowered mid-run does not reach it, because the tick re-parses the policy for the switch and the maxima in the same read — the snapshot is what the run is judged against (design sec-1)." },
  { id = "EX-5", text = "Usage sanity: a completed response whose usage is absent, non-finite or negative, or whose `cost.total` is absent, aborts `accounting_unknown`; a cached read priced at zero does not abort." },
  { id = "EX-6", text = "The wall-clock backstop aborts with cause `timeout` and its own state row; a run that hits no limit completes without an abort record." },
  { id = "EX-7", text = "Accounting scope is disclosed, not overclaimed: a stub gateway or nested process invoked from the child's bash is not attributed to the run and is not reported as attributed — the returned status describes this run's own sends only, and the test asserts the absence of the nested figure rather than a zero (RV-046 F-4)." },
  { id = "EX-8", text = "`node --test pi/mcp/*.test.ts` green, offline, driven by recorded event fixtures." },
]
verification = [
  { id = "VT-1", expects = "ceiling crossing aborts per unit; abort record carries usage", test_file = "pi/mcp/gate.test.ts", keywords = ["ceiling", "abort"], waived = false },
  { id = "VT-2", expects = "gate inputs equal the returned status on the retry/compaction fixture", test_file = "pi/mcp/gate.test.ts", keywords = ["requests_unmeasured", "ceiling"], waived = false },
  { id = "VT-3", expects = "switch flip halts an in-flight run with cause switch", test_file = "pi/mcp/gate.test.ts", keywords = ["switch", "ladder"], waived = false },
  { id = "VT-4", expects = "policy deleted and policy corrupted during an idle run: fail-closed abort, later refusals", test_file = "pi/mcp/gate.test.ts", keywords = ["policy-unavailable", "policy-invalid"], waived = false },
  { id = "VT-5", expects = "usage sanity aborts accounting_unknown; zero-priced cached read does not; wall clock aborts timeout", test_file = "pi/mcp/gate.test.ts", keywords = ["accounting_unknown", "timeout"], waived = false },
  { id = "VT-6", expects = "nested spend is not attributed and not claimed", test_file = "pi/mcp/gate.test.ts", keywords = ["nested", "attributed"], waived = false },
  { id = "VT-7", expects = "the gate and the tick live in gate.ts", test_file = "pi/mcp/gate.ts", keywords = ["tick", "ceiling"], waived = false },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-08"
name      = "The result: state, causes, precedence, conformance"
objective = "Design sec-5, in pi/mcp/result.ts: the state/cause semantics over the `pi-agent-result/1` envelope landed in PHASE-02 — the DEC-093 table with pi's stop reasons verbatim, the abort latch and the commit point, the success predicate, the refusal semantics, the soft transcript budget wired from the call's `transcript_budget_bytes` through the policy clamp, and the artefacts map. `termination` is always `causes[0]`, `causes` carries the whole ordered list, and every enum member is either reachable or declared unreachable."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-07 complete and green." },
]
exit_criteria = [
  { id = "EX-1", text = "Success requires all of: an answer-bearing terminal message (stop or length), `agent_settled` observed, child exit status 0, and known accounting. The three settlement combinations — stop+EOF without settled, stop+nonzero exit, settled+nonzero exit — are each non-success, and exit 0 is never taken as evidence of success (design sec-5)." },
  { id = "EX-2", text = "The latch defeats provisional success: a cause recorded before the commit point (after ladder, reap, drain, final accounting and the exit/abort appends) decides the state, so no ordering reports `completed` while accounting or audit failed; concurrent causes return the full ordered list with `termination = causes[0]` (e.g. timeout then audit → termination `timeout`, causes `[timeout, audit]`)." },
  { id = "EX-3", text = "The refusal semantics (the envelope itself lands in PHASE-02): `refused` carries status, artifacts and result null, `session` null because nothing was minted, and `refusal {reason, detail}`; termination is `refused` and causes `[refused]`; `request-invalid`, `audit-failed` and `audit-unavailable` are valid refusal reasons; the `audit_failed` state exists only for a run that spawned." },
  { id = "EX-4", text = "Vocabulary conformance: `termination` and `causes` are one enum with `timeout` as the cause token and no `backstop` token; every mapped outcome satisfies the advertised result schema, so a cause token outside the enum fails the suite rather than the reader (RV-046 F-6)." },
  { id = "EX-5", text = "`status.state` judges the stream and `state` judges the call; they diverge only when the deciding cause arose outside the stream (`exit`, `spawn`, `audit`, `accounting`, `timeout`) and `causes` names it — never two accounting stories." },
  { id = "EX-6", text = "The transcript is budgeted and the budget is soft: the call's `transcript_budget_bytes`, clamped by the policy's maximum, is what reaches the reducer's budget (never passed through unclamped and never ignored), mandatory sections can exceed it by design and by test, `truncated` reports it, and `artifacts.transcript` names the unbudgeted text; status is embedded verbatim from the reducer." },
  { id = "EX-7", text = "`node --test pi/mcp/*.test.ts` green, offline." },
  { id = "EX-8", text = "`final` is derived in exactly one place — here, where exit status and accounting are known — from the stream-side inputs the reducer supplies; no other module computes or overrides it." },
  { id = "EX-9", text = "Every member of `state` and `termination` is either produced by a named path in this build or explicitly recorded as unreachable in it, asserted by a table test over the enum — an unreachable state is a stated hole rather than a silent one, which is the class RV-043 F-12 raised. `cancelled` and `ceiling_exceeded` are produced by PHASE-06 EX-10 and PHASE-07 EX-1 respectively." },
]
verification = [
  { id = "VT-1", expects = "success predicate: every settlement combination, answer-bearing reasons only", test_file = "pi/mcp/result.test.ts", keywords = ["agent_settled", "final", "exit"], waived = false },
  { id = "VT-2", expects = "latch and precedence: cause before commit point, concurrent causes with the full list", test_file = "pi/mcp/result.test.ts", keywords = ["causes", "latch", "commit"], waived = false },
  { id = "VT-3", expects = "refusal shape and the audit-failed refusal", test_file = "pi/mcp/result.test.ts", keywords = ["refused", "audit-failed"], waived = false },
  { id = "VT-4", expects = "every mapped outcome satisfies the result schema; no backstop token; timeout is the cause token", test_file = "pi/mcp/result.test.ts", keywords = ["pi-agent-result/1", "timeout", "backstop"], waived = false },
  { id = "VT-5", expects = "soft transcript budget wire through the policy clamp, artifacts paths, verbatim status", test_file = "pi/mcp/result.test.ts", keywords = ["budget", "artifacts", "truncated"], waived = false },
  { id = "VT-6", expects = "the result shape and precedence table live in result.ts", test_file = "pi/mcp/result.ts", keywords = ["pi-agent-result/1", "causes"], waived = false },
  { id = "VT-7", expects = "enum reachability: every state and termination member is produced by a named path or declared unreachable", test_file = "pi/mcp/result.test.ts", keywords = ["unreachable", "ceiling_exceeded"], waived = false },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-09"
name      = "Wrapped forms, test hook, one live smoke"
objective = "Design sec-3's per-call forms, sec-7's verification loop and the delivery list: flake.nix gains the two per-call wrapped forms (read: --ro-bind the launch dir; write: --bind) built on the shared jail generator, each consuming its single positional — the active session directory — as a run-time bind source, with `~/.pi`, a tmpfs /tmp, plus `jailProbes` entries asserting each form's actual bind set equals root + active session directory + `child_binds` — the check that closes the loop where the server cannot see. Then the blocker's execution proof: a hostile bash against the run's audit under the real form. One live per-call smoke run against deepseek-flash through the form, recorded as evidence in the slice notes, not as a gate."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-08 complete and green." },
]
exit_criteria = [
  { id = "EX-1", text = "flake.nix declares the two per-call wrapped forms, one per filesystem capability, with the executable baked in and arguments forwarded: the form consumes its single positional (the active session directory) and passes everything after it to pi (no executable word, no `--`) (RV-043 F-7)." },
  { id = "EX-2", text = "Each form binds the launch directory `--ro-bind` for read and `--bind` for write, `~/.pi`, a tmpfs /tmp, and only the active session directory (a run-time path, not the session home and never the run directory) (design sec-3 per-call mode)." },
  { id = "EX-3", text = "A flake check asserts each form's actual bind set equals root + active session directory + the policy's `child_binds`; adding or dropping a bind fails the check rather than moving it (RV-043 F-1, the loop-closing half)." },
  { id = "EX-4", text = "`just check` is green and covers the pi suites through the hook added in PHASE-02, which stays runnable without the test-database gate." },
  { id = "EX-5", text = "One live per-call smoke run against deepseek-flash succeeds end to end: policy, profile, wrapped form, gate, result; the returned result, status and run directory are recorded in the slice notes as evidence, and the run is not a gate." },
  { id = "EX-6", text = "`just check` green, and no member of pi/mcp *outside its test files* authors a bwrap token (`--ro-bind`, `--bind`, `--tmpfs`, `bwrap`) — the scan excludes `pi/mcp/*.test.ts`, which must spell those tokens to assert their absence from the server's own output (design sec-3; SPEC-001 REQ-009)." },
  { id = "EX-7", text = "The hostile fixture runs through the real wrapped form, where the confinement exists: a child bash attempting truncate, unlink or replace of the run's audit from inside the call either cannot reach the path or the run reports a fail-closed `audit_failed` with evidence intact — never a clean success. This is RV-043 F-1's execution proof, and it is why the fixture cannot live in PHASE-06 where a stub launcher has no jail to prove anything about." },
]
verification = [
  { id = "VT-1", expects = "the two per-call forms and their bind sets in the flake", test_file = "flake.nix", keywords = ["pi-mcp", "child_binds"], waived = false },
  { id = "VT-2", expects = "the offline pi suite hook", test_file = "justfile", keywords = ["pi/mcp"], waived = false },
  { id = "VA-1", expects = "the flake's bind-set check passes on the real forms and fails when a bind is added or dropped (agent-run `nix` check, result recorded)." },
  { id = "VA-2", expects = "one live per-call smoke run against deepseek-flash through the wrapped form with the gateway environment forwarded — the provider key is invalid outside the jail, so a bare host run would not prove the form works — recorded in .doctrine/slice/029/notes.md with its result, status and run-directory path." },
  { id = "VA-3", expects = "the hostile truncation/unlink/replace fixture under the real wrapped form (EX-7): a real jail is required, so this is agent-run on the host (or human-run if no jail is available), and the outcome is recorded with the evidence listing." },
]
