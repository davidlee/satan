title = "A throwing registry.install escapes refresh; reconnect refresh is fire-and-forget"
detail = "Raised by the orchestrator from the C4 worker's question (recorded under the raiser role). defineExtension/registry.install rejects e.g. duplicate tool names from satan-mcp; read() does not catch it, so refresh rejects. Via onReconnect ('() => void refresh()') that is an unhandled rejection (Node exits); via PHASE-03 beforeInput it would fail the input. Design §4.3: refresh installs tools: [] on any failure and never throws. Fix: treat an install failure as a failure (install empty, log once)."
