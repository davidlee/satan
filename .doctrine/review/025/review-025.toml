disposition = "fix-now"
route = "review"
response = "Contest accepted. Rather than a second lookup by requestId, the waiting_room recovery rule is widened: past the warning threshold with no placed warning on record (no receipt, or a receipt whose record has no entry), the resume message carries the warning text. The only cost is one repeated advisory when a warning was placed just before the crash, which is tolerated. Paragraph, recovery row and a test for the crash window updated."

