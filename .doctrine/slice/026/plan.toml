# Implementation plan for SL-026 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
#
# Code paths are in ~/dev/malebolge unless prefixed (satan/, satan-corpus/).
# VT test_file paths outside this repo are absolute (SL-023's convention);
# verify-vt fails them until the phase creates the file.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-026"

[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

[[phase]]
id        = "PHASE-01"
name      = "Shared project-context module"
objective = "The pure source pipeline both agents share (design §4.1, §4.6): truncate.ts, xml.ts (escapeXml moved from skills.ts), project-context.ts — names, SourceReader, capSource, readChainDir, readSources, renderProjectContext, gitRootDirs, nodeSourceReader, projectContextExtension."
entrance_criteria = [
  { id = "EN-1", text = "Design locked (run dr-01a152b2, rev 44); malebolge `just check` green at the phase's base commit." },
]
exit_criteria = [
  { id = "EX-1", text = "Render order APPEND_SYSTEM → extra → chain (outermost first); first regular-file name per directory wins; 64 KiB cap on a character boundary with marker; leading BOM stripped; no sources → undefined; attribute values escaped." },
  { id = "EX-2", text = "nodeSourceReader picks by fs.stat isFile and never opens a FIFO (AGENTS.md or .pi/APPEND_SYSTEM.md); gitRootDirs stops at .git (dir or file), [cwd] when none." },
  { id = "EX-3", text = "skills.ts imports escapeXml from xml.ts; no second escaper. `just check` green." },
]
verification = [
  { id = "VT-1", expects = "source pipeline over a fake SourceReader: order, pick, cap + marker, BOM, empty, escaping", test_file = "/home/david/dev/malebolge/test/project-context.test.ts", keywords = ["readSources", "readChainDir", "renderProjectContext", "capSource", "SOURCE_CAP_BYTES"], waived = false },
  { id = "VT-2", expects = "temp dirs: gitRootDirs bounds; symlinked AGENTS.md read; FIFO named AGENTS.md and .pi/APPEND_SYSTEM.md skipped without opening (fails by timeout if opened)", test_file = "/home/david/dev/malebolge/test/project-context.test.ts", keywords = ["gitRootDirs", "nodeSourceReader", "mkfifo"], waived = false },
  { id = "VT-3", expects = "capUtf8 cuts on a character boundary; truncateLine", test_file = "/home/david/dev/malebolge/test/truncate.test.ts", keywords = ["capUtf8", "truncateLine"], waived = false },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-02"
name      = "Room shell limits; existing preparing execs bounded"
objective = "RoomShell gains optional ShellLimits (maxStdoutBytes → overflowed, maxStderrBytes, timeoutS) with the caller's abort always rethrown (design §4.2); checkRoomClone and ensureJobBranch pass PREPARE_LIMITS; cleanRoomClone passes none."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 complete." },
]
exit_criteria = [
  { id = "EX-1", text = "Over-cap stdout stops the process and returns the head with overflowed; stderr capped while streaming; timeout → ChannelFailed with cause timeout; caller abort → rethrown, never overflowed; callers without limits behave as before." },
  { id = "EX-2", text = "checkRoomClone and ensureJobBranch pass PREPARE_LIMITS (60 s, 64 KiB stdout, 4 KiB stderr); a git status overflow is dirty_clone; a timeout fails preparing; cleanRoomClone unchanged." },
  { id = "EX-3", text = "`just check` green." },
]
verification = [
  { id = "VT-1", expects = "over localConnection: overflow head + overflowed; stderr cap; timeout cause; a process blocked on a FIFO read stopped by the timeout; caller abort rethrown", test_file = "/home/david/dev/malebolge/test/runner/shell.test.ts", keywords = ["ShellLimits", "overflowed", "maxStdoutBytes", "timeoutS", "mkfifo"], waived = false },
  { id = "VT-2", expects = "fake RoomShell: preparing execs carry PREPARE_LIMITS, cleanRoomClone none; status overflow → dirty_clone; timeout fails preparing", test_file = "/home/david/dev/malebolge/test/runner/prepare.test.ts", keywords = ["PREPARE_LIMITS"], waived = false },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-03"
name      = "Runner fetch: room SourceReader, doctrine step, classification"
objective = "src/runner/project-context.ts fetchProjectContext (design §4.2-4.3): room SourceReader (stat -L, head -c) with fetch limits; doctrine step (test -d, check-ignore, prompt resolve with 60 s / 64 KiB+1 / 4 KiB, checkClone re-check → PrepareFailed dirty_clone); the ordered error classification; degradations as data. readyRoom takes a FinalStep<T> and returns { baseOid, value }."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 complete." },
]
exit_criteria = [
  { id = "EX-1", text = "Every §4.2 classification row behaves as specified, caller abort tested before the table (ChannelFailed cause aborted rethrown); ChannelUnavailable incl. a spawn_error cause is retried by readyRoom." },
  { id = "EX-2", text = "Doctrine: absent, non-zero, timeout, not ignored, empty → degradation and the job continues; dirty or failed re-check → PrepareFailed dirty_clone with no clean called; overflow → truncated source." },
  { id = "EX-3", text = "RV-033 F-1 probe criterion holds: with hostile head/stat/test/git (ignore args, lie, print unrequested names, stream without end, never exit) and FIFO/device context files (direct or via symlink into an ignored path), the fetch completes, degrades or fails within the sum of per-exec timeouts; per-exec host memory within its caps; only requested names kept from stat; with an honest stat a FIFO is never opened." },
  { id = "EX-4", text = "`just check` green." },
]
verification = [
  { id = "VT-1", expects = "fake RoomShell: argv + limits per exec, every classification row, doctrine outcomes, re-check → dirty_clone, no clean, unrequested stat names ignored", test_file = "/home/david/dev/malebolge/test/runner/project-context.test.ts", keywords = ["fetchProjectContext", "boot_not_ignored", "dirty_clone", "spawn_error", "aborted"], waived = false },
  { id = "VT-2", expects = "F-1 probe over localConnection: real FIFOs and fake endless / lying binaries first on PATH; bounded time and memory, outcome within the sum of per-exec timeouts", test_file = "/home/david/dev/malebolge/test/runner/project-context-probe.test.ts", keywords = ["fetchProjectContext", "mkfifo", "PATH"], waived = false },
  { id = "VT-3", expects = "readyRoom with a FinalStep: value returned; a ChannelUnavailable inside the step retried and its data discarded", test_file = "/home/david/dev/malebolge/test/runner/prepare.test.ts", keywords = ["FinalStep"], waived = false },
]
specs        = []
requirements = []

