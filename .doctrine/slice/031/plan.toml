objective = "Add src/config.ts: one pure resolver over env and launch dir that owns every location (DEC-112, design sec-3 Resolution). Rename PI_MCP_* to QUOTIENT_*. Route request-boundary refusals and admission through the same resolved run dir."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 exit criteria met." },
]
exit_criteria = [
  { id = "EX-1", text = "resolveLocations(env, launchDir) returns the design sec-3 Locations type, and is pure: no I/O, no process.env read." },
  { id = "EX-2", text = "Lookup per the design sec-3 table. The policy is never resolved from the launch dir. Only an unset QUOTIENT_* var falls through; a set but empty or relative value is policy-unavailable. A relative XDG_* is ignored. No usable HOME or XDG gives policy-unavailable." },
  { id = "EX-3", text = "QUOTIENT_POLICY, QUOTIENT_RUN_DIR and QUOTIENT_SESSION_HOME replace the PI_MCP_* vars. The child-env scrub prefix is QUOTIENT_. No PI_MCP_ string remains in src/." },
  { id = "EX-4", text = "knownRunDir is removed. The request-boundary refusals (profile-invalid, request-invalid) and admission all record to resolveLocations(...).runDir (design sec-3; RV-058 F-4)." },
]
verification = [
  { id = "VT-1", expects = "config: env beats XDG; unset falls through; set-but-relative refuses; the policy is never read from the launch dir even when .quotient/policy.json exists; a relative XDG_* is ignored; no usable HOME/XDG gives policy-unavailable", test_file = "/home/david/dev/quotient/src/config.test.ts", keywords = ["resolveLocations", "QUOTIENT_POLICY", "XDG_CONFIG_HOME", "policy-unavailable", ".quotient/policy.json"], waived = false },
  { id = "VT-2", expects = "with every QUOTIENT_* unset, a malformed request and an invalid policy are each recorded in the XDG run dir's attempts.jsonl", test_file = "/home/david/dev/quotient/src/server/server.test.ts", keywords = ["attempts.jsonl", "XDG_STATE_HOME", "request-invalid"], waived = false },
]
