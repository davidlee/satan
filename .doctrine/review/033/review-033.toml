[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "grep buffers room output on the host without bound"
detail = "rg --json emits the whole matching line and ignores --max-columns (verified: 10 KB line gives same output with --max-columns 500; each submatch is listed too). The design's line splitter carry is unbounded, match/context text is truncated to 500 chars only at format time, limit is model-chosen, and the 50 KB cap applies only to the final string. Scenario: a 1 GB single-line file in the clone plus grep x makes the runner node process hold gigabytes; OOM takes every job with it. The daemon is exposed on the host the same way. Repair: truncate text at parse; bound the carry (past N MiB discard to newline, flag truncated); abort like the match limit once rendered output reaches 50 KB; clamp limit; VT with a multi-MB single line asserting bounded memory and output, and large limit x long lines."
disposition = "fix-now"
route = "probe"
response = "Verified: rg --json ignores --max-columns. Repaired in sec-4.5 and sec-6: splitter carry capped at 1 MiB with discard-to-newline and a results-too-large notice; match and context text truncated at parse; malformed JSON lines skipped; stderr capped at 4 KiB as it streams; abort at limit or 50 KB rendered output, both success; limit clamped 1..1000, context 0..20; the same bounds in daemon and runner. Probe adversary: must hold against arbitrary file content in the search path (multi-GB single lines, binary data, very many short matches, many submatches per line) and a hostile rg on PATH emitting unbounded or malformed JSON on stdout or unbounded stderr; need not hold against the host filesystem itself being exhausted. Criterion: peak host memory held by the tool is bounded by MAX_MESSAGE_BYTES plus 50 KB output plus 4 KiB stderr plus a constant, and the result is at most 50 KB. Host phase constraint: the grep phase includes faux-env VT streaming a multi-MB single line, limit 1000 by long lines, and multi-MB stderr, asserting the splitter carry never exceeds the cap (negative control: a splitter without the cap must fail it)."

