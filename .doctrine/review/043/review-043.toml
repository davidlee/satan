[[finding]]
id = "F-9"
status = "answered"
severity = "major"
title = "The termination ladder has no process-group creation and ownership contract"
detail = "Expected: sec-4/DEC-096's SIGTERM then SIGKILL ladder targets all of one call's work and cannot signal the MCP server or a different concurrent call. Observed: sec-4 always signals 'the child's process group' but never states how that group is created or identified. The cited jail generator includes no-new-session in baseJailOptions (/workspace/flakes/agents/jailed-agents.nix:183-186). A normal Node spawn inherits the parent's process group; neither a child PID nor a wrapper's existence establishes a new group. Killing minus-child-PID can therefore find no such group, while killing the inherited group can kill the server and other calls. 'Never detached' also leaves ambiguous whether group/session isolation is forbidden or only lifetime decoupling is forbidden. Required correction: explicitly own a per-call termination domain/group, establish it before execution, define wrapper/timeout PID transitions and waiting/reaping/stream-drain completion, and distinguish group creation from fire-and-forget detachment. Verification: two simultaneous calls plus a grandchild ignoring SIGTERM; cancel one and assert its subtree is gone after the grace, the other call and server remain alive, and results/session-lock release occur only after cleanup."
disposition = "fix-now"
route = "demonstrate"
response = "Accepted. Every call owns a termination domain: the child is spawned as a process-group leader (detached/setsid) so the ladder signals -pid and can never reach the server or a concurrent call, with reaping and stream drain completing before the result and before the session lock is released. 'Never detached' is restated as lifetime coupling - which is what it meant - not session isolation."

