[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = 'Design §4.2 refuses "*" as a list member only for allowed_paths; code refuses it for repos too'
detail = """
Expected (design §4.2 config-refusal bullets): `"*"` as a list member is refused for `allowed_paths` ("as a path it would name a file called `*`").
Observed: M `src/runner/config.ts` `readScope` refuses a `"*"` member for both keys (`repos` and `allowed_paths`). plan.toml PHASE-01 EX-1 lists `"*" as a list member` without naming the key; the PHASE-01 planner (A1) and the orchestrator chose the general reading — it also stops a repo literally named `*` from turning `repos = ["*"]` into a valid scope.
The code is the better rule; the design under-states it.
"""
disposition = "design-wrong"
response = """
The code's general rule is right: a "*" list member is a mistaken unbounded marker on either axis, and refusing it on `repos` keeps a repo literally named `*` from widening a scope. Reconcile: design.md §4.2 refusal bullets say the "*" member rule applies to both keys (Reconciliation Brief, per-slice).
"""

[[finding.turn]]
