[facet]                         # every field typed; seeded empty (captured later)
context = "DEC-100: never a bare agent on the host by fallback. Non-nix users need some form in v1."
choice = "The unconfined form exists only where the policy names it (`forms.<cap> = { unconfined: <abs pi> }`). A policy that serves `read` unconfined is policy-invalid. README and `quotient help setup` state what it voids: no read-only guarantee, no reach limit beyond pi's cwd."
alternatives = ["advisory read marked in status"]
rationale = "Read-only without a jail is an unenforced claim; refusing keeps the word `read` meaning enforced."
