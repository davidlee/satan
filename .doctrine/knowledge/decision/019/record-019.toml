id = 19
slug = "harness-class-is-failed-run-reason"
title = "Harness error class becomes the failed run's recorded reason"
record_kind = "decision"
status = "accepted"
created = "2026-09-23"
updated = "2026-09-23"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = 'The harness classifies provider errors (classify_error, runloop.py:115) and JSON-encodes the class inside the error string (runloop.py:201-208). satan-broker--on-error (satan-broker.el:166) records the error and drops the class. A run with no final gets final.json {"status":"invalid"}, and its announce reason is the literal "failed". IMP-005 (partial). SL-018 needs the auth class, durably recorded, to evict stale credentials.'
choice = "classify_error (runloop.py) classifies by the exception's HTTP status_code first: 401 is auth; 402 is credits; 429 is rate_limit; 5xx is server. 403 is not auth, because OpenRouter answers 403 for moderation-flagged input; a 403 reads as auth only when its text names an auth failure, and otherwise as unknown. It falls back to word-boundary matching. satan-broker--on-error parses the class out of the harness error payload into a new satan-run slot, failure-reason. First write wins, and an unclassified error gives unknown. A pre-child spawn error sets it to spawn_failed (or, before the audit exists, the no-child writer records spawn_failed directly). For a run with no final, finalize synthesises final.json {status invalid, reason FAILURE-REASON}. crash-context carries :failure_reason. satan-broker--failure-reason prefers the final reason, then failure-reason, then the status name. Amended 2026-09-23 per RV-009 F-4/F-5: runloop.py now changes, so deploy needs a push, a flake lock bump and a home-switch. Amended 2026-09-23 per RV-010 F-6: 403 no longer maps to auth; 402 maps to credits."
alternatives = ["Leave runloop.py unchanged: substring matching gives false auth (critical pops and SL-018 evicting a good key).", "Broker re-checks the detail: a second classifier.", "Record the class only in the crash-context event: the streak walk and SL-018 would have to scan transcript.jsonl."]
rationale = "A single field, final.json reason, carries the outcome for DEC-014's walk, DEC-015's auth override, the announce line, and SL-018's eviction. It is transport only, with no typed exception layer (IMP-005 remainder)."
consequences = ["Outcomes read failed/auth and failed/rate_limit and so on", "Init failures read failed/unknown until SL-018 removes the missing-key path", "final.json for a failed run without a final gains a reason key", "satan-audit-p consumers of final.json are checked at execution", "A1 holds only for provider 401 errors and auth-worded messages", "SL-018 must not evict a key on credits or on a moderation 403"]
decided_by = "user (keeper)"
decided_on = "2026-09-23"

