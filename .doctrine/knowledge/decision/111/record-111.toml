[facet]                         # every field typed; seeded empty (captured later)
context = "pi-mcp ships two bins (bin/pi-mcp, bin/pi-run-reduce); the reducer self-executes via an import.meta.main guard (pi/reduce/cli.ts:119)."
choice = "One bin `quotient`: bare serves MCP on stdio (one-line stderr note when stdin is a TTY); `quotient reduce` keeps pi-run-reduce's argv and exit codes 0/1/2; `quotient help [section]`; `--version`; unknown verb prints usage, exit 2. The reducer exports main(argv) instead of self-executing. reduce.ts is not a published library API in v1."
alternatives = ["Two bins quotient + quotient-reduce", "Export reduce() as library API"]
rationale = "A second bin would share the quotient-<capability> form namespace; a subcommand leaves room for later verbs. Exporting a library API is a permanent commitment with no current consumer."
