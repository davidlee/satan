[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "EX-10 should catch door-parser use spreading via imports; withoutSpecifiers hides it"
detail = '''
Expected: EX-10 (test/runner/room.test.ts, plan PHASE-02 EX-5) keeps door knowledge confined to its owners.
Observed: `withoutSpecifiers` (room.test.ts:621) strips every `from "…"` specifier before DOOR_WORDS/KIND_WORDS run. The room/door.ts identifiers (readRoomDoor, RoomDoor, ROOM_DOOR_KEYS, roomConnectionOf) never match `\bdoor` (camelCase gives no word boundary) and KIND_WORDS was narrowed to `(slot|room)DoorConfig`, so `RoomDoor` no longer trips it. Reviewer verified: `import { readRoomDoor, type RoomDoor } from "../room/door.ts"; const d: RoomDoor = readRoomDoor(f, h);` → DOOR=false, KIND=false. The structure test lets every runner module import room/*. Also `switch (kind) { case "room": }` evades KIND_WORDS.
Today only runner/config.ts and runner/door.ts import room/door.ts (grep), so nothing is leaking yet.
Failure scenario: prepare.ts (or the PHASE-03 daemon) starts parsing the door via readRoomDoor; EX-10 stays green.
Fix: structure-test edge rule — only runner/config.ts, runner/door.ts (and from PHASE-03 the daemon's config.ts) may import room/door.ts; add a `case "slot"|"room"` arm to KIND_WORDS with a control.
'''
disposition = "fix-now"
response = """
malebolge b4616fc. test/structure.test.ts: ROOM_DOOR_READERS (runner/config.ts, runner/door.ts) are the only modules that may import room/door.ts; control test rejects runner/prepare.ts and room/shell.ts importing it. KIND_WORDS gains a `case "slot"|"room"` arm with two controls. withoutSpecifiers kept: importing runner/door.ts's API is not door knowledge; the import edge is the structure test's job. PHASE-03's daemon config.ts must join ROOM_DOOR_READERS (notes § Design errata).
"""

