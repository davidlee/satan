[[finding]]
id = "F-5"
status = "answered"
severity = "major"
title = "agent_settled plus any stop reason does not establish that result is a final answer"
detail = "Expected: sec-5's new final flag distinguishes a completed answer from partial or stale assistant text, without losing parts of the final response. Observed: final=true is defined by agent_settled 'with a stop reason'. Pi's documented stopReason union includes error, aborted, length, toolUse and deferred as well as stop; settled means automatic work ended, not that a successful answer exists. The current reducer selects the last prose block anywhere in the run (pi/reduce/reduce.ts:158-166), not the entire final assistant message. Read-only synthetic fixtures verified: (1) error+agent_settled yields failed with partial prose, yet satisfies the proposed final predicate; (2) a toolUse message saying 'I will inspect it', followed by a textless stop message and agent_settled, yields completed with that old planning prose as Result; (3) a final assistant message with two text blocks exposes only the second block in Result. Sec-7 promises only adding Reduced.result/final, so exporting the current selection preserves the defect. Required correction: define accepted terminal reasons, tie result/final to the terminal assistant message rather than a backwards search for prose, preserve all of that message's text blocks, and account for server-caused termination. Test error/abort/length/deferred outcomes, a textless terminal message after earlier prose, and multiple final text blocks."
disposition = "fix-now"
route = "review"
response = "Accepted. final and result derive from the terminal assistant message - the last assistant message_end with a recognised terminal stopReason and no later assistant message - joining all of its text blocks. error, aborted, toolUse, deferred and every server-caused stop yield final=false. The reducer gains result, final and terminalReason, with tests for error+settled, a textless terminal message, multiple terminal blocks, and stale planning prose."

