[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "Expected the corpus to say `since` is state age, not focus duration (design §2); observed it implied focus duration"
detail = """~/satan-corpus/tools/activity_read.md:26-27 (c07ead9): "`since` is when that state began, so it says how long they have been on it". Design §2 (lines 157-158): `:since` is when the full state, title included, was last set — "It is *not* 'focused since'". A title change moves `since`, so the model would misread it as focus duration."""
disposition = "fix-now"
response = "Fixed in ~/satan-corpus 25bc25f: `since` is when that exact state (title included) was last set, not how long the app has been focused; a title change resets it; an old `since` is not stale."

