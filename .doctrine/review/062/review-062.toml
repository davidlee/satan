title = "wake_cancel can answer already fired while terminating the only bounded-wait monitor for a queued input"
detail = """
Expected: the new Fire composition contract (design.md:355-367,413-423; DEC-134) withdraws and reports every wake input still queued after one ceiling, including when a foreground run failed under keep. Reporting already fired must not silently discard the wake's only responsibility for reaching that outcome. W9's no-false-cancelled-answer guarantee must continue to hold.

Observed: Tools (:299-314) still says a sleeping inspection causes harness.abortTask(id), then reports from the task's settled result. The explicitly supported timer-first race (:308-311) lets the task reach submit before that abort. The Wake task abort handler (:132-136) then commits terminal completed {fired:true}; this correctly preserves W9, but it destroys the submit invocation that owns the newly added bound. No handler or replacement takes responsibility for the already-admitted submission. If its foreground run fails, the queued wake now has neither a live bound nor a failure-reporting continuation. The same issue applies to a prepared sleeping occurrence after a submit-host-defer (:145-154): wake_cancel aborts its monitor and answers already fired. This is a new interaction with the F-11 repair, not a request to undo F-3/F-9/F-10 or to classify an admitted input as successfully cancelled.

VERIFIED source: pi-durable harness/scheduler.ts:558-584 abort-marks and joins the run invocation, with abort settlement handled separately; the design's handler makes that task terminal. harness/harness.ts:491-518 binds submission wait/abort operations to the invocation lifetime; ending the invocation leaves the admitted input durable. harness/submissions.ts:130-143 withdraws only when Submission.abort is actually called; abortTask does not call it. generation.ts:404-427 under afterFailedRun:keep leaves queued inputs in place. The source's endRun in live.ts:138-145 settles the failed run's own inputs, not the later queued wake.

VERIFIED in-memory reproduction against malebolge's installed pi-durable 1.4.0, using the authored fire/submit shape, corrected checkpoint-reading abort handler and new submission.wait/timeout/Submission.abort rule: created a sleeping one-shot; retained the sleeping inspect result (until 1100); advanced to its deadline; let it checkpoint submit and queue wake:10:0 behind a foreground run; failed that run; performed the cancel recipe's abortTask and waitForTask. Task result was terminal completed {fired:true}, corresponding to cancelled:false/already fired. Then released the controlled ceiling trigger. The input was still queued, model call count stayed 1, and no withdrawal or failure-report event occurred. A later control input to the original target released it to done (3 calls), demonstrating that the durable input remained executable. A separate normal-path control withdrew the input and reported failure, confirming this result comes from aborting its monitor rather than a broken test bound. Notifications were in-memory hooks; no external message was sent.

INFERENCE: absent later input/write to the target, the task remains terminal while its input stays queued indefinitely. Thus the original silent-stranding failure class remains reachable specifically through the documented cancel/timer race; a mere already-fired answer does not preserve the new bounded-wait contract. Listing only sleeping live tasks also hides this orphaned submission.

Repair: retain or explicitly transfer withdrawal/reporting responsibility whenever wake_cancel discovers, or races with, a potentially admitted occurrence. Do not merely change its answer, and do not use Conversation.abort (which also withdraws user inputs). Specify both timer-before-cancel and prepared-sleeping behavior, preserving W1, W4 and W9; extend the cancellation tests to fail the foreground run and advance beyond the queue bound, checking the actual submission and failure report as well as the tool answer. A pre-inspection check alone does not close the timer race."""
