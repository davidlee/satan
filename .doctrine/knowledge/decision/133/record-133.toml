[facet]                         # every field typed; seeded empty (captured later)
context = "SL-034 inq-6. pi-durable inputs default to whenBusy followUp (spec:1012); Conversation.abort withdraws queued inputs as unanswered. satan-mcp calls go through a private withConnection whose tool-call pool key is fixed to `interactive` (src/satan-tools.ts:39)."
choice = "After the gate (switch, presence, policy) says go: (1) the daemon's beforeInput gate, injected into the tasks extension; (2) percept <- satan_boot_context{refresh:true} over a `scheduled` pool connection via a new exported SatanTools call (withConnection + deadline, 10s), degraded to one line `percept unavailable: <reason>`; presence (DEC-129) uses the same call; (3) fragment <- ~/satan-corpus/prompts/wake.md read per fire; missing -> the fire fails visibly (inq-8); (4) submit {type:input, whenBusy:followUp, requestId:`wake:<taskId>:<at>`, entry:{kind:satan.wake, data:{taskId, at, firedAt, intent, payload, episodeClass, scheduledBy}}, content: a <wake fired_at late_by class scheduled_by> block holding fragment, intent, payload JSON and <percept>}; (5) one-shot -> terminal {fired:true}; heartbeat -> sleepUntil(now+ceiling). requestId includes `at` so the recurring heartbeat is not deduplicated after its first fire, while a crash re-run of one fire still is. In-turn SATAN tool calls stay `interactive`-attributed in v0."
alternatives = ["Built-in fallback fragment when wake.md is missing (runs on framing SATAN did not write; SL-015 prefers an error)", "Attribute in-turn tool calls as `scheduled` by detecting the turn's triggering satan.wake entry (no direct API; a lookup per call) -- backlog", "requestId wake:<taskId> (would dedupe every heartbeat fire after the first)"]
rationale = "Percept after the gate, so deferrals cost only the presence call. One new export serves percept and presence. followUp never injects into a user's running turn."
consequences = ["Audit shows a wake as one `scheduled` run (percept) then interactive-attributed calls; accurate turn attribution is a backlog item", "OQ-4 stands: a full boot capsule per wake; a wake-sized delta is a follow-up", "inq-8 defines the visible failure, including the heartbeat surviving a failed fire"]
decided_by = "user (2026-10-27), on the agent's proposal"
decided_on = "2026-10-27"

