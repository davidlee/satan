[[phase]]
id        = "PHASE-07"
name      = "The loop, part 1: the ask's correlation route and answer predicate"
objective = """
Observer changes scoped to kind "ask" (design sec-10, sec-5); every other
kind's verdicts unchanged:

- `classify-for-motives`: kind "ask" credits the live motive with id
  `related_motive_id`, non-dormant, subject still in its cue; else
  `:unknown :no_correlation` and enqueue `ask_uncorrelated`;
- exempt kind "ask" from the `crosses_midnight` guard;
- kind-scoped predicate selection: for "ask" the answer predicate is the only
  positive predicate; it fires on the record entry for this intervention with
  `value` and `at` within emit + 60 minutes, read from the evidence `:goad`
  slice (PHASE-03). It tests only that a value is present, never its shape
  or content: any answer to the form is an answer (DEC-025).

