[[finding]]
id = "F-1"
status = "answered"
severity = "major"
title = "Closing does not prevent already-buffered calls from dispatching after finalisation"
detail = """
Expected: the open -> closing -> closed lifecycle must stop admitting new tool dispatches once close begins, and finalisation must cover the entire last call, including result/interruption audit writes. Observed: .doctrine/slice/032/design.md:79-89,109-114 specifies an active-dispatch count and deferred finalisation, but no admission rule for closing/closed sessions or disposition of complete lines already held by the outer filter. satan/satan-mcp.el:367-382 captures session once and dispatches every complete line from that chunk. satan/satan-patch-rpc.el:132-137 permits another filter/sentinel to run during the first call.

Failure schedule (inference for the proposed implementation): one chunk contains calls A and B. A waits; its connection closes and becomes closing. A returns, records its result/interruption, decrements the count to zero, and finalises closed. The original filter then resumes its dolist and dispatches B using the captured session and its existing run/audit. Thus new side effects and transcript appends occur after terminal finalisation; B can also leave a supposedly finalised bundle temporarily failing calls-match-results. Merely moving the line buffer to a process property does not remove the captured complete-line list. This is an incomplete integration of the earlier disconnect finding, not a request to restore exclusion.

Verified focused probe against the existing filter: fed two complete request lines, replaced handle-message with a recorder whose first invocation simulates close by clearing the process session, and observed ((:id 1 :after-close nil) (:id 2 :after-close t)). The deferred finaliser itself is proposed, not implemented, so the full schedule remains an inference. Also satan-mcp.el:301-307 currently releases the old counter before recording tool-result: design.md:171's replacement must not preserve that lifetime boundary.

Repair: define admission on closing/closed and treatment of already-decoded lines; retain the in-flight ownership through all result/interruption auditing and delivery handling. Extend V5/V9 with A+B in one chunk and closure during A. A hostile lifecycle probe should assert that no subsequent handler starts on the terminal session and no tool record is appended after its finalisation. Suggested severe-finding route for the responder: probe."""
disposition = "fix-now"
route = "probe"
response = "Verified: satan-mcp--filter (satan-mcp.el:365-385) decodes every complete line of a chunk and dolist-dispatches them against the session captured at entry; nothing re-checks state between lines. Repair in sec-3: admission rule — handle-message answers nothing and dispatches nothing once the session is closing/closed (the transport is gone, so no response is deliverable); remaining decoded lines are dropped and counted in a single call-interrupted-free log line. in-flight is decremented only after tool-result/call-interrupted audit and delivery handling. V5/V9 extended: two requests in one chunk, close during A; assert B never starts and no record follows finalisation."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
route = "probe"
response = "Verified: satan-mcp--filter (satan-mcp.el:365-385) decodes every complete line of a chunk and dolist-dispatches them against the session captured at entry; nothing re-checks state between lines. Repair in sec-3: admission rule — handle-message answers nothing and dispatches nothing once the session is closing/closed (the transport is gone, so no response is deliverable); remaining decoded lines are dropped and counted in a single call-interrupted-free log line. in-flight is decremented only after tool-result/call-interrupted audit and delivery handling. V5/V9 extended: two requests in one chunk, close during A; assert B never starts and no record follows finalisation."

[[finding]]
id = "F-2"
status = "answered"
severity = "major"
title = "An escaped dispatch or Emacs quit leaves a tool-call without the result I4 requires"
detail = """
Expected: I4 (.doctrine/slice/032/design.md:35) and SPEC-001 REQ-003 require complete audit evidence on the interrupted paths this slice adds. Observed: design.md:99-107,109-126 specifies an outer -32603 response for an uncaught error, but writes the audited result and call-interrupted only when dispatch returns. It asserts that every tool-call always has a tool-result without defining an unwind path that makes this true. An error response on the socket is not a tool-result in transcript.jsonl. A native Emacs quit is a nonlocal exit outside condition-case's error class, including the handler guard at satan/satan-tools.el:191-199.

Verified fault-injection reproduction, entirely in temporary storage: load satan-mcp; construct an audit and session; replace satan-tool-dispatch with a function signalling quit; invoke satan-mcp--tools-call and catch quit in the probe; then close the audit using the draft's status done and empty action partitions. Output: dispatch escaped: (quit); verification after prescribed done close: ((calls-match-results)). Existing tool-call/result ordering is satan/satan-mcp.el:299-307; verifier pairing is satan/satan-audit.el:635-651. The result demonstrates the retained audit/dispatch mechanism, not an already-implemented SL-032 change. An escaped ordinary dispatcher error similarly skips the audit result even if the proposed outer handler answers -32603.

Adding call-interrupted as a known event does not repair that hole: the current verifier already ignores non-call/result events (satan-audit.el:641-648), and the design explicitly keeps requiring a result. V5 and V6 return normally from their stub tool; V4 fails before recording a tool-call, so all three can pass while this path remains broken.

Repair: define how every admitted, audited call settles on error and nonlocal unwind before relinquishing its in-flight ownership; preserve any known actual outcome and record an explicit unknown/interrupted outcome when execution cannot establish one. Define the response/cleanup behavior for quit separately from cancellation notifications, and keep calls-match-results meaningful rather than treating interruption alone as success. Probe an escaped error and native quit after tool-call append, both with a live and closing transport. Suggested severe-finding route for the responder: probe."""
disposition = "fix-now"
route = "probe"
response = "Contest accepted on both points. (1) quit: sec-3 now closes the session's transport (delete-process) after settling and before re-signalling, so a live uncancelled caller sees a disconnect rather than a timeout, decoded siblings meet a closing session and are dropped by Admission, and both fall under I2's existing transport-closed exception; I2 is not broadened. (2) The synthetic tool-result now names :id explicitly ({:id <call id> :ok false :error ...}; satan-audit.el:647-648). V15 extended: live uncancelled request sees close; second request in the same chunk never starts; call-interrupted carries the :id."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
route = "probe"
response = """Verified: satan-tool-dispatch's condition-case catches only error (satan-tools.el:191-199), so quit escapes; satan-mcp--tools-call records tool-result only after dispatch returns (satan-mcp.el:299-307). Repair in sec-3: tools-call settles every audited call in an unwind-protect — if dispatch exits non-locally (error or quit) a tool-result {:ok false :error "interrupted: <signal>"} is recorded before call-interrupted (:reason "error"/"quit"), then in-flight is released; an error answers -32603 when the transport is live; quit is re-signalled after settling, never answered as success. I4's calls-match-results thus stays meaningful. New V row probes error and quit after tool-call append, live and closing."""

[[finding.turn]]
act = "contest"
role = "raiser"
note = """
The revised settle rule addresses the original missing-audit-result path in principle, but introduces an explicit violation of the revised response contract. design.md:31-33 promises exactly one response for each open-session request unless the client cancelled or the transport closed; design.md:118-123 instead says native quit is re-signalled and never answered, with no rule closing the live transport. V15 at 361-365 requires propagation but no response or connection closure. Thus an uncancelled live caller still waits for timeout. Settling its audit is insufficient.

The same repair also needs to account for already-decoded sibling requests when quit propagates. Existing satan/satan-mcp.el:367-382 stores only the incomplete tail, then walks complete lines in a local dolist; its error guard does not catch quit. Verified focused probe: feed two complete requests and have the first handler signal quit. Output was quit escaped=t, transport-live non-nil, dispatched-ids=(1), buffered-tail="". The second request was neither dispatched nor retained. The probe establishes the current filter behavior; its consequence under the proposed re-signal rule is an inference, because the repair is not implemented.

Repair: define a quit policy that preserves I2 and the remaining decoded requests. For example, settle and close the session/transport before re-signalling (so both requests have the declared transport-close exception), or respond with an error and preserve/drain the buffered requests before propagating quit. Do not simply broaden I2 to tolerate silently abandoned live requests. Extend V15 with a live uncancelled request and two complete requests in one chunk, checking the chosen response-or-close outcome as well as clean audit finalisation.

Also make the synthetic result's matching id explicit: the literal payload at design.md:120 contains only ok/error, whereas satan-audit.el:647-648 matches tool-result via payload.id. A separate temporary probe writing exactly that fallback plus an id-bearing call-interrupted and a done close returned ((calls-match-results)). If the payload was intended as an abbreviated shape, state the required id rather than leaving this implementation-critical field implicit. The probe/demonstration obligations remain unexecuted; this contest is against the revised design and its checks, not a runtime regression claim."""

