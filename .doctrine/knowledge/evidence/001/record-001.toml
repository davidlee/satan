[facet]                         # every field typed; seeded empty (captured later)
datum        = "A `defun` over a `cl-defstruct` accessor name replaces the function cell but NOT the symbol's `compiler-macro` property, so every syntactic call site still inlines to the slot read — interpreted and byte-compiled alike. Only indirect dispatch (funcall/apply/eval of a constructed form) reaches the defun."
