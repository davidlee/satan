[facet]                         # every field typed; seeded empty (captured later)
context = "Each gateway key carries a lifetime USD budget and a model list. Counted as SATAN ceilings they would restate policy (ADR-018 D2, SPEC-001 REQ-006) and add a third enforcement point (REQ-009, RFC-018 OQ-2)."
choice = "Gateway budgets are host-deployment insurance against runaway spend, tuned with generous headroom over day-to-day use. SATAN's daily token budget and per-run max stay the authoritative ceilings. Gateway caps are not in the ADR-017 ledger."
alternatives = []
rationale = "The user wants a backstop that never trips in normal operation. Distinct purpose and owner, so not dual enforcement."
consequences = ["The model list on the satan key is deployment config, not a policy restatement.", "Tripping a cap is an incident, surfaced as credits (inq-5)."]
