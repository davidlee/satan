[[finding]]
id = "F-11"
status = "answered"
severity = "minor"
title = "The slice's risks and follow-ups still contradict the materialised design"
detail = "Expected: the governing scope accurately reflects the design before review.scope is confirmed. Observed via doctrine show SL-029: the main bullets incorporate DEC-097–100, but the risks still call token/cost ceilings undecided and assert nested confinement is a union that can never narrow; the follow-ups still defer the wrapped-runner jail profile even though sec-3/sec-7 and DEC-098 make safe forms a delivery dependency. The scope also says 'no group kill', while sec-4/DEC-096 explicitly require process-group termination. These are live scope statements, not merely a preserved historical decision record. Required correction: refresh those scope projections against the current design and mark any deliberately historical research claims as superseded; do not remove genuine non-goals such as retiring the old RPC wrappers. Verification: re-read the synthesized SL-029 scope and the design together before discharging review.scope."
disposition = "fix-now"
route = "review"
response = "Accepted. Scope risks and follow-ups are refreshed against the materialised design: ceilings decided as retrospective, the nesting claim restated as intersection with no narrowing, process-group termination required, and the wrapped forms promoted from follow-up to delivery dependency. Historical research claims are marked superseded, not deleted."

