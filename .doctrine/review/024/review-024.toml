[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "Expected I4 to type every un-ready death spawn_failed; observed a failing stderr.log write skips the refusal record (untyped failed)"
detail = """
satan/satan-broker.el satan-broker--wrap-sentinel (~:450-474): inside the unwind-protect body, write-region to stderr.log runs first; the refusal predicate and satan-broker--record-launch-refusal run after it. If write-region signals (missing run dir — ISS-044's observed "Opening output file … stderr.log" error), the body aborts; the unwind form finalizes with failure-reason nil: no `broker spawn-failed` event, run closes untyped `failed`. Design I4: "It is never an untyped failed." ISS-044 is thereby more than a test flake when it hits a refused child.
"""
disposition = "fix-now"
response = """
2243b41: wrap-sentinel's stderr.log write is wrapped in condition-case and logged via `message`, so the refusal predicate always runs. Red→green test satan-broker/refusal-recorded-when-stderr-log-write-fails (run dir /nonexistent → spawn-failed recorded, failure_reason spawn_failed). ISS-044 body updated: the race now costs only stderr.log, not I4.
"""

