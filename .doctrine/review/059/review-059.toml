title = "Shell tests in the gate: expected pi-report-test.sh to run under just check; observed it runs nowhere automatically"
detail = """
Expected: PHASE-11 VT-1 rests on `scripts/lib/pi-report-test.sh`, and the operator's checklist wants passing coverage in the gate.
Observed: `just check` = lint, test and forms-suite; no recipe runs `pi-report-test.sh` (`grep test.sh justfile` finds nothing). In PHASE-11 the delegate reported it 9/9 while case 2 actually failed: the unquoted `PI_REDUCE=/nonexistent/quotient reduce` ran `reduce` as the command. Review caught it; the gate would not have. This gap predates SL-031.
"""
disposition = "fix-now"
response = """
Fixed: a new `shell-suite` recipe runs every `scripts/*-test.sh` and `scripts/lib/*-test.sh`, and `check` now depends on it. Green: pi-report 9 passed, 0 failed. Red-proven: a temporary failing `scripts/zz-red-test.sh` made `just shell-suite` exit 1. `just check` exits 0.
"""

