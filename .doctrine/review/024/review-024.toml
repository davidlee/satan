[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "Expected frontier-commit tick-trace stages to keep recording; observed satan-trace-stage is a passthrough in --commit-frontiers (dead wrappers)"
detail = """
satan-broker--commit-frontiers (satan/satan-broker.el ~:143-152) wraps each commit in satan-trace-stage ("probes.commit.curiosity/content/wpm", "spawn.ingest_cursor"). It now runs from the stdout process filter on `ready`, after satan-trace-with-tick's dynamic extent has exited; satan-trace--current is nil there (satan-trace.el:15-20, 122-133), so the macro records nothing. Before SL-022 these stages ran inside the tick (git show 60c89d5:satan/satan-broker.el ~:894-919) and were traced. Not covered by the design; tick-trace rows silently lost four stages.
"""
disposition = "fix-now"
response = """
2243b41: dropped the satan-trace-stage wrappers from --commit-frontiers. The commits run after the tick, from the process filter, so no tick trace exists to record them and a stage there would be meaningless as tick latency. No reader of the stage names exists (rg). Docstring now says it runs outside any tick trace. Mirror in design at reconcile (see brief).
"""

