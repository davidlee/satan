title = "The new-entry refresh repair can issue two discovery reads despite V12's one-refresh claim"
detail = """
Expected: the refresh cost and verification assertion must match the existing discovery/reconnect/coalesce behavior the repair retains. Observed: design.md:270-281 adds a refresh on the first successful connection of every new pool entry, keeps discovery wired to refresh on its own reconnect (241), and claims one tools/list per conversation window. V12 at 376-380 requires the fresh-entry restart scenario to trigger one refresh. The existing discovery callback in malebolge/src/satan-tools.ts:128-130 calls refresh during its reconnect; read awaits that same discovery connection at 134-137,170-179. coalesce.ts:9-12,34-39 explicitly queues another read for a refresh requested while one is already running, rather than absorbing it into the active read.

Verified focused probe /tmp/rv060-refresh-repair.ts uses the real satanTools, reconnectingClient and coalesce with a local fake MCP server and a stub registry. Populate discovery, restart the server while no pool entry survives, create a fresh entry, and call discovery.refresh once to model the specified first-success announcement. Discovery's own reconnect requests another refresh while that read is in progress. Output: {"newEntryAnnouncements":1,"replacementServerMethods":["initialize","initialize","tools/list","tools/list"],"listRequests":2}. There was only one new-entry announcement, but two discovery reads. This probes the retained components and the proposed trigger, not an implemented satan-pool module.

The new-entry trigger does address F-3's lost-history/stale-registry path; this finding concerns the new cardinality promise and a test that can fail against that otherwise successful repair. Repair: either make V12 assert eventual registry replacement with the documented coalescer's allowed follow-on read, and correct the one-list cost statement, or explicitly design deduplication across the discovery-reconnect and new-entry triggers if a single wire read is required. Exercise both triggers together in the test rather than mocking the discovery reconnect callback away."""
disposition = "fix-now"
response = "Verified: coalesce queues exactly one follow-on run by design (coalesce.ts:9-12, SL-028 §4.3), so a discovery reconnect during the new-entry refresh yields a second read. Chose correcting the claim over adding deduplication: sec-7 cost statement now notes the possible follow-on read; V12 now runs both triggers together with discovery's reconnect left real and asserts registry replacement with at most two tools/list reads."

