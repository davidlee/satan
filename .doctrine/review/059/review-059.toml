[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "help exit codes: expected 0, or 2 for an unknown section (design CLI table); observed exit 1 when the help layer is unreadable"
detail = """
Expected: design.md l.106, the `help [section]` row: "0, or 2 for an unknown section".
Observed: a PHASE-08 choice. `quotient help` exits 1 when the help layer itself cannot be read; `src/cli.ts` documents 0 / 2 / 1. The other PHASE-08 choices the harvest flagged match the design: help/setup.md is listed as the `setup` section (design l.139), and a server refused at start-up names the failure in its instructions and tool description (server.ts row, l.706). Only the exit code is undocumented.
"""
disposition = "design-wrong"
response = """
Exit 1 is the right code for an unreadable help layer: it's an install fault, distinct from a usage error (2). Reconcile the design.md CLI table (l.106) to "0; 2 unknown section; 1 unreadable help layer". The other PHASE-08 choices already match the design.
"""

