title = "§4.3: refresh timeout does not cancel; a hung connect wedges every later refresh"
detail = "GPT-6-sol adversarial. A timeout racing connection.get()/listTools() leaves the read live; a stalled open() stays reconnectingClient's current (satan-tools.ts:51-69) so later gets never reconnect. pi-mcp requests take signal/timeoutMs (client.d.ts:18-19); listTools may page (client.js:218). Fix: one overall refresh deadline as an AbortSignal; on timeout close/replace the client so the next get() opens fresh; test stalled init and a late response."
disposition = "fix-now"
response = "Fixed in design.md (RV-040 F-3 markers in §4; §5-7); verified by GPT-6-sol recheck."
