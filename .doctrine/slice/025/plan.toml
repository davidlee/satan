# Implementation plan for SL-025 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
#
# Paths: M = /home/david/dev/malebolge, F = /srv/fleet, H = ~/flakes,
# C = ~/satan-corpus, this repo = ~/dev/satan. VT test_file paths outside this
# repo are absolute; verify-vt reports them UNATTRIBUTABLE (this repo's git
# cannot see their commits) — expected.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-025"

[specs]
primary       = []
