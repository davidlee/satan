[[finding]]
id = "F-6"
status = "verified"
severity = "minor"
title = "The timestamp risk is understated"
detail = "pi review (broker pass). The probe compares raw captured_at strings. In a mixed store an offset row compares as local wall clock, so a later Z capture can sort before the watermark and be skipped for good, not only after a daylight-saving fall-back. pi marks the data side as inferred."
disposition = "fix-now"
response = """
Partly contested. The later-Z scenario needs a new Z row; the 2026-11-07 measurement in notes.md found all 36 Z rows date from 2026-05-31 to 06-01, and the watermark is now an offset row. pi conceded this on the second pass. The real residual case is any change in local offset, so sec-8 now gives both windows: an hour after a daylight-saving fall-back, and the size of the shift after a timezone change. No normalisation added; it stays a recorded risk.
"""

