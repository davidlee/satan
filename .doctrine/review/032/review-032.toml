[[finding]]
id = "F-9"
status = "verified"
severity = "nit"
title = "Live lane jobs ran with a hand-built ctx: no intervention row, broker ctx join proven statically"
detail = """
PHASE-05 submitted the three lane jobs by `emacsclient` calling `satan-tool/patch-job-create` with ctx `(:mode-name <lane>)`. Each ok carried `intervention_error "tool-ctx missing :id/:mode-name/:time-now/:audit"` — expected for a synthetic ctx.
So the live path through a real broker run (ctx from satan-run.el:345 `:mode-name (plist-get mode :name)`) was not exercised. Static evidence: mode names are the strings "self-edit-mech", "self-edit-mind" (satan-mode.el:141,164), "tick-agent" (satan-tick.el full-name from satan-tick-pool), "interactive" (satan-mcp.el:91); each matches a runner [mode.*]; each lane's :tools includes patch_job_create (satan-mode.el:150,173; satan-tick.el:129; MCP via satan-tools-available "interactive").
"""
disposition = "tolerated"
response = """
The §6 VH rows ask for jobs "through patch_job_create" — met: the handler, the stamping, the runner admission and the lanes all ran live. The only unexercised piece is the broker supplying :mode-name, a one-line ctx field (satan-run.el:345) whose values were checked statically against the runner's mode names and the lanes' tool allowlists. Starting a SATAN run during the cutover sitting was ruled out (PHASE-04 EN-2); the first scheduled tick-agent or self-edit run exercises it, and a mismatch would surface as an invalid_request refusal naming the mode — loud, not silent.
"""

