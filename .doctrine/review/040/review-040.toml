status = "verified"
severity = "blocker"
title = "§4.4: probe-then-unlink can delete a live peer's socket"
detail = "GPT-6-sol adversarial. refuseIfLive runs before serveUnix, which unlinks unconditionally (unix-socket.ts:44); a daemon binding between the two has its live socket removed, and the new process opens the same store. Fix: listen is the claim; on EADDRINUSE probe and unlink only a verified stale socket, then retry once."
disposition = "fix-now"
response = "Fixed in design.md (RV-040 F-1 markers in §4; §5-7); verified by GPT-6-sol recheck."
