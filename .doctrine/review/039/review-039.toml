severity = "minor"
title = "Expected design §4.1/§4.3/§4.4 to describe the delivered room API and daemon env; observed drift recorded across PHASE-02/04 reviews"
detail = """
From notes § Design errata (each verified in its phase):
- §4.1 ReadFailure drops "exit" (runner keeps its own Failure with exit; RV-036 F-3, malebolge 2ba8667).
- §4.1 room API omits exports added with one consumer each: successStdout, answerable, Attempt, ExecFacts, Collected, OutputCollector, observedEnv (RV-036 F-7, already design-wrong); observedEnv options gain reword?; ROOM_DOOR_READERS pinned by the structure test (RV-036 F-1), daemon config.ts among them.
- §4.1 "host-key re-exports" did not exist (PHASE-02).
- §4.3 daemonEnv gains helpers?: DaemonHelpers; readRoomContext / requireGatewaySocket exported; Config.cwd / toolsCwd removed, DaemonEnv.cwd the one source (PHASE-04).
- §4.4 / §7 R3: a lost room reaches grep as a thrown ExecutionError rendered `[error] room unavailable: …`, not spawn_error; the neutral `rg could not run:` covers a missing binary only.
"""
disposition = "design-wrong"
response = """
Code is correct and reviewed (RV-036, RV-037); design text lags. Reconcile: §4.1, §4.3, §4.4/§7 R3 per the listed items (incl. RV-036 F-7). Brief entry RB-3.
"""

