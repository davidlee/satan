[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "Insert succeeds, watermark write fails: the same captures are reported twice"
detail = "pi review (broker pass). mark-inspected can signal after the row is committed (satan-sensor-content--write-state, full or read-only state root). The next tick re-enqueues the same captures with a new run_id and ts; nothing dedupes. pi proposes a dedupe key enforced by attrd."
disposition = "tolerated"
route = "review"
response = "Observation correct, severity and prescription not adopted. The enqueue-then-mark order exists today, so this change does not introduce it, and neither sec-2's invariant nor sec-3's claim is contradicted: both concern a failed insert, not a failed watermark write. The cost is one extra evidence row at a rare disk fault, on an attribute already at its ceiling. A dedupe key would add a daemon contract for that case, which DEC-148 keeps out of this slice. Disclosed: sec-2 states delivery is at least once; sec-8 carries the duplicate report as an accepted risk."

