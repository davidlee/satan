title = "recovery cannot promise “before the scheduler starts” while it calls `abort` or `submit`"
detail = """
Codex (gpt-6-sol) design review of SL-023, finding 4. Location: §5.4, lines 724–750.
Both operations start pi-durable scheduling, as its API explicitly states ([harness/types.d.ts](/home/david/dev/malebolge/node_modules/@earendil-works/pi-durable/dist/harness/types.d.ts:639)). The `pause_requested` and `waiting_room` recovery rows require those calls; the disabled path simultaneously promises no such calls. **Scenario:** recovering one row starts another pending conversation before the remaining host rows are settled, or a disabled runner performs an abort that starts scheduling. **Repair:** separate read-only reconciliation from scheduler-starting operations, specify their order and a gate that prevents any model/tool enactment until reconciliation completes, and give disabled recovery its own explicit table. **Verified against source.**"""
