title = "`waiting_room` loses whether preparation or a run was interrupted"
detail = """
Codex (gpt-6-sol) design review of SL-023, finding 5. Location: §5.4, lines 545, 573–574, 654–655 and 747.
A room unavailable during `preparing` has had no conversation turn; recovery nevertheless submits the “environment restarted” message. **Scenario:** refresh or branch creation fails while the room is down; after restart, the resume message becomes the first input although the base and job branch may not be ready. **Repair:** persist the interrupted phase and resume preparation from its last completed step; submit the recovery message only after an initial run was admitted. **Inferred from the stated state machine.**"""
