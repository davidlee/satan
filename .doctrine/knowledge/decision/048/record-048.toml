context = "S/flake.lock and F/flake.lock pin agents at cfda05a5 (no gatewayClient); the deployed harness builds through F's satan input with agents.follows. The patcher runs jailed-pi from its unit PATH and passes --provider openrouter from an untracked policy.toml."
choice = "1) Issue the satan key (deepseek-flash only; 20 USD lifetime). 2) Land and push satan with agents re-locked to >= a24a0f03; the running Emacs must not reload satan yet. 3) In flakes: update the satan and agents locks; drop the patcher key refs; update SATAN.md; home-switch (the new harness works with the old broker). 4) Edit policy.toml defaults to llm-gateway/deepseek-flash and remove the cheap+code tag. 5) Restart Emacs onto the new satan. 6) Then drop the emacs satan credential backend. 7) Manual checks including a probe of the deployed launcher. Amended 2026-10-18 after RV-023 F-2 F-3: the deployed harness comes from flakes' locked satan input; home-switch overrides agents in-tree; so the flakes agents re-lock is hygiene."
