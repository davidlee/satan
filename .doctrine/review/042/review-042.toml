role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Fixed in malebolge f44240e: close handler registered before the awaits; a stream arriving on a destroyed socket is stopped. Test 'stops watching when a client leaves before the session resolves' observes the stream's closed promise; bite-checked 3/3 red against the old ordering."

[[finding.turn]]
