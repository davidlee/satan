[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "DEC-020 and design sec-3/sec-9 assume a prompting run waits for the keeper; 1Password's dialog expires after ~1–2 min"
detail = """
Expected (DEC-020 context + rationale, design sec-3 "Consequences", sec-9 VH-3): a prompt-mode read "already waits for the keeper"; "a prompt accepted at 11:40 yields an 11:40 run id"; "no expiry exists"; VH-3 "accepting later runs motd with a fresh run id".
Observed (PHASE-08, notes.md): the 1Password authorization dialog closes itself after ~1–2 min and `op` reports it as "authorization prompt dismissed". Run 20260923T221713-motd → credential_unavailable, .FAILED, pop. So an 08:15 motd or 09:15 morning with nobody at the desk fails loudly instead of waiting. SATAN adds no expiry, but 1Password imposes one, so "accept later" is bounded by the dialog's lifetime.
Code behaves as designed: `satan-credential-acquire` treats the failed read as `(:unavailable ERR)` (DEC-022 (7)). The defect is in the recorded premise and the stated consequence, and it touches ISS-012's intent ("a deferred run at 09:30 beats a failed one at 07:47"): for prompt-mode runs with the keeper absent, the day's run is still lost, now loudly and labelled rather than as `KEY not set`."""
disposition = "verified"
response = """Observation confirmed; the code is correct per DEC-022 (7). Keeper (2026-09-23) accepts the behaviour for SL-018: a loud, labelled credential_unavailable replaces the silent `KEY not set`, which meets ISS-012's corrected intent, so ISS-012 closes as fixed at /close. The residual, where a prompt-mode run is lost when the keeper is away, is filed as ISS-023. Text corrections go to /reconcile (Reconciliation Brief): DEC-020 context/rationale ("already waits for the keeper", "no expiry exists"), and design sec-3 Consequences plus sec-9 VH-3 bounded by the dialog's lifetime."""

