[[finding]]
id = "F-3"
status = "verified"
severity = "major"
title = "The host check cannot detect a missing audit-list entry"
detail = "pi review (broker pass). A validator rejection in satan-attribute-listener--handle writes satan_audit_replies and drops the audit inbox row; the delta and event row are already in Postgres, and only the transcript echo is lost. So sec-7's closing check, the event row, passes with satan-audit-attribute-sensor-reasons unpatched, and sec-3 does not say what the rejection costs. pi proposes checking for no satan_audit_replies row."
disposition = "fix-now"
route = "control"
response = """
Observation confirmed in satan-attribute-listener--handle. The prescription is wrong: the daemon's process_reply_row deletes each satan_audit_replies row after logging it, so an absent row proves nothing. Control: the concrete incorrect candidate is a broker running without content_backlog in satan-audit-attribute-sensor-reasons; the check must reject it. The criterion must assert that removing the literal turns the accepted-reasons test red, and that the host check needs a transcript.jsonl line for attribute.delta_applied whose reason is content_backlog (other sensors write the same event to the same file), plus no broker rejected attribute.delta_applied line in the satan-attrd journal for that window (run_loop.rs:710; the broker logs nothing on a rejection). The event row alone does not pass. Host phase constraint: it must follow the re-enable step, needs the run directory still present, and needs a positive control on the journal search. Separable second arm, repaired in prose: sec-3 now states what a rejection costs and who logs it, and sec-7 says the event row proves only the daemon half.
"""

