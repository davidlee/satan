Expected: one way to build an observed remote env (the no-nesting rule of design §4.3 / PHASE-04 EX-3 stated once).
Observed: src/room/shell.ts:216-225 `roomShell` and src/runner/env.ts:23-29 `jobEnv` each do `new RemoteExecutionEnv({ connection: new ObservedConnection(conn, observer), id, cwd })`. At e2aaf98 roomShell called jobEnv; the tier split forced the copy. §4.3's daemon tool path builds the same shape again.
Fix: `observedEnv(connection, observer, { id, cwd })` in src/room/connection.ts (or shell.ts); jobEnv and roomShell call it; its doc comment states the no-nesting rule.
"""
