disposition = "fix-now"
route = "refresh"
response = "Confirmed: the three tests have no stub, and only :293 and :320 (and :259) stub enqueue. The test file is the side that is right; the design's inventory lagged it. Edited sec-6 and sec-7: every test that expects the watermark to advance stubs enqueue to return (ok . 1), so none depends on a reachable inbox. Swept slice-037.md: its test scope already names the failure case and needs no change."

