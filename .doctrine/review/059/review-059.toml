[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "Clients snippet path: expected realpath of argv[1] (design § Clients, DEC-118); observed symlink-preserving path plus QUOTIENT_LAUNCHER"
detail = """
Expected: design.md § Clients (DEC-118) says `quotient help clients` prints "the absolute path of the running bin (`process.argv[1]`, realpath'd)".
Observed (Q `6c31180`, operator "fix now" in PHASE-10): `runningBin` keeps symlinks (`path.resolve`, not realpath). The nix wrapper exports `QUOTIENT_LAUNCHER`, its own `$0` made absolute, and the snippets prefer it.
Why: under nix, the realpath is a store path to `dist/cli.js` whose shebang is `/usr/bin/env node`. It bypasses the node-carrying wrapper and disappears at the next GC. Documented in Q `docs/contract/quotient-policy-1.md`. Evidence: notes.md § PHASE-10 execution.
"""
disposition = "design-wrong"
response = """
The operator ordered the change ("fix now", PHASE-10), and the implementation is the correct one: a realpath'd store path dies at GC and bypasses the wrapper that supplies node. Reconcile design.md § Clients, and amend DEC-118, to say that the snippets name the path the bin was run as (symlinks kept). Under the nix wrapper that path is `QUOTIENT_LAUNCHER`; a relative or empty value is ignored.
"""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "design-wrong"
response = """
The operator ordered the change ("fix now", PHASE-10), and the implementation is the correct one: a realpath'd store path dies at GC and bypasses the wrapper that supplies node. Reconcile design.md § Clients, and amend DEC-118, to say that the snippets name the path the bin was run as (symlinks kept). Under the nix wrapper that path is `QUOTIENT_LAUNCHER`; a relative or empty value is ignored.
"""

