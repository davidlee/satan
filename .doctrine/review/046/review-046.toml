[[finding]]
id = "F-1"
status = "answered"
severity = "major"
title = "The initial build has no fail-closed contract for the deferred static policy mode"
detail = "Expected: the operator's accepted DEC-100 build-status note ships per-call only; a static policy must not activate an unbuilt or unconfined execution branch. Observed: revision 48 sec-3 and sec-7's file list label the static derivation deferred, but sec-1 still presents mode=per-call|static as supported, and sec-2 defines static admission branches. DEC-100's build note explicitly removes the posture switch and its policy-invalid cross-check from the build. No rule says what the actual initial server does when it reads mode=static, agent or the other static-only fields; it could silently ignore mode and run a different capability/posture, or choose a bare agent on the host. This is distinct from RV-043 F-11's stale delivery wording: it is the missing executable admission rule at a security boundary. Required correction: define the build's accepted policy shape explicitly (only per-call, with a stable refusal for static/unsupported posture and no downgrade), while keeping future static design clearly non-operative. Verification should present a valid-looking static policy to the initial server and assert refusal before spawn; test that no agent-only fallback path exists."
disposition = "fix-now"
route = "demonstrate"
response = """
Accepted. "Deferred" left the executable rule unwritten at a security boundary, and that is a gap regardless of the build decision.

Fixed in design revision 60 (sec-1, sec-2 step 1) and DEC-100's appended amendment: `mode` accepts exactly `per-call` in this build. A policy declaring `static`, **or carrying any static-only field** (`agent`, `root`, `filesystem`, `session_home`, `run_dir`, `evidence_dir`) in an otherwise valid file, is refused **`posture-unsupported`** at validation step 1, before anything spawns. No downgrade to per-call, no silent ignore of a field it could not honour, and no bare-agent-on-the-host path — step 1's refusal and step 5's `capability-mismatch` together leave no branch that reaches an unwrapped agent. sec-3's static section now opens by saying the posture is refused at step 1, so no unbuilt branch can activate.

The demonstration is named in sec-7: a valid-looking static policy is presented to the initial server and must be refused before spawn, with a test asserting no agent-only fallback path exists. It binds the phase criterion that implements policy validation; this ledger entry stays unverified until then.
"""

