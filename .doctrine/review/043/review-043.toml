[[finding]]
id = "F-6"
status = "answered"
severity = "major"
title = "The gate and verbatim reducer status give different accounts of the same run's spend"
detail = "Expected: the returned status and audit support the ceiling verdict with one defined accounting model, including compaction and precise request/token units. Observed: sec-4 counts message_end and compaction_end usage, while sec-5 embeds pi-run-status/1 verbatim and sec-7 only adds result/final to the reducer. The current reducer ignores compaction_end entirely, adds only usage.input/output/cacheRead, and turns missing cost into zero after an assistant message (pi/reduce/reduce.ts:109-112, absorb and totalCost). An isolated fixture with compaction cost 0.20 USD plus assistant cost 0.01 USD returns status.cost_usd=0.01; the designed gate would account 0.21 and could abort against 0.10 while returning a below-limit status. DEC-097 also correctly says assistant messages are not provider-request counts, but the request-count calculation for max_requests is not defined; retries and summarization attempts cannot simply be counted as assistant turns. Required correction: choose one authoritative usage accumulator or explicitly expose/reconcile separate accounting with their limitations; define request counting, cached-token treatment, missing/unpriced data and when compaction updates trigger checks. Tests must assert returned/audited spend agrees with enforcement inputs, including compaction and failed/retried requests."
disposition = "fix-now"
route = "demonstrate"
response = "Accepted. One accumulator lives in the reducer: message_end plus compaction_end, with compaction triggering a gate check, and retry attempts counted as provider requests. Absent or unpriced usage is unknown, not zero, and unknown aborts. Request counting is defined as observed provider requests. Tests assert the gate's enforcement inputs equal the returned and audited status, including compaction and failed requests."

