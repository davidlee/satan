[[phase]]
id        = "PHASE-08"
name      = "The result: state, causes, precedence, conformance"
objective = "Design sec-5, in pi/mcp/result.ts: the `pi-agent-result/1` shape (schema, state, termination, causes, session, final, truncated, result, transcript, status, artifacts, refusal); the DEC-093 state/termination table with pi's stop reasons verbatim; the abort latch and the commit point; the success predicate; the refusal shape; the transcript budget (soft) with artifacts naming the unbudgeted text. `termination` is always `causes[0]`, and `causes` carries the whole ordered list."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-07 complete and green." },
]
exit_criteria = [
  { id = "EX-1", text = "Success requires all of: an answer-bearing terminal message (stop or length), `agent_settled` observed, child exit status 0, and known accounting. The three settlement combinations — stop+EOF without settled, stop+nonzero exit, settled+nonzero exit — are each non-success, and exit 0 is never taken as evidence of success (design sec-5)." },
  { id = "EX-2", text = "The latch defeats provisional success: a cause recorded before the commit point (after ladder, reap, drain, final accounting and the exit/abort appends) decides the state, so no ordering reports `completed` while accounting or audit failed; concurrent causes return the full ordered list with `termination = causes[0]` (e.g. timeout then audit → termination `timeout`, causes `[timeout, audit]`)." },
  { id = "EX-3", text = "The refusal shape: `refused` carries status, artifacts and result null plus `refusal {reason, detail}`, termination `refused`, causes `[refused]`; `audit-failed` and `audit-unavailable` are valid refusal reasons; the `audit_failed` state exists only for a run that spawned. PHASE-02's provisional refusal envelopes are brought under this shape here, so one shape covers a refusal and a run." },
  { id = "EX-4", text = "Vocabulary conformance: `termination` and `causes` are one enum with `timeout` as the cause token and no `backstop` token; every mapped outcome satisfies the advertised result schema, so a cause token outside the enum fails the suite rather than the reader (RV-046 F-6)." },
  { id = "EX-5", text = "`status.state` judges the stream and `state` judges the call; they diverge only when the deciding cause arose outside the stream (`exit`, `spawn`, `audit`, `accounting`, `timeout`) and `causes` names it — never two accounting stories." },
  { id = "EX-6", text = "The transcript is budgeted and the budget is soft: mandatory sections can exceed it (by design and by test), `truncated` reports it, and `artifacts.transcript` names the unbudgeted text; status is embedded verbatim from the reducer." },
  { id = "EX-7", text = "`node --test pi/mcp/*.test.ts` green, offline." },
  { id = "EX-8", text = "`final` is derived in exactly one place — here, where exit status and accounting are known — from the stream-side inputs the reducer supplies; no other module computes or overrides it." },
]
verification = [
  { id = "VT-1", expects = "success predicate: every settlement combination, answer-bearing reasons only", test_file = "pi/mcp/result.test.ts", keywords = ["agent_settled", "final", "exit"], waived = false },
  { id = "VT-2", expects = "latch and precedence: cause before commit point, concurrent causes with the full list", test_file = "pi/mcp/result.test.ts", keywords = ["causes", "latch", "commit"], waived = false },
  { id = "VT-3", expects = "refusal shape and the audit-failed refusal", test_file = "pi/mcp/result.test.ts", keywords = ["refused", "audit-failed"], waived = false },
  { id = "VT-4", expects = "every mapped outcome satisfies the result schema; no backstop token; timeout is the cause token", test_file = "pi/mcp/result.test.ts", keywords = ["pi-agent-result/1", "timeout", "backstop"], waived = false },
  { id = "VT-5", expects = "soft transcript budget, artifacts paths, verbatim status", test_file = "pi/mcp/result.test.ts", keywords = ["transcript", "artifacts", "status"], waived = false },
  { id = "VT-6", expects = "the result shape and precedence table live in result.ts", test_file = "pi/mcp/result.ts", keywords = ["pi-agent-result/1", "causes"], waived = false },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-09"
name      = "Wrapped forms, test hook, one live smoke"
objective = "Design sec-3's per-call forms, sec-7's verification loop and the delivery list: flake.nix gains the two per-call wrapped forms (read: --ro-bind the launch dir; write: --bind) built on the shared jail generator with `~/.pi`, a tmpfs /tmp, and the active session directory bound by run-time path, plus `jailProbes` entries asserting each form's actual bind set equals root + active session directory + `child_binds` — the check that closes the loop where the server cannot see. justfile gains the offline pi suite hook. Then one live per-call smoke run against deepseek-flash, recorded as evidence in the slice notes, not as a gate."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-08 complete and green." },
]
exit_criteria = [
  { id = "EX-1", text = "flake.nix declares the two per-call wrapped forms, one per filesystem capability, with the executable baked in and arguments forwarded (no executable word, no `--`) (RV-043 F-7)." },
  { id = "EX-2", text = "Each form binds the launch directory `--ro-bind` for read and `--bind` for write, `~/.pi`, a tmpfs /tmp, and only the active session directory (a run-time path, not the session home and never the run directory) (design sec-3 per-call mode)." },
  { id = "EX-3", text = "A flake check asserts each form's actual bind set equals root + active session directory + the policy's `child_binds`; adding or dropping a bind fails the check rather than moving it (RV-043 F-1, the loop-closing half)." },
  { id = "EX-4", text = "`just check` is green and covers the pi suites through the hook added in PHASE-02, which stays runnable without the test-database gate." },
  { id = "EX-5", text = "One live per-call smoke run against deepseek-flash succeeds end to end: policy, profile, wrapped form, gate, result; the returned result, status and run directory are recorded in the slice notes as evidence, and the run is not a gate." },
  { id = "EX-6", text = "`just check` green, and no bwrap token appears anywhere in pi/mcp." },
]
verification = [
  { id = "VT-1", expects = "the two per-call forms and their bind sets in the flake", test_file = "flake.nix", keywords = ["pi-mcp", "child_binds"], waived = false },
  { id = "VT-2", expects = "the offline pi suite hook", test_file = "justfile", keywords = ["pi/mcp"], waived = false },
  { id = "VA-1", expects = "the flake's bind-set check passes on the real forms and fails when a bind is added or dropped (agent-run `nix` check, result recorded)." },
  { id = "VA-2", expects = "one live per-call smoke run against deepseek-flash recorded in .doctrine/slice/029/notes.md with its result, status and run-directory path." },
]
