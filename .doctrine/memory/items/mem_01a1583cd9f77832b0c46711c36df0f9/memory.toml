schema_version = 1
memory_type = "fact"
status = "active"
title = "Nested jails are additive, never narrowing"
summary = "An unjailed process inside a jail is jailed; a jailed process inside a jail gets the union of both jails. A nested jail can therefore never repair an outer profile's exposure, so the outer profile remains the containing guarantee and 'nested' never implies 'narrower'."
created = "2026-10-20"
updated = "2026-10-20"

