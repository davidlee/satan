  { id = "VT-3", expects = "second attach errors already attached, binding unchanged (V-6)", test_file = "/home/david/dev/malebolge/test/daemon.test.ts", keywords = ["already attached"], waived = false },
  { id = "VT-4", expects = "departure before ready and mid-bind: no stream / stopped stream, nothing submitted, the stranded create (V-11, V-14, V-15)", test_file = "/home/david/dev/malebolge/test/daemon.test.ts", keywords = ["watched.streams", "stopped", "scanConversations", "destroy"], waived = false },
  { id = "VT-5", expects = "serve takes options; the transport reaches pi only through Conversations", test_file = "/home/david/dev/malebolge/src/daemon.ts", keywords = ["ServeOptions", "conversations.watch", "parseConnectionMessage", "destroyed"], waived = false },
  { id = "VA-1", expects = "Read daemon.ts against design sec-3 line by line: one chain per connection, departure check as each turn's first step, bind order (watch → destroyed? → attached → snapshot → start), no `Harness` import, no closing flag. Record the read in the phase sheet." },
