severity = "minor"
title = "Design sec-7's delivery list and the design-target selector set omit three artefacts the slice actually shipped"
detail = """
Expected (design sec-7 "Files"; slice-029.toml's design-target selectors, the set `slice conformance` compares actual edits against): every shipped file is named in the delivery list, and a file named there is also a selector, so design §6's prose mirror and the registry (what conformance reads) agree.

