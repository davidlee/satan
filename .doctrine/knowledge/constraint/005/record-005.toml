[facet]                         # every field typed; seeded empty (captured later)
statement = "Malebolge's interactive daemon runs under one execution profile per conversation, enforced host-side by its jail (oubliette RFC-001 P3). Room profile: coding tools in room assistant, no egress. Egress profile (future): network egress, NEVER with the room attached (oubliette RFC-001 P1), writes limited to its own memories, never resumes a conversation that held room content. Host profile (interactive only): coding tools in a chosen host directory / jail configuration. Patch jobs are room-only. Designs must keep the egress and host profiles possible and egress/room mutually exclusive by construction."
