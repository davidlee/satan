[[finding]]
id = "F-22"
status = "verified"
severity = "minor"
title = "No gate refusal for a model request racing the host_key abort"
detail = """
Expected: once a trust failure (`host_key`) is on record the run aborts and no further model request is spent.
Observed (PHASE-15 B Open): the pause has STOP-1's gate refusal (`pausePending`); the latch's `host_key` trip has none, so one model request racing the abort can still be admitted and counted. `latchedEnding` still sets `end_reason = error`, payload `reason: host_key`, and the job is collected and fails; the spend stays inside the per-job ceilings (it is a counted request). The design asks only for the abort, not a gate refusal.
"""
disposition = "tolerated"
response = """
Tolerated: the design requires the abort only; at most one counted request inside the per-job ceilings is spent, and the outcome (`end_reason = error`, `host_key`, collected, failed) is unchanged and tested. A gate refusal on `latch.reason() === "host_key"` is a cheap later tightening if wanted.
"""

