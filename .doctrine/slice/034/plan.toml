[[phase]]
id        = "PHASE-03"
name      = "malebolge: model stream deadline (RV-062 F-13 demonstrate)"
objective = "withStreamDeadline bounds every gateway model request from request start across headers and the whole body; on expiry it aborts the inner request and ends the stream as a non-retryable error, so a stalled stream fails its run with model_error and settles its inputs unanswered (design sec-5 Model stream deadline). Hosts the RV-062 F-13 demonstration, which must land no later than the first phase relying on a placed wake always settling (PHASE-05)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 exit criteria met." },
  { id = "EN-2", text = "RV-062 F-13 and F-16 responses re-read from the ledger (doctrine review show RV-062 -f F-13, -f F-16): F-16 replaces F-13's clause the run fail after its retries with the run fails with model_error after exactly one model request." },
]
exit_criteria = [
  { id = "EX-1", text = "src/models.ts: MODEL_STREAM_DEADLINE_MS = 2 h code constant; withStreamDeadline(api, ms); gatewayProvider wraps its API for both profiles; on expiry the inner request signal is aborted and the stream ends stopReason error, errorMessage model stream exceeded 2h (wording matched by none of pi-ai's retryable patterns)." },
  { id = "EX-2", text = "RV-062 F-13 (demonstrate, criterion as amended by F-16): through the real pi-ai openai-completions adapter with an injected transport and a shortened deadline, inside a real pi-durable run, a response that sends headers and one chunk and then never ends makes the stream end as an error, the inner request signal aborted, the run fail with model_error after exactly one model request (no retry), and a placed input settle unanswered; a stream finishing inside the deadline is unaffected. Option propagation on a faux model does not count." },
  { id = "EX-3", text = "M green." },
]
verification = [
  { id = "VT-1", expects = "RV-062 F-13 demonstration as EX-2: headers + one chunk then stall -> error, inner signal aborted, exactly one model request, placed input unanswered; positive control: a stream inside the deadline completes", test_file = "/home/david/dev/malebolge/test/models.test.ts", keywords = ["withStreamDeadline", "openai-completions", "model_error", "unanswered"], waived = false },
  { id = "VA-1", text = "Agent confirms the test uses the real adapter and a real pi-durable run (not a faux model), and records the positive and negative outcomes in notes; this is the transcription RV-062 F-13 verify asserts." },
]
