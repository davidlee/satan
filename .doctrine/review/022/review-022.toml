[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "Expected plan criteria to be executable as written; observed EX-6/VA-1 and EX-2 could not be followed literally"
detail = """
- PHASE-03 EX-6 / VA-1 name `~/.emacs.d`, which no longer exists (config moved to `~/.config/emacs`); the edit and the VA-1 closure grep ran against `~/.config/emacs/lisp`.
- PHASE-05 EX-2 says commit with `just commit`; the corpus recipe runs `git reset; git add .` and would have swept unrelated dirty SATAN state (inbox, motd, goad, hippocampus, proposals) into a date-stamped commit. c07ead9 committed the one file instead.
Plan criteria are immutable-append, so neither can be edited in place."""
disposition = "tolerated"
response = "Plan criteria are immutable-append, so EX-6/VA-1/EX-2 cannot be rewritten. Both deviations served the criteria's intent: ~/.emacs.d no longer exists and ~/.config/emacs is the same config; `just commit` would have swept unrelated SATAN state into a slice commit, so a single-file commit is the correct reading. Recorded in notes.md at reconcile; the corpus-commit friction is observation 01a12e00."

