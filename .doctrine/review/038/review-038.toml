[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "Expected the rendered ssh_config to be readable in the jail; observed its store path set by env only, absent from the runtime closure binds"
detail = """flake.nix: `(set-env "MALEBOLGE_SSH_CONFIG" "${malebolgeSshConfig}")` is the config's only use. jail.nix set-env updates state.env only; bind-nix-store-runtime-closure builds its closure from additionalRuntimeClosures, argv and entry. Verified: the launcher's runtime-closure-bind-args (675 entries) contains socat (extraPkgs) but no malebolge-room-ssh-config. Failure: daemon runs `ssh -F /nix/store/...-malebolge-room-ssh-config`; the file doesn't exist in the jail; every room call fails. malebolge-jail-profile stays green: it reads the config on the host, never checks it is bound. Source: jailed-pi-research pass, verified by implementer."""
disposition = "fix-now"
response = 'satan 91a7fc0: `(readonly "${malebolgeSshConfig}")`. malebolge-jail-profile now asserts the config path is in the runtime closure bind args or ro-bound in the launcher; red before the fix ("ssh config … is not bound in the jail"), green after; control (drop the bind) red again.'

