  { id = "EX-4", text = "The wrapper's host write on the shared SQLite adapter, made while catching that failure, settles (runs outside any pi transaction) and is durable before `afterTool` runs (RV-025 F-17)." },
  { id = "EX-5", text = "A `whenBusy: \"steer\"` submission made mid-run is placed after the current tool round, before the next model request; `Harness.submission(id).status()` on a paused harness reads the record without enabling scheduling." },
  { id = "EX-6", text = "Findings captured as evidence records (doctrine knowledge, kind evidence) and EVD/notes cite them; F-1 and F-2 verified on RV-025 against that evidence, or the slice stops for a DEC-057/DEC-055 amendment." },
]
verification = [
  { id = "VT-1", expects = "faux-provider spike test: exhausted budget → no provider call on generation, retry and compaction; counter survives reopen", test_file = "/home/david/dev/malebolge/test/runner/model-gate.test.ts", keywords = ["streamSimple", "completeSimple", "compaction", "retry"], waived = false },
