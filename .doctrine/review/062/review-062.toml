title = "settings.stream.timeoutMs does not bound a gateway model stream stalled after response headers"
detail = """
Expected: Daemon wiring and configuration (design.md:575-581) adds a 2 h MODEL_REQUEST_TIMEOUT_MS via settings.stream.timeoutMs specifically 'so a hung model stream cannot hold a turn — and the wake waiting on it — forever'. Verification (:746-747) currently checks only that faux request options carry the number. Fire composition still waits unbounded once the wake input is already_placed (:392-394), so actual stream-time enforcement matters for the claimed liveness improvement.

Observed/VERIFIED source: malebolge src/models.ts:17,93-104,142-145,163-176 uses pi-ai's openai-completions adapter for the gateway. pi-durable harness/generation.ts:226-233 passes the setting into pi-ai without an independent elapsed-time abort. pi-ai src/api/openai-completions.ts:376-390 passes timeoutMs to the OpenAI SDK request's timeout and then begins consuming the stream; src/types.ts:200-204 calls this an HTTP request timeout for supporting SDKs. In malebolge's installed OpenAI SDK 7.19.0, node_modules/openai/src/client.ts:1610-1652 starts that timeout around fetch and clears it in finally when fetch returns a Response (headers), before its streaming body is consumed. client.ts:1033-1040 also bypasses non-streaming response-body timeout handling for stream requests. There is no replacement timeout in the SSE iteration at core/streaming.ts:106-137. Thus this option does not implement the stated full-request stream bound on the provider this daemon actually uses.

VERIFIED no-network probe with installed pi-ai 1.4.0 and its real openai-completions/SDK path: injected a fetch returning status 200, SSE headers and one valid assistant chunk, then a ReadableStream that never emits or ends; the injected body honors the transport AbortSignal. With timeoutMs:20 and maxRetries:0, after 100 ms the pi-ai result was still unsettled and the SDK transport signal was not aborted. Explicit caller abort ended the stream as stopReason:aborted. A positive control withholding response headers with the same timeoutMs:20 did abort and return stopReason:error / 'Request timed out.' This checks the actual enforcement boundary with a shortened parameter, not two hours of production timing; no real provider, gateway, key or HTTP server was contacted.

INFERENCE: a gateway/upstream that starts its SSE response and then stalls can keep a placed wake and its heartbeat submit invocation alive indefinitely despite the new 2 h setting; a test that merely inspects faux options passes while this failure remains. A live but stalled model stream is distinct from the separately accepted hung-tool risk.

Repair: retain the user's chosen 2 h per-model-request policy, but enforce a deadline across actual response-body streaming with a cancellation path that settles the placed input. Choose the owning model/provider wrapper or other appropriate existing seam; merely forwarding the SDK timeout is insufficient. Add a real transport-adapter test for headers/first-chunk-then-stall, including successful cleanup/settlement, alongside the existing option-propagation test. This does not request a turn budget or change the accepted no-owned-spend-limits decision."""
disposition = "fix-now"
route = "demonstrate"
response = """
Accepted. Verified: the installed OpenAI SDK fetchWithTimeout clears its timer in finally once fetch returns headers, and pi-durable passes runtime.signal to pi-ai with no elapsed-time abort of its own (generation.ts streamResponse options). Repair accepted by the user 2026-10-27, design rev 52: settings.stream.timeoutMs is dropped; gatewayProvider in src/models.ts wraps the gateway API in withStreamDeadline with a 2 h code constant, running from request start across headers and the whole body; on expiry it aborts the inner request and ends the stream as an error, which pi-durable treats as a model error (retries per policy, then fails the run and settles its inputs unanswered). Worst case is about retries plus one times 2 h. Owned by malebolge, not a pi option, so it does not depend on pi internals. Edited Daemon wiring, Fire composition (already_placed note), Code impact, Verification, Risks.
Criterion the demonstration must assert: through the real pi-ai openai-completions adapter with an injected transport and a shortened deadline, a response that sends headers and one chunk and then never ends makes the stream end as an error, the inner request signal aborted, the run fail after its retries, and a placed wake input settle unanswered; a stream finishing inside the deadline is unaffected. Constraint on the host phase: it must exercise the wrapper inside a real pi-durable run over the real adapter, not option propagation on a faux model, and it lands no later than the phase that first relies on a placed wake always settling.
"""

