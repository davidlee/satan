[[phase]]
id        = "PHASE-01"
name      = "runner mode scope"
objective = "In M, give every [mode.<m>] required `repos` and `allowed_paths` scopes and refuse a submit outside them (design §4.2, DEC-069). Code and tests only; deployed in PHASE-04."
entrance_criteria = [
  { id = "EN-1", text = "SL-025 design locked (run dr-01a15234, rev 35)." },
  { id = "EN-2", text = "`just check` in M green before the change." },
]
exit_criteria = [
  { id = "EX-1", text = "config.ts: `Scope`, `ModeConfig extends PolicyLayer`, `readScope`, `readMode`; repos parsed before modes; `RunnerConfig.modes: ReadonlyMap<string, ModeConfig>`. Config refuses every malformed scope listed in design §4.2 (missing key, empty list, non-string member, non-\"*\" string, \"*\" as a list member, unknown repo, an allowed_paths member normaliseAllowedEntry refuses)." },
  { id = "EX-2", text = "protocol.ts: `knownMode` replaced by `withinModeScope`, first in SUBMIT_CHECKS and run before the repo lookup; refusals are invalid_request and name what the mode allows; containment is `disallowedPaths` (no new matcher)." },
  { id = "EX-3", text = "Scope stays outside the policy ladder: policy.ts unchanged in behaviour; tag and repo tables still refuse the scope keys." },
  { id = "EX-4", text = "Fixtures follow (design §5): [mode.fix] in config-fixture.ts takes \"*\" scopes; policy.test.ts's appended [mode.deep] tables carry both keys; smokeSubmit and its test use mode `interactive`." },
  { id = "EX-5", text = "`just check` in M green: format, lint (zero warnings), typecheck, tests. Committed in M." },
]
verification = [
  { id = "VT-1", expects = "config parse: list and \"*\" scopes accepted; each malformed scope refused with a message naming mode.<m> and the key", test_file = "/home/david/dev/malebolge/test/runner/config.test.ts", keywords = ["allowed_paths", "repos", "\"*\"", "unknown repo"], waived = false },
  { id = "VT-2", expects = "admission: §4.2 containment table, repo outside the mode, unknown repo under a scoped mode lists the allowed repos, \"*\" admits anything, unknown mode still refused", test_file = "/home/david/dev/malebolge/test/runner/protocol.test.ts", keywords = ["does not allow repo", "does not allow paths", "it allows"], waived = false },
  { id = "VT-3", expects = "a replayed submissionId returns its existing job after the mode's scope narrows (no re-admission)", test_file = "/home/david/dev/malebolge/test/runner/control.test.ts", keywords = ["submissionId", "scope narrowed"], waived = false },
  { id = "VT-4", expects = "an admitted job run under a config that narrowed its mode reaches preparing with its policy recorded", test_file = "/home/david/dev/malebolge/test/runner/run.test.ts", keywords = ["scope narrowed", "preparing"], waived = false },
  { id = "VT-5", expects = "a held job rejoins after a restart whose config narrowed its mode's scope", test_file = "/home/david/dev/malebolge/test/runner/recovery.test.ts", keywords = ["scope narrowed"], waived = false },
  { id = "VT-6", expects = "the smoke submits as interactive", test_file = "/home/david/dev/malebolge/test/runner/live-fixture.test.ts", keywords = ["interactive"], waived = false },
  { id = "VA-1", expects = "M's `just check` output green, zero lint warnings (recorded in notes)" },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-02"
name      = "Emacs stamps the acting mode"
objective = "In this repo, patch_job_create takes its mode from the tool ctx :mode-name and refuses without one; `mode` leaves the schema; satan-tools-patch-modes is deleted (design §4.1, DEC-068). Correct the stale memory mem.fact.satan.patch-job-contract. Loaded by Emacs in PHASE-04."
entrance_criteria = [
  { id = "EN-1", text = "SL-025 design locked." },
  { id = "EN-2", text = "`just check` green in this repo before the change." },
]
exit_criteria = [
  { id = "EX-1", text = "satan-tools-patch.el: defcustom gone; schema keys are directive, repo, allowed_paths, base_ref, tags, source, context; --submit-fields takes mode as a parameter; handler errors without :mode-name and sends nothing." },
  { id = "EX-2", text = "The vacuous schema test is replaced by stamping and no-ctx tests." },
  { id = "EX-3", text = "No reference to satan-tools-patch-modes remains in this repo or ~/.config/emacs (grep, with a positive control)." },
  { id = "EX-4", text = "mem.fact.satan.patch-job-contract corrected: repo is a runner config name; mode is the acting run mode, stamped by Emacs; per-mode scope enforced by the runner at submit." },
  { id = "EX-5", text = "`just check` green (lint zero warnings, tests). Committed by path." },
]
verification = [
  { id = "VT-1", expects = "the submit carries the ctx :mode-name whatever the args say; the schema has no mode key", test_file = "satan/test/satan-tools-patch-test.el", keywords = [":mode-name", "satan-patch-fixture-requests"], waived = false },
  { id = "VT-2", expects = "no ctx, or a ctx without :mode-name: error naming the acting run mode, no request sent", test_file = "satan/test/satan-tools-patch-test.el", keywords = ["acting run mode"], waived = false },
  { id = "VA-1", expects = "grep for satan-tools-patch-modes returns nothing in this repo and ~/.config/emacs; the same grep for satan-tools-patch--submit-fields finds its definition (positive control)" },
]
specs        = []
requirements = []

