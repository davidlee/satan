Expected: SL-034 Summary (slice-034.md:134-148) says a scheduled wake runs a turn in its target and a failed wake is reported in the journal and through notify_send. DEC-130/W8 permit wakes in the caller or any known topic, fixed at scheduling; the heartbeat's dedicated conversation is not the only supported target. A run failure must therefore have an explicit observable outcome for these wakes too.

Observed: Fire composition (design.md:353-354) says 'For the heartbeat only, the wait is bounded by one ceiling ... A one-shot waits until its submission settles.' Its failure handler (:394-403) runs only for an exception or an unanswered settlement. Heartbeat (:411-414,436-445) targets its own fixed topic conversation and releases stuck work by submitting a new occurrence to THAT conversation under afterFailedRun:keep. It cannot release an input queued in another conversation. A one-shot admitted behind a still-running foreground turn can therefore stay queued forever when that foreground turn fails. Its task stays running, so wake_list omits it (:315-317) and wake_cancel returns already fired without acting (:298-305); it neither executes nor reaches the wake failure reporter. This is separate from F-1: the heartbeat's own recovery repair remains valid; the uncovered case is a one-shot in another target conversation.

VERIFIED source: pi-durable src/harness/types.ts:565-568 documents keep as retaining queued inputs until the next input/queued write; harness/generation.ts:404-427 leaves that queue alone after model_error; harness/submissions.ts:210-216 returns an existing requestId without a placement boundary, and :241-264 applies the boundary only for a fresh submission to that conversation. No global heartbeat tick drains other conversations.

VERIFIED probe against malebolge's installed pi-durable 1.4.0, using Node stdin, a faux model and MemoryStorage only: held a foreground response in conversation 1, admitted a target-owned background satan.wake in submit awaiting requestId wake:16:0, then failed the foreground with stopReason:error. The wake submission remained queued and its task inspected running (1 model call). Closed/reopened the harness over the same in-memory backing (storage close suppressed solely to retain MemoryStorage), then successfully submitted three distinct heartbeat-like inputs to a separate conversation: the one-shot still showed queued/running (4 model calls). A control input to conversation 1 released it to done (6 calls). This exercises the specified unbounded one-shot submit/wait path and the conversation-local recovery behavior; it is not a probe of an implemented wake extension or SQLite crash durability.

INFERENCE: with no later input/write to the original target, the current design leaves this wake silently stranded indefinitely, even while the daemon and room heartbeat are healthy. The lack of wake failure reporting follows from the authored wait/failure branches; no production notifications were sent.

Repair: specify and test an observable recovery or stuck-wake outcome for one-shot inputs queued behind failed runs in non-heartbeat conversations, including close/reopen. Preserve the accepted afterFailedRun:keep setting, W1 occurrence identity, W4 admission-only switch, and W9 cancellation guarantee; merely timing out and retrying the same requestId does not release the queue. If indefinite parking is intentionally accepted instead, explicitly reconcile that limitation with scope/DEC-134 and make the stranded wake observable. Do not reopen the settled no-spend-limits or shared-allowlist decisions."""
disposition = "fix-now"
route = "review"
response = """
Accepted. Observation verified on source: pi-durable types.ts:565-568 (keep leaves queued inputs for the next input) and Fire composition's former heartbeat-only bound. Repair accepted by the user 2026-10-27: every wake races submission.wait() against one ceiling; on timeout submit calls Submission.abort(), which in one commit withdraws the input only if still queued (harness/submissions.ts:130-143). aborted: withdrawn, never reaches the model, occurrence takes the failure path (one-shot fails with reason not answered within the ceiling, withdrawn; journal plus notify_send). already_placed: its turn is running, wait on unbounded; a failed run settles its own placed inputs unanswered (generation.ts endFailedRun), so it always settles. settled: read wait(). One commit, so a turn that starts just before the bound is neither withdrawn nor reported. The heartbeat shares the rule; its stuck input is withdrawn rather than carried, and its next input still releases other queued inputs. afterFailedRun stays keep; Conversation.abort rejected (withdraws user inputs). Edited design rev 46: Fire composition, Heartbeat, Off switch journal table, Verification (one-shot behind a failed run in a non-heartbeat conversation incl. close/reopen with a negative control; placed-at-the-bound), Risks, W4, task state diagram. DEC-134 and DEC-131 amended; slice scope reconciled. This also changes the F-1 repair (stuck heartbeat input withdrawn, not carried): please re-check F-1 against it.
"""

