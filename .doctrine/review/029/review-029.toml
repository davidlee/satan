title = "Pause trigger split afterTool/afterTools and gate refuses paused; DEC-055 and design §5.4 say afterTool triggers"
detail = """
Expected (DEC-055 choice; design §5.4 "Room down: pause and resume" sequence): an `afterTool` hook reads `pause_requested`, replaces the result and triggers the pause; the runner then aborts "before another model request". The gate's refusal list is DEC-057's.
