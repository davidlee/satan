[[finding]]
id = "F-4"
status = "verified"
severity = "nit"
title = 'Expected the "room literal appears only in the door dir bind" comment to hold; observed a second literal in roomKnownHosts, and identity/known_hosts duplicating door-file facts'
detail = """flake.nix: comment above malebolgeDoorFile; `roomKnownHosts = "/var/lib/capsule/room/assistant/known_hosts"` and `malebolgeRoomIdentity` restate door.toml's known_hosts/identity. Design §4.6 makes the same claim. If the door file moves either path, the jail binds stale paths while the daemon reads the new ones. The bind paths can't come from door.toml at eval (host file, pure eval), so the coupling is inherent; the comment is what's wrong."""
disposition = "fix-now"
response = """satan 91a7fc0: comment now says the jail binds what the door file names, so identity and state-dir paths repeat it (pure eval cannot read the door file). Coupling accepted; §4.6's "once" claim recorded as erratum alongside F-2."""

