detail = """
Expected (the vocabulary `doctrine slice status` enforces: proposed -> design -> plan -> ready -> started -> audit -> reconcile -> done): the slice's status is an honest account of where the work is, and the closure seam is crossed from the state the work actually reached.

Observed: .doctrine/slice/029/slice-029.toml carried status = "ready" at c01735f — after eight phases read completed, after the plan was approved, after the design locked at revision 80, and after RV-053's implementation review had been concluded over 2931b97..bba7d87. The slice was never moved to started, so `doctrine status` and `doctrine next` reported it as pre-execution work.

Nothing in the delivered code depends on this, and the closure seam was not breached (audit is reachable from ready), so the cost is bookkeeping fidelity: a fresh agent reading `doctrine status` would conclude the phases had not begun. Repaired in this pass by `doctrine slice status 29 audit`, which classifies as a skip of started — the honest record of what actually happened."""
