[[finding]]
id = "F-3"
status = "answered"
severity = "major"
title = "Session exclusion is not specified or tested across per-client MCP server processes"
detail = "Expected: same-session concurrency is refused across the actual deployment topology, with a single atomic root/capability binding on first use. A stdio MCP server is per client; separate drivers can therefore run separate server processes using the same default PI_MCP_SESSION_HOME and the same bearer session id. Observed: revision 48 sec-6 declares session-busy and server-side lock/binding metadata, but does not state whether admission/binding is atomic across processes or only within one server. Sec-7's lifecycle verification covers two calls, not two servers, so an in-memory busy map can pass the specified test while both processes open/write the same pi session concurrently or race its first-use root/capability binding. Required correction: make the lock/binding scope explicit, including ownership through termination/reap/drain and crash recovery, or give each server a deliberately isolated session namespace and define its continuation implications. This need not prescribe a particular locking library. Verification must start two independent MCP server processes sharing state: exactly one of simultaneous same-session calls may spawn, including first use with conflicting root/capability; the loser is refused before side effects."
disposition = "fix-now"
route = "demonstrate"
response = """
Upheld. The race is real: unlink-then-create lets two reclaimers both unlink, and the second's unlink can delete the first's freshly created lock — after which both create and both believe they own the session. `O_EXCL` protects one create, not the delete-create pair.

Fixed in design revision 64 (sec-6) and DEC-099's appended amendment by making reclaim **an election**:

1. ownership is conferred only by the `O_EXCL` create of `<state>/sessions/<id>.lock`;
2. a reclaimer elects itself by **atomically renaming** the stale lock to a private name — exactly one `rename` of a given path can succeed, so there is a single winner by construction;
3. the winner verifies the file it now holds is the file it inspected (same device and inode), re-confirms its owner is dead, creates the successor with `O_EXCL`, and only then unlinks its own copy;
4. every loser — of the rename, of the inode check, or of the `O_EXCL` — refuses `session-busy` instead of retrying, so a lost election never becomes a delete race;
5. a reclaimer that dies mid-reclaim leaves the lock **absent**, so the next caller's `O_EXCL` create simply succeeds — double ownership is unreachable, and the worst case is an orphan private file for ops to prune;
6. owner identity is pid **plus kernel start time**, since a bare pid is reused, and unknowable liveness (no `/proc`) resolves to `session-busy`; every reclaim is recorded in `attempts.jsonl`.

sec-7's session test now includes it: two processes presented with one stale lock, exactly one may reclaim and spawn, the loser refuses, and a reclaimer killed mid-rename leaves state the next caller can take without double ownership.

The pending item is unchanged and still not claimed: this is a design rule with a named test, verified only when the phase criterion exists.
"""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
route = "demonstrate"
response = """
Accepted. The lock was specified without a scope, so an in-memory busy map would have passed the stated test while two drivers ran two servers over one session home.

Fixed in design revision 60 (sec-6) and DEC-099's appended amendment: the lock and the first-use (root, capability) binding are **files in the server's own state directory**, outside every child bind, and atomic across processes:

- the lock is created with `O_EXCL`, carrying pid, call id and start time; a racing process fails the create and refuses `session-busy` **before any side effect**, which is what makes "exactly one spawns" true across processes rather than within one;
- the binding is written in the same atomic step as first use, so two processes cannot record different bindings for one session;
- ownership is held through termination, reap and drain, and released last;
- crash recovery is specified: a lock whose recorded pid is no longer alive is reclaimed, and the reclamation is recorded in `attempts.jsonl` rather than done silently — a silently reclaimed lock is a session that changed hands with no evidence.

sec-7 names the demonstration: two independent server processes sharing one state root, exactly one of two simultaneous same-session calls spawning, including a first-use race with conflicting root/capability, the loser refused before side effects.
"""

[[finding.turn]]
act = "contest"
role = "raiser"
