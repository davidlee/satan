[[finding]]
id = "F-8"
status = "verified"
severity = "minor"
title = "Expected POL-001's seat clause to cover a non-editor human surface; observed the gap design sec-8 deferred to reconcile"
detail = """Design sec-8 ("POL-001: the No branch, explicitly"): the seat rationale for thin shells is "the human's editing surface is where their output lands and where the keeper approves it". goad is a second human surface that is not the editor, and the clause does not contemplate one. The slice does not widen it ("governance by implementation"). It records the goad modules as tenants (DEC-008) and names a REV at close as the vehicle (sec-9 "Out of scope": "Widening POL-001's seat clause — a REV at close")."""
disposition = "verified"
response = "Governance, delegated to /reconcile as a REV against POL-001: widen the seat clause's rationale to name non-editor human surfaces (goad), or state explicitly that such surfaces are No-branch tenants. This is the keeper's call at reconcile. The slice itself stays within POL-001 as written (DEC-008)."

[[finding]]
id = "F-9"
status = "verified"
severity = "nit"
title = "Expected an answer to design sec-8's deferred question: does a second caller of the auto-verdict writer need an ADR-017 ledger note? Observed it still open"
detail = """Design sec-8 ("No authority item, no ledger row"): the `undelivered` verdict goes through the writer notify_send already uses. PHASE-04 moved it into satan-intervention.el, and goad_ask is its second caller. "Whether a second caller of an existing auto-verdict writer wants a ledger note is a question for /reconcile at close." SL-017's REV-002 covers operational alarms only."""
disposition = "verified"
response = "Governance question, delegated to /reconcile. Audit recommendation: no REV. PHASE-04 moved an existing writer without changing it, and adding a second caller adds no write path, so ledger row 4's owner and invariant do not change. Reconcile records that decision in design sec-8, replacing the open question."

[[finding]]
id = "F-10"
status = "verified"
severity = "nit"
title = "Expected the RV-017 closing nits dispositioned; observed four carried to audit unresolved"
detail = """
From the notes, "RV-017 closed 2026-09-24":
(a) `satan-tools-goad/independently-perceived-topic-askable` sources its topic from a fictional canon rule `notes.topic` (satan-tools-goad-test.el:385). The real non-goad topic rule is `hint.topic`.
(b) `~/satan/prompts/tick/pulse.txt:18-20` describes goad_ask even while goad is disabled.
(c) The interactive mode's `:tools` is fixed at registration (satan-mcp.el:93), while tools/list recomputes per call.
(d) An observation trace's `predicates` serialises as a JSON object (`{"goad_answer":{}}`), while the outcome row's evidence_json holds an array. The trace metadata line dates from b2f0da11 (2026-07-12), so this predates the slice and affects every kind."""
disposition = "fix-now"
response = "(a) Fixed: the test now sources its topic from the real `hint.topic` rule. The suite gives 1293 tests, 0 unexpected, 6 skipped. (b) Tolerated: `satan-goad-enabled` is now persisted on (.emacs.d 9ed54c6), so the prompt text matches the manifest; with goad disabled a call is refused, which is transcript noise only. (c) Tolerated: no interactive `:available-p` varies at runtime, and MCP tools/list filters per call. (d) Follow-up ISS-027: pre-existing since 2026-07-12, affects all kinds, outside this slice."

