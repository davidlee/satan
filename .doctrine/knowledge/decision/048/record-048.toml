context = "S/flake.lock and F/flake.lock pin agents at cfda05a5 (no gatewayClient); the deployed harness builds through F's satan input with agents.follows. The patcher runs jailed-pi from its unit PATH and passes --provider openrouter from an untracked policy.toml."
choice = "1) Issue the satan key (deepseek-flash only; 20 USD lifetime). 2) Land the harness and jail changes (with the flake check and agents re-locked to >= a24a0f03) and push satan before any broker change lands. 3) In flakes: lock satan at that commit and update agents; drop the patcher key refs; update SATAN.md; home-switch (the new harness works with today's broker). 4) Edit policy.toml defaults to llm-gateway/deepseek-flash and remove the cheap+code tag. 5) Land the broker, patch-path and credential retirement in satan; Emacs may reload at any point, since the deployed harness is already the gateway one. 6) Push satan, restart Emacs onto the new satan. 7) Then drop the emacs satan credential backend. 8) Manual checks including a probe of the deployed launcher. Amended 2026-10-18 after RV-023 F-2 F-3: the deployed harness comes from flakes' locked satan input; home-switch overrides agents in-tree; so the flakes agents re-lock is hygiene. Amended 2026-10-18 at planning (user): deploy the harness before the broker work, which removes the window in which an Emacs reload breaks every tick."
alternatives = []
rationale = "Each step builds on a pinned, pushed predecessor; F can only follow a pushed S. The patcher gets the minimum (OQ-1)."
