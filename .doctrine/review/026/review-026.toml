[[finding]]
id = "F-14"
status = "verified"
severity = "minor"
title = "Parked time still counts against the wait bounds once the runner is re-enabled"
detail = "design.md:1005-1006 say that while disabled 'no wait bound is applied, so nothing times out while parked'. But the gated rows are still bounded 'from state_entered_at' (:1013 preparing via max_room_wait, :1023 waiting_room, :1025 pending_collection), and parking does not change state_entered_at. Scenario: a job sits in pending_collection, the runner is disabled for a day, then re-enabled. Elapsed time is already past max_pending_collection, so the job fails collection_abandoned (or room_unavailable for preparing/waiting_room) at once, possibly before or without a single retry, even though the room is up. Parked time is charged as wait. Fix: re-base the bound on enable (restamp, or subtract parked time), or require one attempt before the bound is judged. Add a §9 case."
disposition = "fix-now"
response = "Fixed: jobs gain parked_at. A disabled startup stamps parked_at=now on non-terminal jobs where it is null (one tx + parked event; repeated disabled restarts keep the first stamp). The first enabled startup, in phase A before any bound is judged, shifts state_entered_at forward by now-parked_at and clears parked_at in one tx + unparked event, so parked time is never charged as wait and a crash on either side re-bases exactly once. §9 case: pending_collection parked past max_pending_collection retries on re-enable; no double re-base after a crash."

