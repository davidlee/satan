  { id = "EX-3", text = "Form is the design sec-3 union: { kind: confined, path, extensions } | { kind: unconfined, pi }." },
  { id = "EX-4", text = "The DEC-097 rules carry over unchanged: fail-closed reading, unknown keys refused, all four maxima required, enabled re-read at each gate tick, mode per-call, the digest in the audit." },
